lieder der Pr\xFCfungskommission gezielt vertiefende Fragen zu Inhalt, Methodik, theoretischem Hintergrund oder den Grenzen (Limitationen) der vorgelegten Arbeit, um zu pr\xFCfen, ob der Kandidat sein Thema tats\xE4chlich durchdrungen hat und nicht nur die schriftliche Arbeit auswendig wiedergeben kann. H\xE4ufige Fragetypen betreffen die \xDCbertragbarkeit der Ergebnisse auf andere Kontexte, Branchen oder L\xE4nder, alternative methodische Herangehensweisen, die der Kandidat nicht gew\xE4hlt hat, die praktische Relevanz und m\xF6gliche Handlungsempfehlungen f\xFCr Unternehmen, sowie m\xF6gliche Anschlussfragen f\xFCr weiterf\xFChrende zuk\xFCnftige Forschung. Eine \xFCberzeugende Antwort zeigt intellektuelle Flexibilit\xE4t, Ehrlichkeit bez\xFCglich der Grenzen der eigenen Arbeit sowie die F\xE4higkeit, spontan und unter Zeitdruck fundiert \xFCber das eigene Thema nachzudenken, statt lediglich vorbereitete Antworten abzuspulen.",ex:"Eine Pr\xFCferin fragt kritisch nach, ob sich die f\xFCr den Modehandel gewonnenen Erkenntnisse zu Same-Day-Delivery auch auf andere Branchen wie den Lebensmittel- oder Elektronikhandel \xFCbertragen lie\xDFen \u2013 der Kandidat antwortet differenziert, dass die grunds\xE4tzliche Wirkungsrichtung vermutlich \xE4hnlich sei, die Zahlungsbereitschaft f\xFCr schnelle Lieferung aber je nach Produktkategorie und Dringlichkeit des Bedarfs stark variieren d\xFCrfte, was in seiner Arbeit nicht empirisch untersucht wurde."}],quiz:[{q:"Was passiert im Kolloquium?",options:["Eine neue Klausur wird geschrieben","Die Bachelorarbeit wird m\xFCndlich pr\xE4sentiert und verteidigt","Nur die Note wird bekanntgegeben","Ein neues Thema wird vergeben"],correct:1,explain:"Im Kolloquium pr\xE4sentiert und verteidigt man die eigene Bachelorarbeit m\xFCndlich."}],cards:[{front:"Kolloquium",back:"M\xFCndliche Pr\xFCfung zur Verteidigung der Bachelorarbeit vor einer Pr\xFCfungskommission."}]}]}],Zc=[{n:"Angewandte k\xFCnstliche Intelligenz im E-Commerce",d:"Prak ,"Bewegtbild & Animation","Cross-Media-Konsistenz"]},{n:"Empfehlungssysteme",d:"Funktionsweise und Einsatz von Recommendation Engines, wie sie z.B. Amazon oder Netflix zur Personalisierung nutzen.",th:["Collaborative Filtering","Content-based Filtering","Hybride Empfehlungsans\xE4tze","Bewertung von Empfehlungsqualit\xE4t"]},{n:"Entwicklung und Produktion eines Rennwagens (Formula Student)",d:"Interdisziplin\xE4res Projektmodul, in dem Studierende gemeinsam einen Rennwagen f\xFCr Formula-Student-Wettbewerbe konstruieren.",th:["Projektmanagement im Konstruktionsteam","Technische Konstruktion & Fertigung","Teamarbeit interdisziplin\xE4rer Fachbereiche","Wettbewerbsvorbereitung & Pr\xE4sentation"]},{n:"EyeTracking Research in Retail Management",d:"Einsatz von Eye-Tracking-Technologie zur Untersuchung des Blickverhaltens von Kunden im On- und Offline-Handel.",th:["Grundlagen der Eye-Tracking-Methodik","Studiendesign f\xFCr Blickverhaltensstudien","Auswertung von Heatmaps","Gestaltungsempfehlungen f\xFCr Shops ableiten"]},{n:"Forschungsprojekt mit aktuellem Thema im E-Commerce",d:"Eigenst\xE4ndige, forschungsnahe Bearbeitung eines aktuellen E-Commerce-Themas, oft mit einem Lehrstuhl oder Praxispartner.",th:["Selbstst\xE4ndige Forschungsfrage entwickeln","Wissenschaftliche Methodik anwenden","Aktuelle E-Commerce-Trends untersuchen","Ergebnispr\xE4sentation & Dokumentation"]},{n:"Grundlagen der KI \u2013 interdisziplin\xE4r",d:"Interdisziplin\xE4re Einf\xFChrung in Konzepte der K\xFCnstlichen Intelligenz f\xFCr Studierende unterschiedlicher Fachrichtungen.",th:["Was ist KI? Abgrenzung zu ML und Deep Learning","Grundlegende Algorithmen & Anwendungsfelder","Chancen und Risiken von KI","Ethische Fragestellungen"]},{n:"Grundlagen der Verhandlungsf\xFChrung",d:"Theorie und Praxis erfolgreicher Verhandlungsf\xFChrung, u.a. f\xFCr Einkaufs-, Vertriebs- und Gehaltsverhandlungen.",th:["Verhandlungsstrategien (z.B. Harvard-Konzept)","Argumentations- und Kommunikationstechniken","Umgang mit schwierigen Verhandlungspartnern","Verhandlungssimulationen"]},{n:"Inklusives IT-Design",d:"Gestaltung digitaler Produkte, die f\xFCr m\xF6glichst viele Menschen nutzbar sind, unabh\xE4ngig von Einschr\xE4nkungen.",th:["Prinzipien inklusiven Designs","Barrierefreiheit nach WCAG","Design f\xFCr unterschiedliche Nutzergruppen","Testing mit assistiven Technologien"]},{n:"Internationales Management",d:"Grundlagen der F\xFChrung und Steuerung international t\xE4tiger Unternehmen, inkl. interkultureller Aspekte.",th:["Internationalisierungsstrategien","Interkulturelles Management","Globale Organisationsstrukturen","Fallstudien internationaler Konzerne"]},{n:"Internationalisation of E-Commerce & Intercultural Aspects (English)",d:"Untersucht, wie E-Commerce-Unternehmen international expandieren und kulturelle Unterschiede im Kaufverhalten ber\xFCcksichtigen.",th:["Markteintrittsstrategien im E-Commerce","Kulturelle Unterschiede im Kaufverhalten","Lokalisierung von Online-Shops","Internationale Zahlungs- und Logistikaspekte"]},{n:"Let's battle for some attention: Brand Development and Marketing (English)",d:"Praxisorientiertes Modul zu Markenentwicklung und Aufmerksamkeitsstrategien im digitalen Wettbewerb, auf Englisch.",th:["Markenidentit\xE4t & Positionierung entwickeln","Attention Economy & Content-Strategien","Kampagnenkonzeption","Markenkommunikation \xFCber mehrere Kan\xE4le"]},{n:"Mobile Computing",d:"Grundlagen mobiler Technologien, Betriebssysteme und Anwendungsentwicklung f\xFCr Smartphones und Tablets.",th:["Mobile Betriebssysteme (iOS, Android)","Mobile App-Architekturen","Standortbasierte Dienste","Mobile Sicherheit & Datenschutz"]},{n:"Modelle im Maschinellen Lernen verstehen und bewerten",d:"Vertiefung im Verst\xE4ndnis, der Bewertung und kritischen Einordnung von Machine-Learning-Modellen.",th:["\xDCberwachtes vs. un\xFCberwachtes Lernen","Modellbewertung (Genauigkeit, Overfitting)","Interpretierbarkeit von ML-Modellen","Praktische Fallbeispiele"]}, java/?price=price-free"}]}],_c=[{nr:1,t:"BWL & Buchf\xFChrung",e:"\u{1F4CA}",sub:"Modul: BWL EC \u2013 Einf\xFChrung in die BWL"},{nr:2,t:"Handel & E-Commerce",e:"\u{1F6D2}",sub:"Module: HBL EC + Grundlagen E-Commerce (ECM)"},{nr:3,t:"Informatik & Java",e:"\u{1F4BB}",sub:"Modul: GIP EC \u2013 Informatik & Programmierung"}],tf={1:{lernziel:"Du verstehst, was Betriebswirtschaftslehre als Wissenschaft bedeutet und warum BWL-Grundkenntnisse f\xFCr E-Commerce-F\xFChrungskr\xE4fte unerl\xE4sslich sind. Du unterscheidest die drei G\xFCterarten (Sachg\xFCter, Dienstleistungen, Rechte), kennst die vier betrieblichen Produktionsfaktoren und kannst das Wirtschaftlichkeitsprinzip in seinen beiden Auspr\xE4gungen (Minimal- und Maximalprinzip) mit konkreten E-Commerce-Beispielen erkl\xE4ren.",pr\u00FCfung:"Klausur BWL EC: Minimal-/Maximalprinzip mit Zahlenbeispiel, G\xFCterarten klassifizieren, Produktionsfaktoren benennen (Arbeit, Betriebsmittel, Werkstoffe, dispositiver Faktor), betriebliche Ziele und Zielkonflikte erl\xE4utern",begriffe:["Wirtschaftlichkeit","G\xFCterarten","Produktionsfaktoren","Stakeholder","Minimalprinzip","Maximalprinzip","dispositiver Faktor"],subs:[{t:"Wirtschaft & knappe G\xFCter",desc:"Wirtschaft entsteht, weil Bed\xFCrfnisse der Menschen unbegrenzt sind, aber G\xFCter knapp. Die BWL untersucht, wie Unternehmen mit diesen knappen Ressourcen (Produktionsfaktoren) m\xF6glichst effizient umgehen. F\xFCr E-Commerce bedeutet das: Wie setzt ein Online-H\xE4ndler sein Budget (Kapital) und seine Mitarbeiter (Arbeit) optimal ein?",items:[{c:"\u25B6",l:"SimpleClub \u2013 Was ist BWL?",u:K("SimpleClub Was ist BWL")},{c:"\u25B6",l:"Studyflix \u2013 G\xFCterarten",u:G("G\xFCterarten Wirtschaft")},{c:"\u{1F9E0}",l:"Knowunity BWL Grundlagen",u:F("BWL Grundlagen Wirtschaft G\xFCter")},{c:"\u{1F4AC}",l:"Studocu BWL",u:le("BWL Wirtschaft Grundlagen Hochschule")}]},{t:"Wirtschaftlichkeitsprinzip & betriebliche Ziele",desc:"Das Wirtschaftlichkeitsprinzip besagt: Entweder ein gegebenes Ziel mit minimalem Einsatz erreichen (Minimalprinzip) \u2013 oder mit gegebenem Einsatz das Maximum herausholen (Maximalprinzip). Betriebliche Ziele umfassen Sachziele (Produkte, Dienstleistungen), Formalziele (Gewinn, Liquidit\xE4t) und soziale Ziele. Zielkonflikte entstehen z.B., wenn Nachhaltigkeitsziele den Gewinn kurzfristig senken.",items:[{c:"\u25B6",l:"YouTube \u2013 Wirtschaftlichkeitsprinzip",u:K("Wirtschaftlichkeitsprinzip Minimal Maximalprinzip BWL")},{c:"\u25B6",l:"Studyflix \u2013 Betriebliche Ziele",u:G("betriebliche Ziele Unternehmen")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Zielkonflikte",u:F("betriebliche Ziele Zielkonflikte BWL")},{c:"\u{1F4AC}",l:"Studocu \u2013 BWL Zusammenfassung",u:le("BWL Grundlagen Unternehmensziele Hochschule")}]}]},2:{lernziel:"Du kennst die wichtigsten deutschen Unternehmensrechtsformen und kannst f\xFCr jeden Online-Shop-Typ die passende empfehlen. Du verstehst den grundlegenden Unterschied zwischen Personen- (GbR, OHG, KG) und Kapitalgesellschaften (GmbH, AG, UG), insbesondere hinsichtlich Haftung, Stammkapital und Gr\xFCndungsaufwand. Du wei\xDFt, warum die meisten E-Commerce-Startups die UG oder GmbH w\xE4hlen und ab wann eine AG sinnvoll ist.",pr\u00FCfung:"Klausur BWL EC: Rechtsformen-Tabelle vervollst\xE4ndigen (Haftung, Stammkapital, Leitungsorgan, Mindestpersonen), Unterschied GmbH vs. AG erkl\xE4ren, passende Rechtsform f\xFCr ein Unternehmensbeispiel empfehlen und begr\xFCnden",begriffe:["GmbH","AG","UG","GbR","Haftungsbeschr\xE4nkung","Stammkapital","Handelsregister","Kapitalgesellschaft"],subs:[{t:"Rechtsformen im \xDCberblick",desc:"Deutschland kennt sechs wichtige Rechtsformen: Einzelunternehmen (volle Haftung, kein Mindestkapital), GbR (mindestens 2 Personen, unbeschr\xE4nkte Haftung), GmbH (25.000 \u20AC Stammkapital, beschr\xE4nkte Haftung \u2013 die h\xE4ufigste Wahl f\xFCr Online-Shops), UG (ab 1 \u20AC Stammkapital, vereinfachte GmbH), AG (50.000 \u20AC Grundkapital, f\xFCr b\xF6rsennotierte Unternehmen) und KG/OHG.",items:[{c:"\u25B6",l:"Studyflix \u2013 Rechtsformen",u:G("Rechtsformen GmbH AG UG")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Rechtsformen Tabelle",u:F("Rechtsformen GmbH AG Vergleich Tabelle")},{c:"\u{1F4AC}",l:"Studocu \u2013 Rechtsformen",u:le("Rechtsformen Unternehmen GmbH AG Hochschule")},{c:"\u25B6",l:"YouTube \u2013 GmbH erkl\xE4rt",u:K("GmbH einfach erkl\xE4rt Gr\xFCndung Stammkapital")}]},{t:"Haftung & Kapital \u2013 Entscheidungskriterien f\xFCr E-Commerce",desc:"Das zentrale Entscheidungskriterium ist die Haftungsfrage: Wer f\xFCr Verbindlichkeiten des Unternehmens pers\xF6nlich einsteht. Bei GmbH und AG haftet nur das Gesellschaftsverm\xF6gen. F\xFCr einen neuen Online-Shop empfiehlt sich die UG (haftungsbeschr\xE4nkt) als g\xFCnstiger Einstieg \u2013 mit der Option auf sp\xE4tere Umwandlung in eine GmbH, sobald ausreichend R\xFCcklagen gebildet wurden.",items:[{c:"\u25B6",l:"YouTube \u2013 Rechtsform w\xE4hlen E-Commerce",u:K("Welche Rechtsform Online-Shop E-Commerce GmbH UG")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Haftung Rechtsformen",u:F("Haftung Rechtsformen Unterschiede")},{c:"\u{1F4AC}",l:"Studocu \u2013 Rechtsform Praxisfall",u:le("Rechtsformen E-Commerce Online-Shop Hochschule")}]}]},3:{lernziel:"Du verstehst, warum Buchf\xFChrung gesetzlich verpflichtend ist und welche Kaufleute dem HGB unterliegen. Du kennst den Unterschied zwischen freiwilliger und gesetzlicher Buchf\xFChrungspflicht, den Ablauf einer Inventur und was das Inventar von der Bilanz unterscheidet. Du verstehst die sechs Grunds\xE4tze ordnungsm\xE4\xDFiger Buchf\xFChrung (GoB) und warum sie insbesondere f\xFCr E-Commerce-Unternehmen mit internationalen Lieferanten relevant sind.",pr\u00FCfung:"Klausur BWL EC: GoB nennen und erkl\xE4ren, Buchf\xFChrungspflicht nach \xA7 238 HGB beschreiben, Unterschied Inventur / Inventar / Bilanz erl\xE4utern, Kaufmannsbegriff definieren",begriffe:["HGB","Buchf\xFChrungspflicht","GoB","Inventur","Inventar","Kaufmann","externes Rechnungswesen","\xA7 238 HGB"],subs:[{t:"Buchf\xFChrungspflicht nach HGB",desc:"Nach \xA7 238 HGB ist jeder Kaufmann verpflichtet, B\xFCcher zu f\xFChren und in diesen seine Handelsgesch\xE4fte und die Lage seines Verm\xF6gens nach den Grunds\xE4tzen ordnungsm\xE4\xDFiger Buchf\xFChrung ersichtlich zu machen. Ein Online-H\xE4ndler, der als Einzelkaufmann oder GmbH handelt, unterliegt dieser Pflicht. Kleinunternehmer unter 600.000 \u20AC Umsatz k\xF6nnen unter Umst\xE4nden eine vereinfachte E\xDCR nutzen.",items:[{c:"\u25B6",l:"YouTube \u2013 Buchf\xFChrungspflicht HGB",u:K("Buchf\xFChrungspflicht HGB \xA7 238 Kaufleute")},{c:"\u{1F4DA}",l:"wiwiweb.de Buchf\xFChrung",u:"https://www.wiwiweb.de/"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Buchf\xFChrungspflicht",u:F("Buchf\xFChrung Pflicht HGB Grundlagen")},{c:"\u{1F4AC}",l:"Studocu \u2013 Rechnungswesen",u:le("Buchf\xFChrung Rechnungswesen Grundlagen Hochschule")}]},{t:"GoB \u2013 6 Grunds\xE4tze ordnungsm\xE4\xDFiger Buchf\xFChrung",desc:"Die GoB sind ungeschriebene Regeln der Buchf\xFChrungspraxis: (1) Richtigkeit & Willk\xFCrfreiheit, (2) Vollst\xE4ndigkeit, (3) \xDCbersichtlichkeit & Nachvollziehbarkeit, (4) Einzelbewertung, (5) Vorsichtsprinzip, (6) Periodenabgrenzung (Abgrenzungsprinzip). F\xFCr E-Commerce besonders relevant: Das Vorsichtsprinzip beim Bewerten von Warenbest\xE4nden und das Realisationsprinzip bei mehrmonatigen Softwareprojekten.",items:[{c:"\u25B6",l:"YouTube \u2013 GoB erkl\xE4rt",u:K("Grunds\xE4tze ordnungsm\xE4\xDFiger Buchf\xFChrung GoB einfach erkl\xE4rt")},{c:"\u25B6",l:"Studyflix \u2013 Rechnungswesen",u:G("Rechnungswesen Grundlagen \xDCberblick")},{c:"\u{1F9E0}",l:"Knowunity \u2013 GoB",u:F("GoB Grunds\xE4tze ordnungsm\xE4\xDFige Buchf\xFChrung")}]}]},4:{lernziel:"Du beherrschst das Grundprinzip der doppelten Buchf\xFChrung: Jeder Gesch\xE4ftsvorfall wird auf zwei Konten gebucht \u2013 einmal im Soll und einmal im Haben. Du kannst T-Konten f\xFCr Aktiv- und Passivkonten korrekt anlegen, er\xF6ffnen und abschlie\xDFen. Du verstehst die Merkregel 'Soll an Haben' und kannst f\xFCr g\xE4ngige E-Commerce-Vorg\xE4nge (Wareneingang auf Ziel, PayPal-Zahlung, Kauf auf Rechnung) eigenst\xE4ndig Buchungss\xE4tze bilden.",pr\u00FCfung:"Klausur BWL EC: T-Konten er\xF6ffnen und f\xFChren, Buchungss\xE4tze bilden (z.B. Waren auf Ziel kaufen: Wareneingang 500 \u20AC an Verbindlichkeiten 500 \u20AC), Saldo berechnen, Abschluss eines Aktivkontos",begriffe:["Soll","Haben","T-Konto","Buchungssatz","Aktivkonto","Passivkonto","Saldo","doppelte Buchf\xFChrung"],subs:[{t:"Das T-Konto \u2013 Soll links, Haben rechts",desc:"Das T-Konto ist die visuelle Grundlage der Buchf\xFChrung. Links steht immer das Soll, rechts immer das Haben \u2013 unabh\xE4ngig davon, ob es ein Aktiv- oder Passivkonto ist. Bei Aktivkonten (z.B. Kasse) bedeutet eine Buchung im Soll eine Erh\xF6hung; bei Passivkonten (z.B. Verbindlichkeiten) bedeutet eine Buchung im Haben eine Erh\xF6hung. Ein Shop-Beispiel: Warenbestand (Aktiv) steigt durch Wareneinkauf \u2192 Buchung im Soll.",items:[{c:"\u25B6",l:"Studyflix \u2013 Soll & Haben",u:G("Soll Haben T-Konto Buchf\xFChrung")},{c:"\u{1F4DA}",l:"wiwiweb.de \u2013 T-Konto \xDCbungen",u:"https://www.wiwiweb.de/"},{c:"\u{1F9E0}",l:"Knowunity \u2013 T-Konten",u:F("T-Konto Buchf\xFChrung Soll Haben")},{c:"\u{1F4AC}",l:"Studocu \u2013 Buchungss\xE4tze Aufgaben",u:le("Buchungss\xE4tze T-Konto Aufgaben L\xF6sungen")}]},{t:"Buchungss\xE4tze f\xFCr E-Commerce-Vorg\xE4nge",desc:"Praxisbeispiele f\xFCr Buchungss\xE4tze: (1) Wareneinkauf auf Ziel: Wareneingang 500 \u20AC / Verbindlichkeiten 500 \u20AC. (2) Zahlung per Bank\xFCberweisung: Verbindlichkeiten 500 \u20AC / Bank 500 \u20AC. (3) Online-Verkauf (Ausgangsrechnung): Forderungen 119 \u20AC / Umsatzerl\xF6se 100 \u20AC / USt 19 \u20AC. Diese Vorg\xE4nge erscheinen regelm\xE4\xDFig in der Klausur!",items:[{c:"\u25B6",l:"YouTube \u2013 Buchungssatz bilden",u:K("Buchungssatz bilden Soll Haben einfach erkl\xE4rt")},{c:"\u25B6",l:"Studyflix \u2013 Buchungssatz",u:G("Buchungssatz Schema")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Buchungss\xE4tze E-Commerce",u:F("Buchungss\xE4tze Wareneinkauf Verkauf Buchf\xFChrung")}]}]},5:{lernziel:"Du kannst eine Bilanz lesen und die wichtigsten Positionen auf Aktiv- (Anlageverm\xF6gen, Umlaufverm\xF6gen) und Passivseite (Eigenkapital, Fremdkapital) einordnen. Du verstehst, wie die Gewinn- und Verlustrechnung (GuV) aufgebaut ist und erkennst den Zusammenhang zwischen Bilanz, GuV und Eigenkapital. Du kannst die vier Bilanzver\xE4nderungstypen unterscheiden.",pr\u00FCfung:"Klausur BWL EC: Bilanzpositionen zuordnen (aktiv oder passiv?), Bilanzver\xE4nderungstypen nennen und erkennen, GuV-Schema ausf\xFCllen, Jahres\xFCberschuss/-fehlbetrag berechnen, Bilanzsumme-Gleichung (Aktiva = Passiva) anwenden",begriffe:["Aktiva","Passiva","Eigenkapital","Fremdkapital","Anlageverm\xF6gen","Umlaufverm\xF6gen","Jahres\xFCberschuss","Bilanzsumme"],subs:[{t:"Bilanzaufbau \u2013 Aktiva und Passiva",desc:"Die Bilanz ist eine Momentaufnahme des Verm\xF6gens (Aktiva) und der Finanzierung (Passiva) zu einem Stichtag. Aktiva: Anlageverm\xF6gen (langfristig: Maschinen, Software, Patente) + Umlaufverm\xF6gen (kurzfristig: Waren, Forderungen, Kasse). Passiva: Eigenkapital (was Eigent\xFCmer eingebracht haben) + Fremdkapital (Schulden bei Banken, Lieferanten). F\xFCr Zalando bedeutet das: Lagerwaren und Forderungen aus Retouren sind das gr\xF6\xDFte Umlaufverm\xF6gen.",items:[{c:"\u25B6",l:"Studyflix \u2013 Bilanz erkl\xE4rt",u:G("Bilanz Aktiva Passiva Aufbau")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Bilanz Aufbau",u:F("Bilanz Aktiva Passiva Aufbau einfach")},{c:"\u{1F4AC}",l:"Studocu \u2013 Bilanz Aufgaben",u:le("Bilanz Jahresabschluss BWL Hochschule Aufgaben")}]},{t:"GuV & die 4 Bilanzver\xE4nderungstypen",desc:"Die GuV zeigt Ertrag vs. Aufwand in einer Periode. Vier Bilanzver\xE4nderungstypen: (1) Aktiv-Tausch: Kasse \u2191, Bank \u2193 \u2013 Bilanzsumme gleich. (2) Passiv-Tausch: EK \u2191, Verbindlichkeiten \u2193. (3) Aktiv-Passiv-Mehrung: Ware \u2191 (Aktiv), Verbindlichkeiten \u2191 (Passiv) \u2013 Bilanzsumme steigt. (4) Aktiv-Passiv-Minderung: Bank \u2193, Kredit \u2193 \u2013 Bilanzsumme sinkt.",items:[{c:"\u25B6",l:"Studyflix \u2013 GuV Rechnung",u:G("GuV Gewinn Verlustrechnung Aufbau")},{c:"\u25B6",l:"YouTube \u2013 Bilanzver\xE4nderungen",u:K("Bilanzver\xE4nderungen 4 Typen Buchf\xFChrung einfach")},{c:"\u{1F9E0}",l:"Knowunity \u2013 GuV",u:F("GuV Gewinn Verlustrechnung einfach Aufbau")}]}]},6:{lernziel:"Du verstehst, warum Anlageverm\xF6gen abgeschrieben wird und kannst lineare und degressive Abschreibung f\xFCr typische E-Commerce-Assets (Server, Laptop, Lagerhalle) berechnen. Du kennst den Unterschied zwischen Vorsteuer (VSt) und Umsatzsteuer (USt) aus H\xE4ndler- und Kundensicht und kannst den USt-Buchungssatz f\xFCr einen Online-Kauf korrekt bilden.",pr\u00FCfung:"Klausur BWL EC: Jahresabschreibung linear berechnen (Anschaffungskosten / Nutzungsdauer), Buchwert zum Stichtag ermitteln, USt-Buchungssatz bilden (Nettobetrag / USt 19% / Bruttobetrag), Vorsteuer vs. Umsatzsteuer aus Unternehmenssicht erkl\xE4ren",begriffe:["Abschreibung","AfA","Buchwert","Restbuchwert","Vorsteuer","Umsatzsteuer","Nutzungsdauer","Anschaffungskosten"],subs:[{t:"Lineare Abschreibung & AfA-Tabelle",desc:"Anlageverm\xF6gen verliert durch Nutzung an Wert. Die lineare Abschreibung verteilt die Kosten gleichm\xE4\xDFig \xFCber die Nutzungsdauer: AfA = Anschaffungskosten / Nutzungsdauer. Beispiel Shopify-Server-Hardware: 12.000 \u20AC / 4 Jahre = 3.000 \u20AC/Jahr. Das Finanzamt gibt in der AfA-Tabelle vor, wie lange verschiedene G\xFCter genutzt werden d\xFCrfen (PC = 3 Jahre, Lkw = 6 Jahre, Geb\xE4ude = 33 Jahre).",items:[{c:"\u25B6",l:"Studyflix \u2013 Abschreibungsarten",u:G("Abschreibung linear degressiv AfA")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Abschreibung Aufgaben",u:F("Abschreibung lineare Berechnung Aufgaben")},{c:"\u{1F4AC}",l:"Studocu \u2013 Abschreibung L\xF6sungen",u:le("Abschreibungen Rechnungswesen Aufgaben L\xF6sungen")},{c:"\u25B6",l:"YouTube \u2013 AfA Buchwert berechnen",u:K("Abschreibung AfA Buchwert berechnen Beispiel")}]},{t:"Umsatzsteuer \u2013 VSt & USt im E-Commerce",desc:"Als Unternehmer zahlst du beim Einkauf Vorsteuer (VSt), die du vom Finanzamt zur\xFCckholst, und erhebst beim Verkauf Umsatzsteuer (USt), die du ans Finanzamt abf\xFChrst. Du bist quasi Steuereinnehmer des Staates. Buchungssatz Warenverkauf: Forderungen 119 \u20AC / Umsatzerl\xF6se 100 \u20AC / USt-Verbindlichkeiten 19 \u20AC. Im EU-Onlinehandel: Ab 10.000 \u20AC Jahresumsatz grenz\xFCberschreitend greift das OSS-Verfahren (One Stop Shop).",items:[{c:"\u25B6",l:"Studyflix \u2013 Umsatzsteuer",u:G("Umsatzsteuer Vorsteuer einfach erkl\xE4rt")},{c:"\u{1F9E0}",l:"Knowunity \u2013 USt Buchungssatz",u:F("Umsatzsteuer Vorsteuer Buchungssatz")},{c:"\u25B6",l:"YouTube \u2013 USt E-Commerce",u:K("Umsatzsteuer E-Commerce Online-Handel OSS")}]}]},7:{lernziel:"Du festigst alle Inhalte aus Woche 1 durch aktive Wiederholung mit Anki und Mind-Map. Ziel: Du kannst ohne Hilfsmittel T-Konten aufstellen, Buchungss\xE4tze bilden, die 4 Bilanzver\xE4nderungstypen nennen und das Wirtschaftlichkeitsprinzip erkl\xE4ren. Spaced Repetition (Anki) ist bewiesen die effektivste Methode f\xFCr Klausurvorbereitung.",pr\u00FCfung:"Gesamtwiederholung Woche 1 \u2013 alle Themen sind direkt klausurrelevant im BWL-EC-Modul",begriffe:["Spaced Repetition","Aktives Erinnern","Mind-Map","Anki","Wiederholung","Lernkurve"],subs:[{t:"Anki effektiv nutzen \u2013 Spaced Repetition",desc:"Anki ist eine Karteikarten-App, die auf dem Prinzip des Spaced Repetition basiert: Karten, die du noch nicht gut kennst, zeigt sie \xF6fter; sichere Karten weniger oft. Damit lernst du in minimalster Zeit maximal viel. Erstelle f\xFCr jede BWL-Definition und jeden Buchungssatz eine eigene Karte. Ziel f\xFCr Woche 1: 35+ Karten, Trefferquote > 80%.",items:[{c:"\u{1F0CF}",l:"Anki App (iOS/Android/Desktop)",u:"https://apps.ankiweb.net/"},{c:"\u25B6",l:"YouTube \u2013 Anki Tutorial Deutsch",u:K("Anki Tutorial Deutsch Karteikarten Spaced Repetition")},{c:"\u{1F9E0}",l:"Knowunity \u2013 BWL Gesamt\xFCbersicht",u:F("BWL Zusammenfassung Pr\xFCfungsvorbereitung")}]},{t:"Mind-Map als Verbindungsstruktur",desc:"Zeichne eine Mind-Map mit 'BWL' im Zentrum und allen 6 Themen der Woche als \xC4ste: Grundbegriffe, Rechtsformen, Buchf\xFChrung, Soll/Haben, Bilanz, Abschreibungen. Trage unter jedem Ast die wichtigsten 3 Schl\xFCsselbegriffe ein. Das visuelle Ordnen st\xE4rkt das Langzeitged\xE4chtnis und hilft dir, Klausurthemen schnell einzuordnen.",items:[{c:"\u25B6",l:"YouTube \u2013 Mind-Map Methode",u:K("Mind Map erstellen Lernmethode effektiv")},{c:"\u{1F4AC}",l:"Studocu \u2013 BWL Klausur",u:le("BWL Klausuraufgaben L\xF6sungen Hochschule")}]}]},8:{lernziel:"Du verstehst, was Handelsmanagement als Disziplin bedeutet und welche wirtschaftliche Funktion Handelsbetriebe in der Wertsch\xF6pfungskette \xFCbernehmen. Du kennst die 5 klassischen Handelsfunktionen und kannst erkl\xE4ren, wie E-Commerce diese ver\xE4ndert oder teilweise obsolet macht. Du kennst die 10 Handelskompetenzen nach dem HBL-EC-Modul der HRW.",pr\u00FCfung:"Klausur HBL EC: 5 Handelsfunktionen nennen und beschreiben, Unterschied Einzel-/Gro\xDFhandel, Disintermediation erkl\xE4ren, Handelskompetenzen benennen",begriffe:["Handelsfunktion","Einzelhandel","Gro\xDFhandel","Disintermediation","Handelsmanagement","Wertsch\xF6pfungskette","\xDCberbr\xFCckungsfunktion"],subs:[{t:"Die 5 klassischen Handelsfunktionen",desc:"Handelsbetriebe erf\xFCllen 5 Funktionen: (1) \xDCberbr\xFCckungsfunktion (Raum & Zeit: Ware vom Hersteller zum Kunden bringen), (2) Quantit\xE4tsfunktion (gro\xDFe Mengen vom Hersteller, kleine an Kunden), (3) Qualit\xE4tsfunktion (Sortimentszusammenstellung), (4) Kreditfunktion (Kauf auf Rechnung erm\xF6glichen), (5) Werbefunktion (Produkte bekannt machen). Im E-Commerce entfallen teilweise Raum- und Zeitfunktionen durch Direktversand (Dropshipping).",items:[{c:"\u25B6",l:"YouTube \u2013 Handelsfunktionen",u:K("Handelsfunktionen 5 Funktionen Handel erkl\xE4rt")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Handelsmanagement",u:F("Handelsmanagement Handelsfunktionen Einzelhandel")},{c:"\u{1F4AC}",l:"Studocu \u2013 HBL Zusammenfassung",u:le("Handelsmanagement HBL Zusammenfassung Hochschule")}]},{t:"Disintermediation \u2013 wenn Handel \xFCberfl\xFCssig wird",desc:"Disintermediation beschreibt die Ausschaltung von Handelsstufen durch das Internet: Hersteller k\xF6nnen direkt an Endkunden verkaufen (D2C). Nike verkauft \xFCber nike.com direkt, Tesla \xFCber eigene Showrooms. Das zwingt den traditionellen Handel zur Spezialisierung und Innovation. Im HBL-EC-Modul ist dieser Wandel ein zentrales Thema.",items:[{c:"\u25B6",l:"YouTube \u2013 Disintermediation",u:K("Disintermediation Handel Internet D2C erkl\xE4rt")},{c:"\u{1F4D6}",l:"Gabler \u2013 Handelsmanagement",u:"https://wirtschaftslexikon.gabler.de/"},{c:"\u{1F4CA}",l:"HDE \u2013 Handelsdaten",u:"https://einzelhandel.de/"}]}]},9:{lernziel:"Du kannst die verschiedenen Betriebstypen des station\xE4ren und digitalen Handels unterscheiden: Fachhandel, Verbrauchermarkt, Discounter, Versandhandel, Online-Marktplatz. Du verstehst Sortimentsstrategie (Breite vs. Tiefe) und Category Management und erkennst den Unterschied zwischen Multi-, Cross- und Omnichannel-Handel.",pr\u00FCfung:"Klausur HBL EC: Betriebstypen zuordnen und Beispiele nennen, Sortimentsbreite vs. -tiefe erl\xE4utern, Omnichannel vs. Multichannel unterscheiden, Category Management beschreiben",begriffe:["Betriebstyp","Sortimentsbreite","Sortimentstiefe","Category Management","Omnichannel","Multichannel","Fachhandel","Discounter"],subs:[{t:"Betriebstypen im \xDCberblick",desc:"Fachhandel: tiefes Sortiment (z.B. MediaMarkt f\xFCr Elektronik), hohe Beratungskompetenz. Verbrauchermarkt/SB-Warenhaus: breites, tiefes Sortiment (Kaufland). Discounter: schmales, flaches Sortiment, Preisf\xFChrerschaft (Aldi, Lidl). Versandhandel/E-Commerce: kein station\xE4rer Punkt, unbegrenzte Sortimentsbreite m\xF6glich (Amazon). Marktplatz: Plattform f\xFCr Drittanbieter (Amazon Marketplace, Etsy).",items:[{c:"\u25B6",l:"YouTube \u2013 Betriebstypen",u:K("Betriebstypen Einzelhandel Fachhandel Discounter Verbrauchermarkt")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Betriebstypen",u:F("Betriebstypen Handel \xDCbersicht")},{c:"\u{1F4AC}",l:"Studocu \u2013 HBL Mitschriften",u:le("Handelsmanagement Betriebstypen Sortiment")}]},{t:"Omnichannel \u2013 die Zukunft des Handels",desc:"Omnichannel bedeutet, dass alle Verkaufskan\xE4le (Filiale, Website, App, Social Commerce) nahtlos vernetzt sind und ein einheitliches Kundenerlebnis bieten: Bestellung online, Abholung im Laden (Click & Collect), R\xFCckgabe im Store. Im Gegensatz zu Multichannel, bei dem Kan\xE4le parallel, aber getrennt existieren. Zalando und H&M sind Paradebeispiele f\xFCr Omnichannel-H\xE4ndler.",items:[{c:"\u25B6",l:"YouTube \u2013 Omnichannel erkl\xE4rt",u:K("Omnichannel Multichannel Crosschannel Unterschied")},{c:"\u{1F4CA}",l:"HDE Handelsverband",u:"https://einzelhandel.de/"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Omnichannel",u:F("Omnichannel Multichannel Handel erkl\xE4rt")}]}]},10:{lernziel:"Du kennst die aktuellen Umsatzzahlen des deutschen E-Commerce-Markts und kannst die wichtigsten Entwicklungsphasen seit 1995 benennen. Du verstehst, warum Online-Handel ein Disruptor f\xFCr den station\xE4ren Handel ist und welche Unternehmen als 'GAFA' bezeichnet werden. Du kannst die Wertsch\xF6pfungsstufen des E-Commerce beschreiben.",pr\u00FCfung:"Klausur ECM: E-Commerce Umsatzzahlen DE (aktuelle Gr\xF6\xDFenordnung kennen), Entwicklungsgeschichte Internethandel, Disruption und Disintermediation erkl\xE4ren, GAFA beschreiben",begriffe:["E-Commerce","Disruption","GAFA","Wertsch\xF6pfungskette","Station\xE4rer Handel","bevh","Corona-Effekt"],subs:[{t:"E-Commerce Entwicklung & aktuelle Zahlen",desc:"Deutsche E-Commerce-Geschichte: 1995 erste Online-Shops, 1999 eBay & Amazon DE, 2005 Zalando-Gr\xFCndung, 2011\u20132019 kontinuierliches Wachstum, 2020\u20132021 Corona-Boom (+30%), danach Normalisierung. Heute: Laut bevh erzielte der deutsche Online-Handel 2023 ca. 79,7 Mrd. Euro Umsatz. Die wichtigsten Kategorien: Mode, Elektronik, M\xF6bel. Amazon, Otto und Zalando sind die Top-3-Plattformen in Deutschland.",items:[{c:"\u{1F4CA}",l:"Statista \u2013 E-Commerce DE Umsatz",u:"https://de.statista.com/themen/3979/e-commerce-in-deutschland/"},{c:"\u{1F4CA}",l:"bevh \u2013 Marktdaten",u:"https://www.bevh.org/zahlen-daten-fakten/"},{c:"\u{1F4D6}",l:"Deges Kap.1.5 \u2013 \xD6konomische Bedeutung (S.20)",u:N(36)},{c:"\u{1F4D6}",l:"Deges Kap.1.5.3 \u2013 Corona-Effekt (S.26)",u:N(42)}]},{t:"Disruption durch E-Commerce",desc:"E-Commerce hat ganze Branchen disruptiert: Buchhandel (Hugendubel schlie\xDFt Filialen wegen Amazon), Musik (CD-Handel ersetzt durch Streaming), Reiseb\xFCros (durch booking.com). Disruption nach Christensen: Neue Technologie tritt zun\xE4chst im Niedrigpreissegment an und verdr\xE4ngt dann die etablierten Spieler von unten. Im HRW-Modul ECM ist dieses Konzept Pr\xFCfungsstoff.",items:[{c:"\u{1F4D6}",l:"Deges Kap.1.4 \u2013 Disruption (S.16)",u:N(32)},{c:"\u25B6",l:"YouTube \u2013 Disruption Handel",u:K("Disruption Branchentransformation E-Commerce station\xE4rer Handel")}]}]},11:{lernziel:"Du unterscheidest sicher zwischen B2C, B2B, C2C und D2C und kannst f\xFCr jedes Modell drei reale Beispiele nennen. Du verstehst das Konzept der Plattform\xF6konomie mit Netzeffekten und kannst erkl\xE4ren, warum Marktpl\xE4tze wie Amazon Daten als Wettbewerbsvorteil nutzen. Du kennst den Unterschied zwischen Online-Direktgesch\xE4ft und Marktplatzmodell.",pr\u00FCfung:"Klausur ECM: Gesch\xE4ftsmodelle definieren und mit Beispielen belegen, Netzwerkeffekte erkl\xE4ren, Vor-/Nachteile Marktplatz vs. eigener Shop, Plattform\xF6konomie beschreiben",begriffe:["B2C","B2B","C2C","D2C","Plattform","Netzwerkeffekte","Marktplatz","Direktgesch\xE4ft"],subs:[{t:"Gesch\xE4ftsmodelle im E-Commerce",desc:"B2C (Business-to-Consumer): Unternehmen an Endverbraucher (Zalando, Amazon Retail). B2B (Business-to-Business): Unternehmen an Unternehmen (Amazon Business, Alibaba). C2C (Consumer-to-Consumer): Verbraucher an Verbraucher \xFCber Plattform (eBay Kleinanzeigen, Vinted). D2C (Direct-to-Consumer): Hersteller direkt an Endkunde ohne Zwischenh\xE4ndler (Nike.com, Tesla). D2C w\xE4chst stark, weil Hersteller Kundendaten selbst kontrollieren wollen.",items:[{c:"\u{1F4D6}",l:"Deges Kap.2.1 \u2013 Marktformen (S.53)",u:N(68)},{c:"\u{1F4D6}",l:"Deges Kap.2.1.5 \u2013 D2C (S.59)",u:N(74)},{c:"\u{1F9E0}",l:"Knowunity \u2013 Gesch\xE4ftsmodelle",u:F("B2B B2C D2C Gesch\xE4ftsmodelle E-Commerce")},{c:"\u25B6",l:"YouTube \u2013 D2C erkl\xE4rt",u:K("D2C Direct to Consumer Gesch\xE4ftsmodell erkl\xE4rt")}]},{t:"Plattform\xF6konomie & Netzwerkeffekte",desc:"Plattformen schaffen Mehrwert durch Vernetzung von Angebot und Nachfrage. Je mehr Nutzer eine Plattform hat, desto attraktiver wird sie f\xFCr neue Nutzer \u2013 das sind positive Netzwerkeffekte. Amazon hatte 2023 \xFCber 300 Millionen Kunden weltweit und \xFCber 2 Millionen aktive Drittanbieter. Diese Datenmacht erm\xF6glicht personalisierte Empfehlungen (Recommendation Engine) und Preisoptimierung in Echtzeit.",items:[{c:"\u{1F4D6}",l:"Deges Kap.2.3 \u2013 Marktpl\xE4tze (S.62)",u:N(77)},{c:"\u{1F4D6}",l:"Deges Kap.2.5.3 \u2013 Big Data & KI (S.96)",u:N(111)},{c:"\u25B6",l:"YouTube \u2013 Plattform\xF6konomie",u:K("Plattform\xF6konomie Amazon Netzeffekte erkl\xE4rt")},{c:"\u{1F4AC}",l:"Studocu \u2013 Plattform\xF6konomie",u:le("Plattform\xF6konomie Netzeffekte Hochschule")}]}]},12:{lernziel:"Du kannst den f\xFCnfstufigen Kaufentscheidungsprozess beschreiben und auf Online-Kaufsituationen anwenden. Du kennst den ROPO-Effekt und seinen Gegensatz (TOPO) und verstehst ihre Bedeutung f\xFCr Omnichannel-Strategien. Du kannst hedonistischen vom utilitaristischen Kauf unterscheiden und verschiedene Konsumententypologien benennen.",pr\u00FCfung:"Klausur ECM: Kaufentscheidungsprozess skizzieren (5 Phasen), ROPO-Effekt erkl\xE4ren, Konsumententypologien (hedonistisch, utilitaristisch) unterscheiden, Vertrauen als Kaufhemmnis im E-Commerce",begriffe:["Kaufentscheidungsprozess","ROPO","TOPO","Hedonistisch","Utilitaristisch","Trust","Conversion Rate","Kaufhemmnis"],subs:[{t:"5-stufiger Kaufentscheidungsprozess",desc:"(1) Problemerkennung: Ich brauche neue Kopfh\xF6rer. (2) Informationssuche: Google, YouTube-Reviews, Amazon-Rezensionen. (3) Alternativbewertung: Sony vs. Apple vs. Sennheiser \u2013 Preisvergleich, Testberichte. (4) Kaufentscheidung: Kauf auf Amazon mit Prime. (5) Nachkaufverhalten: Bewertung schreiben, Retoure pr\xFCfen, Empfehlung an Freunde. E-Commerce-H\xE4ndler m\xFCssen in jeder Phase pr\xE4sent sein (SEO, Ads, Trust-Signale, After-Sales).",items:[{c:"\u{1F4D6}",l:"Deges Kap.4.2 \u2013 Kaufentscheidung (S.130)",u:N(144)},{c:"\u25B6",l:"YouTube \u2013 Kaufentscheidungsprozess",u:K("Kaufentscheidungsprozess 5 Phasen E-Commerce")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Kaufentscheidung",u:F("Kaufentscheidungsprozess Konsument Phasen")}]},{t:"ROPO-Effekt & Konsumententypologien",desc:"ROPO = Research Online, Purchase Offline: Kunde informiert sich online, kauft aber im Laden. TOPO = Try Offline, Purchase Online: Kunde probiert im Laden an, kauft g\xFCnstiger online. Beide Effekte zeigen: Online und station\xE4r sind nicht getrennt, sondern verflochten. Konsumententypologien: Hedonisten kaufen aus Freude am Einkaufen (Impulskauf); Utilitaristen kaufen zielorientiert, rational und preisbewusst.",items:[{c:"\u{1F4D6}",l:"Deges Kap.4.3 \u2013 Konsumententypologien (S.139)",u:N(153)},{c:"\u25B6",l:"YouTube \u2013 ROPO-Effekt",u:K("ROPO Effekt Research Online Purchase Offline")},{c:"\u{1F4AC}",l:"Studocu \u2013 Konsumentenverhalten",u:le("Konsumentenverhalten E-Commerce Online Shopping")}]}]},13:{lernziel:"Du kennst die wichtigsten Zahlungsmethoden im deutschen E-Commerce aus Kunden- und H\xE4ndlersicht und kannst deren Kosten und Ausfallrisiken einsch\xE4tzen. Du verstehst Fulfillment-Modelle (Inhouse, 3PL, Dropshipping) und wei\xDFt, warum die 'letzte Meile' der teuerste Teil der Lieferkette ist. Du kennst Nachhaltigkeitsans\xE4tze im E-Commerce-Versand.",pr\u00FCfung:"Klausur ECM: Payment-Methoden Vor-/Nachteile aus H\xE4ndlersicht nennen, Fulfillment-Modelle beschreiben, Retouren und ihre Kosten erkl\xE4ren, Nachhaltigkeit der letzten Meile",begriffe:["Payment Gateway","Zahlungsausfallrisiko","Fulfillment","3PL","Dropshipping","Letzte Meile","Retoure","CO2-Kompensation"],subs:[{t:"Payment-Methoden aus H\xE4ndlersicht",desc:"Kauf auf Rechnung: Beliebteste Methode in DE (30%+ Marktanteil), hohes Zahlungsausfallrisiko f\xFCr H\xE4ndler. PayPal: Schnell, sicher, aber Geb\xFChren 1,5\u20133%. Klarna (BNPL): Ratenkauf, H\xE4ndler erh\xE4lt sofort Geld, Klarna tr\xE4gt das Ausfallrisiko gegen Geb\xFChr. Kreditkarte: Weltweit, aber chargeback-Risiko. SEPA-Lastschrift: G\xFCnstig, aber R\xFCckbuchungsrisiko. F\xFCr E-Commerce-H\xE4ndler: Breites Payment-Angebot erh\xF6ht Conversion Rate!",items:[{c:"\u25B6",l:"YouTube \u2013 Payment E-Commerce",u:K("Payment Methoden E-Commerce Vergleich PayPal Klarna Kreditkarte")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Payment",u:F("Payment E-Commerce Zahlungsmethoden Online-Shop")},{c:"\u{1F4AC}",l:"Studocu \u2013 Payment",u:le("Payment Fulfillment E-Commerce Hochschule")}]},{t:"Fulfillment & Nachhaltigkeit der letzten Meile",desc:"Fulfillment umfasst: Lagerung, Kommissionierung, Verpackung, Versand, Retouren. 3 Modelle: (1) Inhouse: H\xE4ndler macht alles selbst (Kontrolle, aber kapitalintensiv). (2) 3PL (Third-Party Logistics): DHL, Hermes \xFCbernehmen Logistik. (3) Dropshipping: Hersteller versendet direkt \u2013 kein Lager n\xF6tig, aber weniger Kontrolle. Die letzte Meile (vom Depot zum Kunden) macht 40\u201350% der Logistikkosten aus. Nachhaltigkeit: E-Fahrzeuge, Paketstationen, CO2-neutrale Optionen.",items:[{c:"\u25B6",l:"YouTube \u2013 Fulfillment & Letzte Meile",u:K("Fulfillment letzte Meile E-Commerce Logistik erkl\xE4rt")},{c:"\u{1F4CA}",l:"DHL Nachhaltigkeit",u:"https://www.dhl.com/de-de/home/nachhaltigkeit.html"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Logistik",u:F("Logistik Fulfillment E-Commerce letzte Meile")}]}]},14:{lernziel:"Du kennst den strukturellen Aufbau einer wissenschaftlichen Seminararbeit und kannst jeden Abschnitt mit Inhalt f\xFCllen. Du verstehst den Unterschied zwischen Prim\xE4r- und Sekund\xE4rquellen, findest seri\xF6se wissenschaftliche Quellen und kannst korrekt zitieren. WICHTIG: Im ECM-Modul Semester 1 schreibst du eine 25-seitige Gruppenarbeit zu einem realen Handelsunternehmen.",pr\u00FCfung:"Seminararbeit ECM Sem.1: 25 Seiten Gruppenarbeit, wissenschaftliche Sprache, korrekte Zitation (APA oder Harvard), Literaturverzeichnis, Eigenst\xE4ndigkeitserkl\xE4rung",begriffe:["Seminararbeit","Zitation","Literaturverzeichnis","Prim\xE4rquelle","Sekund\xE4rquelle","APA-Stil","Wissenschaftssprache","Plagiat"],subs:[{t:"Aufbau der wissenschaftlichen Seminararbeit",desc:"Klassischer Aufbau (7 Teile): (1) Titelblatt (Name, Modul, Betreuer, Datum). (2) Inhaltsverzeichnis mit Seitenzahlen. (3) Abbildungsverzeichnis (falls vorhanden). (4) Einleitung (Thema + Fragestellung + Aufbau der Arbeit \u2013 ca. 1 Seite). (5) Hauptteil (Theorie, Analyse, Ergebnisse \u2013 20+ Seiten). (6) Fazit & Ausblick (ca. 1 Seite). (7) Literaturverzeichnis. Sprache: Wissenschaftlich, kein 'Ich', unpers\xF6nlich, pr\xE4zise.",items:[{c:"\u25B6",l:"YouTube \u2013 Seminararbeit Aufbau",u:K("Seminararbeit schreiben Aufbau Gliederung Anleitung")},{c:"\u{1F4DA}",l:"Scribbr \u2013 Gliederung",u:"https://www.scribbr.de/richtig-zitieren/gliederung/"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Wiss. Schreiben",u:F("Wissenschaftlich schreiben Seminararbeit Aufbau")},{c:"\u{1F4AC}",l:"Studocu \u2013 Seminararbeit Beispiel",u:le("Seminararbeit E-Commerce Beispiel Hochschule")}]},{t:"Zitation & seri\xF6se Quellen finden",desc:"In-Text-Zitation APA: (Deges, 2023, S. 20). Literaturverzeichnis: Deges, F. (2023). Grundlagen des E-Commerce (2. Aufl.). Springer Gabler. Seri\xF6se Quellen: Springer Link, EBSCO, Google Scholar, statista.com (Vorsicht: nur als Sekund\xE4rquelle), bevh.org. Vorsicht: Wikipedia und Blogs sind keine zitierf\xE4higen Quellen! Das Buch von Deges ist dein Prim\xE4rwerk f\xFCr das ECM-Modul.",items:[{c:"\u{1F4DA}",l:"Scribbr \u2013 APA Zitieren",u:"https://www.scribbr.de/category/richtig-zitieren/"},{c:"\u{1F4DA}",l:"Citavi Tutorials",u:"https://www.citavi.com/de/tutorials"},{c:"\u{1F310}",l:"Google Scholar",u:"https://scholar.google.de/"},{c:"\u{1F4D6}",l:"Springer Link",u:"https://link.springer.com/"}]}]},15:{lernziel:"Du kennst die grundlegenden Hardware-Komponenten eines Computers (CPU, RAM, Festplatte, Mainboard, GPU) und verstehst das Von-Neumann-Prinzip. Du kannst Zahlen sicher zwischen Dezimal-, Bin\xE4r-, Oktal- und Hexadezimalsystem umrechnen \u2013 das ist direkt klausurrelevant im GIP-EC-Modul! Du verstehst, warum Computer intern im Bin\xE4rsystem arbeiten.",pr\u00FCfung:"Klausur GIP EC: Umrechnung Dezimal \u2194 Bin\xE4r \u2194 Hex (Rechenaufgaben mit L\xF6sungsweg!), Von-Neumann-Architektur skizzieren, Hardware-Komponenten benennen und erkl\xE4ren",begriffe:["CPU","RAM","Bin\xE4rsystem","Hexadezimal","Von-Neumann","Bit","Byte","ASCII"],subs:[{t:"Computeraufbau & Von-Neumann-Architektur",desc:"Ein Computer nach Von-Neumann besteht aus: CPU (rechnet und steuert), Hauptspeicher RAM (fl\xFCchtig, schnell), Festplatte/SSD (persistent, langsam), Eingabe (Tastatur) und Ausgabe (Monitor). Die CPU besteht aus ALU (Arithmetisch-Logische Einheit, rechnet), Steuerwerk (organisiert Abl\xE4ufe) und Registern (ultraschneller Speicher). F\xFCr Java-Programmierung wichtig: Dein Programm liegt als .class-Datei auf der Festplatte, wird in den RAM geladen und von der CPU ausgef\xFChrt.",items:[{c:"\u25B6",l:"YouTube \u2013 Computeraufbau",u:K("Computeraufbau CPU RAM Festplatte einfach erkl\xE4rt")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Computeraufbau",u:F("Computeraufbau CPU RAM Speicher Informatik")},{c:"\u{1F4CA}",l:"Studyflix \u2013 Von-Neumann",u:G("Von Neumann Architektur")}]},{t:"Zahlensysteme \u2013 Umrechnung f\xFCr die Klausur",desc:"Dezimal (Basis 10): Unser Alltag. Bin\xE4r (Basis 2): Nur 0 und 1 \u2013 so denkt der Computer. Hexadezimal (Basis 16): Kompakte Darstellung bin\xE4rer Daten (Farben in HTML: #FF5733). Umrechnung Dezimal \u2192 Bin\xE4r: Wiederholtes Dividieren durch 2, Rest aufschreiben von unten nach oben. Beispiel: 42 = 101010\u2082. Umrechnung Hex: Jede Hex-Stelle entspricht 4 Bit (0=0000, F=1111, A=1010). Diese Aufgaben kommen garantiert in der GIP-Klausur!",items:[{c:"\u{1F4CA}",l:"Studyflix \u2013 Bin\xE4rsystem",u:G("Bin\xE4rsystem Umrechnung Dezimal")},{c:"\u{1F4CA}",l:"Studyflix \u2013 Hexadezimal",u:G("Hexadezimalsystem Umrechnung")},{c:"\u25B6",l:"YouTube \u2013 Bin\xE4r Dezimal",u:K("Dezimal Bin\xE4r Hexadezimal Umrechnung Aufgaben")},{c:"\u{1F4AC}",l:"Studocu \u2013 Zahlensysteme",u:le("Zahlensysteme Informatik Bin\xE4r Hex Hochschule")}]}]},16:{lernziel:"Du kannst Wahrheitstabellen f\xFCr AND, OR, NOT, XOR und NAND eigenst\xE4ndig aufstellen und auswerten. Du kennst die De-Morgan-Regeln und kannst logische Ausdr\xFCcke vereinfachen. Du verstehst, wie boolesche Logik die Grundlage f\xFCr if-Bedingungen in Java bildet. Diese Themen sind ausdr\xFCcklich Klausurstoff im GIP-EC-Modul der HRW.",pr\u00FCfung:"Klausur GIP EC: Wahrheitstabellen aufstellen (2\u20133 Aufgaben), De-Morgan anwenden und vereinfachen, boolesche Ausdr\xFCcke auswerten, Verbindung zu Java-Bedingungen (&&, ||, !) erkl\xE4ren",begriffe:["AND","OR","NOT","XOR","NAND","De-Morgan","Wahrheitstabelle","Logikgatter"],subs:[{t:"Grundoperatoren & Wahrheitstabellen",desc:"AND (UND): Nur wahr, wenn BEIDE Eingaben wahr sind. OR (ODER): Wahr, wenn MINDESTENS EINE Eingabe wahr ist. NOT (NICHT): Invertiert den Wert. XOR (Exklusiv-Oder): Wahr, wenn GENAU EINE Eingabe wahr ist. NAND: Gegenteil von AND. In Java: && = AND, || = OR, ! = NOT. Klausurbeispiel: Ausdruck !(A && B) = !A || !B nach De-Morgan vereinfachen.",items:[{c:"\u{1F4CA}",l:"Studyflix \u2013 Aussagenlogik",u:G("Aussagenlogik Wahrheitstabelle AND OR NOT")},{c:"\u{1F9E0}",l:"Knowunity \u2013 Boolesche Algebra",u:F("Boolesche Algebra Wahrheitstabelle AND OR NOT")},{c:"\u25B6",l:"YouTube \u2013 Wahrheitstabellen",u:K("Wahrheitstabelle AND OR NOT XOR Informatik")},{c:"\u{1F4AC}",l:"Studocu \u2013 Aufgaben",u:le("Aussagenlogik Boolesche Algebra Aufgaben Informatik")}]},{t:"De-Morgan-Regeln \u2013 vereinfachen f\xFCr die Klausur",desc:"De-Morgans Gesetze: (1) NOT(A AND B) = NOT A OR NOT B. (2) NOT(A OR B) = NOT A AND NOT B. Merkhilfe: 'Klammer aufl\xF6sen = Vorzeichen wechseln + AND\u2194OR tauschen'. Praxisbeispiel: Eine Warenbestellbedingung im E-Commerce: 'Bestelle, wenn Lager leer UND Nachfrage hoch' \u2192 mit NOT vereinfachen f\xFCr die Systemlogik. De-Morgan erscheint in jeder GIP-Klausur!",items:[{c:"\u{1F4CA}",l:"Studyflix \u2013 De-Morgan",u:G("De Morgan Regel Vereinfachung")},{c:"\u25B6",l:"YouTube \u2013 De-Morgan erkl\xE4rt",u:K("De-Morgan Regel Informatik einfach erkl\xE4rt Aufgaben")},{c:"\u{1F9E0}",l:"Knowunity \u2013 De-Morgan",u:F("De Morgan Regel Logik Informatik Klausur")}]}]},17:{lernziel:"Du verstehst, warum Java als Programmiersprache im GIP-EC-Modul der HRW verwendet wird (plattformunabh\xE4ngig dank JVM, weit verbreitet im Enterprise-Bereich). Du kannst Variablen mit int, double, long, boolean, char und String deklarieren und initialisieren. Du verstehst Typkonvertierung (implizites und explizites Casting) und kannst dein erstes Hello-World-Programm in Java schreiben.",pr\u00FCfung:"Klausur/Praktikum GIP EC: Variablen deklarieren, Datentypen unterscheiden und konvertieren, einfache Ein-/Ausgabe mit System.out.println() und Scanner, Typfehler erkennen",begriffe:["Variable","Datentyp","int","String","boolean","Casting","JVM","Deklaration","Initialisierung"],subs:[{t:"Java Grundstruktur & Datentypen",desc:'Jedes Java-Programm beginnt mit einer Klasse und einer main()-Methode. Primitive Datentypen: int (ganze Zahlen, z.B. int lagerbestand = 100;), double (Dezimalzahlen, z.B. double preis = 9.99;), boolean (wahr/falsch, z.B. boolean verf\xFCgbar = true;), char (einzelnes Zeichen). Referenztypen: String (Zeichenkette, z.B. String name = "Sneaker";). ACHTUNG: String mit gro\xDFem S \u2013 ist eine Klasse, kein primitiver Typ!',items:[{c:"\u{1F4BB}",l:"W3Schools \u2013 Java Variables",u:"https://www.w3schools.com/java/java_variables.asp"},{c:"\u{1F4BB}",l:"W3Schools \u2013 Data Types",u:"https://www.w3schools.com/java/java_data_types.asp"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Java Variablen",u:F("Java Variablen Datentypen Programmierung")},{c:"\u25B6",l:"YouTube \u2013 Java Deutsch",u:K("Java Tutorial Deutsch Variablen Datentypen Anf\xE4nger")}]},{t:"Type Casting & erstes Programm",desc:'Implizites Casting: Kleiner Typ \u2192 gr\xF6\xDFer funktioniert automatisch: int \u2192 double. Explizites Casting: Gr\xF6\xDFer \u2192 kleiner muss manuell erfolgen: (int) meinDouble \u2013 dabei gehen Nachkommastellen verloren. Dein erstes Programm: public class Hallo { public static void main(String[] args) { System.out.println("Hallo Marokko!"); } }. Scanner f\xFCr Eingabe: Scanner sc = new Scanner(System.in); String eingabe = sc.nextLine();',items:[{c:"\u{1F4BB}",l:"W3Schools \u2013 Type Casting",u:"https://www.w3schools.com/java/java_type_casting.asp"},{c:"\u25B6",l:"YouTube \u2013 Java Grundlagen",u:K("Java erstes Programm Hello World Deutsch Tutorial")},{c:"\u{1F4AC}",l:"Studocu \u2013 Java Mitschriften",u:le("Java Programmierung Grundlagen Hochschule")}]}]},18:{lernziel:"Du kannst if/else-Verzweigungen, else-if-Ketten und switch-Anweisungen in Java schreiben und einsetzen. Du beherrschst die drei Schleifentypen: for (bekannte Iterationsanzahl), while (unbekannte Anzahl) und do-while (mindestens einmal). Diese Kontrollstrukturen sind die Basis f\xFCr alle GIP-Praktikumsaufgaben.",pr\u00FCfung:"Klausur/Praktikum GIP EC: Code-Tracing (Was gibt dieses Programm aus?), eigene Schleifen und Bedingungen schreiben, Endlosschleifen erkennen, break und continue erkl\xE4ren",begriffe:["if-else","switch","for-Schleife","while-Schleife","do-while","break","continue","Kontrollstruktur"],subs:[{t:"Bedingungen & Verzweigungen in Java",desc:'if (bedingung) { // wenn wahr } else if (andere) { // alternativ } else { // sonst }. Bedingungen verwenden Vergleichsoperatoren: == (gleich), != (ungleich), > < >= <=. switch f\xFCr viele feste F\xE4lle: switch(tag) { case 1: System.out.println("Mo"); break; default: ... }. E-Commerce-Beispiel: if (bestand > 0 && preis < budget) { kaufen(); } else { wunschliste(); }',items:[{c:"\u{1F4BB}",l:"W3Schools \u2013 Java Conditions",u:"https://www.w3schools.com/java/java_conditions.asp"},{c:"\u{1F4BB}",l:"W3Schools \u2013 Switch",u:"https://www.w3schools.com/java/java_switch.asp"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Java if-else",u:F("Java if else Bedingungen Programmierung")},{c:"\u25B6",l:"YouTube \u2013 if/else Java",u:K("Java if else Bedingungen switch Kontrollstrukturen Deutsch")}]},{t:"Schleifen: for, while, do-while",desc:"for-Schleife (Anzahl bekannt): for (int i = 0; i < 10; i++) { System.out.println(i); } \u2013 z\xE4hlt 0 bis 9. while-Schleife (Anzahl unbekannt): while (user.hatGeld()) { kaufen(); } \u2013 solange Bedingung wahr. do-while (mindestens einmal): do { eingabe(); } while (!eingabe.valid()); \u2013 f\xFChrt mindestens einmal aus, dann pr\xFCft. break beendet die Schleife sofort; continue \xFCberspringt den Rest der aktuellen Iteration.",items:[{c:"\u{1F4BB}",l:"W3Schools \u2013 For Loop",u:"https://www.w3schools.com/java/java_for_loop.asp"},{c:"\u{1F4BB}",l:"W3Schools \u2013 While Loop",u:"https://www.w3schools.com/java/java_while_loop.asp"},{c:"\u{1F310}",l:"CodingBat \u2013 Java \xDCbungen",u:"https://codingbat.com/java"},{c:"\u25B6",l:"YouTube \u2013 Schleifen Java",u:K("Java for while Schleife Deutsch Anf\xE4nger \xDCbungen")}]}]},19:{lernziel:"Du kannst eigene Methoden in Java definieren, Parameter \xFCbergeben und R\xFCckgabewerte nutzen. Du verstehst das OOP-Konzept: Klassen sind Baupl\xE4ne, Objekte sind Instanzen. Du kannst eine einfache Klasse 'Produkt' mit Attributen, Konstruktor und Getter-/Setter-Methoden schreiben. Du verstehst Vererbung und Polymorphie auf konzeptioneller Ebene.",pr\u00FCfung:"Klausur/Praktikum GIP EC: Methoden schreiben und aufrufen (Parameter, R\xFCckgabetyp), einfache Klasse implementieren, Konstruktor und Getter/Setter, Vererbungshierarchie verstehen und zeichnen",begriffe:["Methode","Parameter","R\xFCckgabewert","Klasse","Objekt","Konstruktor","Vererbung","Kapselung"],subs:[{t:"Methoden definieren & aufrufen",desc:"Eine Methode kapselt wiederverwendbaren Code: public static int addiere(int a, int b) { return a + b; } \u2013 aufruf: int ergebnis = addiere(5, 3); \u2192 ergebnis = 8. Methodenbestandteile: Zugriffsmodifizierer (public), R\xFCckgabetyp (int oder void), Name (addiere), Parameter ((int a, int b)), Methodenrumpf ({...}), Return-Anweisung. E-Commerce-Beispiel: berechneGesamtpreis(double preis, int menge, double rabatt)",items:[{c:"\u{1F4BB}",l:"W3Schools \u2013 Java Methods",u:"https://www.w3schools.com/java/java_methods.asp"},{c:"\u{1F4BB}",l:"W3Schools \u2013 Parameters",u:"https://www.w3schools.com/java/java_methods_param.asp"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Java Methoden",u:F("Java Methoden Parameter R\xFCckgabewert")},{c:"\u25B6",l:"YouTube \u2013 Methoden Java",u:K("Java Methoden Parameter R\xFCckgabewert Deutsch")}]},{t:"OOP: Klassen, Objekte & Vererbung",desc:'Klasse = Bauplan. Objekt = konkrete Instanz. Beispielklasse: class Produkt { String name; double preis; Produkt(String n, double p) { name=n; preis=p; } String getName() { return name; } } \u2013 Objekt erstellen: Produkt sneaker = new Produkt("Air Max", 149.99); System.out.println(sneaker.getName()); Vererbung: class DigitalesProdukt extends Produkt { } \u2013 erbt alle Attribute und Methoden von Produkt.',items:[{c:"\u{1F4BB}",l:"W3Schools \u2013 Java Classes",u:"https://www.w3schools.com/java/java_classes.asp"},{c:"\u{1F4BB}",l:"W3Schools \u2013 OOP",u:"https://www.w3schools.com/java/java_oop.asp"},{c:"\u25B6",l:"YouTube \u2013 OOP Java",u:K("Objektorientierung Java Klassen Vererbung Deutsch")},{c:"\u{1F310}",l:"CodinGame \u2013 Java \xFCben",u:"https://www.codingame.com/start/"}]}]},20:{lernziel:"Du kannst erkl\xE4ren, was passiert, wenn du 'amazon.de' im Browser eingibst \u2013 von der DNS-Aufl\xF6sung \xFCber TCP/IP-Handshake bis zur HTTP-Anfrage und HTML-Antwort. Du kennst den Unterschied zwischen HTTP und HTTPS (SSL/TLS-Verschl\xFCsselung) und wei\xDFt, warum HTTPS f\xFCr E-Commerce-Shops Pflicht ist. Diese Grundlagen bereiten dich auf das Datenbanken-Modul in Semester 2 vor.",pr\u00FCfung:"Relevant in mehreren Modulen: HTTP vs. HTTPS erkl\xE4ren, DNS-Aufl\xF6sung beschreiben, Client-Server-Modell skizzieren, API-Begriff definieren, IP-Adressen und Ports",begriffe:["HTTP","HTTPS","DNS","TCP/IP","SSL/TLS","Client","Server","API","Port"],subs:[{t:"Vom Browser bis zur Webseite \u2013 Schritt f\xFCr Schritt",desc:"(1) Du tippst amazon.de. (2) Browser fragt den DNS-Server: 'Welche IP hat amazon.de?' \u2192 Antwort: 54.239.28.85. (3) Browser baut TCP-Verbindung auf (3-Way-Handshake). (4) HTTPS: SSL/TLS-Verschl\xFCsselung aktiviert. (5) Browser sendet HTTP-Request: GET /index.html HTTP/1.1. (6) Server antwortet mit HTTP-Response: 200 OK + HTML-Code. (7) Browser rendert HTML zu sichtbarer Webseite. Das alles in unter 1 Sekunde!",items:[{c:"\u25B6",l:"YouTube \u2013 Internet erkl\xE4rt",u:K("Wie funktioniert Internet HTTP DNS TCP IP Schritt Schritt Deutsch")},{c:"\u{1F4DA}",l:"MDN \u2013 Internet",u:"https://developer.mozilla.org/de/docs/Learn/Common_questions/Web_mechanics/How_does_the_Internet_work"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Netzwerke",u:F("Internet HTTP DNS IP Netzwerke Informatik")}]},{t:"HTTP vs. HTTPS & APIs",desc:"HTTP (HyperText Transfer Protocol): Unverschl\xFCsselt \u2013 Daten k\xF6nnen abgefangen werden. HTTPS: HTTP + SSL/TLS-Verschl\xFCsselung \u2013 alle Daten (Kreditkarten, Passw\xF6rter) verschl\xFCsselt. Seit 2021 straft Google HTTP-Seiten in Rankings ab. API (Application Programming Interface): Eine Schnittstelle, \xFCber die zwei Programme kommunizieren. Beispiel: Shopify-Shop ruft die DHL-API auf, um eine Sendungsverfolgung zu starten. REST-APIs sind der Standard im E-Commerce.",items:[{c:"\u25B6",l:"YouTube \u2013 HTTPS erkl\xE4rt",u:K("HTTPS SSL TLS Verschl\xFCsselung einfach erkl\xE4rt")},{c:"\u25B6",l:"YouTube \u2013 API erkl\xE4rt",u:K("API einfach erkl\xE4rt REST API Deutsch")},{c:"\u{1F4AC}",l:"Studocu \u2013 Netzwerke",u:le("Informatik Netzwerke HTTP HTTPS API Hochschule")}]}]},21:{lernziel:"Du reflektierst die drei Wochen Marokko-Lernplan: Was hast du wirklich gemeistert? Wo sind noch L\xFCcken? Du erstellst einen konkreten, realistischen Lernplan f\xFCr August (bis Vorlesungsbeginn 1.9.2026). Du kennst die Anforderungen der Seminararbeit im ECM-Modul und kannst schon erste Themenideen sammeln. Du bist mental und fachlich bereit f\xFCr Semester 1.",pr\u00FCfung:"Kein Klausurthema \u2013 aber die beste Investition in einen starken Semesterstart. Nutze August f\xFCr Java-Vertiefung (Praktikum!) und BWL-Klausuraufgaben.",begriffe:["Reflexion","Lernplan","Seminararbeit","Java-Vertiefung","Anki-Review","HRW Moodle","Semesterstart"],subs:[{t:"R\xFCckblick & L\xFCckenanalyse",desc:"Gehe alle 20 Tage durch und beantworte ehrlich: (1) Kann ich das Thema ohne Unterlagen erkl\xE4ren? (2) W\xFCrde ich eine Klausuraufgabe dazu l\xF6sen k\xF6nnen? Markiere Schw\xE4chethemen rot. Typische Schw\xE4chen nach Woche 1: Buchungss\xE4tze und T-Konten. Nach Woche 2: Konsumentenverhalten und Plattform\xF6konomie. Nach Woche 3: Java und Boolesche Algebra. Diese Themen kommen in August intensiver dran.",items:[{c:"\u{1F0CF}",l:"Anki \u2013 alle Karten durchgehen",u:"https://apps.ankiweb.net/"},{c:"\u{1F9E0}",l:"Knowunity \u2013 Pr\xFCfungsvorbereitung",u:F("Studium Pr\xFCfungsvorbereitung Lernplan")},{c:"\u{1F393}",l:"Springer Flashcards (Deges)",u:"https://flashcards.springernature.com/login"}]},{t:"August-Plan & Semesterstart-Vorbereitung",desc:"Empfohlener August-Plan: Woche 1 (1.-7.8): BWL-Klausuraufgaben \xFCben + Buchf\xFChrung vertiefen. Woche 2 (8.-14.8): Java-\xDCbungen auf CodingBat + W3Schools durcharbeiten. Woche 3 (15.-21.8): Deges-Buch Kapitel 1-3 lesen + Seminararbeitsthema recherchieren. Woche 4 (22.-31.8): HRW Moodle-Zugang einrichten, Campus-Karte holen, Stundenplan organisieren, Anki-Decks finalisieren.",items:[{c:"\u{1F393}",l:"HRW Moodle",u:"https://elearning.hs-ruhrwest.de/"},{c:"\u{1F4BB}",l:"Udemy \u2013 Java Kurs",u:"https://www.udemy.com/topic/java/?price=price-free"},{c:"\u{1F4D6}",l:"Deges Buch \xF6ffnen",u:ms},{c:"\u{1F4DA}",l:"HRW Bibliothek",u:"https://www.hs-ruhrwest.de/studium/bibliothek/"}]}]}};function Jc(e,n){try{let t=new Date(e);return isNaN(t)?"":(t.setDate(t.getDate()+n),t.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}))}catch{return""}}function rf(e){return{"\u{1F4D6}":S.violet,"\u{1F9E0}":"#c026a8","\u{1F4AC}":S.teal,"\u{1F4CA}":"#167a5e","\u{1F4BB}":S.blue,"\u{1F310}":"#1d6fa8","\u{1F0CF}":S.red,"\u{1F393}":S.red,"\u{1F4DA}":S.violet,"\u25B6":S.blue}[e]||"#8a96b8"}function $c(e){return String(e).padStart(2,"0")}function en(e){return{role:"button",tabIndex:0,onKeyDown:n=>{(n.key==="Enter"||n.key===" ")&&(n.preventDefault(),e())}}}function Vt({l:e,u:n,col:t}){return(0,l.jsxs)("a",{href:n,target:"_blank",rel:"noopener noreferrer",onClick:r=>r.stopPropagation(),className:"hover-pop",style:{display:"inline-flex",alignItems:"center",gap:"0.22rem",backgro
