ch gestaffelten Wiederholungen \u2013 Basis des Anki-Algorithmus, maximal effizient f\xFCrs Langzeitged\xE4chtnis.",Stakeholder:"Alle Personen/Gruppen mit berechtigtem Interesse am Unternehmen (Mitarbeiter, Kunden, Investoren, Staat).",Stammkapital:"Mindestkapital, das Gesellschafter bei Gr\xFCndung einer GmbH einbringen m\xFCssen (gesetzlich 25.000 \u20AC).","Station\xE4rer Handel":"Handel mit physischen Verkaufsstellen (Ladengesch\xE4fte) im Gegensatz zum Online-Handel.",String:'Java-Datentyp f\xFCr Zeichenketten/Text (z.B. "Hallo Welt") \u2013 technisch eine Klasse, kein primitiver Typ.',"T-Konto":"Visuelle Darstellung eines Buchf\xFChrungskontos in T-Form: links Soll, rechts Haben.","TCP/IP":"Grundlegendes Protokollpaar des Internets \u2013 TCP sichert zuverl\xE4ssige \xDCbertragung, IP adressiert Ger\xE4te.",TOPO:"Try Offline, Purchase Online \u2013 Kunde probiert im Laden, kauft aber g\xFCnstiger online.",Trust:"Vertrauen des Kunden in einen Online-Shop \u2013 entscheidender Faktor f\xFCr die Kaufentscheidung im E-Commerce.",UG:"Unternehmergesellschaft (haftungsbeschr\xE4nkt) \u2013 vereinfachte GmbH-Variante, gr\xFCndbar bereits ab 1 \u20AC Stammkapital.",Umlaufverm\u00F6gen:"Kurzfristig im Unternehmen gebundenes Verm\xF6gen (Waren, Forderungen, Kasse) \u2013 Teil der Aktivseite.",Umsatzsteuer:"Steuer auf Warenverk\xE4ufe (19% bzw. 7%), die Unternehmen einnehmen und ans Finanzamt abf\xFChren.",Utilitaristisch:"Kaufmotivation, die rein zweckorientiert und rational ist \u2013 Gegensatz zum hedonistischen Kauf.",Variable:"Benannter Speicherplatz in Java, der einen Wert eines bestimmten Datentyps enth\xE4lt.",Vererbung:"OOP-Prinzip, bei dem eine Unterklasse Attribute und Methoden einer Oberklasse automatisch \xFCbernimmt.","Von-Neumann":"Klassische Computerarchitektur mit gemeinsamem Speicher f\xFCr Programme und Daten, gesteuert durch eine CPU.",Vorsteuer:"Umsatzsteuer, die ein Unternehmen beim Einkauf zahlt und vom Finanzamt zur\xFCckerstattet bekommt.",Wahrheitstabelle:"Tabellarische Darstellung aller m\xF6glichen Ein-/Ausgabe-Kombinationen einer logischen Operation.",Wertsch\u00F6pfungskette:"Abfolge von Aktivit\xE4ten, die ein Produkt vom Rohstoff bis zum Endkunden durchl\xE4uft und dabei an Wert gewinnt.",Wiederholung:"Aktives erneutes Durcharbeiten von bereits gelerntem Stoff zur Festigung im Langzeitged\xE4chtnis.",Wirtschaftlichkeit:"Verh\xE4ltnis von erzieltem Ertrag zu eingesetzten Mitteln \u2013 zentrales \xF6konomisches Prinzip.",Wissenschaftssprache:"Pr\xE4zise, unpers\xF6nliche und sachliche Ausdrucksweise, die in akademischen Arbeiten erwartet wird.",XOR:"Boolescher Operator (Exklusiv-Oder) \u2013 wahr, wenn GENAU EINE der beiden Eingaben wahr ist.",Zahlungsausfallrisiko:"Risiko des H\xE4ndlers, dass ein Kunde nach Lieferung nicht bezahlt (besonders bei Kauf auf Rechnung).",Zitation:"Korrekte Kennzeichnung \xFCbernommener Gedanken/Texte mit Quellenangabe in wissenschaftlichen Arbeiten.",bevh:"Bundesverband E-Commerce und Versandhandel Deutschland \u2013 wichtigste Quelle f\xFCr deutsche E-Commerce-Marktzahlen.",boolean:"Java-Datentyp, der nur zwei Werte annehmen kann: true oder false.",break:"Java-Schl\xFCsselwort, das eine Schleife oder switch-Anweisung sofort beendet.",continue:"Java-Schl\xFCsselwort, das den Rest der aktuellen Schleifeniteration \xFCberspringt und zur n\xE4chsten springt.","dispositiver Faktor":"Vierter Produktionsfaktor \u2013 die Leitungs- und Entscheidungsfunktion des Managements/Unternehmers.","do-while":"Java-Schleifentyp, der den Code-Block mindestens einmal ausf\xFChrt und die Bedingung erst danach pr\xFCft (Gegensatz zu while).","doppelte Buchf\xFChrung":"Buchf\xFChrungssystem, bei dem jeder Gesch\xE4ftsvorfall auf mindestens zwei Konten erfasst wird (Soll und Haben).","externes Rechnungswesen":"Rechnungswesen-Teil, der f\xFCr au\xDFenstehende Adressaten (Finanzamt, Investoren) gesetzlich vorgeschrieben ist \u2013 z.B. Bilanz, GuV.","for-Schleife":"Java-Schleifentyp f\xFCr eine bekannte Anzahl von Wiederholungen, z.B. for(int i=0;i<10;i++).","if-else":"Java-Kontrollstruktur zur bedingten Ausf\xFChrung von Code-Bl\xF6cken je nach Wahrheitswert einer Bedingung.",int:"Java-Datentyp f\xFCr ganze Zahlen (ohne Nachkommastellen), z.B. int menge = 5;",switch:"Java-Kontrollstruktur zur \xFCbersichtlichen Auswahl zwischen vielen festen F\xE4llen (Alternative zu langen if-else-Ketten).","while-Schleife":"Java-Schleifentyp, der l\xE4uft, solange eine Bedingung wahr ist \u2013 Anzahl der Durchl\xE4ufe ist vorher unbekannt.","\xA7 238 HGB":"Zentrale Gesetzesvorschrift, die die Buchf\xFChrungspflicht f\xFCr Kaufleute in Deutschland festlegt.",\u00DCberbr\u00FCckungsfunktion:"Handelsfunktion, die Raum- und Zeitunterschiede zwischen Herstellung und Verbrauch eines Gutes \xFCberbr\xFCckt."},Uc=[{nr:1,title:"Grundlagen BWL, Handel, E-Commerce & Informatik",ects:30,modules:[{id:"s1-bwl",code:"BWL EC",name:"Einf\xFChrung in die BWL",ects:6,sws:"4",exam:"Klausur 120 Min. \xB7 100%",desc:"Betriebswirtschaftliche Grundlagen und Technik des betrieblichen Rechnungswesens.",topics:[{t:"Wirtschaftlichkeitsprinzip & betriebliche Ziele",def:"Das \xF6konomische Prinzip ist die fundamentale Entscheidungsregel der Betriebswirtschaftslehre und beschreibt, wie ein rational handelnder Wirtschaftsakteur mit begrenzten Ressourcen (Knappheit) umgeht. Es existiert in zwei Auspr\xE4gungen: Beim Minimalprinzip ist ein bestimmtes Ziel (z.B. eine Produktionsmenge oder ein Umsatzziel) fest vorgegeben, und der Mitteleinsatz (Kosten, Zeit, Personal) soll daf\xFCr minimiert werden. Beim Maximalprinzip ist umgekehrt der Mitteleinsatz fix vorgegeben (z.B. ein Budget), und mit diesem soll der gr\xF6\xDFtm\xF6gliche Ertrag erzielt werden. Beide Prinzipien sind zwei Seiten derselben Wirtschaftlichkeitslogik: Wirtschaftlichkeit = Ertrag \xF7 Aufwand, ein Wert \xFCber 1 zeigt, dass mehr erwirtschaftet wurde als eingesetzt wurde. \xDCber das reine Ertrags-Aufwands-Verh\xE4ltnis hinaus verfolgt jedes Unternehmen ein Zielsystem aus mehreren, teils konkurrierenden Zielarten: Sachziele definieren, WAS angeboten wird (Produkt-/Leistungsprogramm, Marktsegmente, Qualit\xE4t); Formalziele beschreiben, WIE erfolgreich gewirtschaftet wird (Gewinn, Rentabilit\xE4t, Liquidit\xE4t, Marktanteil, Umsatzwachstum); soziale und \xF6kologische Ziele (auch Humanziele bzw. Nachhaltigkeitsziele genannt) betreffen Mitarbeiterzufriedenheit, faire Arbeitsbedingungen, Umweltschutz und gesellschaftliche Verantwortung (CSR). Diese Zielarten stehen in der Praxis h\xE4ufig in Zielkonflikten zueinander \u2013 etwa wenn eine h\xF6here Servicequalit\xE4t die Formalziele belastet, oder wenn \xF6kologische Standards kurzfristig die Rentabilit\xE4t senken. Ein gutes Management muss diese Zielkonflikte transparent machen und \xFCber Zielhierarchien oder Zielgewichtung aufl\xF6sen.",ex:"Ein Online-Modeh\xE4ndler hat exakt 5.000 \u20AC Werbebudget und m\xF6chte damit so viele Neukunden-Bestellungen wie m\xF6glich generieren \u2013 klassische Anwendung des Maximalprinzips. W\xFCrde er stattdessen vorgeben 'Ich brauche 200 neue Kunden' und das g\xFCnstigste Budget daf\xFCr suchen, w\xE4re das Minimalprinzip. Ein Zielkonflikt entsteht, wenn er zus\xE4tzlich klimaneutralen Versand anbieten will (soziales Ziel), der die Versandkosten um 15% erh\xF6ht und damit das Gewinnziel schm\xE4lert."},{t:"Rechtsformen von Unternehmen",def:"Die Wahl der Rechtsform bestimmt zentrale unternehmerische Rahmenbedingungen: Haftung, Kapitalbedarf, Steuerlast, Publizit\xE4tspflichten und Mitspracherechte. Personengesellschaften umfassen das Einzelunternehmen (ein Inhaber, volle unbeschr\xE4nkte Haftung, keine Formvorschriften), die GbR (mind. zwei Gesellschafter, gemeinsame Zweckverfolgung, gesamtschuldnerische unbeschr\xE4nkte Haftung), die OHG (Handelsgewerbe, im Handelsregister eingetragen, ebenfalls unbeschr\xE4nkte Haftung aller Gesellschafter) und die KG (mind. ein unbeschr\xE4nkt haftender Komplement\xE4r und mind. ein nur mit seiner Einlage haftender Kommanditist). Kapitalgesellschaften sind eigenst\xE4ndige juristische Personen mit eigener Rechtspers\xF6nlichkeit, unabh\xE4ngig von den Gesellschaftern: Die GmbH erfordert 25.000 \u20AC Stammkapital (davon mindestens 12.500 \u20AC bei Gr\xFCndung tats\xE4chlich einzuzahlen), die UG (haftungsbeschr\xE4nkt) als 'Mini-GmbH' kann bereits mit 1 \u20AC gegr\xFCndet werden, muss aber Gewinne teilweise als gesetzliche R\xFCcklage thesaurieren bis das GmbH-Mindestkapital erreicht ist, und die AG ben\xF6tigt 50.000 \u20AC Grundkapital sowie Vorstand, Aufsichtsrat und Hauptversammlung. Mit der Rechtsform ver\xE4ndern sich zudem Buchf\xFChrungspflichten (Kapitalgesellschaften sind stets buchf\xFChrungspflichtig), Publizit\xE4tspflichten (z.B. Offenlegung im Bundesanzeiger) sowie Mitbestimmungsrechte der Arbeitnehmer ab bestimmten Unternehmensgr\xF6\xDFen. Die Entscheidung ist daher immer eine Abw\xE4gung zwischen Haftungsschutz, Gr\xFCndungsaufwand, steuerlicher Behandlung und Au\xDFenwirkung gegen\xFCber Banken, Lieferanten und Investoren.",ex:"Zwei Gr\xFCnder starten einen Online-Sneaker-Shop mit 3.000 \u20AC Startkapital. Wegen des geringen Kapitals w\xE4hlen sie zun\xE4chst die UG (haftungsbeschr\xE4nkt) mit 1.500 \u20AC Stammkapital statt einer GmbH \u2013 ihr Privatverm\xF6gen bleibt gesch\xFCtzt. W\xE4chst der Umsatz auf \xFCber 500.000 \u20AC j\xE4hrlich und bauen sie 25.000 \u20AC R\xFCcklagen auf, k\xF6nnen sie sp\xE4ter in eine GmbH umwandeln, um seri\xF6ser gegen\xFCber Lieferanten und Investoren aufzutreten."},{t:"Buchf\xFChrungspflicht & GoB",def:"\xA7 238 Abs. 1 HGB verpflichtet jeden Kaufmann, B\xFCcher zu f\xFChren und darin seine Handelsgesch\xE4fte sowie die Lage seines Verm\xF6gens nach den Grunds\xE4tzen ordnungsm\xE4\xDFiger Buchf\xFChrung (GoB) ersichtlich zu machen. Kaufmann im rechtlichen Sinn ist grunds\xE4tzlich jeder, der ein Handelsgewerbe betreibt (Ist-Kaufmann), sowie jeder, der sich freiwillig ins Handelsregister eintragen l\xE4sst (Kann-Kaufmann). Kleingewerbetreibende und Freiberufler, die bestimmte Umsatz- und Gewinnschwellen nicht \xFCberschreiten (\xA7 241a HGB: 800.000 \u20AC Umsatz bzw. 80.000 \u20AC Gewinn pro Jahr), sind von der doppelten Buchf\xFChrung befreit und d\xFCrfen vereinfacht per Einnahmen-\xDCberschuss-Rechnung (E\xDCR) ihren Gewinn ermitteln. Die GoB selbst sind kein geschlossenes Gesetzeswerk, sondern ein B\xFCndel kodifizierter und ungeschriebener, aus der kaufm\xE4nnischen Praxis abgeleiteter Ordnungsprinzipien: Richtigkeit und Willk\xFCrfreiheit (Buchungen m\xFCssen den tats\xE4chlichen Gesch\xE4ftsvorfall widerspiegeln), Vollst\xE4ndigkeit (kein Gesch\xE4ftsvorfall darf fehlen), Klarheit und \xDCbersichtlichkeit, Nachpr\xFCfbarkeit (l\xFCckenloser Zusammenhang zwischen Beleg und Buchung \u2013 'keine Buchung ohne Beleg'), das Vorsichtsprinzip (Verluste werden antizipiert, Gewinne erst bei Realisierung verbucht) sowie zeitgerechte und geordnete Erfassung. Diese Prinzipien dienen dem Gl\xE4ubigerschutz und der Vergleichbarkeit von Abschl\xFCssen und sind Grundlage jeder Betriebspr\xFCfung.",ex:"Ein Online-H\xE4ndler mit GmbH-Rechtsform und 800.000 \u20AC Jahresumsatz ist eindeutig buchf\xFChrungspflichtig und muss jede Wareneinfuhr, jede Marktplatzabrechnung und jede PayPal-Gutschrift l\xFCckenlos mit Belegen dokumentieren \u2013 ein Betriebspr\xFCfer muss jede Buchung bis zum Ursprungsbeleg zur\xFCckverfolgen k\xF6nnen (Belegprinzip als Auspr\xE4gung der GoB)."},{t:"Soll/Haben, T-Konten, Buchungss\xE4tze",def:"Die doppelte Buchf\xFChrung ist das zentrale technische Verfahren des Rechnungswesens: Jeder Gesch\xE4ftsvorfall wird stets auf mindestens zwei Konten erfasst \u2013 einmal auf der linken Seite (Soll) und einmal auf der rechten Seite (Haben) \u2013 wodurch die fundamentale Bilanzgleichung Aktiva = Passiva jederzeit erhalten bleibt und sich Fehlbuchungen \xFCber Kontrollsummen aufdecken lassen. Konten werden schematisch als T-Konten dargestellt: eine senkrechte Linie trennt Soll (links) von Haben (rechts). F\xFCr Aktivkonten (Bestandskonten des Verm\xF6gens wie Kasse, Bank, Warenbestand, Forderungen) gilt: Anfangsbestand und Zug\xE4nge stehen im Soll, Abg\xE4nge im Haben. F\xFCr Passivkonten (Eigenkapital, Verbindlichkeiten, R\xFCckstellungen) gilt es spiegelverkehrt: Anfangsbestand und Zug\xE4nge im Haben, Abg\xE4nge im Soll. Ein Buchungssatz ist die formale Kurzschreibweise eines Gesch\xE4ftsvorfalls nach dem Schema 'Soll-Konto an Haben-Konto, Betrag' und liest sich wie ein Satz: Das im Soll genannte Konto wird belastet, das im Haben genannte entlastet bzw. erkannt. Komplexere Vorf\xE4lle k\xF6nnen auch zusammengesetzte Buchungss\xE4tze mit mehreren Soll- oder Haben-Konten erfordern, wobei die Summe aller Soll-Betr\xE4ge stets der Summe aller Haben-Betr\xE4ge entsprechen muss.",ex:"Ein Fashion-Shop kauft Ware im Wert von 2.000 \u20AC auf Rechnung (30 Tage Zahlungsziel) ein. Buchungssatz: Wareneingang 2.000 \u20AC an Verbindlichkeiten 2.000 \u20AC. Zahlt er 15 Tage sp\xE4ter per \xDCberweisung, lautet der zweite Buchungssatz: Verbindlichkeiten 2.000 \u20AC an Bank 2.000 \u20AC \u2013 das Bankkonto wird im Haben entlastet, die Schuld im Soll getilgt."},{t:"Bilanz, GuV, Abschreibungen",def:"Die Bilanz und die Gewinn- und Verlustrechnung (GuV) sind die zentralen Bestandteile des handelsrechtlichen Jahresabschlusses (\xA7 242 HGB). Die Bilanz ist eine stichtagsbezogene Gegen\xFCberstellung von Verm\xF6gen und Kapital: Auf der Aktivseite steht die Mittelverwendung, gegliedert in Anlageverm\xF6gen (langfristig gebundene Werte wie Maschinen, Geb\xE4ude, Lizenzen) und Umlaufverm\xF6gen (kurzfristig verf\xFCgbare Werte wie Warenbestand, Forderungen, liquide Mittel); auf der Passivseite steht die Mittelherkunft, gegliedert in Eigenkapital und Fremdkapital (Verbindlichkeiten, R\xFCckstellungen). Beide Bilanzseiten sind per Definition immer gleich gro\xDF (Bilanzsumme). Die GuV ist demgegen\xFCber zeitraumbezogen: Sie stellt alle Ertr\xE4ge (z.B. Umsatzerl\xF6se) den Aufwendungen (Material-, Personalaufwand, Abschreibungen) einer Periode gegen\xFCber und ermittelt den Jahres\xFCberschuss oder -fehlbetrag, der anschlie\xDFend das Eigenkapital in der Folgebilanz erh\xF6ht bzw. mindert. Abschreibungen (AfA) sind das Bindeglied zwischen beiden Rechenwerken: Sie verteilen Anschaffungs-/Herstellungskosten von Anlageverm\xF6gen systematisch \xFCber die betriebsgew\xF6hnliche Nutzungsdauer (oft anhand amtlicher AfA-Tabellen), reduzieren dadurch j\xE4hrlich den Restbuchwert in der Bilanz und schlagen sich gleichzeitig als Aufwand in der GuV nieder. Man unterscheidet die lineare Abschreibung (gleichbleibender Jahresbetrag) von der degressiven Abschreibung (fallende Jahresbetr\xE4ge) sowie au\xDFerplanm\xE4\xDFige Abschreibungen bei dauerhafter Wertminderung.",ex:"Ein E-Commerce-Unternehmen kauft einen Lagerstapler f\xFCr 24.000 \u20AC, Nutzungsdauer 8 Jahre. Lineare Jahresabschreibung: 24.000 \u20AC \xF7 8 = 3.000 \u20AC/Jahr. Nach 3 Jahren steht der Stapler mit einem Restbuchwert von 15.000 \u20AC in der Bilanz, w\xE4hrend die j\xE4hrlichen 3.000 \u20AC als Aufwand die GuV und damit den Jahres\xFCberschuss mindern."}],quiz:[{q:"Was besagt das Minimalprinzip?",options:["Maximalen Ertrag mit festem Mitteleinsatz erzielen","Ein festes Ziel mit minimalem Mitteleinsatz erreichen","Immer die billigste Option w\xE4hlen","Nur bei Verlust wirtschaften"],correct:1,explain:"Minimalprinzip = gegebenes Ziel mit geringstm\xF6glichem Aufwand erreichen."},{q:"Welche Rechtsform hat unbeschr\xE4nkte Haftung?",options:["GmbH","AG","GbR","UG"],correct:2,explain:"Bei der GbR haften die Gesellschafter unbeschr\xE4nkt und pers\xF6nlich."},{q:"Auf welcher Seite steht bei einem Aktivkonto der Zugang?",options:["Haben","Soll","Beide gleich","Keine, nur bei Passivkonten"],correct:1,explain:"Aktivkonten: Zugang im Soll, Abgang im Haben."}],cards:[{front:"Wirtschaftlichkeitsprinzip",back:"Verh\xE4ltnis von Ertrag zu Mitteleinsatz optimieren \u2013 Minimal- oder Maximalprinzip."},{front:"GmbH",back:"Kapitalgesellschaft, 25.000 \u20AC Stammkapital, Haftung auf Gesellschaftsverm\xF6gen beschr\xE4nkt."},{front:"GoB",back:"Grunds\xE4tze ordnungsm\xE4\xDFiger Buchf\xFChrung \u2013 Regeln f\xFCr korrekte, nachvollziehbare Buchhaltung."},{front:"T-Konto",back:"Visuelle Kontodarstellung: links Soll, rechts Haben."},{front:"Aktiva",back:"Linke Bilanzseite \u2013 zeigt, wof\xFCr das Kapital verwendet wurde (Verm\xF6gen)."}]},{id:"s1-hbl",code:"HBL",name:"Grundlagen des Handelsmanagements",ects:6,sws:"4",exam:"Klausur 60 Min. \xB7 100%",desc:"Einf\xFChrung in das Handelsmanagement: Handelsfunktionen, Betriebstypen, Sortimentspolitik.",topics:[{t:"5 klassische Handelsfunktionen",def:"Der Handel ist volkswirtschaftlich als eigenst\xE4ndige Wirtschaftsstufe zwischen Produktion und Konsum zu verstehen, die Wert schafft, indem sie g\xFCterwirtschaftliche und informatorische L\xFCcken zwischen Herstellern und Endkunden schlie\xDFt. Klassischerweise werden f\xFCnf Grundfunktionen unterschieden: (1) Die Raum- und Zeit-\xDCberbr\xFCckungsfunktion transportiert Ware von Produktionsstandorten zu den Kunden und lagert sie zwischen Produktion und Bedarf zwischen; (2) die Mengen-/Quantit\xE4tsfunktion (Umgruppierungsfunktion) zerlegt gro\xDFe, industriell produzierte Mengen in kleinere, konsumgerechte Einheiten; (3) die Qualit\xE4ts-/Sortimentsfunktion b\xFCndelt Produkte unterschiedlicher Hersteller zu einem f\xFCr die Zielgruppe sinnvollen Sortiment und \xFCbernimmt dabei h\xE4ufig Qualit\xE4tskontrolle; (4) die Kreditfunktion (Finanzierungsfunktion) erm\xF6glicht Zahlungsziele, Ratenk\xE4ufe oder Vorfinanzierung und verlagert damit Liquidit\xE4tsrisiken zwischen den Marktstufen; (5) die Werbe- und Beratungsfunktion informiert \xFCber Produkte, schafft Aufmerksamkeit und unterst\xFCtzt die Kaufentscheidung durch fachkundige Beratung. Im digitalen Handel verschieben sich diese Funktionen deutlich: Die Raum-/Zeitfunktion wird zunehmend von spezialisierten Fulfillment-Dienstleistern \xFCbernommen, w\xE4hrend pers\xF6nliche Beratung immer h\xE4ufiger durch algorithmische Empfehlungen, Kundenbewertungen und Erkl\xE4rvideos ersetzt wird \u2013 die Funktion bleibt bestehen, nur ihr Tr\xE4ger ver\xE4ndert sich.",ex:"Amazon erf\xFCllt alle 5 Funktionen digital: Es lagert Millionen Artikel in Fulfillment-Zentren (\xDCberbr\xFCckung), bietet Einzelst\xFCcke statt Gro\xDFgebinde (Menge), b\xFCndelt Produkte unz\xE4hliger Hersteller durchsuchbar (Sortiment), erm\xF6glicht Rechnungskauf und Ratenzahlung (Kredit) und zeigt Rezensionen sowie Anzeigen (Werbung/Beratung)."},{t:"Einzel- vs. Gro\xDFhandel",def:"Gro\xDFhandel und Einzelhandel unterscheiden sich prim\xE4r nach der Marktstufe, auf der sie agieren, sowie nach ihren typischen Kunden. Der Gro\xDFhandel (Wholesale) kauft \xFCblicherweise in gro\xDFen Mengen unmittelbar bei Herstellern oder Importeuren ein und verkauft diese in geringeren, aber weiterhin gewerblichen Mengen an Wiederverk\xE4ufer, Weiterverarbeiter oder Gro\xDFabnehmer weiter (klassisches B2B-Gesch\xE4ft) \u2013 typisch sind Mengenrabatte, l\xE4ngere Zahlungsziele und h\xE4ufig ein Mindestbestellwert. Der Einzelhandel (Retail) verkauft dagegen einzelne Artikel direkt an private Endverbraucher (B2C) und \xFCbernimmt dabei zus\xE4tzliche, kundennahe Serviceleistungen wie Beratung, Umtausch- und R\xFCckgaberecht, kleinteilige Verpackung sowie ein ansprechendes Einkaufserlebnis. Handelsspannen unterscheiden sich entsprechend: Gro\xDFh\xE4ndler kalkulieren meist mit geringeren prozentualen Aufschl\xE4gen bei hohem Volumen, Einzelh\xE4ndler mit h\xF6heren Margen bei geringerem St\xFCckvolumen. Im E-Commerce verschwimmen diese Grenzen zunehmend, da digitale Plattformen beide Gesch\xE4ftsmodelle parallel unter einem Dach abbilden k\xF6nnen \u2013 etwa wenn ein Konzern sowohl einen B2B-Marktplatz mit Staffelpreisen als auch einen klassischen Endkunden-Shop betreibt und beide \xFCber dieselbe Logistikinfrastruktur abwickelt.",ex:"Ein Sportartikelhersteller verkauft Laufschuhe paketweise (je 50 Paar) mit 20% Mengenrabatt und 60 Tagen Zahlungsziel an einen Sporth\xE4ndler (Gro\xDFhandel/B2B). Derselbe Hersteller betreibt zugleich einen eigenen Online-Shop, \xFCber den Privatkunden einzelne Paare zum vollen Preis sofort per Kreditkarte kaufen (Einzelhandel/B2C)."},{t:"Betriebstypen (Fachhandel, Discounter, Marktplatz)",def:"Betriebstypen des Handels sind idealtypische Kombinationen aus Sortimentsbreite und -tiefe, Preis-/Leistungsniveau, Servicegrad, Standortkonzept und Vertriebsweg, an denen sich Handelsunternehmen strategisch positionieren. Der Fachhandel konzentriert sich auf ein enges, aber tiefes Sortiment mit hoher fachlicher Beratungskompetenz im mittleren bis Premium-Preissegment. Verbraucherm\xE4rkte und SB-Warenh\xE4user kombinieren gro\xDFe Sortimentsbreite und -tiefe mit Selbstbedienung und mittlerem Preisniveau, um m\xF6glichst viele Bedarfe eines Haushalts in einem Einkauf abzudecken. Discounter reduzieren Sortimentsbreite und -tiefe bewusst auf ein rotierendes Kernsortiment, um \xFCber schlanke Prozesse, hohe Umschlagsgeschwindigkeit und geringe Handling-Kosten einen dauerhaften Preisvorteil zu erzielen. Der reine Online-/Versandhandel verzichtet vollst\xE4ndig auf physische Verkaufsfl\xE4chen und kann dadurch \u2013 dank zentraler Lagerhaltung statt Regalfl\xE4chenbeschr\xE4nkung \u2013 ein nahezu unbegrenztes Sortiment anbieten (Long-Tail-Effekt: auch Nischenprodukte mit geringer Einzelnachfrage werden profitabel, weil sie \xFCber viele Regionen hinweg verkauft werden). Marktpl\xE4tze sind streng genommen gar kein H\xE4ndler, sondern eine reine Vermittlungs- und Infrastrukturplattform, auf der unabh\xE4ngige Drittanbieter ihre Produkte listen und daf\xFCr Provisionen sowie Geb\xFChren an den Plattformbetreiber zahlen.",ex:"MediaMarkt (Fachhandel: tiefes Elektroniksortiment, geschulte Berater), Kaufland (Verbrauchermarkt: breit und tief, Selbstbedienung), Aldi (Discounter: rotierendes Schmalsortiment), Zalando (Online-Versandhandel: \xFCber 6.000 Marken ohne eigene L\xE4den) und Amazon Marketplace (reine Vermittlungsplattform mit Millionen Drittanbietern) zeigen die Grundtypen nebeneinander."},{t:"Sortimentsbreite & -tiefe",def:"Die Sortimentspolitik ist eine der zentralen strategischen Stellschrauben im Handel und wird \xFCber zwei unabh\xE4ngige Dimensionen gesteuert. Die Sortimentsbreite gibt an, wie viele unterschiedliche Warengruppen bzw. Produktkategorien ein H\xE4ndler f\xFChrt \u2013 ein breites Sortiment erlaubt es, m\xF6glichst viele unterschiedliche Kundenbed\xFCrfnisse unter einem Dach zu bedienen und dadurch Kundenbindung sowie durchschnittlichen Bestellwert (Cross-Selling) zu erh\xF6hen. Die Sortimentstiefe gibt an, wie viele Varianten \u2013 Marken, Modelle, Farben, Gr\xF6\xDFen, Ausstattungsstufen \u2013 innerhalb einer einzelnen Warengruppe angeboten werden; eine hohe Tiefe erh\xF6ht die Auswahl und die Wahrscheinlichkeit, dass ein Kunde exakt sein gew\xFCnschtes Produkt findet. Aus der Kombination beider Dimensionen ergeben sich vier idealtypische Sortimentsstrategien: schmal und flach (typisch f\xFCr Discounter), schmal und tief (typisch f\xFCr Fachgesch\xE4fte), breit und flach (kleinere Gemischtwarenl\xE4den) sowie breit und tief (gro\xDFe Kaufh\xE4user oder Online-Marktpl\xE4tze). Eine gr\xF6\xDFere Sortimentstiefe erh\xF6ht zwar die Kundenzufriedenheit durch Auswahl, gleichzeitig aber auch Lagerkomplexit\xE4t, Kapitalbindung im Bestand und das Risiko von Ladenh\xFCtern.",ex:"Zalando f\xFChrt Mode, Schuhe, Accessoires, Sport und Beauty (hohe Breite) und bietet allein bei Sneakern hunderte Modelle in zig Farb-/Gr\xF6\xDFenkombinationen (hohe Tiefe) \u2013 eine bewusste breit-und-tief-Strategie, um m\xF6glichst viele Kaufanl\xE4sse eines Kunden auf einer Plattform abzudecken."},{t:"Omnichannel vs. Multichannel",def:"Multichannel-Handel bedeutet, dass ein Unternehmen mehrere Vertriebs- und Kommunikationskan\xE4le \u2013 Filiale, Online-Shop, Katalog, App, Marktplatz \u2013 parallel betreibt, diese aber organisatorisch, technisch und h\xE4ufig auch von den Verantwortlichkeiten her getrennt funktionieren. Das f\xFChrt in der Praxis oft zu inkonsistenten Erfahrungen: unterschiedliche Preise oder Verf\xFCgbarkeiten je Kanal, getrennte Kundenkonten, keine kanal\xFCbergreifende R\xFCckgabem\xF6glichkeit. Omnichannel-Handel geht einen entscheidenden Schritt weiter: Alle Kan\xE4le werden technisch und organisatorisch nahtlos vernetzt, sodass der Kunde ein einheitliches, konsistentes Markenerlebnis erlebt, unabh\xE4ngig davon, \xFCber welchen Kanal er gerade interagiert. Typische Omnichannel-Services sind Click & Collect (online bestellen, in der Filiale abholen), Click & Reserve (online reservieren, vor Ort anprobieren und kaufen), In-Store-Return f\xFCr online gekaufte Ware sowie ein einheitliches Kundenkonto mit Bonuspunkten und Bestellhistorie \xFCber alle Kan\xE4le. Voraussetzung ist eine vollst\xE4ndig integrierte IT-Landschaft: ein zentrales Warenwirtschaftssystem, das Lagerbest\xE4nde in Echtzeit \xFCber alle Kan\xE4le synchronisiert, sowie eine einheitliche Kundendatenbank (Single Customer View), die verhindert, dass derselbe Kunde online und offline als zwei unterschiedliche Personen behandelt wird.",ex:"H&M l\xE4sst Kunden online einen Artikel reservieren, in der n\xE4chsten Filiale anprobieren und dort sofort kaufen oder zur\xFCckgeben (Click & Collect/Return) \u2013 Bestand und Kundendaten sind kanal\xFCbergreifend in Echtzeit synchronisiert. Ein reiner Multichannel-H\xE4ndler h\xE4tte getrennte Lagerbest\xE4nde, sodass ein online reservierter Artikel in der Filiale u.U. fehlen w\xFCrde."}],quiz:[{q:"Welche Handelsfunktion beschreibt das \xDCberbr\xFCcken von Raum und Zeit?",options:["Kreditfunktion","\xDCberbr\xFCckungsfunktion","Werbefunktion","Qualit\xE4tsfunktion"],correct:1,explain:"Die \xDCberbr\xFCckungsfunktion bringt Ware vom Hersteller zum Kunden \xFCber Raum und Zeit."},{q:"Was kennzeichnet einen Discounter?",options:["Tiefes Sortiment, hohe Beratung","Schmales, flaches Sortiment, Preisf\xFChrerschaft","Nur online aktiv","Ausschlie\xDFlich Luxusg\xFCter"],correct:1,explain:"Discounter wie Aldi/Lidl setzen auf schmales Sortiment und niedrige Preise."},{q:"Was ist Omnichannel?",options:["Nur ein Verkaufskanal","Getrennte, parallele Kan\xE4le","Nahtlos vernetzte Kan\xE4le mit einheitlichem Erlebnis","Nur station\xE4rer Handel"],correct:2,explain:"Omnichannel verkn\xFCpft alle Kan\xE4le nahtlos (z.B. online bestellen, im Laden abholen)."}],cards:[{front:"Handelsfunktion",back:"Aufgabe des Handels in der Wertsch\xF6pfungskette (\xDCberbr\xFCckung, Menge, Qualit\xE4t, Kredit, Werbung)."},{front:"Sortimentsbreite",back:"Anzahl unterschiedlicher Warengruppen im Angebot eines H\xE4ndlers."},{front:"Sortimentstiefe",back:"Anzahl verschiedener Varianten innerhalb einer Warengruppe."},{front:"Disintermediation",back:"Ausschaltung von Handelsstufen durch Direktverkauf (z.B. D2C)."},{front:"Category Management",back:"Strategische Steuerung von Produktkategorien zur Sortiments- und Umsatzoptimierung."}]},{id:"s1-ecm",code:"B EC",name:"Grundlagen des E-Commerce",ects:6,sws:"6",exam:"Klausur 120 Min. \xB7 50% + Seminararbeit (Gruppe, 25 S.) mit m\xFCndl. Pr\xFCfung \xB7 50%",desc:"Grundlagen des E-Commerce/Online-Handels: Gesch\xE4ftsmodelle, Plattform\xF6konomie, Konsumentenverhalten.",topics:[{t:"E-Commerce-Historie & \xF6konomische Bedeutung",def:"Die Entwicklung des E-Commerce l\xE4sst sich in mehreren historischen Wellen nachzeichnen. In der Pionierphase Mitte der 1990er-Jahre entstanden die ersten kommerziellen Websites; 1995 gr\xFCndete Jeff Bezos Amazon zun\xE4chst als reinen Online-Buchhandel, 1999 startete eBay seinen deutschen Marktplatz f\xFCr Privatverk\xE4ufe. In den 2000er-Jahren schufen der Ausbau von Breitbandinternet, sinkende Technologiekosten und wachsendes Vertrauen in Online-Zahlungsverfahren (u.a. durch PayPal) die Grundlage f\xFCr ein breiteres Publikum. In den 2010er-Jahren beschleunigte der mobile Durchbruch (Smartphones, Apps, mobile Zahlungen) den Wandel zus\xE4tzlich, w\xE4hrend gleichzeitig Amazon und Zalando zu globalen Gr\xF6\xDFen aufstiegen. Die Corona-Pandemie 2020/2021 wirkte als historischer Beschleuniger: Weil station\xE4re Gesch\xE4fte zeitweise schlie\xDFen mussten, verlagerte sich Kaufverhalten strukturell und dauerhaft Richtung Online. \xD6konomisch ist der deutsche E-Commerce-Markt heute laut Branchenverband bevh ein Umsatzvolumen von rund 80 Mrd. \u20AC j\xE4hrlich und beeinflusst damit nicht nur die Wettbewerbsf\xE4higkeit einzelner H\xE4ndler, sondern auch gesamtwirtschaftliche Gr\xF6\xDFen wie Besch\xE4ftigung im Einzelhandel, die Struktur von Innenst\xE4dten (Leerstand durch Kaufkraftabwanderung) und internationale Warenstr\xF6me durch grenz\xFCberschreitenden Online-Handel.",ex:"Der deutsche Online-Modehandel wuchs 2020 pandemiebedingt zweistellig, w\xE4hrend station\xE4re Modegesch\xE4fte teils \xFCber 30% Umsatzverlust verzeichneten \u2013 ein Beispiel daf\xFCr, wie externe Schocks Handelsstrukturen dauerhaft Richtung Online verschieben k\xF6nnen."},{t:"B2B/B2C/C2C/D2C-Gesch\xE4ftsmodelle",def:"Die vier zentralen E-Commerce-Gesch\xE4ftsmodelle unterscheiden sich danach, welche Marktseiten an der Transaktion beteiligt sind und wer die Kontrolle \xFCber Kundenbeziehung und Markenerlebnis beh\xE4lt. B2C (Business-to-Consumer) bezeichnet den Verkauf eines Unternehmens an private Endverbraucher und ist das klassische Modell des Online-Handels (z.B. Zalando). B2B (Business-to-Business) bezeichnet den Verkauf zwischen Unternehmen, h\xE4ufig mit abweichenden Preisstrukturen (Staffelpreise, individuelle Konditionen), gr\xF6\xDFeren Bestellmengen und komplexeren Beschaffungsprozessen mit mehreren Entscheidern (z.B. Amazon Business). C2C (Consumer-to-Consumer) vermittelt den Verkauf zwischen Privatpersonen \xFCber eine zentrale Plattform, die selbst nicht Eigent\xFCmerin der Ware ist, sondern \xFCber Vermittlungsgeb\xFChren oder Abonnements Einnahmen erzielt (z.B. eBay Kleinanzeigen, Vinted). D2C (Direct-to-Consumer) beschreibt ein Modell, bei dem ein Hersteller bewusst auf den mehrstufigen Handel verzichtet und direkt an Endkunden verkauft \u2013 meist \xFCber einen eigenen Online-Shop. Der strategische Vorteil von D2C liegt in der vollst\xE4ndigen Kontrolle \xFCber Markenpr\xE4sentation, Preisgestaltung und vor allem \xFCber wertvolle Erstanbieter-Kundendaten (First-Party-Data); der Nachteil ist der Verzicht auf die etablierte Reichweite, Logistik und Kundenbasis traditioneller Handelspartner.",ex:"Nike verkauft weiterhin \xFCber Zalando (B2C via Drittanbieter), baut aber gezielt nike.com als D2C-Kanal aus, um Kundendaten direkt zu erfassen und limitierte Editionen exklusiv selbst zu vermarkten \u2013 ein Trend vieler Markenhersteller weg vom reinen Handelspartner-Modell."},{t:"Plattform\xF6konomie & Netzwerkeffekte",def:"Plattformunternehmen unterscheiden sich fundamental von klassischen linearen Handelsunternehmen dadurch, dass sie in der Regel selbst kein oder kaum eigenes Warenverm\xF6gen besitzen, sondern als vermittelnde Infrastruktur zwischen zwei oder mehr Marktseiten fungieren \u2013 etwa zwischen K\xE4ufern und Verk\xE4ufern \u2013 und f\xFCr diese Vermittlungsleistung Geb\xFChren, Provisionen oder Werbeeinnahmen erzielen. Der zentrale \xF6konomische Werttreiber von Plattformen sind Netzwerkeffekte. Man unterscheidet direkte (same-side) Netzwerkeffekte, bei denen der Nutzen f\xFCr eine Nutzergruppe unmittelbar mit der Anzahl der Mitglieder derselben Gruppe steigt, von indirekten (cross-side) Netzwerkeffekten, bei denen der Nutzen einer Marktseite mit der Anzahl der Teilnehmer auf der jeweils anderen Marktseite steigt (mehr K\xE4ufer machen die Plattform f\xFCr Verk\xE4ufer attraktiver, und umgekehrt ziehen mehr Verk\xE4ufer wiederum mehr K\xE4ufer an). Diese sich selbst verst\xE4rkenden Effekte f\xFChren in vielen digitalen M\xE4rkten zu einer Tendenz hin zu 'Winner-take-most'- oder sogar 'Winner-take-all'-Marktstrukturen, in denen wenige dominante Plattformen den \xFCberwiegenden Teil des Marktes kontrollieren. Zus\xE4tzlich verschaffen die im Betrieb gesammelten Nutzer- und Transaktionsdaten der etablierten Plattform einen kumulativen Datenvorteil, der Empfehlungsalgorithmen, Preisfindung und Produktentwicklung verbessert und Neueinsteigern den Markteintritt zus\xE4tzlich erschwert.",ex:"Amazon Marketplace: Je mehr Drittanbieter listen, desto attraktiver wird die Plattform f\xFCr K\xE4ufer; je mehr K\xE4ufer aktiv sind, desto attraktiver wird sie f\xFCr neue Verk\xE4ufer \u2013 dieser sich selbst verst\xE4rkende Netzwerkeffekt hat Amazon zur dominanten Plattform mit \xFCber 2 Mio. aktiven Drittanbietern gemacht."},{t:"Kaufentscheidungsprozess & ROPO-Effekt",def:"Der Kaufentscheidungsprozess wird in der Konsumentenverhaltensforschung klassisch in f\xFCnf aufeinanderfolgende Phasen unterteilt. In der Problemerkennung wird dem Konsumenten ein Bed\xFCrfnis bewusst (ausgel\xF6st durch interne Reize wie Bedarf oder externe Reize wie Werbung). In der Informationssuche recherchiert der Kunde m\xF6gliche L\xF6sungen \u2013 heute \xFCberwiegend online \xFCber Suchmaschinen, Vergleichsportale, Social Media und Influencer-Empfehlungen. In der Bewertung der Alternativen vergleicht er Angebote anhand von Preis, Qualit\xE4t, Bewertungen und Markenvertrauen. In der Kaufentscheidung erfolgt der eigentliche Kaufabschluss auf einem gew\xE4hlten Kanal. Im Nachkaufverhalten entscheidet sich, ob der Kunde zufrieden ist, das Produkt beh\xE4lt oder retourniert, eine Bewertung hinterl\xE4sst und eine Wiederkaufabsicht entsteht. Dabei spielt der ROPO-Effekt (Research Online, Purchase Offline) eine zentrale Rolle: Viele Kunden recherchieren online, kaufen aber bewusst station\xE4r \u2013 etwa weil sie das Produkt vorab anfassen, anprobieren oder sofort mitnehmen m\xF6chten. Das spiegelbildliche Gegenst\xFCck TOPO (Try Offline, Purchase Online) beschreibt den umgekehrten Weg: im Laden anprobieren, aber anschlie\xDFend g\xFCnstiger online kaufen. Beide Effekte belegen, dass sich Online- und Offline-Handel in der Realit\xE4t kaum trennscharf abgrenzen lassen.",ex:"Ein Kunde vergleicht Kopfh\xF6rer anhand von YouTube-Reviews und Amazon-Bewertungen (Informationssuche), geht dann aber in den Elektronikmarkt, um sie live zu testen und sofort mitzunehmen (ROPO). Ein anderer Kunde probiert Kleidungsgr\xF6\xDFen im Laden an, bestellt das passende Teil aber abends g\xFCnstiger online (TOPO)."},{t:"Payment & Fulfillment",def:"Payment und Fulfillment bilden gemeinsam das operative R\xFCckgrat jeder E-Commerce-Transaktion nach Abschluss des Kaufakts. Im Bereich Payment stehen H\xE4ndlern verschiedene Zahlungsmethoden mit unterschiedlichem Risiko-, Kosten- und Komfortprofil zur Verf\xFCgung: Der Kauf auf Rechnung ist bei Kunden sehr beliebt, weil er das Ausfallrisiko beim Kunden l\xE4sst, bevor er die Ware sieht, birgt f\xFCr den H\xE4ndler jedoch ein erhebliches Forderungsausfallrisiko. PayPal und Kreditkarte bieten hohen Komfort und schnelle Abwicklung, kosten aber prozentuale Transaktionsgeb\xFChren. Buy-now-pay-later-Anbieter wie Klarna \xFCbernehmen das komplette Ausfallrisiko gegen eine Geb\xFChr und zahlen dem H\xE4ndler sofort aus, was die Konversionsrate erh\xF6hen kann. SEPA-Lastschrift ist g\xFCnstig, birgt aber ein R\xFCckbuchungsrisiko innerhalb der gesetzlichen Widerspruchsfrist. Im Bereich Fulfillment umfasst der Prozess den kompletten physischen Weg einer Bestellung: Wareneingang und Einlagerung, Kommissionierung (Zusammenstellen der Bestellung), Verpackung, \xDCbergabe an den Versanddienstleister sowie Retourenabwicklung inkl. Qualit\xE4tspr\xFCfung. H\xE4ndler w\xE4hlen zwischen Inhouse-Fulfillment (volle Kontrolle, hohe Fixkosten), Auslagerung an spezialisierte 3PL-Logistikdienstleister (Skalierbarkeit ohne eigene Infrastruktur) oder Dropshipping (der Hersteller versendet direkt, kein eigenes Lagerrisiko, aber weniger Kontrolle \xFCber Lieferzeit und Markenerlebnis).",ex:"Ein Modeh\xE4ndler bietet Kauf auf Rechnung (erh\xF6ht die Konversion, aber mit Ausfallrisiko) und Klarna-Ratenkauf an; im Hintergrund lagert er Bestseller im eigenen Lager, l\xE4sst saisonale Nischenartikel aber per Dropshipping direkt vom Hersteller verschicken, um Kapital nicht in selten verkaufte Ware zu binden."}],quiz:[{q:"Was bedeutet D2C?",options:["Data to Cloud","Direct to Consumer","Distribution to Company","Digital to Customer"],correct:1,explain:"D2C: Hersteller verkauft direkt an Endkunden, ohne Zwischenh\xE4ndler."},{q:"Was beschreibt der ROPO-Effekt?",options:["Online recherchieren, offline kaufen","Immer nur online kaufen","Retouren ohne Produktoption","Reine Offline-Werbung"],correct:0,explain:"ROPO = Research Online, Purchase Offline."},{q:"Was sind Netzwerkeffekte?",options:["Serverausf\xE4lle bei hoher Last","Plattform wird wertvoller, je mehr Nutzer sie hat","Preissenkung bei mehr Konkurrenz","Netzwerkkabel-Standards"],correct:1,explain:"Je mehr Nutzer eine Plattform hat, desto attraktiver wird sie f\xFCr neue Nutzer."}],cards:[{front:"B2C",back:"Business-to-Consumer \u2013 Unternehmen verkauft direkt an Endverbraucher."},{front:"Plattform\xF6konomie",back:"Gesch\xE4ftsmodell, das Angebot und Nachfrage verschiedener Akteure auf einer Plattform zusammenbringt."},{front:"ROPO-Effekt",back:"Research Online, Purchase Offline \u2013 online informieren, im Laden kaufen."},{front:"Fulfillment",back:"Gesamtprozess von Lagerung \xFCber Kommissionierung bis Versand und Retouren."},{front:"GAFA",back:"Sammelbegriff f\xFCr Google, Apple, Facebook (Meta), Amazon."}]},{id:"s1-gip",code:"GIP EC",name:"Grundlagen der Informatik und Programmierung",ects:6,sws:"5",exam:"Klausur 120 Min. \xB7 100% + Praktikum (Pflicht, unbenotet)",desc:"Einf\xFChrung in Informatik-Grundlagen und Programmierung mit Java.",topics:[{t:"Zahlensysteme (Bin\xE4r, Hex)",def:"Digitale Rechner verarbeiten s\xE4mtliche Informationen \u2013 Zahlen, Text, Bilder, Programme \u2013 ausschlie\xDFlich in bin\xE4rer Form, also im Zahlensystem zur Basis 2 mit den einzigen Ziffern 0 und 1 (Bits), weil sich zwei eindeutig unterscheidbare physikalische Zust\xE4nde (z.B. Spannung an/aus) technisch am zuverl\xE4ssigsten realisieren lassen. Da lange Bin\xE4rfolgen f\xFCr Menschen schwer lesbar sind, wird in der Praxis h\xE4ufig das Hexadezimalsystem zur Basis 16 verwendet (Ziffern 0\u20139 gefolgt von A\u2013F f\xFCr die Werte 10\u201315), weil sich exakt vier Bin\xE4rstellen (ein Nibble) verlustfrei in genau eine Hexadezimalziffer \xFCbersetzen lassen \u2013 dadurch wird die Darstellung kompakter, etwa bei Farbcodes in HTML/CSS (#FF5733) oder Speicheradressen. Die Umrechnung von Dezimal- in Bin\xE4rzahlen erfolgt durch fortgesetzte Division der Dezimalzahl durch 2, wobei die entstehenden Reste von unten (zuletzt berechnet) nach oben (zuerst berechnet) gelesen die Bin\xE4rzahl ergeben. Die Umrechnung von Bin\xE4r- in Hexadezimalzahlen erfolgt durch Gruppierung der Bin\xE4rziffern von rechts in 4er-Bl\xF6cke, die anschlie\xDFend einzeln in ihre Hexadezimal-Entsprechung \xFCbersetzt werden. Auch die Umrechnung in die Gegenrichtung folgt demselben Prinzip: Jede Hex-Ziffer wird durch ihre 4-Bit-Bin\xE4rentsprechung ersetzt.",ex:"Die Dezimalzahl 214 wird bin\xE4r zu 11010110 (128+64+16+4+2=214) und l\xE4sst sich in zwei 4er-Bl\xF6cke (1101 | 0110) aufteilen, was hexadezimal D6 ergibt \u2013 genau dieser Umrechnungstyp taucht regelm\xE4\xDFig als Klausuraufgabe auf."},{t:"Boolesche Algebra & Aussagenlogik",def:"Die boolesche Algebra, benannt nach dem Mathematiker George Boole, ist die formale Grundlage der digitalen Logik und arbeitet ausschlie\xDFlich mit den zwei Wahrheitswerten wahr (1) und falsch (0). Die vier grundlegenden Verkn\xFCpfungsoperatoren sind: AND (Konjunktion, in Java &&), das nur dann wahr liefert, wenn beide verkn\xFCpften Aussagen gleichzeitig wahr sind; OR (Disjunktion, in Java ||), das bereits dann wahr liefert, wenn mindestens eine der beiden Aussagen wahr ist; NOT (Negation, in Java !), das den Wahrheitswert seiner Eingabe umkehrt; und XOR (exklusives Oder), das nur dann wahr liefert, wenn genau eine der beiden Eingaben wahr ist, nicht aber beide gleichzeitig. Die nach Augustus De Morgan benannten De-Morgan-Regeln erlauben das systematische Umformen negierter Verkn\xFCpfungsausdr\xFCcke und sind in der Programmierung \xE4u\xDFerst n\xFCtzlich, um komplexe Bedingungen zu vereinfachen: NOT(A AND B) ist logisch identisch zu (NOT A) OR (NOT B), und NOT(A OR B) ist logisch identisch zu (NOT A) AND (NOT B). Diese Regeln bilden die theoretische Basis von Bedingungsausdr\xFCcken in nahezu jeder Programmiersprache sowie die physikalische Grundlage digitaler Schaltkreise und Logikgatter in der Hardware-Entwicklung.",ex:"Eine Bestelllogik soll ausl\xF6sen, wenn NICHT (Lager leer UND Nachfrage niedrig) gilt \u2013 nach De-Morgan \xE4quivalent zu (Lager nicht leer) ODER (Nachfrage nicht niedrig). In Java: if (!(lagerLeer && nachfrageNiedrig)) entspricht exakt if (!lagerLeer || !nachfrageNiedrig)."},{t:"Java: Variablen & Datentypen",def:"Eine Variable ist in Java ein benannter, typgebundener Speicherplatz im Arbeitsspeicher, dessen Inhalt sich w\xE4hrend der Programmlaufzeit \xE4ndern kann. Java ist streng typisiert, das hei\xDFt jede Variable muss vor ihrer ersten Verwendung mit einem festen Datentyp deklariert werden. Man unterscheidet primitive Datentypen, die direkt Werte speichern (int f\xFCr 32-Bit-Ganzzahlen, long f\xFCr sehr gro\xDFe Ganzzahlen, double f\xFCr Flie\xDFkommazahlen doppelter Genauigkeit, float f\xFCr einfache Genauigkeit, boolean f\xFCr wahr/falsch, char f\xFCr ein einzelnes Unicode-Zeichen, byte und short f\xFCr kleinere Ganzzahlbereiche), von Referenztypen, die stattdessen eine Speicheradresse auf ein Objekt im Heap enthalten \u2013 der wichtigste Referenztyp im Alltag ist String f\xFCr Zeichenketten, der deshalb gro\xDFgeschrieben wird, weil er technisch eine eigene Klasse ist. Jede Variable sollte m\xF6glichst direkt bei der Deklaration mit einem sinnvollen Startwert initialisiert werden, um Fehler durch undefinierte Werte zu vermeiden. Bei der Typkonvertierung (Casting) unterscheidet man die implizite (automatische) Konvertierung, die immer dann stattfindet, wenn kein Informationsverlust droht (z.B. int zu double), von der expliziten (manuellen) Konvertierung mittels vorangestelltem Klammer-Cast wie (int), die n\xF6tig ist, wenn vom gr\xF6\xDFeren zum kleineren Typ konvertiert wird und dabei m\xF6glicherweise Nachkommastellen oder Wertebereich verloren gehen.",ex:'int lagerbestand = 120; double einzelpreis = 29.99; boolean istVerfuegbar = lagerbestand > 0; String produktname = "Wanderrucksack"; double gesamtwert = lagerbestand * einzelpreis; \u2013 implizite Konvertierung von int zu double bei der Multiplikation.'},{t:"Kontrollstrukturen (if/else, Schleifen)",def:"Kontrollstrukturen sind die syntaktischen Bausteine, mit denen ein Programm vom rein sequenziellen Ablauf abweichen und stattdessen Entscheidungen treffen oder Codeabschnitte wiederholen kann. Bedingte Anweisungen steuern Verzweigungen: Eine if-Anweisung f\xFChrt einen Block nur aus, wenn eine Bedingung wahr ist; eine optionale else-if-Kette pr\xFCft weitere Bedingungen der Reihe nach; ein abschlie\xDFendes else f\xE4ngt alle \xFCbrigen F\xE4lle ab; eine switch-Anweisung bietet bei vielen festen, diskreten Fallunterscheidungen eine \xFCbersichtlichere Alternative zu langen if-else-Ketten. Schleifen wiederholen einen Codeblock: Die for-Schleife wird verwendet, wenn die Anzahl der Wiederholungen von vornherein bekannt ist (mit Z\xE4hlvariable, Bedingung und Inkrement in einer Zeile); die while-Schleife pr\xFCft ihre Bedingung vor jedem Durchlauf und eignet sich, wenn die Anzahl vorab unbekannt ist; die do-while-Schleife f\xFChrt den Block mindestens ein einziges Mal aus, bevor sie ihre Abbruchbedingung \xFCberhaupt zum ersten Mal pr\xFCft. Innerhalb von Schleifen erm\xF6glichen zwei Sprunganweisungen zus\xE4tzliche Kontrolle: break bricht die gesamte Schleife sofort und vollst\xE4ndig ab, w\xE4hrend continue lediglich den Rest des aktuellen Durchlaufs \xFCberspringt und sofort mit der n\xE4chsten Iteration fortf\xE4hrt.",ex:'for (int i = 1; i <= 10; i++) { if (lagerbestand[i] == 0) continue; System.out.println(produkt[i] + " ist verf\xFCgbar"); } durchl\xE4uft zehn Produkte, \xFCberspringt aber ausverkaufte Artikel und listet nur verf\xFCgbare auf.'},{t:"Methoden & objektorientierte Grundlagen",def:"Eine Methode ist ein benannter, wiederverwendbarer Codeabschnitt, der eine klar abgegrenzte Aufgabe erledigt: Sie kann optionale Parameter entgegennehmen und liefert entweder \xFCber return einen Wert eines festgelegten R\xFCckgabetyps zur\xFCck oder verwendet void, wenn kein Wert zur\xFCckgegeben wird. Die objektorientierte Programmierung (OOP) organisiert Software nicht als lose Ansammlung von Funktionen, sondern in Klassen und Objekten: Eine Klasse ist ein Bauplan, der festlegt, welche Attribute (Eigenschaften) und Methoden (Verhalten) ihre Instanzen besitzen; ein Objekt ist eine konkrete, im Speicher existierende Instanz dieser Klasse mit eigenen, individuellen Attributwerten. Ein Konstruktor ist eine spezielle, nach der Klasse benannte Methode ohne R\xFCckgabetyp, die automatisch beim Erzeugen eines neuen Objekts mit new aufgerufen wird und typischerweise die Attribute mit \xFCbergebenen Startwerten initialisiert. Vererbung (mit extends realisiert) erlaubt es, eine Unterklasse zu definieren, die automatisch s\xE4mtliche Attribute und Methoden einer Oberklasse \xFCbernimmt und zus\xE4tzlich um eigene erg\xE4nzen oder bestehende Methoden \xFCberschreiben (Overriding) kann \u2013 das f\xF6rdert Wiederverwendbarkeit, vermeidet Codeduplikate und bildet reale Hierarchien direkt im Code ab.",ex:'class Produkt { String name; double preis; Produkt(String n, double p){name=n; preis=p;} double getBrutto(double mwst){return preis*(1+mwst);} } \u2013 ein Objekt Produkt sneaker = new Produkt("Air Max", 129.99); ruft dann sneaker.getBrutto(0.19) auf, um den Bruttopreis inkl. 19% Mehrwertsteuer zu berechnen (154.69 \u20AC).'}],quiz:[{q:"Wie viele Werte kann 1 Bit annehmen?",options:["1","2","4","8"],correct:1,explain:"Ein Bit ist bin\xE4r: 0 oder 1 \u2013 also 2 m\xF6gliche Werte."},{q:"Was liefert NOT(A AND B) nach De-Morgan?",options:["NOT A AND NOT B","NOT A OR NOT B","A OR B","A AND B"],correct:1,explain:"De-Morgan: NOT(A AND B) = NOT A OR NOT B."},{q:"Welcher Java-Datentyp speichert Text?",options:["int","boolean","String","double"],correct:2,explain:"String ist der Java-Referenztyp f\xFCr Zeichenketten/Text."}],cards:[{front:"Bin\xE4rsystem",back:"Zahlensystem mit Basis 2 (nur 0 und 1) \u2013 die Sprache des Computers."},{front:"Boolescher Operator AND",back:"Ergebnis nur wahr, wenn beide Eingaben wahr sind. In Java: &&"},{front:"for-Schleife",back:"Java-Schleife f\xFCr bekannte Wiederholungsanzahl: for(int i=0;i<10;i++)"},{front:"Klasse (Java)",back:"Bauplan f\xFCr Objekte \u2013 definiert Attribute und Methoden."},{front:"Konstruktor",back:"Spezielle Methode, die beim Erstellen eines Objekts automatisch aufgerufen wird."}]},{id:"s1-eng",code:"ENGECom",name:"English",ects:6,sws:"4",exam:"Mehrteilig: Draft 25% + Presentation 40% + schriftl. Pr\xFCfung 35%",desc:"Business-Englisch f\xFCr den E-Commerce-Kontext, mit Anwesenheitspflicht.",topics:[{t:"Business Vocabulary E-Commerce",def:"Professionelles Business-Englisch im E-Commerce-Kontext erfordert einen pr\xE4zisen, fachspezifischen Wortschatz, der weit \xFCber Alltagsenglisch hinausgeht und sich grob in mehrere Kategorien gliedern l\xE4sst. Finanzielle Kennzahlen umfassen Begriffe wie revenue (Umsatz), profit margin (Gewinnspanne), conversion rate (Konversionsrate), churn rate (Abwanderungsrate) und customer lifetime value (erwarteter Gesamtwert eines Kunden \xFCber die gesamte Beziehung). Prozessbegriffe umfassen supply chain (Lieferkette), fulfillment (Auftragsabwicklung), inventory management (Bestandsmanagement) und customer journey (die gesamte Kundenreise von der ersten Wahrnehmung bis zum Nachkauf). Stakeholder-Begriffe unterscheiden shareholder (formale Anteilseigner mit Kapitalbeteiligung) von stakeholder im weiteren Sinne (jede Interessengruppe mit legitimem Interesse am Unternehmen, also auch Mitarbeiter, Kunden, Lieferanten und die Gesellschaft). Zus\xE4tzlich sollten Studierende auf systematische Unterschiede zwischen britischem und amerikanischem Gesch\xE4ftsenglisch achten (colour/color, organisation/organization, unterschiedliche Anredekonventionen) sowie den jeweils angemessenen Formalit\xE4tsgrad w\xE4hlen \u2013 ein interner Chat mit Kollegen erfordert einen anderen Ton als ein formeller Investorenbericht oder eine Kundenkommunikation.",ex:"In einem Quartalsbericht k\xF6nnte stehen: 'Our conversion rate increased by 12% after the checkout redesign, while churn rate among returning customers dropped significantly, positively impacting overall revenue.' \u2013 ein Satz mit vier zentralen Fachbegriffen im Kontext."},{t:"Pr\xE4sentationstechniken auf Englisch",def:"Eine \xFCberzeugende englischsprachige Gesch\xE4ftspr\xE4sentation folgt typischerweise einer klaren dreiteiligen Struktur. Der Hook (Einstieg) soll innerhalb der ersten Sekunden Aufmerksamkeit erzeugen, etwa durch eine \xFCberraschende Statistik, eine provokante rhetorische Frage oder eine kurze, relevante Anekdote. Der Body (Hauptteil) sollte auf maximal drei bis vier klar abgegrenzte Kernbotschaften begrenzt bleiben, die jeweils durch Daten, Diagramme oder konkrete Beispiele untermauert werden, statt das Publikum mit zu vielen Details zu \xFCberfrachten. Der Call-to-Action (Abschluss) formuliert am Ende eine konkrete, umsetzbare Handlungsaufforderung. Auf rhetorischer Ebene helfen Signalw\xF6rter zur Gliederung ('firstly... secondly... in conclusion...'), aktive statt passive Sprachkonstruktionen sowie bewusste Pausen zur Betonung wichtiger Punkte. Beim Umgang mit R\xFCckfragen im Anschluss an eine Pr\xE4sentation ist es eine bew\xE4hrte Technik, die gestellte Frage zun\xE4chst in eigenen Worten zu paraphrasieren ('That's a great question about...'), bevor man antwortet \u2013 das verschafft zus\xE4tzliche Bedenkzeit und stellt sicher, dass die Frage korrekt verstanden wurde.",ex:"Eine Produktpr\xE4sentation beginnt mit: 'Did you know that 70% of online shopping carts are abandoned before checkout?' (Hook), f\xFChrt durch drei L\xF6sungsans\xE4tze (Body) und endet mit: 'That's why we recommend implementing a one-click checkout by Q3.' (Call-to-Action)."},{t:"Schriftliche Ausarbeitung (Draft)",def:"Ein Draft bezeichnet im akademischen wie im gesch\xE4ftlichen Kontext eine bewusst vorl\xE4ufige, h\xE4ufig noch unvollst\xE4ndige oder unpolierte Fassung eines Textes, die nicht als Endprodukt gedacht ist, sondern als Zwischenschritt, um fr\xFChzeitig strukturelles und inhaltliches Feedback von Dozierenden, Kolleg:innen oder Vorgesetzten einzuholen, bevor unverh\xE4ltnism\xE4\xDFig viel Zeit in sprachlichen Feinschliff investiert wird, der sp\xE4ter ohnehin \xFCberarbeitet werden m\xFCsste. \xDCblich ist ein mehrstufiger, iterativer Schreibprozess: Ein first draft enth\xE4lt meist nur eine grobe Gliederung und die wichtigsten Kernargumente in vorl\xE4ufiger Formulierung; ein revised draft integriert erhaltenes Feedback und verbessert Struktur sowie Argumentationslogik; der final draft ist schlie\xDFlich die sprachlich und formal ausgefeilte Abgabeversion. In diesem Prozess bezieht sich Feedback in den fr\xFChen Phasen typischerweise auf inhaltliche und strukturelle Aspekte (Ist die Argumentation logisch? Fehlen wichtige Belege?), w\xE4hrend sprachliche und grammatikalische Korrekturen bewusst erst in sp\xE4teren Runden im Fokus stehen, um zu vermeiden, dass Zeit in Formulierungen investiert wird, die inhaltlich ohnehin noch verworfen werden k\xF6nnten.",ex:"Vor der Abgabe eines Business Case zur Einf\xFChrung eines neuen Bezahlverfahrens reicht ein Student einen ersten Draft mit Rohgliederung ein; basierend auf dem Feedback ('add more quantitative evidence in section 2') entsteht der \xFCberarbeitete, deutlich st\xE4rkere finale Draft."},{t:"Verhandlungs- & Meeting-Englisch",def:"Souver\xE4nes Verhandeln und Moderieren von Meetings auf Englisch erfordert einen Werkzeugkasten an situativ passenden Redewendungen f\xFCr unterschiedliche Gespr\xE4chsphasen. Zustimmung l\xE4sst sich abgestuft signalisieren, von einfacher Best\xE4tigung ('That makes sense') bis zu starker \xDCbereinstimmung ('I completely agree with that point'). H\xF6flicher, konstruktiver Widerspruch, der die Gesch\xE4ftsbeziehung nicht belastet, gelingt \xFCber abmildernde Formulierungen wie 'I see your point, but...' oder 'I'm not entirely sure that would work, because...', statt direkt zu widersprechen. Kompromissvorschl\xE4ge werden typischerweise \xFCber vorsichtig formulierte Fragen eingeleitet, etwa 'Could we consider a middle ground here?' oder 'What if we met halfway on the pricing?'. Die professionelle Moderation eines Meetings umfasst das Er\xF6ffnen mit einer klaren Agenda ('Today we'll cover three points...'), das aktive Steuern und ausgewogene Verteilen von Redebeitr\xE4gen sowie das Zusammenfassen am Ende zur Sicherstellung eines gemeinsamen Verst\xE4ndnisses ('To summarize what we've discussed today...'). Wichtig ist zudem ein Bewusstsein f\xFCr interkulturelle Unterschiede: Verhandlungspartner aus unterschiedlichen Kulturkreisen unterscheiden sich teils erheblich in ihrer bevorzugten Direktheit, ihrem Verhandlungstempo und ihrer Erwartungshaltung an Small Talk vor dem eigentlichen Gesch\xE4ftlichen.",ex:"In einer Preisverhandlung mit einem britischen Lieferanten reagiert der Eink\xE4ufer diplomatisch: 'I understand your position, but our budget is quite tight this quarter. Could we possibly agree on a 5% discount for orders above 10,000 units?' \u2013 ein h\xF6flicher Kompromissvorschlag statt Konfrontation."}],quiz:[{q:"Was bedeutet 'stakeholder' im Business-Englisch?",options:["Nur Aktion\xE4re","Alle Interessengruppen eines Unternehmens","Ein Firmensitz","Ein Vertragstyp"],correct:1,explain:"Stakeholder = alle Personen/Gruppen mit Interesse am Unternehmen."},{q:"Welches Wort passt zu 'supply chain'?",options:["Lieferkette","Aktienkurs","Personalabteilung","Marketingstrategie"],correct:0,explain:"'Supply chain' ist der englische Begriff f\xFCr Lieferkette."}],cards:[{front:"Stakeholder",back:"Person or group with an interest in a company's activities and outcomes."},{front:"Revenue",back:"Total income generated by a business before expenses (Umsatz)."},{front:"Supply Chain",back:"Lieferkette \u2013 the network involved in producing and delivering a product."},{front:"Draft",back:"A preliminary written version of a document before final submission."}]}]},{nr:2,title:"Datenbanken, Marketing, Mathematik & Recht",ects:30,modules:[{id:"s2-dat",code:"DAT",name:"Datenbanken",ects:6,sws:"5",exam:"Klausur 90 Min. \xB7 100% + Praktikum (Pflicht, unbenotet)",desc:"Grundlagen relationaler Datenbanken, praktische Arbeit mit MySQL und SQL.",topics:[{t:"ER-Modell & Datenmodellierung",def:"Das Entity-Relationship-Modell (ERM) ist die zentrale konzeptionelle Methode zur Modellierung von Datenstrukturen, bevor eine Datenbank technisch umgesetzt wird. Es bildet reale Objekte der Anwendungswelt als Entit\xE4ten ab (z.B. Kunde, Produkt, Bestellung), die durch Attribute n\xE4her beschrieben werden (Kunde hat Name, E-Mail, Adresse), und modelliert die Beziehungen zwischen diesen Entit\xE4ten. Jede Beziehung erh\xE4lt eine Kardinalit\xE4t: 1:1 (eine Entit\xE4t entspricht genau einer anderen), 1:n (eine Entit\xE4t kann mit vielen anderen verbunden sein, aber nicht umgekehrt) oder n:m (beide Seiten mehrfach verkn\xFCpft, was in der relationalen Umsetzung eine eigene Zwischentabelle erfordert). Aus dem fertigen ER-Diagramm lassen sich systematisch relationale Tabellen mit Prim\xE4r- und Fremdschl\xFCsseln ableiten \u2013 das ERM ist die Br\xFCcke zwischen fachlicher Anforderung und technischem Datenbankschema.",ex:"Ein Online-Shop-ERM zeigt: Kunde t\xE4tigt Bestellung (1:n, ein Kunde kann viele Bestellungen haben, eine Bestellung geh\xF6rt zu genau einem Kunden), w\xE4hrend Bestellung enth\xE4lt Produkt eine n:m-Beziehung ist (eine Bestellung enth\xE4lt mehrere Produkte, ein Produkt taucht in mehreren Bestellungen auf) und daher in eine Zwischentabelle Bestellposition aufgel\xF6st wird."},{t:"Relationale Algebra",def:"Die relationale Algebra ist die formale mathematische Grundlage, auf der SQL-Abfragen aufbauen, und definiert eine Menge von Operationen, die aus einer oder mehreren Tabellen (Relationen) neue Tabellen erzeugen. Die Selektion (\u03C3) filtert Zeilen einer Tabelle anhand einer Bedingung heraus, ohne Spalten zu ver\xE4ndern. Die Projektion (\u03C0) w\xE4hlt dagegen bestimmte Spalten aus und blendet andere aus. Der Verbund (Join) verkn\xFCpft zwei Tabellen anhand gemeinsamer Attribute (meist Prim\xE4r-/Fremdschl\xFCssel) zu einer neuen, breiteren Tabelle. Weitere Operationen sind Vereinigung, Differenz und das kartesische Produkt. Jede SQL-Abfrage l\xE4sst sich gedanklich in eine Abfolge solcher elementarer Operationen zerlegen, was beim Verst\xE4ndnis und bei der Optimierung komplexer Abfragen hilft.",ex:"Um den Umsatz aller Bestellungen \xFCber 100 \u20AC pro Kunde zu ermitteln, filtert man zun\xE4chst mit einer Selektion die Bestellungen (Betrag > 100), f\xFChrt dann einen Join mit der Kundentabelle \xFCber die Kunden-ID durch und projiziert abschlie\xDFend nur die Spalten Kundenname und Betrag."},{t:"SQL: SELECT, JOIN, Aggregation",def:"SQL (Structured Query Language) ist die Standardsprache zur Abfrage und Bearbeitung relationaler Datenbanken. Die SELECT-Anweisung liest Daten aus einer oder mehreren Tabellen aus und kann \xFCber eine WHERE-Klausel gefiltert werden. JOIN-Operationen verkn\xFCpfen mehrere Tabellen \xFCber gemeinsame Schl\xFCsselspalten: Der INNER JOIN liefert nur Zeilen, die in beiden Tabellen eine Entsprechung haben, w\xE4hrend ein LEFT JOIN zus\xE4tzlich alle Zeilen der linken Tabelle beh\xE4lt, auch wenn keine Entsprechung existiert. Aggregatfunktionen wie SUM (Summe), COUNT (Anzahl), AVG (Durchschnitt), MIN und MAX fassen mehrere Zeilen zu einem einzigen Kennwert zusammen und werden h\xE4ufig zusammen mit GROUP BY verwendet, das die Ergebnismenge zun\xE4chst in Gruppen (z.B. je Kunde) aufteilt, bevor die Aggregation pro Gruppe berechnet wird. HAVING filtert anschlie\xDFend die bereits aggregierten Gruppen, w\xE4hrend WHERE die Zeilen vor der Aggregation filtert.",ex:"SELECT kunde.name, SUM(betrag) AS umsatz FROM bestellung JOIN kunde ON bestellung.kunden_id = kunde.id GROUP BY kunde.name HAVING SUM(betrag) > 500 berechnet den Gesamtumsatz je Kunde und zeigt nur Kunden mit \xFCber 500 \u20AC Umsatz."},{t:"Normalisierung (1.\u20133. NF)",def:"Die Normalisierung ist ein systematisches Verfahren zur Strukturierung relationaler Datenbanken, das Datenredundanz reduziert und Anomalien bei Einf\xFCge-, \xC4nderungs- und L\xF6schvorg\xE4ngen vermeidet. Die erste Normalform (1. NF) fordert, dass jede Tabellenspalte nur atomare, nicht weiter zerlegbare Werte enth\xE4lt (keine Listen oder Mehrfachwerte in einer Zelle). Die zweite Normalform (2. NF) baut darauf auf und fordert zus\xE4tzlich, dass jedes Nicht-Schl\xFCsselattribut vollst\xE4ndig vom gesamten Prim\xE4rschl\xFCssel abh\xE4ngt, nicht nur von einem Teil davon (relevant bei zusammengesetzten Schl\xFCsseln). Die dritte Normalform (3. NF) fordert dar\xFCber hinaus, dass kein Nicht-Schl\xFCsselattribut transitiv von einem anderen Nicht-Schl\xFCsselattribut abh\xE4ngt, sondern ausschlie\xDFlich direkt vom Prim\xE4rschl\xFCssel. In der Praxis wird oft bewusst von der strengen Normalisierung abgewichen (Denormalisierung), um Abfragen zu beschleunigen, wenn Lesegeschwindigkeit wichtiger ist als minimale Redundanz.",ex:"W\xFCrde man die Kundenadresse in jeder einzelnen Bestellzeile wiederholen, verstie\xDFe das gegen die Normalisierung: \xC4ndert sich die Adresse, m\xFCssten alle Zeilen aktualisiert werden. Stattdessen wird die Adresse einmalig in einer eigenen Kundentabelle gespeichert, und die Bestelltabelle verweist nur \xFCber die Kunden-ID (Fremdschl\xFCssel) darauf."},{t:"Einblick in NoSQL-Datenbanken",def:"NoSQL-Datenbanken ('Not only SQL') verzichten bewusst auf das starre, im Voraus festgelegte Tabellenschema relationaler Datenbanken und bieten stattdessen flexible Datenmodelle, die sich f\xFCr gro\xDFe, heterogene oder schnell wachsende Datenmengen eignen. Man unterscheidet mehrere Kategorien: Dokumentbasierte Datenbanken (z.B. MongoDB) speichern Datens\xE4tze als flexible, JSON-\xE4hnliche Dokumente, bei denen unterschiedliche Datens\xE4tze unterschiedliche Felder haben k\xF6nnen. Key-Value-Stores (z.B. Redis) speichern einfache Schl\xFCssel-Wert-Paare mit sehr hoher Lese-/Schreibgeschwindigkeit, oft f\xFCr Caching. Spaltenorientierte Datenbanken (z.B. Cassandra) eignen sich f\xFCr sehr gro\xDFe Datenmengen mit hohem Schreibdurchsatz. Graphdatenbanken (z.B. Neo4j) modellieren explizit Beziehungen zwischen Datenpunkten und eignen sich f\xFCr stark vernetzte Daten wie soziale Netzwerke oder Empfehlungssysteme. Der Kompromiss gegen\xFCber relationalen Datenbanken liegt meist in geringerer Konsistenzgarantie zugunsten h\xF6herer Skalierbarkeit und Flexibilit\xE4t (CAP-Theorem).",ex:"Ein Produktkatalog eines Marktplatzes, bei dem Elektronikartikel v\xF6llig andere Attribute (Akkulaufzeit, Prozessor) haben als Kleidung (Gr\xF6\xDFe, Material), passt schlecht in ein starres relationales Schema mit festen Spalten, aber sehr gut in eine dokumentbasierte NoSQL-Datenbank wie MongoDB, bei der jedes Produktdokument nur die f\xFCr es relevanten Felder enth\xE4lt."}],quiz:[{q:"Was beschreibt das ER-Modell?",options:["Entit\xE4ten und ihre Beziehungen","Nur Tabellenformate","Ein Programmiersprachen-Standard","Ein Backup-Verfahren"],correct:0,explain:"Entity-Relationship-Modell zeigt Entit\xE4ten und ihre Beziehungen zueinander."},{q:"Welcher SQL-Befehl liest Daten aus?",options:["INSERT","UPDATE","DELETE","SELECT"],correct:3,explain:"SELECT liest (liefert) Daten aus einer oder mehreren Tabellen."},{q:"Wozu dient die Normalisierung?",options:["Datenredundanz vermeiden","Tabellen verschl\xFCsseln","Server beschleunigen","Backups erstellen"],correct:0,explain:"Normalisierung reduziert Redundanz und verbessert Datenintegrit\xE4t."}],cards:[{front:"Prim\xE4rschl\xFCssel",back:"Eindeutiger Identifikator einer Tabellenzeile (z.B. Kunden-ID)."},{front:"JOIN",back:"SQL-Operation, die Daten aus mehreren Tabellen anhand einer Beziehung verkn\xFCpft."},{front:"Normalisierung",back:"Prozess zur Reduktion von Datenredundanz durch Aufteilung in mehrere Tabellen."},{front:"NoSQL",back:"Nicht-relationale Datenbanken (z.B. dokumentbasiert) f\xFCr flexible, gro\xDFe Datenmengen."},{front:"Fremdschl\xFCssel",back:"Attribut, das auf den Prim\xE4rschl\xFCssel einer anderen Tabelle verweist."}]},{id:"s2-mkt",code:"M EC",name:"Marketing",ects:6,sws:"4",exam:"Test 90 Min. \xB7 50% + Gruppenprojekt (Entwurf, 5 S.) \xB7 50%",desc:"Einf\xFChrung in die Instrumente des Marketing \u2013 Marketing-Mix im E-Commerce-Kontext.",topics:[{t:"Marketing-Mix: Product, Price, Place, Promotion",def:"Der klassische Marketing-Mix nach E. Jerome McCarthy fasst die vier zentralen, vom Unternehmen aktiv gestaltbaren Marketinginstrumente zusammen ('4 Ps'). Die Produktpolitik (Product) umfasst alle Entscheidungen rund um das Leistungsangebot: Sortiment, Qualit\xE4t, Design, Markierung, Verpackung und Zusatzleistungen wie Garantie oder Kundenservice. Die Preispolitik (Price) legt Preisniveau, Rabatt- und Zahlungskonditionen fest und beeinflusst direkt Umsatz und Positionierung. Die Distributionspolitik (Place) betrifft die Wahl der Vertriebswege und -kan\xE4le, \xFCber die ein Produkt den Kunden erreicht (z.B. eigener Online-Shop, Marktpl\xE4tze, station\xE4rer Handel). Die Kommunikationspolitik (Promotion) umfasst alle Ma\xDFnahmen, mit denen ein Unternehmen sein Angebot bekannt macht und Kaufanreize schafft, etwa Werbung, \xD6ffentlichkeitsarbeit, Verkaufsf\xF6rderung und Social-Media-Marketing. Im digitalen Kontext wird der Mix oft um weitere Ps erweitert (z.B. People, Process, Physical Evidence bei Dienstleistungen).",ex:"Ein neu gestarteter Online-Sportshop trifft Marketing-Mix-Entscheidungen auf allen vier Ebenen gleichzeitig: Er w\xE4hlt ein auf Laufsport spezialisiertes Sortiment (Product), positioniert sich preislich im mittleren Segment mit gelegentlichen Rabattaktionen (Price), verkauft ausschlie\xDFlich \xFCber einen eigenen Online-Shop plus Amazon-Marktplatz (Place) und bewirbt sich \xFCber Instagram-Kooperationen mit Laufinfluencern (Promotion)."},{t:"Zielgruppenanalyse & Segmentierung",def:"Die Marktsegmentierung teilt einen heterogenen Gesamtmarkt in intern m\xF6glichst homogene, untereinander aber klar abgrenzbare Kundengruppen (Segmente) ein, um diese gezielter mit passenden Angeboten und Botschaften anzusprechen als mit einer undifferenzierten Massenansprache. Man unterscheidet mehrere Segmentierungskriterien: demografische Kriterien (Alter, Geschlecht, Einkommen, Bildung), geografische Kriterien (Region, Stadt/Land), psychografische Kriterien (Werte, Lebensstil, Pers\xF6nlichkeit) und verhaltensbezogene Kriterien (Kaufh\xE4ufigkeit, Markentreue, Preissensibilit\xE4t, Nutzungsintensit\xE4t). Eine gute Segmentierung erf\xFCllt mehrere Anforderungen: Die Segmente m\xFCssen messbar (erfassbare Daten verf\xFCgbar), erreichbar (\xFCber gezielte Kan\xE4le ansprechbar), wirtschaftlich gro\xDF genug (Substanz) und in ihrem Kaufverhalten tats\xE4chlich unterschiedlich (Differenzierbarkeit) sein. Auf Basis der Segmentierung folgt im Marketing-Prozess das Targeting (Auswahl der zu bearbeitenden Segmente) und die Positionierung (wie sich das Angebot im Kopf der Zielgruppe von der Konkurrenz abheben soll).",ex:"Ein Sportartikelh\xE4ndler segmentiert seinen Markt nach Nutzungsintensit\xE4t in Gelegenheitssportler (kaufen selten, preissensibel, einfache Grundausstattung) und Leistungssportler (kaufen h\xE4ufiger, weniger preissensibel, legen Wert auf Spitzentechnologie) und entwickelt f\xFCr beide Segmente unterschiedliche Produktlinien, Preispunkte und Werbebotschaften."},{t:"Markenf\xFChrung (Branding)",def:"Markenf\xFChrung (Branding) umfasst alle strategischen und operativen Ma\xDFnahmen, mit denen ein Unternehmen ein konsistentes, unverwechselbares Markenbild in den K\xF6pfen seiner Zielgruppe aufbaut und pflegt. Zentrale Bausteine sind die Markenidentit\xE4t (wof\xFCr die Marke intern stehen soll: Werte, Mission, Pers\xF6nlichkeit), das Markenimage (wie die Marke tats\xE4chlich von au\xDFen wahrgenommen wird \u2013 idealerweise deckt sich dies mit der Identit\xE4t) sowie die Markenbekanntheit (wie viele Personen der Zielgruppe die Marke \xFCberhaupt kennen und mit welchen Assoziationen). Eine starke Marke schafft Vertrauen, reduziert das wahrgenommene Kaufrisiko, erm\xF6glicht h\xF6here Preisspielr\xE4ume (Markenpremium) und f\xF6rdert Kundenloyalit\xE4t \xFCber wiederholte K\xE4ufe hinweg. Konsistenz ist dabei entscheidend: Visuelle Elemente (Logo, Farben, Typografie), Tonalit\xE4t der Kommunikation und das Kundenerlebnis sollten \xFCber alle Ber\xFChrungspunkte (Website, App, Verpackung, Kundenservice, Social Media) hinweg einheitlich gestaltet sein, um Wiedererkennung zu erzeugen.",ex:"Zalando setzt \xFCber Website, App, Werbeanzeigen und Verpackung konsequent denselben orangefarbenen Markenauftritt sowie einen einheitlichen, jugendlich-lockeren Kommunikationsstil ein \u2013 diese Konsistenz \xFCber alle Touchpoints hinweg st\xE4rkt die Wiedererkennung und das Vertrauen der Kunden in die Marke."},{t:"Preispolitik & Preisstrategien",def:"Die Preispolitik legt fest, zu welchem Preis und unter welchen Konditionen (Rabatte, Zahlungsziele, Finanzierungsangebote) ein Produkt angeboten wird, und ist eines der am direktesten gewinnwirksamen Marketinginstrumente. Bei der Markteinf\xFChrung neuer Produkte stehen zwei gegens\xE4tzliche Grundstrategien zur Wahl: Die Skimming-Strategie (Absch\xF6pfungsstrategie) setzt zun\xE4chst einen hohen Einf\xFChrungspreis an, um zahlungsbereite Fr\xFChk\xE4ufer (Innovatoren) abzusch\xF6pfen, und senkt den Preis anschlie\xDFend schrittweise, um sukzessive preissensiblere Kundensegmente zu erschlie\xDFen \u2013 geeignet bei hoher Produktdifferenzierung und geringer anf\xE4nglicher Konkurrenz. Die Penetrationsstrategie (Durchdringungsstrategie) setzt dagegen von Beginn an einen niedrigen Preis an, um schnell hohe Marktanteile und Skaleneffekte zu erzielen, bevor Wettbewerber reagieren k\xF6nnen \u2013 geeignet bei hoher Preiselastizit\xE4t und dem Ziel schneller Marktdurchdringung. Daneben existieren weitere Preisstrategien wie die dynamische Preisbildung (Preise \xE4ndern sich in Echtzeit nach Nachfrage, Wettbewerb oder Lagerbestand) und psychologische Preissetzung (z.B. 9,99 \u20AC statt 10 \u20AC).",ex:"Ein neues Smartphone-Modell wird zum Marktstart bewusst teuer positioniert, um technikaffine Fr\xFChk\xE4ufer mit hoher Zahlungsbereitschaft abzusch\xF6pfen (Skimming), und wird einige Monate sp\xE4ter schrittweise g\xFCnstiger, sobald Konkurrenzmodelle erscheinen und die breitere Masse angesprochen werden soll."}],quiz:[{q:"Welche 4 Elemente umfasst der klassische Marketing-Mix?",options:["Product, Price, Place, Promotion","Plan, Price, People, Product","Product, Profit, Place, Person","Price, Promotion, Profit, Plan"],correct:0,explain:"Die 4 Ps: Product, Price, Place, Promotion."},{q:"Was ist Preisskimming?",options:["Niedrigpreis-Einstieg","Hochpreis-Einstieg, der sinkt","Preise nie \xE4ndern","Nur Rabattaktionen"],correct:1,explain:"Skimming = hoher Einstiegspreis, der \xFCber Zeit gesenkt wird."}],cards:[{front:"Marketing-Mix (4P)",back:"Product, Price, Place, Promotion \u2013 die vier klassischen Marketinginstrumente."},{front:"Preisskimming",back:"Hoher Einf\xFChrungspreis, der schrittweise gesenkt wird, um verschiedene K\xE4ufersegmente abzusch\xF6pfen."},{front:"Penetrationsstrategie",back:"Niedriger Einf\xFChrungspreis zur schnellen Marktdurchdringung."},{front:"Zielgruppensegmentierung",back:"Aufteilung des Marktes in homogene Kundengruppen nach Merkmalen."}]},{id:"s2-mat",code:"MAT 1",name:"Mathematik 1 (Ingenieurmathematik)",ects:6,sws:"6",exam:"Klausur 120 Min. \xB7 100%",desc:"Mathematisches Grundwissen: Funktionen, Vektorrechnung, Folgen, Differential- und Integralrechnung, komplexe Zahlen.",topics:[{t:"Logik, Mengen & Funktionen",def:"Die Aussagenlogik untersucht die Verkn\xFCpfung von Aussagen (die entweder wahr oder falsch sind) \xFCber Operatoren wie UND, ODER und NICHT und bildet die formale Grundlage vieler mathematischer Beweise. Die Mengenlehre beschreibt Zusammenfassungen von Objekten (Mengen) und definiert Operationen zwischen ihnen: die Vereinigung (alle Elemente, die in mindestens einer Menge vorkommen), der Durchschnitt (alle Elemente, die in beiden Mengen vorkommen) und die Differenz (Elemente einer Menge, die nicht in der anderen vorkommen). Der Funktionsbegriff beschreibt eine eindeutige Zuordnungsvorschrift, die jedem Element einer Definitionsmenge (den x-Werten) genau ein Element einer Zielmenge (den y-Werten) zuordnet. Wichtige Funktionseigenschaften sind Definitionsbereich (erlaubte Eingabewerte), Wertebereich (m\xF6gliche Ausgabewerte), Monotonie (steigend/fallend) sowie Nullstellen (x-Werte, an denen die Funktion den Wert 0 annimmt).",ex:"Die lineare Funktion f(x) = 2x + 3 ordnet jedem x-Wert eindeutig einen y-Wert zu (z.B. f(5) = 13) und l\xE4sst sich als Kostenfunktion interpretieren, bei der 3 die Fixkosten und 2 die variablen Kosten pro Einheit darstellen."},{t:"Vektor- & Matrizenrechnung",def:"Ein Vektor ist ein mathematisches Objekt, das im Gegensatz zu einer einzelnen Zahl (Skalar) sowohl einen Betrag (L\xE4nge) als auch eine Richtung besitzt und \xFCblicherweise als geordnetes Zahlentupel dargestellt wird. Vektoren lassen sich addieren, subtrahieren und mit einem Skalar multiplizieren; das Skalarprodukt zweier Vektoren liefert eine einzelne Zahl und wird u.a. zur Berechnung von Winkeln zwischen Vektoren verwendet. Eine Matrix ist ein rechteckiges Schema von Zahlen, angeordnet in Zeilen und Spalten, und dient insbesondere zur kompakten Darstellung und L\xF6sung linearer Gleichungssysteme: Ein System mehrerer linearer Gleichungen mit mehreren Unbekannten l\xE4sst sich als Matrix-Vektor-Gleichung schreiben und mit Verfahren wie dem Gau\xDF-Algorithmus systematisch l\xF6sen. Matrizen lassen sich addieren, mit einem Skalar multiplizieren und unter bestimmten Bedingungen miteinander multiplizieren (Matrizenmultiplikation), was in der Praxis z.B. bei linearen Transformationen oder in der Datenanalyse verwendet wird.",ex:"Eine 3\xD74-Matrix bildet die Lagerbest\xE4nde von drei Produkten an vier verschiedenen Lagerstandorten ab; durch Matrizenmultiplikation mit einem Preisvektor l\xE4sst sich in einem Rechenschritt der Gesamtwert des Lagerbestands je Standort berechnen."},{t:"Folgen & Reihen",def:"Eine Zahlenfolge ist eine geordnete, abz\xE4hlbare Liste von Zahlen, deren einzelne Glieder nach einer festen mathematischen Vorschrift gebildet werden \u2013 etwa einer expliziten Formel (die jedes Glied direkt aus seiner Position berechnet) oder einer rekursiven Vorschrift (die jedes Glied aus dem vorherigen berechnet). Bei einer arithmetischen Folge ist die Differenz zwischen aufeinanderfolgenden Gliedern konstant (lineares Wachstum), bei einer geometrischen Folge ist dagegen der Quotient zwischen aufeinanderfolgenden Gliedern konstant (exponentielles Wachstum bzw. exponentieller Zerfall). Eine Reihe ist die fortlaufende Summe der Glieder einer Folge; man unterscheidet endliche Reihen (Partialsummen) von unendlichen Reihen, die unter bestimmten Bedingungen gegen einen endlichen Grenzwert konvergieren k\xF6nnen, obwohl unendlich viele Glieder addiert werden.",ex:"Ein Startup rechnet mit monatlich 8% Umsatzwachstum \u2013 eine geometrische Folge mit dem Quotienten 1,08. Nach 12 Monaten hat sich der Umsatz dadurch nicht linear, sondern um den Faktor 1,08 hoch 12 (rund das 2,5-fache) erh\xF6ht, was die Dynamik exponentiellen Wachstums verdeutlicht."},{t:"Differentialrechnung",def:"Die Differentialrechnung berechnet Ableitungen von Funktionen und beantwortet damit die Frage, wie stark sich der Funktionswert bei einer minimalen \xC4nderung des Eingabewerts ver\xE4ndert \u2013 geometrisch entspricht die Ableitung an einer Stelle der Steigung der Tangente an den Funktionsgraphen an genau diesem Punkt. Wichtige Ableitungsregeln sind die Potenzregel (die Ableitung von x\u207F ist n\xB7x\u207F\u207B\xB9), die Summenregel, die Produktregel und die Kettenregel f\xFCr verschachtelte Funktionen. \xD6konomisch l\xE4sst sich die erste Ableitung einer Funktion oft als Grenzrate interpretieren: Die Ableitung einer Kostenfunktion liefert die Grenzkosten (die zus\xE4tzlichen Kosten f\xFCr genau eine weitere produzierte Einheit), die Ableitung einer Erl\xF6sfunktion die Grenzerl\xF6se. Die zweite Ableitung gibt zus\xE4tzlich Aufschluss \xFCber die Kr\xFCmmung des Graphen und wird u.a. genutzt, um Maxima und Minima einer Funktion (z.B. den gewinnmaximalen Preis) zu identifizieren und zu klassifizieren.",ex:"Eine Kostenfunktion K(x) = 0,5x\xB2 + 20x + 500 hat die Ableitung K'(x) = x + 20. Bei einer bereits produzierten Menge von x=100 Einheiten betragen die Grenzkosten f\xFCr die 101. Einheit also rund 120 \u20AC \u2013 deutlich mehr als die durchschnittlichen St\xFCckkosten, weil die Produktion in diesem Bereich \xFCberproportional teurer wird."},{t:"Integralrechnung & komplexe Zahlen",def:"Die Integralrechnung ist die Umkehroperation der Differentialrechnung: W\xE4hrend die Ableitung die Steigung einer Funktion an einem Punkt liefert, berechnet das bestimmte Integral die Fl\xE4che zwischen dem Funktionsgraphen und der x-Achse \xFCber einem festgelegten Intervall \u2013 dies l\xE4sst sich \xF6konomisch etwa nutzen, um aus einer Grenzkostenfunktion die gesamten (kumulierten) Kosten \xFCber eine Produktionsmenge hinweg zu berechnen. Das unbestimmte Integral (die Stammfunktion) liefert dagegen eine ganze Funktionsfamilie, deren Ableitung wieder die urspr\xFCngliche Funktion ergibt. Komplexe Zahlen erweitern den reellen Zahlenraum um die imagin\xE4re Einheit i, definiert als Wurzel aus -1 (eine im Reellen unl\xF6sbare Gleichung), und werden in der Form a + bi geschrieben, wobei a der Realteil und b der Imagin\xE4rteil ist. Komplexe Zahlen erm\xF6glichen es, Gleichungen zu l\xF6sen, die im Reellen keine L\xF6sung haben (z.B. x\xB2 = -1), und finden Anwendung u.a. in der Elektrotechnik und Signalverarbeitung.",ex:"Integriert man die Grenzkostenfunktion K'(x) = x + 20 \xFCber das Intervall von 0 bis 100, erh\xE4lt man die gesamten Produktionskosten f\xFCr 100 Einheiten: das Integral ergibt [0,5x\xB2 + 20x] von 0 bis 100 = 5.000 + 2.000 = 7.000 \u20AC."}],quiz:[{q:"Was ist die Ableitung von x\xB2?",options:["x","2x","x\xB2","2"],correct:1,explain:"Die Potenzregel: d/dx(x\u207F) = n\xB7x\u207F\u207B\xB9, also d/dx(x\xB2) = 2x."},{q:"Was beschreibt eine Matrix?",options:["Eine einzelne Zahl","Ein rechteckiges Zahlenschema","Nur Dezimalzahlen","Eine Funktion 3. Grades"],correct:1,explain:"Eine Matrix ist ein rechteckiges Schema von Zahlen in Zeilen und Spalten."},{q:"Was ist die imagin\xE4re Einheit i?",options:["\u221A-1","\u221A1","0","\u221E"],correct:0,explain:"i ist definiert als Wurzel aus -1, Basis komplexer Zahlen."}],cards:[{front:"Differentialrechnung",back:"Berechnung von Ableitungen \u2013 beschreibt die \xC4nderungsrate/Steigung einer Funktion."},{front:"Integralrechnung",back:"Berechnung von Fl\xE4chen unter Kurven / Umkehrung der Ableitung."},{front:"Vektor",back:"Mathematisches Objekt mit Richtung und Betrag, dargestellt als geordnetes Zahlentupel."},{front:"Komplexe Zahl",back:"Zahl der Form a+bi, bestehend aus Realteil a und Imagin\xE4rteil b."},{front:"Folge",back:"Geordnete, abz\xE4hlbare Liste von Zahlen nach einer bestimmten Vorschrift."}]},{id:"s2-pme",code:"PME",name:"Prozessmanagement im E-Commerce",ects:6,sws:"4",exam:"Schriftliche Ausarbeitung (5 S.) \xB7 100%",desc:"Einf\xFChrung in das Prozessmanagement mit Vertiefung im E-Commerce-Kontext.",topics:[{t:"Prozessmodellierung (BPMN Grundlagen)",def:"BPMN (Business Process Model and Notation) ist ein international standardisierter, grafischer Notationsstandard zur eindeutigen und f\xFCr alle Beteiligten verst\xE4ndlichen Darstellung von Gesch\xE4ftsprozessen. Zentrale Elemente sind Start- und Endereignisse (kreisf\xF6rmige Symbole, die den Beginn und das Ende eines Prozesses markieren), Aktivit\xE4ten bzw. Aufgaben (rechteckige Symbole f\xFCr einzelne Arbeitsschritte), Gateways bzw. Entscheidungspunkte (rautenf\xF6rmige Symbole, an denen sich der Prozessfluss abh\xE4ngig von einer Bedingung verzweigt oder wieder zusammenf\xFChrt) sowie Sequenzfl\xFCsse (Pfeile, die die Reihenfolge der Schritte festlegen). Zus\xE4tzlich lassen sich in BPMN sogenannte Swimlanes (Bahnen) verwenden, um zu visualisieren, welche Rolle oder Abteilung f\xFCr welchen Prozessschritt verantwortlich ist. Der gro\xDFe Vorteil von BPMN liegt darin, dass sowohl Fachabteilungen als auch IT-Entwickler dieselbe, eindeutige Notation verstehen und darauf aufbauend Prozesse analysieren, optimieren oder sogar automatisiert in Workflow-Systemen ausf\xFChren k\xF6nnen.",ex:"Der Bestellprozess eines Online-Shops wird als BPMN-Diagramm mit den Schritten Warenkorb bef\xFCllen \u2192 Kasse (Gateway: Zahlungsart w\xE4hlen) \u2192 Zahlung ver
