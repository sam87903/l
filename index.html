arbeiten \u2192 Lager benachrichtigt (Aktivit\xE4t) \u2192 Versand \u2192 Best\xE4tigungs-E-Mail (Endereignis) modelliert, wobei separate Swimlanes f\xFCr Kunde, Zahlungsdienstleister und Lager die jeweiligen Zust\xE4ndigkeiten sichtbar machen."},{t:"Ist- vs. Soll-Prozesse",def:"Die Unterscheidung zwischen Ist- und Soll-Prozessen ist ein zentrales methodisches Werkzeug des Prozessmanagements. Der Ist-Prozess (auch Ist-Zustand) beschreibt m\xF6glichst objektiv und detailliert, wie ein Arbeitsablauf tats\xE4chlich in der Praxis abl\xE4uft \u2013 inklusive aller Umwege, Sonderf\xE4lle, manueller Zwischenschritte und Medienbr\xFCche, die sich oft im Laufe der Zeit unbemerkt eingeschlichen haben. Die Ist-Aufnahme erfolgt typischerweise durch Interviews mit den beteiligten Mitarbeitenden, direkte Beobachtung oder die Auswertung von Systemprotokollen. Der Soll-Prozess (Ziel- oder Referenzprozess) beschreibt demgegen\xFCber, wie der Ablauf nach einer geplanten Verbesserung idealerweise aussehen soll \u2013 meist mit dem Ziel, Schritte zu eliminieren, zu vereinfachen oder zu automatisieren. Die systematische Gegen\xFCberstellung (Ist-Soll-Vergleich, auch Gap-Analyse genannt) macht sichtbar, an welchen konkreten Stellen sich Schwachstellen befinden und liefert die Grundlage f\xFCr einen priorisierten Ma\xDFnahmenplan zur Prozessverbesserung.",ex:"Ist-Prozess: Ein Kunde schickt eine Retoure per E-Mail an den Kundenservice, ein Mitarbeiter pr\xFCft den Fall manuell und veranlasst die R\xFCckerstattung oft erst nach mehreren Tagen. Soll-Prozess: Der Kunde meldet die Retoure selbst \xFCber ein automatisiertes Online-Portal an, erh\xE4lt sofort ein R\xFCcksendeetikett, und die R\xFCckerstattung wird automatisch ausgel\xF6st, sobald die Retoure im Lager gescannt wird \u2013 der manuelle Pr\xFCfschritt entf\xE4llt fast vollst\xE4ndig."},{t:"Prozessoptimierung im Online-Handel",def:"Prozessoptimierung bezeichnet die systematische, meist datengetriebene Verbesserung bestehender Gesch\xE4ftsabl\xE4ufe hinsichtlich Durchlaufzeit, Fehlerquote, Kosten und Kundenerlebnis. Typische Ansatzpunkte sind die Eliminierung \xFCberfl\xFCssiger oder doppelter Arbeitsschritte, die Automatisierung repetitiver, regelbasierter T\xE4tigkeiten (z.B. durch Software-Bots oder Workflow-Systeme), die Parallelisierung von Prozessschritten, die bislang unn\xF6tig nacheinander abliefen, sowie der Abbau von Medienbr\xFCchen, bei denen Informationen manuell von einem System in ein anderes \xFCbertragen werden m\xFCssen. Im E-Commerce sind besonders die sogenannten Order-to-Cash-Prozesse (vom Bestelleingang bis zum Zahlungseingang) und Procure-to-Pay-Prozesse (von der Beschaffung bis zur Bezahlung von Lieferanten) klassische Optimierungsfelder, weil hier hohe Transaktionsvolumina auf enge Zeit- und Kostenanforderungen treffen. Kennzahlen wie Durchlaufzeit, Fehlerquote pro 1.000 Vorg\xE4nge oder Prozesskosten pro Transaktion dienen dazu, den Erfolg von Optimierungsma\xDFnahmen messbar zu machen.",ex:"Ein Online-H\xE4ndler automatisiert die bislang manuelle Rechnungsstellung: Statt dass ein Mitarbeiter jede Bestellung h\xE4ndisch pr\xFCft und eine Rechnung erstellt, generiert das System die Rechnung automatisch bei Zahlungseingang und verschickt sie sofort per E-Mail \u2013 der Order-to-Cash-Prozess verk\xFCrzt sich dadurch von mehreren Tagen auf wenige Minuten und die Fehlerquote sinkt sp\xFCrbar."},{t:"Schnittstellen zwischen Abteilungen",def:"Schnittstellen sind die definierten \xDCbergabepunkte, an denen Informationen, Daten oder physische G\xFCter von einer Abteilung, einem System oder einem Prozessschritt an den n\xE4chsten \xFCbergeben werden. Im E-Commerce-Kontext sind Schnittstellen besonders kritisch zwischen Marketing (das Kaufinteresse generiert), Vertrieb/Shop-System (das Bestellungen entgegennimmt), Logistik/Lager (das die Ware bereitstellt und versendet), Buchhaltung (die Zahlungen verbucht) und Kundenservice (der R\xFCckfragen und Reklamationen bearbeitet). Schlecht definierte Schnittstellen f\xFChren h\xE4ufig zu Informationsverlust, Doppelarbeit oder Verz\xF6gerungen, etwa wenn Bestands\xE4nderungen im Lager nicht in Echtzeit an den Online-Shop gemeldet werden und dadurch Artikel verkauft werden, die gar nicht mehr vorr\xE4tig sind. Moderne Systemlandschaften l\xF6sen dieses Problem zunehmend durch automatisierte, in Echtzeit synchronisierte Schnittstellen (APIs) zwischen den beteiligten Systemen, statt sich auf manuellen Datenaustausch per E-Mail oder Excel-Tabelle zu verlassen.",ex:"Eine automatisierte API-Schnittstelle zwischen dem Warenwirtschaftssystem des Lagers und dem Online-Shop meldet in Echtzeit, sobald ein Artikel ausverkauft ist, sodass der Shop den Artikel sofort als 'nicht verf\xFCgbar' kennzeichnet \u2013 ohne diese Schnittstelle k\xF6nnten Kunden Artikel bestellen, die bereits vergriffen sind, was zu Stornierungen und Unzufriedenheit f\xFChrt."}],quiz:[{q:"Wof\xFCr steht BPMN?",options:["Business Process Model and Notation","Basic Process Management Network","Business Planning Model Number","Big Process Management Node"],correct:0,explain:"BPMN = Business Process Model and Notation, Standard zur Prozessmodellierung."},{q:"Was ist ein Ist-Prozess?",options:["Der aktuell tats\xE4chlich ablaufende Prozess","Ein zuk\xFCnftiger Wunschprozess","Ein Prozess, der gel\xF6scht wurde","Ein rein theoretisches Konzept"],correct:0,explain:"Der Ist-Prozess beschreibt, wie ein Ablauf aktuell wirklich funktioniert."}],cards:[{front:"Prozessmodellierung",back:"Grafische Darstellung von Arbeitsabl\xE4ufen, z.B. mit BPMN-Notation."},{front:"Ist-Prozess",back:"Der aktuelle, tats\xE4chlich gelebte Ablauf eines Gesch\xE4ftsprozesses."},{front:"Soll-Prozess",back:"Der angestrebte, optimierte Zielprozess nach einer Verbesserung."},{front:"Prozessoptimierung",back:"Systematische Verbesserung von Abl\xE4ufen hinsichtlich Zeit, Kosten und Qualit\xE4t."}]},{id:"s2-law",code:"ECLAW",name:"Rechtliche Grundlagen des E-Commerce",ects:6,sws:"4",exam:"Klausur 90 Min. \xB7 100%",desc:"Rechtliche Basis f\xFCr den Online-Handel: BGB, HGB, AGB, Urheberrecht, Wettbewerbsrecht, Datenschutz.",topics:[{t:"BGB & HGB Grundlagen",def:"Das B\xFCrgerliche Gesetzbuch (BGB) ist das zentrale deutsche Zivilgesetzbuch und regelt allgemeine Rechtsgesch\xE4fte zwischen Privatpersonen und Unternehmen, insbesondere das Vertragsrecht: Ein Vertrag kommt durch zwei \xFCbereinstimmende Willenserkl\xE4rungen zustande \u2013 ein Angebot und dessen Annahme. F\xFCr Kaufvertr\xE4ge regelt das BGB u.a. Pflichten von Verk\xE4ufer (mangelfreie Lieferung) und K\xE4ufer (Zahlung, Abnahme) sowie Gew\xE4hrleistungsrechte bei M\xE4ngeln (Nacherf\xFCllung, R\xFCcktritt, Minderung, Schadensersatz). Das Handelsgesetzbuch (HGB) erg\xE4nzt das BGB um Sonderregeln, die ausschlie\xDFlich f\xFCr Kaufleute gelten und den besonderen Anforderungen des Gesch\xE4ftsverkehrs zwischen Unternehmen Rechnung tragen, etwa strengere Formvorschriften, aber auch mehr Vertragsfreiheit als im Verbraucherschutzrecht, sowie spezielle Regeln zur kaufm\xE4nnischen R\xFCge- und Untersuchungspflicht bei Warenlieferungen.",ex:"Ein Online-Kaufvertrag entsteht rechtlich, sobald der Kunde auf 'Jetzt kaufen' klickt (Annahme des im Shop unterbreiteten Angebots) \u2013 die reine Produktanzeige im Shop gilt dabei rechtlich meist nur als unverbindliche Aufforderung zur Abgabe eines Angebots (invitatio ad offerendum), das eigentliche Angebot gibt der Kunde mit seiner Bestellung ab, angenommen wird es durch die Bestellbest\xE4tigung des H\xE4ndlers."},{t:"AGB-Recht im Online-Shop",def:"Allgemeine Gesch\xE4ftsbedingungen (AGB) sind vom Verk\xE4ufer f\xFCr eine Vielzahl von Vertr\xE4gen vorformulierte Vertragsbedingungen, die er seinen Kunden bei Vertragsschluss stellt, um Rechtsverh\xE4ltnisse einheitlich und effizient zu regeln, statt jeden Vertrag individuell auszuhandeln. Damit AGB wirksam Vertragsbestandteil werden, m\xFCssen sie dem Kunden vor Vertragsschluss klar erkennbar zug\xE4nglich gemacht werden und er muss zumutbar die M\xF6glichkeit zur Kenntnisnahme haben. Das AGB-Recht (\xA7\xA7 305 ff. BGB) unterwirft AGB-Klauseln zudem einer strengen Inhaltskontrolle: \xDCberraschende Klauseln werden nicht Vertragsbestandteil, und Klauseln, die den Kunden unangemessen benachteiligen (z.B. unklare oder widerspr\xFCchliche Formulierungen, unzul\xE4ssiger Haftungsausschluss), sind unwirksam \u2013 im Zweifel geht eine Unklarheit stets zu Lasten des Verwenders (Unklarheitenregel). F\xFCr Online-Shops kommen zus\xE4tzlich verbraucherschutzrechtliche Informationspflichten hinzu, die typischerweise \xFCber die AGB oder begleitende Rechtstexte erf\xFCllt werden.",ex:"Ein Online-Shop muss in seinen AGB transparent und verst\xE4ndlich \xFCber das 14-t\xE4gige Widerrufsrecht f\xFCr Verbraucher, die voraussichtliche Lieferzeit, die akzeptierten Zahlungsarten sowie etwaige Versandkosten informieren \u2013 fehlen diese Angaben oder sind sie versteckt/unklar formuliert, drohen Abmahnungen durch Wettbewerber oder Verbraucherschutzverb\xE4nde."},{t:"Urheberrecht & Wettbewerbsrecht",def:"Das Urheberrecht (UrhG) sch\xFCtzt pers\xF6nliche geistige Sch\xF6pfungen wie Texte, Fotos, Grafiken, Musik oder Software vor unerlaubter Vervielf\xE4ltigung, Verbreitung und \xF6ffentlicher Zug\xE4nglichmachung durch Dritte \u2013 der Schutz entsteht automatisch mit der Sch\xF6pfung, ohne dass eine Registrierung n\xF6tig ist, und liegt grunds\xE4tzlich beim Urheber, sofern keine Nutzungsrechte vertraglich \xFCbertragen wurden. Das Wettbewerbsrecht, insbesondere das Gesetz gegen den unlauteren Wettbewerb (UWG), sch\xFCtzt demgegen\xFCber nicht geistiges Eigentum, sondern einen fairen Wettbewerb zwischen Marktteilnehmern und verbietet unlautere Gesch\xE4ftspraktiken wie irref\xFChrende Werbung (unwahre oder zur T\xE4uschung geeignete Angaben \xFCber Produkteigenschaften, Preise oder Verf\xFCgbarkeit), aggressive Verkaufsmethoden sowie die gezielte Herabsetzung oder Nachahmung von Mitbewerbern. Verst\xF6\xDFe gegen beide Rechtsgebiete k\xF6nnen sowohl zivilrechtliche Unterlassungs- und Schadensersatzanspr\xFCche als auch kostenpflichtige Abmahnungen durch Konkurrenten oder Verb\xE4nde nach sich ziehen.",ex:"\xDCbernimmt ein Online-H\xE4ndler unautorisiert die Produktfotos und Beschreibungstexte eines Konkurrenten f\xFCr sein eigenes Angebot, verletzt er sowohl das Urheberrecht des urspr\xFCnglichen Erstellers (unerlaubte Vervielf\xE4ltigung) als auch das Wettbewerbsrecht, sofern die Kopie geeignet ist, Kunden \xFCber die Herkunft oder Eigenst\xE4ndigkeit des Angebots zu t\xE4uschen."},{t:"TMG (Telemediengesetz)",def:"Das Telemediengesetz (TMG) regelt rechtliche Rahmenbedingungen f\xFCr Anbieter von Telemedien \u2013 also praktisch alle internetbasierten Dienste wie Websites, Online-Shops, Apps und soziale Netzwerke \u2013 und legt insbesondere Informations- und Kennzeichnungspflichten fest. Die bekannteste Regelung ist die Impressumspflicht (\xA7 5 TMG): Gesch\xE4ftsm\xE4\xDFige Telemedien-Anbieter m\xFCssen leicht erkennbar, unmittelbar erreichbar und st\xE4ndig verf\xFCgbar Angaben zu Namen bzw. Firma, Anschrift, Kontaktm\xF6glichkeit (z.B. E-Mail), Handelsregistereintrag und ggf. Umsatzsteuer-ID bereitstellen. Das TMG regelt zudem Haftungsfragen f\xFCr Diensteanbieter, etwa in welchem Umfang ein Betreiber f\xFCr von Nutzern eingestellte Inhalte (z.B. Kundenbewertungen, Foreneintr\xE4ge) haftet, und unterscheidet dabei zwischen eigenen und fremden Informationen sowie zwischen blo\xDFer Durchleitung, Zwischenspeicherung und Hosting von Inhalten.",ex:"Jeder deutsche Online-Shop ben\xF6tigt ein vollst\xE4ndiges, \xFCber einen klar mit 'Impressum' beschrifteten Link von jeder Seite aus in maximal zwei Klicks erreichbares Impressum gem\xE4\xDF \xA7 5 TMG \u2013 fehlt es oder ist es unvollst\xE4ndig, drohen kostenpflichtige Abmahnungen durch Mitbewerber oder Verbraucherschutzverb\xE4nde."},{t:"DSGVO, BDSG & TTDSG",def:"Die Datenschutz-Grundverordnung (DSGVO) ist eine EU-weit unmittelbar geltende Verordnung, die den Umgang mit personenbezogenen Daten (allen Informationen, die sich auf eine identifizierte oder identifizierbare Person beziehen) einheitlich regelt und auf zentralen Grunds\xE4tzen beruht: Rechtm\xE4\xDFigkeit und Transparenz der Verarbeitung, Zweckbindung (Daten d\xFCrfen nur f\xFCr den urspr\xFCnglich festgelegten Zweck genutzt werden), Datenminimierung (nur so viele Daten wie n\xF6tig erheben) sowie Betroffenenrechte wie Auskunft, Berichtigung, L\xF6schung ('Recht auf Vergessenwerden') und Daten\xFCbertragbarkeit. Das Bundesdatenschutzgesetz (BDSG) erg\xE4nzt die DSGVO um nationale Konkretisierungen und \xD6ffnungsklauseln, w\xE4hrend das Telekommunikation-Telemedien-Datenschutz-Gesetz (TTDSG) speziell Regeln f\xFCr elektronische Kommunikationsdienste und den Einsatz von Cookies bzw. vergleichbaren Tracking-Technologien festlegt \u2013 insbesondere die Pflicht, vor dem Setzen nicht technisch notwendiger Cookies eine informierte, aktive und freiwillige Einwilligung der Nutzer einzuholen (Opt-in statt Opt-out).",ex:"Ein Online-Shop darf Marketing- und Tracking-Cookies (z.B. f\xFCr personalisierte Werbung oder Analyse-Tools) erst setzen, nachdem der Nutzer \xFCber ein DSGVO- und TTDSG-konformes Cookie-Banner aktiv zugestimmt hat \u2013 ein blo\xDFes Weiterscrollen oder ein vorangekreuztes Zustimmungsfeld reicht nach geltender Rechtsprechung nicht als wirksame Einwilligung aus."}],quiz:[{q:"Wof\xFCr steht DSGVO?",options:["Datenschutz-Grundverordnung","Deutsche Software-Gesetzesordnung","Digitale Sicherheits-Grundverordnung","Daten-Sende-Genehmigungs-Ordnung"],correct:0,explain:"DSGVO = Datenschutz-Grundverordnung, EU-weites Datenschutzrecht."},{q:"Was regelt das TMG?",options:["Steuerrecht","Telemedien / Online-Dienste","Arbeitsrecht","Erbrecht"],correct:1,explain:"Das Telemediengesetz (TMG) regelt rechtliche Pflichten f\xFCr Online-Anbieter, z.B. Impressum."},{q:"Was sind AGB?",options:["Allgemeine Gesch\xE4ftsbedingungen","Amtliche Gewerbebescheinigung","Allgemeine Gewinnbeteiligung","Automatisierte Gesch\xE4ftsbuchung"],correct:0,explain:"AGB = Allgemeine Gesch\xE4ftsbedingungen, vom Verk\xE4ufer vorformulierte Vertragsbedingungen."}],cards:[{front:"AGB",back:"Allgemeine Gesch\xE4ftsbedingungen \u2013 vorformulierte Vertragsbedingungen f\xFCr viele Kunden."},{front:"DSGVO",back:"EU-Datenschutz-Grundverordnung, regelt Umgang mit personenbezogenen Daten."},{front:"TMG",back:"Telemediengesetz \u2013 regelt Impressumspflicht & Haftung f\xFCr Online-Dienste."},{front:"Widerrufsrecht",back:"Recht des Verbrauchers, einen Online-Kauf innerhalb von 14 Tagen zu widerrufen."},{front:"Wettbewerbsrecht (UWG)",back:"Sch\xFCtzt vor unlauteren Gesch\xE4ftspraktiken wie irref\xFChrender Werbung."}]}]},{nr:3,title:"Statistik, CRM, Finanzierung & Softwaretechnik",ects:30,modules:[{id:"s3-stat",code:"Ang.Stat.",name:"Angewandte Statistik",ects:6,sws:"4",exam:"Klausur 120 Min. \xB7 100%",desc:"Statistische Methoden zur Datenauswertung \u2013 Basis f\xFCr Marktforschung und Data-Analytics.",topics:[{t:"Deskriptive Statistik (Mittelwert, Median, Streuung)",def:"Die deskriptive Statistik fasst gro\xDFe Datenmengen mit wenigen aussagekr\xE4ftigen Kennzahlen zusammen, ohne bereits auf eine gr\xF6\xDFere Grundgesamtheit zu schlie\xDFen. Lagema\xDFe beschreiben, wo sich die 'Mitte' der Daten befindet: Der arithmetische Mittelwert (Durchschnitt) summiert alle Werte und teilt durch ihre Anzahl, ist aber empfindlich gegen\xFCber Ausrei\xDFern; der Median ist der mittlere Wert einer der Gr\xF6\xDFe nach sortierten Reihe und robuster gegen\xFCber extremen Einzelwerten; der Modus ist der am h\xE4ufigsten vorkommende Wert. Streuungsma\xDFe beschreiben dagegen, wie stark die Werte um diese Mitte herum variieren: Die Varianz ist die durchschnittliche quadrierte Abweichung vom Mittelwert, die Standardabweichung ist die Wurzel daraus und damit in derselben Einheit wie die Ursprungsdaten interpretierbar, und die Spannweite ist die Differenz zwischen gr\xF6\xDFtem und kleinstem Wert. Eine geringe Streuung zeigt homogene, eine hohe Streuung stark variierende Daten an.",ex:"Der durchschnittliche Warenkorbwert eines Shops liegt bei 65 \u20AC (Mittelwert), doch weil einige wenige Gro\xDFbestellungen von \xFCber 500 \u20AC den Durchschnitt nach oben verzerren, liegt der Median \u2013 der tats\xE4chlich 'typische' Warenkorb \u2013 nur bei 42 \u20AC, was bei der Interpretation der Kennzahl entscheidend ist."},{t:"Wahrscheinlichkeitsrechnung",def:"Die Wahrscheinlichkeitsrechnung quantifiziert die Chance, dass ein bestimmtes zuf\xE4lliges Ereignis eintritt, als Zahl zwischen 0 (unm\xF6glich) und 1 (sicher). Grundlegende Konzepte sind der Ereignisraum (die Menge aller m\xF6glichen Ausg\xE4nge eines Zufallsexperiments), die Additionsregel (die Wahrscheinlichkeit, dass eines von mehreren sich ausschlie\xDFenden Ereignissen eintritt, ist die Summe ihrer Einzelwahrscheinlichkeiten) und die Multiplikationsregel (die Wahrscheinlichkeit, dass zwei unabh\xE4ngige Ereignisse beide eintreten, ist das Produkt ihrer Einzelwahrscheinlichkeiten). Die bedingte Wahrscheinlichkeit beschreibt die Wahrscheinlichkeit eines Ereignisses unter der Voraussetzung, dass ein anderes Ereignis bereits eingetreten ist, und ist die Grundlage des Bayes-Theorems, mit dem sich Wahrscheinlichkeiten unter neuer Information systematisch aktualisieren lassen.",ex:"Aus historischen Daten wei\xDF ein Shop, dass 3% aller Website-Besucher tats\xE4chlich kaufen (unbedingte Kaufwahrscheinlichkeit). Legt ein Besucher jedoch bereits einen Artikel in den Warenkorb, steigt die bedingte Kaufwahrscheinlichkeit auf 35% \u2013 dieses Wissen l\xE4sst sich nutzen, um Besuchern mit gef\xFClltem Warenkorb gezielt einen Rabatt-Reminder per E-Mail zu senden."},{t:"Verteilungen (Normal-, Binomialverteilung)",def:"Eine Wahrscheinlichkeitsverteilung beschreibt, wie sich die Wahrscheinlichkeit \xFCber alle m\xF6glichen Werte einer Zufallsvariable verteilt. Die Normalverteilung (Gau\xDF-Verteilung) ist die bekannteste stetige Verteilung, symmetrisch glockenf\xF6rmig um ihren Mittelwert, und beschreibt viele nat\xFCrliche Ph\xE4nomene, bei denen sich viele kleine, unabh\xE4ngige Einflussfaktoren zu einem Gesamtergebnis addieren; sie wird vollst\xE4ndig durch Mittelwert und Standardabweichung charakterisiert, wobei nach der 68-95-99,7-Regel etwa 68% aller Werte innerhalb einer Standardabweichung um den Mittelwert liegen. Die Binomialverteilung ist eine diskrete Verteilung und modelliert die Anzahl der Erfolge bei einer festen Anzahl unabh\xE4ngiger Ja/Nein-Versuche mit jeweils gleicher Erfolgswahrscheinlichkeit (z.B. wie oft bei 100 M\xFCnzw\xFCrfen 'Kopf' f\xE4llt) und ist die theoretische Grundlage vieler A/B-Test-Auswertungen im E-Commerce, bei denen jeder Website-Besucher entweder konvertiert oder nicht.",ex:"Die Lieferzeiten eines Versandh\xE4ndlers folgen ann\xE4hernd einer Normalverteilung mit Mittelwert 3 Tage und Standardabweichung 0,5 Tage \u2013 rund 95% aller Lieferungen kommen demnach zwischen 2 und 4 Tagen an, was der Kundenservice nutzt, um realistische Lieferzeitversprechen zu kommunizieren."},{t:"Hypothesentests",def:"Ein Hypothesentest ist ein statistisches Verfahren, um zu pr\xFCfen, ob ein in einer Stichprobe beobachteter Unterschied oder Effekt tats\xE4chlich in der Grundgesamtheit existiert oder lediglich zuf\xE4lliger Stichprobenschwankung geschuldet ist. Man formuliert zun\xE4chst eine Nullhypothese (meist: 'es gibt keinen Unterschied/Effekt') und eine Alternativhypothese (der zu beweisende Effekt), berechnet aus den Stichprobendaten eine Teststatistik und daraus den p-Wert \u2013 die Wahrscheinlichkeit, ein mindestens so extremes Ergebnis rein zuf\xE4llig zu beobachten, wenn die Nullhypothese tats\xE4chlich zutr\xE4fe. Ist der p-Wert kleiner als ein vorab festgelegtes Signifikanzniveau (\xFCblicherweise 5%), wird die Nullhypothese verworfen und der Effekt gilt als statistisch signifikant. Wichtig ist dabei die Unterscheidung zwischen statistischer Signifikanz (der Effekt ist wahrscheinlich real) und praktischer Relevanz (der Effekt ist auch gro\xDF genug, um gesch\xE4ftlich bedeutsam zu sein) sowie das Bewusstsein f\xFCr m\xF6gliche Fehler erster Art (f\xE4lschlich signifikant) und zweiter Art (f\xE4lschlich nicht signifikant).",ex:"Ein A/B-Test vergleicht die Konversionsraten zweier Checkout-Varianten bei jeweils 5.000 Besuchern. Variante B erzielt 4,2% statt 3,8% Konversion. Ein Hypothesentest ergibt einen p-Wert von 0,03 (unter der 5%-Schwelle) \u2013 der Unterschied gilt damit als statistisch signifikant, und der Shop kann die Nullhypothese ('kein Unterschied zwischen den Varianten') mit hoher Sicherheit verwerfen."},{t:"Korrelation & Regression",def:"Die Korrelation misst die St\xE4rke und Richtung eines linearen Zusammenhangs zwischen zwei numerischen Variablen \xFCber den Korrelationskoeffizienten, der zwischen -1 (perfekter negativer Zusammenhang) \xFCber 0 (kein linearer Zusammenhang) bis +1 (perfekter positiver Zusammenhang) reicht. Wichtig ist dabei der Grundsatz 'Korrelation impliziert keine Kausalit\xE4t': Auch stark korrelierte Variablen m\xFCssen nicht urs\xE4chlich zusammenh\xE4ngen, sondern k\xF6nnen beide von einer dritten, unbeobachteten Variable beeinflusst werden. Die Regressionsanalyse geht einen Schritt weiter und modelliert eine abh\xE4ngige Zielvariable als (meist lineare) Funktion einer oder mehrerer unabh\xE4ngiger Einflussvariablen, um daraus konkrete Vorhersagen abzuleiten \u2013 die einfache lineare Regression sch\xE4tzt dabei eine Gerade, deren Steigung angibt, um wie viele Einheiten sich die Zielvariable im Schnitt \xE4ndert, wenn die Einflussvariable um eine Einheit steigt, w\xE4hrend die multiple Regression mehrere Einflussfaktoren gleichzeitig ber\xFCcksichtigt.",ex:"Eine lineare Regression zeigt, dass jeder zus\xE4tzlich investierte Euro Werbebudget im Schnitt mit 4,50 \u20AC zus\xE4tzlichem Wochenumsatz einhergeht (Regressionskoeffizient), mit einem Korrelationskoeffizienten von 0,82 \u2013 ein starker positiver Zusammenhang, der jedoch nicht automatisch beweist, dass die Werbung allein urs\xE4chlich f\xFCr den Umsatz verantwortlich ist, da z.B. saisonale Effekte beide Gr\xF6\xDFen gleichzeitig beeinflussen k\xF6nnten."}],quiz:[{q:"Was misst die Standardabweichung?",options:["Den Mittelwert","Die Streuung um den Mittelwert","Die Anzahl der Datenpunkte","Den Median"],correct:1,explain:"Die Standardabweichung zeigt, wie stark Werte um den Mittelwert streuen."},{q:"Was zeigt ein Korrelationskoeffizient von +1?",options:["Keinen Zusammenhang","Perfekten negativen Zusammenhang","Perfekten positiven Zusammenhang","Zuf\xE4lligen Zusammenhang"],correct:2,explain:"+1 bedeutet perfekten positiven linearen Zusammenhang zwischen zwei Variablen."},{q:"Was ist der Median?",options:["Der h\xE4ufigste Wert","Der mittlere Wert einer sortierten Reihe","Die Summe aller Werte","Die gr\xF6\xDFte Zahl"],correct:1,explain:"Der Median teilt eine sortierte Datenreihe in zwei gleich gro\xDFe H\xE4lften."}],cards:[{front:"Median",back:"Der mittlere Wert einer der Gr\xF6\xDFe nach sortierten Datenreihe."},{front:"Standardabweichung",back:"Ma\xDF f\xFCr die Streuung von Werten um den Mittelwert."},{front:"Normalverteilung",back:"Glockenf\xF6rmige Verteilung, bei der die meisten Werte um den Mittelwert liegen."},{front:"Korrelation",back:"Statistisches Ma\xDF f\xFCr den linearen Zusammenhang zweier Variablen (-1 bis +1)."},{front:"Hypothesentest",back:"Statistisches Verfahren, um eine Annahme \xFCber die Grundgesamtheit zu pr\xFCfen."}]},{id:"s3-bwl2",code:"BWL II",name:"Bilanz und Erfolgsrechnung",ects:6,sws:"4",exam:"Klausur 60 Min. \xB7 100%",desc:"Vertiefung Rechnungswesen: Bilanzen und Jahresabschluss nach HGB.",topics:[{t:"Jahresabschluss nach HGB",def:"Der handelsrechtliche Jahresabschluss ist der j\xE4hrliche Rechenschaftsbericht eines Unternehmens gegen\xFCber Eigent\xFCmern, Gl\xE4ubigern und der \xD6ffentlichkeit und besteht bei Kapitalgesellschaften mindestens aus Bilanz, Gewinn- und Verlustrechnung (GuV) sowie einem erl\xE4uternden Anhang; gr\xF6\xDFere Kapitalgesellschaften m\xFCssen zus\xE4tzlich einen Lagebericht erstellen, der die wirtschaftliche Lage und Risiken einordnet. Der Aufstellungs-, Pr\xFCfungs- und Offenlegungsumfang richtet sich nach der handelsrechtlichen Gr\xF6\xDFenklasse des Unternehmens (klein, mittelgro\xDF, gro\xDF gem\xE4\xDF \xA7 267 HGB), die anhand von Bilanzsumme, Umsatzerl\xF6sen und Mitarbeiterzahl bestimmt wird \u2013 gr\xF6\xDFere Gesellschaften unterliegen strengeren Pr\xFCfungs- (Wirtschaftspr\xFCfer) und Offenlegungspflichten. Der Jahresabschluss muss dabei den GoB entsprechen und ein den tats\xE4chlichen Verh\xE4ltnissen entsprechendes Bild der Verm\xF6gens-, Finanz- und Ertragslage vermitteln.",ex:"Eine mittelgro\xDFe GmbH muss ihren gepr\xFCften Jahresabschluss j\xE4hrlich beim Bundesanzeiger einreichen, wo er f\xFCr jedermann einsehbar offengelegt wird \u2013 dies dient dem Gl\xE4ubigerschutz, da potenzielle Gesch\xE4ftspartner sich so vor Vertragsabschluss ein Bild von der finanziellen Stabilit\xE4t des Unternehmens machen k\xF6nnen."},{t:"Bilanzierung & Bewertung",def:"Bilanzierungs- und Bewertungsvorschriften legen fest, ob ein Verm\xF6gensgegenstand oder eine Schuld \xFCberhaupt in der Bilanz angesetzt werden darf (Bilanzierungsf\xE4higkeit) und mit welchem Wert er bewertet wird (Bewertungsma\xDFstab). Der Grundsatz der Bewertung zu Anschaffungs- oder Herstellungskosten begrenzt den Ansatz nach oben: Verm\xF6gensgegenst\xE4nde d\xFCrfen h\xF6chstens mit ihren tats\xE4chlichen Anschaffungs- bzw. Herstellungskosten (abz\xFCglich Abschreibungen) bilanziert werden, auch wenn ihr aktueller Marktwert gestiegen ist (Anschaffungswertprinzip). Das Vorsichtsprinzip, eine der zentralen GoB, verlangt zus\xE4tzlich, drohende Verluste und Risiken bereits zu ber\xFCcksichtigen, sobald sie erkennbar sind, w\xE4hrend Gewinne erst bei tats\xE4chlicher Realisierung ausgewiesen werden d\xFCrfen (Realisationsprinzip) \u2013 dies f\xFChrt beim Umlaufverm\xF6gen zum sogenannten strengen Niederstwertprinzip: Ist der aktuelle Marktpreis niedriger als die Anschaffungskosten, muss zum niedrigeren Wert bilanziert werden.",ex:"Ein Warenlager wurde zu Anschaffungskosten von 50.000 \u20AC eingekauft. Ist der aktuelle Marktpreis der Ware zum Bilanzstichtag auf 42.000 \u20AC gefallen (z.B. wegen Modell-Nachfolgern), muss das Unternehmen nach dem strengen Niederstwertprinzip den niedrigeren Wert von 42.000 \u20AC ansetzen und die Differenz als au\xDFerplanm\xE4\xDFige Abschreibung verbuchen."},{t:"Erfolgsrechnung (GuV) im Detail",def:"Die Gewinn- und Verlustrechnung schl\xFCsselt detailliert auf, wie sich der Jahres\xFCberschuss bzw. -fehlbetrag eines Unternehmens zusammensetzt, indem sie s\xE4mtliche Ertr\xE4ge und Aufwendungen einer Periode systematisch gegen\xFCberstellt. Nach dem in Deutschland verbreiteten Gesamtkostenverfahren beginnt die GuV mit den Umsatzerl\xF6sen, denen der Reihe nach Materialaufwand (Kosten f\xFCr Rohstoffe, Waren, bezogene Leistungen), Personalaufwand (L\xF6hne, Geh\xE4lter, Sozialabgaben), Abschreibungen und sonstige betriebliche Aufwendungen gegen\xFCbergestellt werden, bis das Betriebsergebnis (operatives Ergebnis) erreicht ist. Anschlie\xDFend werden Finanzertr\xE4ge und -aufwendungen (Zinsen) sowie au\xDFerordentliche und steuerliche Effekte ber\xFCcksichtigt, um zum finalen Jahres\xFCberschuss zu gelangen. Diese stufenweise Gliederung erlaubt es, gezielt zu analysieren, auf welcher Ebene (operativ, finanziell, au\xDFerordentlich) ein Ergebnis ma\xDFgeblich beeinflusst wurde.",ex:"Ein Online-H\xE4ndler analysiert seine GuV und stellt fest, dass die Versandkosten (Teil der sonstigen betrieblichen Aufwendungen) in den letzten zwei Jahren von 8% auf 13% der Umsatzerl\xF6se gestiegen sind und damit einen wesentlichen Teil des R\xFCckgangs im operativen Ergebnis erkl\xE4ren \u2013 eine Erkenntnis, die auf Basis der reinen Jahres\xFCberschusszahl allein nicht sichtbar geworden w\xE4re."},{t:"Bilanzanalyse & Kennzahlen",def:"Die Bilanzanalyse wertet die im Jahresabschluss ver\xF6ffentlichten Zahlen mithilfe standardisierter Kennzahlen aus, um die wirtschaftliche Lage eines Unternehmens einzusch\xE4tzen und im Zeit- oder Branchenvergleich einzuordnen. Zentrale Kennzahlenkategorien sind: Kapitalstrukturkennzahlen wie die Eigenkapitalquote (Eigenkapital \xF7 Bilanzsumme), die die finanzielle Unabh\xE4ngigkeit von Fremdkapitalgebern zeigt; Liquidit\xE4tskennzahlen wie die Liquidit\xE4t 1., 2. und 3. Grades, die messen, inwieweit kurzfristige Verbindlichkeiten durch liquide Mittel bzw. kurzfristig verwertbares Umlaufverm\xF6gen gedeckt sind; Rentabilit\xE4tskennzahlen wie die Eigenkapitalrentabilit\xE4t (Gewinn \xF7 eingesetztes Eigenkapital) oder die Umsatzrentabilit\xE4t (Gewinn \xF7 Umsatz); sowie Effizienzkennzahlen wie der Lagerumschlag, der zeigt, wie oft der durchschnittliche Warenbestand innerhalb eines Jahres verkauft und ersetzt wird. Diese Kennzahlen sollten stets im Kontext der Branche und im Zeitverlauf betrachtet werden, da absolute Werte allein wenig aussagekr\xE4ftig sind.",ex:"Eine Eigenkapitalquote von 40% signalisiert eine solide, wenig fremdkapitalabh\xE4ngige Finanzierungsstruktur, w\xE4hrend ein Wert von nur 10% auf eine hohe Verschuldung und damit ein erh\xF6htes finanzielles Risiko hindeutet, insbesondere wenn zus\xE4tzlich die Liquidit\xE4t 1. Grades unter 100% liegt und kurzfristige Verbindlichkeiten nicht vollst\xE4ndig durch liquide Mittel gedeckt sind."}],quiz:[{q:"Wonach richtet sich der Jahresabschluss in Deutschland prim\xE4r?",options:["IFRS","HGB","US-GAAP","ISO 9001"],correct:1,explain:"Der handelsrechtliche Jahresabschluss in Deutschland folgt dem HGB."},{q:"Was zeigt die Eigenkapitalquote?",options:["Anteil des Eigenkapitals an der Bilanzsumme","Nur den Gewinn","Die Mitarbeiterzahl","Den Lagerbestand"],correct:0,explain:"Die Eigenkapitalquote = Eigenkapital / Bilanzsumme, zeigt finanzielle Stabilit\xE4t."}],cards:[{front:"Jahresabschluss",back:"Besteht aus Bilanz, GuV und ggf. Anhang \u2013 j\xE4hrlicher Rechenschaftsbericht eines Unternehmens."},{front:"Eigenkapitalquote",back:"Kennzahl: Eigenkapital \xF7 Bilanzsumme \u2013 zeigt finanzielle Unabh\xE4ngigkeit."},{front:"R\xFCckstellung",back:"Passivposten f\xFCr ungewisse zuk\xFCnftige Verpflichtungen (z.B. Prozessrisiken)."},{front:"Bilanzanalyse",back:"Auswertung von Bilanzkennzahlen zur Beurteilung der wirtschaftlichen Lage."}]},{id:"s3-crm",code:"CRM",name:"Customer Relationship Management (CRM) und Web Controlling",ects:6,sws:"5",exam:"Seminararbeit (Gruppe, ca. 6 S./Person) \xB7 100%",desc:"Einf\xFChrung in CRM im Online-Handel sowie wichtigste Kennzahlen und Instrumente des Web Controllings.",topics:[{t:"CRM-Grundlagen & Customer Lifecycle",def:"Customer Relationship Management (CRM) bezeichnet die systematische, meist softwaregest\xFCtzte Steuerung s\xE4mtlicher Phasen der Beziehung zwischen einem Unternehmen und seinen Kunden mit dem Ziel, Kundenwert und -zufriedenheit \xFCber die gesamte Beziehungsdauer zu maximieren. Der Customer Lifecycle (Kundenlebenszyklus) gliedert diese Beziehung typischerweise in mehrere Phasen: Akquise (Gewinnung neuer Interessenten und Erstkunden), Onboarding (erste Kauferfahrung, Willkommenskommunikation), Bindung/Entwicklung (Ausbau der Beziehung durch Cross- und Upselling, personalisierte Kommunikation), Loyalit\xE4t (der Kunde wird zum wiederkehrenden Stammkunden und ggf. Markenbotschafter) sowie potenziell R\xFCckgewinnung (Reaktivierung abgewanderter oder inaktiver Kunden). Ein CRM-System speichert dabei alle Kundeninteraktionen (K\xE4ufe, Support-Anfragen, Kommunikation) zentral, um jede Phase gezielt und datenbasiert zu steuern statt auf Vermutungen zu basieren.",ex:"Ein Online-Shop sendet automatisiert eine Willkommens-E-Mail mit einem kleinen Rabattcode direkt nach dem ersten Kauf (Onboarding-Phase), verschickt drei Monate sp\xE4ter eine personalisierte Empfehlung basierend auf dem bisherigen Kaufverhalten (Bindungsphase) und reaktiviert Kunden, die sechs Monate nicht mehr gekauft haben, mit einer gezielten 'Wir vermissen dich'-Kampagne (R\xFCckgewinnungsphase)."},{t:"Kundenbindung & Loyalty-Programme",def:"Kundenbindungsprogramme (Loyalty-Programme) sind strukturierte Anreizsysteme, die wiederkehrendes Kaufverhalten gezielt belohnen und damit die Wechselbereitschaft von Kunden zu Wettbewerbern senken sollen. G\xE4ngige Ausgestaltungsformen sind Punktesysteme (Kunden sammeln f\xFCr jeden Einkauf Punkte, die sp\xE4ter gegen Rabatte oder Pr\xE4mien eingel\xF6st werden k\xF6nnen), Stufenprogramme (Tier-Systeme), bei denen Kunden mit steigendem Umsatz h\xF6here Statusstufen mit exklusiveren Vorteilen erreichen, sowie reine Rabatt- oder Cashback-Modelle. \xD6konomisch rechtfertigt sich der Aufwand solcher Programme dadurch, dass die Gewinnung neuer Kunden in der Regel deutlich teurer ist als die Bindung bestehender Kunden, und dass gebundene Kunden tendenziell h\xF6here durchschnittliche Bestellwerte, eine geringere Preissensibilit\xE4t sowie eine h\xF6here Weiterempfehlungsbereitschaft aufweisen. Der Erfolg eines Loyalty-Programms wird meist \xFCber die Wiederkaufrate, den durchschnittlichen Customer Lifetime Value teilnehmender vs. nicht teilnehmender Kunden sowie die Nutzungs-/Einl\xF6sequote gemessen.",ex:"Ein Modeh\xE4ndler betreibt ein dreistufiges Punkteprogramm: F\xFCr jeden ausgegebenen Euro erhalten Kunden einen Punkt, ab 500 gesammelten Punkten erreichen sie die Silber-Stufe mit kostenlosem Versand, ab 2.000 Punkten die Gold-Stufe mit exklusivem Zugang zu Sale-Vorverk\xE4ufen \u2013 dieses gestaffelte System motiviert Kunden zu h\xF6heren und h\xE4ufigeren K\xE4ufen, um die n\xE4chste Stufe zu erreichen."},{t:"Web-Controlling-Kennzahlen (KPIs)",def:"Web-Controlling nutzt quantitative Kennzahlen (Key Performance Indicators, KPIs), um den Erfolg einer Website oder eines Online-Shops objektiv und datenbasiert zu messen, statt sich auf subjektive Einsch\xE4tzungen zu verlassen. Zentrale KPIs umfassen: die Absprungrate (Bounce Rate) \u2013 der Anteil der Besucher, die die Seite verlassen, ohne weiter zu interagieren; die durchschnittliche Verweildauer (Time on Site), die Engagement signalisiert; die Seiten pro Sitzung, die zeigen, wie tief Besucher navigieren; die Conversion Rate, also der Anteil der Besucher, die eine gew\xFCnschte Zielaktion (Kauf, Newsletter-Anmeldung) abschlie\xDFen; sowie Traffic-Quellen-Kennzahlen, die aufschl\xFCsseln, \xFCber welche Kan\xE4le (organische Suche, bezahlte Werbung, Social Media, Direktzugriff) Besucher auf die Seite gelangen. Erst die Kombination mehrerer KPIs ergibt ein aussagekr\xE4ftiges Gesamtbild, da eine einzelne Kennzahl isoliert betrachtet leicht fehlinterpretiert werden kann.",ex:"Eine ungew\xF6hnlich hohe Absprungrate von 75% speziell auf einer bestimmten Produktseite (im Vergleich zu 40% im Seitendurchschnitt) kann darauf hindeuten, dass die Produktbeschreibung unklar ist, wichtige Informationen (z.B. Gr\xF6\xDFentabelle) fehlen oder die Ladezeit dieser Seite zu lang ist \u2013 eine gezielte Analyse dieser einzelnen KPI-Abweichung liefert konkrete Ansatzpunkte zur Optimierung."},{t:"Conversion-Rate-Optimierung",def:"Conversion-Rate-Optimierung (CRO) bezeichnet den systematischen, datengetriebenen Prozess, den Anteil der Website-Besucher zu erh\xF6hen, die eine definierte Zielaktion abschlie\xDFen \u2013 meist einen Kauf, aber auch Newsletter-Anmeldungen oder Kontaktanfragen. Der CRO-Prozess folgt typischerweise einem iterativen Zyklus: Zun\xE4chst werden anhand von Web-Analytics-Daten und Nutzerverhaltensanalysen (z.B. Heatmaps, Session-Recordings) Schwachstellen oder Reibungspunkte im Nutzerpfad identifiziert; darauf basierend werden Hypothesen formuliert (z.B. 'ein prominenterer Call-to-Action-Button erh\xF6ht die Klickrate'); anschlie\xDFend wird die Hypothese \xFCber einen kontrollierten A/B-Test empirisch gepr\xFCft, bei dem ein Teil der Besucher zuf\xE4llig die bisherige Version (Kontrollgruppe) und der andere Teil die neue Variante (Testgruppe) sieht; abschlie\xDFend wird die Variante mit der statistisch signifikant besseren Performance dauerhaft \xFCbernommen. H\xE4ufige CRO-Hebel sind die Vereinfachung des Checkout-Prozesses, die Reduktion der Formularfelder, das Hinzuf\xFCgen von Vertrauenssignalen (Kundenbewertungen, Sicherheitssiegel) und eine klarere Preis-/Versandkosten-Kommunikation.",ex:"Ein Online-Shop testet zwei Checkout-Varianten: die bisherige mit f\xFCnf Formularschritten und eine neue, verk\xFCrzte Variante mit nur zwei Schritten. Nach 10.000 Besuchern je Variante zeigt die verk\xFCrzte Variante eine Abschlussrate von 4,8% gegen\xFCber 3,9% bei der bisherigen Version \u2013 ein statistisch signifikanter Unterschied, woraufhin der Shop die verk\xFCrzte Variante dauerhaft \xFCbernimmt."},{t:"Google Analytics Grundlagen",def:"Google Analytics ist eines der weltweit meistgenutzten Web-Analyse-Werkzeuge und erfasst automatisiert Website-Traffic, Nutzerverhalten und Conversion-Pfade, indem ein Tracking-Code auf jeder Seite eines Shops Ereignisse (Seitenaufrufe, Klicks, K\xE4ufe) an Google \xFCbermittelt. Zentrale Berichtskategorien sind: Akquisitionsberichte, die zeigen, \xFCber welche Kan\xE4le Besucher auf die Website gelangen (organische Suche, bezahlte Anzeigen, Social Media, Direktzugriff, Verweise von anderen Seiten); Verhaltensberichte, die zeigen, welche Seiten wie oft und wie lange besucht werden und wo Nutzer die Seite verlassen; sowie Conversion-/E-Commerce-Berichte, die K\xE4ufe, Ums\xE4tze und den gesamten Kaufpfad bis zum Abschluss nachvollziehen. \xDCber sogenannte Zielvorhaben (Goals) und Trichter-Analysen (Funnel-Analysen) l\xE4sst sich zudem exakt identifizieren, an welcher konkreten Stelle im Kaufprozess Besucher \xFCberproportional h\xE4ufig abspringen, bevor sie den Kauf abschlie\xDFen.",ex:"\xDCber Google Analytics erkennt ein Modeh\xE4ndler, dass 45% aller zahlenden Kunden \xFCber organische Instagram-Verweise und Influencer-Links auf die Seite gelangen, w\xE4hrend bezahlte Google-Ads-Anzeigen zwar viel Traffic, aber eine deutlich niedrigere Conversion Rate liefern \u2013 eine Erkenntnis, die den H\xE4ndler dazu bewegt, das Marketingbudget st\xE4rker in Richtung Social-Media-Kooperationen zu verschieben."}],quiz:[{q:"Was misst die Conversion Rate?",options:["Anzahl der Website-Besucher","Anteil der Besucher, die kaufen","Ladezeit der Website","Anzahl der Produkte im Shop"],correct:1,explain:"Conversion Rate = Anteil der Besucher, die eine gew\xFCnschte Aktion (z.B. Kauf) ausf\xFChren."},{q:"Was ist der Customer Lifetime Value (CLV)?",options:["Alter des Kunden","Erwarteter Gesamtumsatz eines Kunden \xFCber die Kundenbeziehung","Anzahl der Klicks","Retourenquote"],correct:1,explain:"CLV sch\xE4tzt den gesamten Wert eines Kunden \xFCber die gesamte Gesch\xE4ftsbeziehung."},{q:"Was ist eine typische CRM-Ma\xDFnahme?",options:["Personalisierte E-Mail-Kampagnen","Serverwartung","Buchhaltung","Produktionsplanung"],correct:0,explain:"Personalisierte Kommunikation ist ein zentrales CRM-Instrument zur Kundenbindung."}],cards:[{front:"CRM",back:"Customer Relationship Management \u2013 systematische Gestaltung der Kundenbeziehungen."},{front:"Conversion Rate",back:"Prozentsatz der Besucher, die eine gew\xFCnschte Aktion (z.B. Kauf) abschlie\xDFen."},{front:"Customer Lifetime Value",back:"Erwarteter Gesamtumsatz/-gewinn eines Kunden \xFCber die gesamte Gesch\xE4ftsbeziehung."},{front:"Web Controlling",back:"Systematische Analyse von Website-Kennzahlen zur Erfolgssteuerung."},{front:"Churn Rate",back:"Kennzahl f\xFCr die Kundenabwanderungsrate in einem Zeitraum."}]},{id:"s3-bwl6",code:"BWL VI",name:"Investition und Finanzierung",ects:6,sws:"4",exam:"Klausur 60 Min. \xB7 100%",desc:"Investitionsverfahren, Finanzierungsformen und Finanzmanagement.",topics:[{t:"Statische Investitionsrechnung",def:"Statische Investitionsrechnungsverfahren bewerten die Vorteilhaftigkeit einer Investition anhand einer einzigen, meist durchschnittlichen Rechnungsperiode und ber\xFCcksichtigen dabei bewusst nicht, dass Geld zu unterschiedlichen Zeitpunkten unterschiedlich viel wert ist (Zeitwert des Geldes) \u2013 sie sind daf\xFCr einfach und schnell anzuwenden, liefern aber bei langfristigen oder stark schwankenden Zahlungsstr\xF6men nur eine grobe N\xE4herung. Die Kostenvergleichsrechnung vergleicht die durchschnittlichen j\xE4hrlichen Kosten mehrerer Investitionsalternativen. Die Gewinnvergleichsrechnung erweitert dies um die erwarteten Erl\xF6se. Die Rentabilit\xE4tsrechnung setzt den durchschnittlichen Gewinn ins Verh\xE4ltnis zum eingesetzten Kapital. Die Amortisationsrechnung (Payback-Methode) schlie\xDFlich berechnet, nach welcher Zeitspanne die anf\xE4nglichen Anschaffungskosten einer Investition durch die daraus resultierenden R\xFCckfl\xFCsse (Einzahlungs\xFCbersch\xFCsse) wieder vollst\xE4ndig hereingeholt wurden \u2013 je k\xFCrzer die Amortisationsdauer, desto geringer gilt das Investitionsrisiko.",ex:"Ein neues automatisiertes Lagersystem kostet in der Anschaffung 200.000 \u20AC und spart durch geringeren Personalbedarf j\xE4hrlich 50.000 \u20AC an Kosten. Die Amortisationsrechnung zeigt: 200.000 \u20AC \xF7 50.000 \u20AC/Jahr = 4 Jahre, bis sich die Investition durch die Einsparungen amortisiert hat \u2013 ein Wert, den das Management mit der geplanten Nutzungsdauer der Anlage von z.B. 10 Jahren vergleicht, um die Investition zu bewerten."},{t:"Dynamische Verfahren (Kapitalwertmethode)",def:"Dynamische Investitionsrechnungsverfahren ber\xFCcksichtigen im Gegensatz zu statischen Verfahren explizit den Zeitwert des Geldes: Ein Euro, der heute zur Verf\xFCgung steht, ist mehr wert als ein Euro, der erst in f\xFCnf Jahren zuflie\xDFt, weil er zwischenzeitlich angelegt und verzinst werden k\xF6nnte. Die Kapitalwertmethode (Net Present Value, NPV) ist das wichtigste dynamische Verfahren: Sie diskontiert (rechnet zur\xFCck) alle zuk\xFCnftigen, mit der Investition verbundenen Ein- und Auszahlungen mithilfe eines Kalkulationszinssatzes (der die geforderte Mindestverzinsung bzw. die Kapitalkosten widerspiegelt) auf ihren heutigen Wert (Barwert) und summiert diese Barwerte abz\xFCglich der anf\xE4nglichen Investitionsauszahlung. Ist der resultierende Kapitalwert positiv, gilt die Investition als wirtschaftlich vorteilhaft, da sie mehr Wert schafft, als die geforderte Mindestverzinsung erfordert; bei mehreren sich ausschlie\xDFenden Alternativen wird \xFCblicherweise diejenige mit dem h\xF6chsten positiven Kapitalwert gew\xE4hlt. Verwandte dynamische Verfahren sind die interne Zinsfu\xDFmethode (der Zinssatz, bei dem der Kapitalwert genau null wird) und die Annuit\xE4tenmethode.",ex:"Ein Unternehmen plant eine neue Fulfillment-Anlage mit 500.000 \u20AC Anschaffungskosten, die \xFCber 5 Jahre j\xE4hrliche Einzahlungs\xFCbersch\xFCsse von 130.000 \u20AC erwirtschaften soll. Bei einem Kalkulationszinssatz von 8% ergibt die Diskontierung dieser Zahlungsstr\xF6me einen positiven Kapitalwert von rund 19.000 \u20AC \u2013 die Investition gilt damit als wirtschaftlich vorteilhaft, da sie die geforderte 8%-Mindestverzinsung \xFCbertrifft."},{t:"Eigen- vs. Fremdfinanzierung",def:"Die Finanzierungsentscheidung eines Unternehmens betrifft grundlegend die Frage, woher das f\xFCr Investitionen ben\xF6tigte Kapital stammt. Eigenfinanzierung stammt von den Eigent\xFCmern des Unternehmens \u2013 etwa durch Einlagen der Gr\xFCnder, Kapitalerh\xF6hungen bestehender oder neuer Gesellschafter, oder durch die Selbstfinanzierung aus einbehaltenen (thesaurierten) Gewinnen \u2013 und begr\xFCndet keinen festen R\xFCckzahlungsanspruch, daf\xFCr aber Mitspracherechte und eine Beteiligung am Gewinn (und Verlust). Fremdfinanzierung stammt dagegen von externen Gl\xE4ubigern wie Banken (Kredite), Anleihegl\xE4ubigern oder Lieferanten (Lieferantenkredit) und begr\xFCndet einen festen, vertraglich fixierten R\xFCckzahlungs- und Zinsanspruch unabh\xE4ngig vom Gesch\xE4ftserfolg, gew\xE4hrt den Gl\xE4ubigern aber in der Regel keine Mitspracherechte. Der sogenannte Leverage-Effekt (Hebelwirkung) beschreibt, dass Fremdkapital die Eigenkapitalrendite steigern kann, solange die Gesamtkapitalrendite \xFCber dem Fremdkapitalzinssatz liegt \u2013 gleichzeitig erh\xF6ht ein hoher Fremdkapitalanteil aber auch das finanzielle Risiko, da Zins- und Tilgungszahlungen unabh\xE4ngig von der Gesch\xE4ftslage geleistet werden m\xFCssen.",ex:"Ein Startup finanziert den Bau einer neuen Lagerhalle im Wert von 1 Mio. \u20AC zu 40% aus Eigenkapital (Einlagen der Gr\xFCnder und eines Investors) und zu 60% \xFCber einen Bankkredit (Fremdkapital) \u2013 dieser Finanzierungsmix nutzt den Leverage-Effekt zur Steigerung der Eigenkapitalrendite, birgt aber gleichzeitig das Risiko, dass die monatlichen Kreditraten auch in einem schwachen Gesch\xE4ftsjahr bedient werden m\xFCssen."},{t:"Finanzierungsformen (Kredit, Leasing, Factoring)",def:"Neben der klassischen Kreditfinanzierung (ein Kreditinstitut stellt einen Geldbetrag gegen Zins- und Tilgungszahlungen zur Verf\xFCgung) existieren im Unternehmensalltag mehrere spezialisierte Finanzierungsinstrumente. Leasing ist eine zeitlich befristete Nutzungs\xFCberlassung eines Wirtschaftsguts (z.B. Fahrzeuge, Maschinen, IT-Ausstattung) gegen regelm\xE4\xDFige Leasingraten, ohne dass das rechtliche Eigentum auf den Nutzer \xFCbergeht \u2013 dies schont die Liquidit\xE4t, da keine hohe Einmalzahlung n\xF6tig ist, und verlagert oft Instandhaltungsrisiken auf den Leasinggeber. Factoring bezeichnet den Verkauf offener Kundenforderungen (Rechnungen mit Zahlungsziel) an eine spezialisierte Factoring-Gesellschaft, die dem Unternehmen sofort einen Gro\xDFteil des Rechnungsbetrags auszahlt (abz\xFCglich einer Geb\xFChr) und dadurch sofortige Liquidit\xE4t schafft, w\xE4hrend das Ausfallrisiko und der Verwaltungsaufwand f\xFCr das Forderungsmanagement auf die Factoring-Gesellschaft \xFCbergehen (beim echten Factoring). Diese Instrumente sind besonders f\xFCr wachstumsstarke, aber liquidit\xE4tsknappe Unternehmen attraktiv, da sie Kapitalbindung reduzieren, ohne daf\xFCr klassische Kredite mit strengen Sicherheitenanforderungen aufnehmen zu m\xFCssen.",ex:"Ein Online-H\xE4ndler mit 30 Tagen Zahlungsziel gegen\xFCber seinen Gesch\xE4ftskunden verkauft seine offenen Forderungen \xFCber 100.000 \u20AC an eine Factoring-Gesellschaft und erh\xE4lt daf\xFCr sofort 95.000 \u20AC ausgezahlt (5% Factoring-Geb\xFChr) \u2013 dadurch steht ihm die Liquidit\xE4t sofort zur Verf\xFCgung, um z.B. p\xFCnktlich L\xF6hne zu zahlen, statt 30 Tage auf den Zahlungseingang seiner Kunden warten zu m\xFCssen."}],quiz:[{q:"Was berechnet die Kapitalwertmethode?",options:["Den Barwert aller Zahlungsstr\xF6me einer Investition","Nur den Kaufpreis","Die Steuerlast","Den Personalbedarf"],correct:0,explain:"Der Kapitalwert (NPV) diskontiert alle zuk\xFCnftigen Zahlungen auf den heutigen Wert."},{q:"Was ist Leasing?",options:["Kauf auf Raten","Miete von Wirtschaftsg\xFCtern gegen Geb\xFChr","Eine Aktienart","Ein Steuervorteil"],correct:1,explain:"Leasing = zeitlich befristete Nutzungs\xFCberlassung von G\xFCtern gegen Zahlung."}],cards:[{front:"Kapitalwertmethode",back:"Dynamisches Investitionsverfahren, das alle Zahlungsstr\xF6me abzinst und summiert (NPV)."},{front:"Amortisationsrechnung",back:"Statisches Verfahren, das die Zeit bis zur R\xFCckgewinnung des eingesetzten Kapitals berechnet."},{front:"Leasing",back:"Zeitlich befristete Nutzungs\xFCberlassung von Wirtschaftsg\xFCtern gegen Zahlung."},{front:"Factoring",back:"Verkauf von Forderungen an ein Finanzinstitut zur sofortigen Liquidit\xE4tsbeschaffung."}]},{id:"s3-swt",code:"SWT EC",name:"Softwaretechnik",ects:6,sws:"5",exam:"Klausur 90 Min. \xB7 100% + Praktikum (Pflicht, unbenotet)",desc:"Einf\xFChrung in die Softwaretechnik: Requirements Engineering, UML, Entwurfsmuster, Vorgehensmodelle.",topics:[{t:"Requirements Engineering",def:"Requirements Engineering (Anforderungsmanagement) ist die systematische Disziplin, mit der Anforderungen an ein Softwaresystem ermittelt (Elicitation), dokumentiert, analysiert, priorisiert, abgestimmt und \xFCber den gesamten Projektverlauf hinweg verwaltet werden, bevor bzw. w\xE4hrend Software entwickelt wird. Man unterscheidet funktionale Anforderungen (was das System konkret tun soll, z.B. 'Nutzer k\xF6nnen Artikel in den Warenkorb legen') von nicht-funktionalen Anforderungen (Qualit\xE4tseigenschaften wie Performance, Sicherheit, Benutzerfreundlichkeit oder Skalierbarkeit). Typische Techniken zur Anforderungsermittlung sind Interviews mit Stakeholdern, Workshops, Beobachtung bestehender Arbeitsabl\xE4ufe sowie das Verfassen von User Stories (kurze, aus Nutzersicht formulierte Anforderungsbeschreibungen nach dem Schema 'Als [Rolle] m\xF6chte ich [Ziel], um [Nutzen] zu erreichen') und Use Cases (detailliertere Beschreibungen von Interaktionsabl\xE4ufen zwischen Nutzer und System). Mangelhaftes Requirements Engineering gilt als eine der Hauptursachen f\xFCr gescheiterte oder budget\xFCberziehende Softwareprojekte, weil Fehlverst\xE4ndnisse erst sp\xE4t und damit besonders teuer korrigiert werden k\xF6nnen.",ex:"Vor der Entwicklung eines neuen Warenkorb-Features formuliert das Entwicklungsteam gemeinsam mit dem Produktmanagement User Stories wie 'Als Kundin m\xF6chte ich Artikel im Warenkorb speichern k\xF6nnen, auch nachdem ich mich ausgeloggt habe, damit ich meinen Einkauf sp\xE4ter fortsetzen kann' \u2013 diese konkrete, aus Nutzersicht formulierte Anforderung l\xE4sst sich anschlie\xDFend in klar testbare technische Akzeptanzkriterien \xFCbersetzen."},{t:"UML-Diagramme (Klassen, Sequenz, Use-Case)",def:"UML (Unified Modeling Language) ist der internationale Standard zur grafischen Modellierung von Softwaresystemen und stellt verschiedene Diagrammtypen f\xFCr unterschiedliche Perspektiven bereit. Klassendiagramme geh\xF6ren zu den Strukturdiagrammen und zeigen die statische Architektur eines Systems: Klassen mit ihren Attributen und Methoden sowie die Beziehungen zwischen ihnen (Assoziation, Vererbung, Aggregation, Komposition). Sequenzdiagramme geh\xF6ren zu den Verhaltensdiagrammen und zeigen den zeitlichen Ablauf von Nachrichtenaustausch zwischen mehreren Objekten oder Systemkomponenten \u2013 wer ruft wann welche Methode bei wem auf. Use-Case-Diagramme visualisieren aus einer h\xF6heren, fachlichen Flugh\xF6he, welche Akteure (Nutzer oder externe Systeme) welche Funktionalit\xE4ten (Anwendungsf\xE4lle) eines Systems nutzen, ohne technische Details der Umsetzung zu zeigen. Zusammen ergeben diese komplement\xE4ren Diagrammtypen ein vollst\xE4ndigeres Bild eines Softwaresystems als jeder einzelne Diagrammtyp f\xFCr sich.",ex:"Ein Sequenzdiagramm f\xFCr den Checkout-Prozess zeigt exakt die zeitliche Reihenfolge der Nachrichten: Kunde sendet Kaufanfrage an Shop-System \u2192 Shop-System fragt Zahlungsstatus beim Zahlungsdienstleister an \u2192 Zahlungsdienstleister best\xE4tigt die Zahlung \u2192 Shop-System l\xF6st Versandauftrag beim Lagersystem aus \u2013 dieses Diagramm macht auf einen Blick sichtbar, welche Systeme in welcher Reihenfolge miteinander kommunizieren m\xFCssen."},{t:"Entwurfsmuster (Design Patterns)",def:"Entwurfsmuster (Design Patterns) sind bew\xE4hrte, in der Softwareentwicklungspraxis wiederholt erprobte und dokumentierte L\xF6sungsschablonen f\xFCr wiederkehrende, strukturell \xE4hnliche Entwurfsprobleme \u2013 sie sind kein fertiger Code, sondern eine allgemeine, \xFCbertragbare Vorlage, die auf das konkrete Problem angepasst wird. Die 1994 vom sogenannten 'Gang of Four' ver\xF6ffentlichten klassischen Design Patterns werden traditionell in drei Kategorien eingeteilt: Erzeugungsmuster (Creational Patterns) regeln, wie Objekte erzeugt werden (z.B. das Singleton-Pattern, das sicherstellt, dass von einer Klasse zur Laufzeit nur genau eine Instanz existiert); Strukturmuster (Structural Patterns) regeln, wie Klassen und Objekte zu gr\xF6\xDFeren Strukturen zusammengesetzt werden (z.B. das Adapter-Pattern, das inkompatible Schnittstellen kompatibel macht); Verhaltensmuster (Behavioral Patterns) regeln, wie Objekte miteinander kommunizieren und Verantwortlichkeiten verteilen (z.B. das Observer-Pattern, bei dem mehrere Objekte automatisch \xFCber Zustands\xE4nderungen eines anderen Objekts benachrichtigt werden). Design Patterns f\xF6rdern Wiederverwendbarkeit, verbessern die Verst\xE4ndlichkeit im Team (durch gemeinsames Vokabular) und vermeiden h\xE4ufige Entwurfsfehler.",ex:"Das Singleton-Pattern wird eingesetzt, um sicherzustellen, dass pro Nutzersitzung genau ein Warenkorb-Objekt existiert, unabh\xE4ngig davon, von wie vielen unterschiedlichen Stellen im Code auf den Warenkorb zugegriffen wird \u2013 ohne dieses Muster k\xF6nnten versehentlich mehrere, widerspr\xFCchliche Warenkorb-Instanzen entstehen."},{t:"Testverfahren & Qualit\xE4tssicherung",def:"Softwaretests stellen systematisch sicher, dass ein Softwaresystem die spezifizierten Anforderungen korrekt erf\xFCllt, und werden \xFCblicherweise in einer aufsteigenden Teststufen-Pyramide organisiert. Unit-Tests (Komponententests) pr\xFCfen die kleinste isolierte Code-Einheit \u2013 meist eine einzelne Methode oder Funktion \u2013 automatisiert und unabh\xE4ngig von anderen Systemteilen und bilden die breite Basis der Testpyramide, da sie schnell, zahlreich und g\xFCnstig auszuf\xFChren sind. Integrationstests pr\xFCfen darauf aufbauend das korrekte Zusammenspiel mehrerer bereits einzeln getesteter Komponenten (z.B. ob das Bestellsystem korrekt mit dem Zahlungsdienstleister kommuniziert). Systemtests pr\xFCfen das gesamte, vollst\xE4ndig integrierte System gegen die fachlichen Anforderungen, h\xE4ufig aus Nutzersicht. Abnahmetests schlie\xDFlich werden vom Auftraggeber oder Endnutzer selbst durchgef\xFChrt, um die Freigabe f\xFCr den produktiven Einsatz zu erteilen. Automatisierte Tests, die bei jeder Code\xE4nderung automatisch erneut ausgef\xFChrt werden (Regressionstests), sind heute Standard, um sicherzustellen, dass neue \xC4nderungen keine bestehende Funktionalit\xE4t versehentlich brechen.",ex:"Ein automatisierter Unit-Test pr\xFCft isoliert, ob die Rabattberechnungsfunktion bei Eingabe des Gutscheincodes 'SOMMER10' korrekt 10% vom Warenkorbwert abzieht, bei einem ung\xFCltigen Code aber keinen Rabatt gew\xE4hrt und keine Fehlermeldung im System ausl\xF6st \u2013 dieser Test l\xE4uft bei jeder Code\xE4nderung automatisch mit, um sicherzustellen, dass die Rabattlogik durch sp\xE4tere Anpassungen nicht versehentlich besch\xE4digt wird."},{t:"Vorgehensmodelle (Wasserfall, Scrum)",def:"Vorgehensmodelle strukturieren, in welcher Reihenfolge und mit welcher Organisationsform die Phasen eines Softwareentwicklungsprojekts (Anforderungsanalyse, Design, Implementierung, Test, Betrieb) durchlaufen werden. Das klassische Wasserfallmodell ist linear-sequenziell: Jede Phase wird vollst\xE4ndig abgeschlossen, bevor die n\xE4chste beginnt, was eine klare Planbarkeit und Dokumentation erm\xF6glicht, aber wenig Flexibilit\xE4t bei sich \xE4ndernden Anforderungen bietet und Fehler oft erst sp\xE4t im Projekt sichtbar macht. Agile Vorgehensmodelle wie Scrum durchbrechen diese starre Linearit\xE4t zugunsten kurzer, iterativer Entwicklungszyklen (Sprints, meist 1\u20134 Wochen), an deren Ende jeweils ein potenziell auslieferbares Produktinkrement steht; zentrale Scrum-Rollen sind der Product Owner (verantwortet die fachlichen Priorit\xE4ten im Product Backlog), das Entwicklungsteam und der Scrum Master (moderiert den Prozess und beseitigt Hindernisse), w\xE4hrend t\xE4gliche kurze Abstimmungen (Daily Standups) und regelm\xE4\xDFige R\xFCckblicke (Sprint Reviews, Retrospektiven) f\xFCr kontinuierliche Anpassung sorgen. Agile Modelle eignen sich besonders gut f\xFCr Projekte mit unklaren oder sich h\xE4ufig \xE4ndernden Anforderungen, wie es im schnelllebigen E-Commerce-Umfeld typisch ist.",ex:"Ein E-Commerce-Entwicklungsteam plant seine Arbeit in zweiw\xF6chigen Scrum-Sprints: Zu Sprint-Beginn w\xE4hlt das Team gemeinsam mit dem Product Owner priorisierte Eintr\xE4ge aus dem Product Backlog aus (z.B. 'Wunschliste-Feature entwickeln'), f\xFChrt t\xE4glich ein 15-min\xFCtiges Daily Standup durch, um Fortschritt und Hindernisse zu besprechen, und liefert am Sprint-Ende ein fertig getestetes, potenziell direkt einsetzbares Feature aus \u2013 im Gegensatz zum starren Wasserfallmodell kann das Team so flexibel auf neue Erkenntnisse oder ver\xE4nderte Kundenw\xFCnsche reagieren."}],quiz:[{q:"Wof\xFCr steht UML?",options:["Unified Modeling Language","Universal Machine Learning","User Management Layer","Unit Model Logic"],correct:0,explain:"UML = Unified Modeling Language, Standard-Notation f\xFCr Softwaremodellierung."},{q:"Was ist ein Entwurfsmuster (Design Pattern)?",options:["Ein fertiges Programm","Eine wiederverwendbare L\xF6sung f\xFCr ein wiederkehrendes Entwurfsproblem","Ein Datenbankschema","Ein Testverfahren"],correct:1,explain:"Design Patterns sind bew\xE4hrte, wiederverwendbare L\xF6sungsschablonen f\xFCr Software-Probleme."},{q:"Welches Vorgehensmodell ist iterativ und agil?",options:["Wasserfallmodell","Scrum","V-Modell","Spiralmodell (klassisch)"],correct:1,explain:"Scrum ist ein agiles, iteratives Vorgehensmodell mit kurzen Sprints."}],cards:[{front:"Requirements Engineering",back:"Systematisches Ermitteln, Dokumentieren und Verwalten von Anforderungen an Software."},{front:"UML-Klassendiagramm",back:"Zeigt Klassen, Attribute, Methoden und Beziehungen in einem Softwaresystem."},{front:"Design Pattern",back:"Bew\xE4hrte, wiederverwendbare L\xF6sung f\xFCr ein wiederkehrendes Entwurfsproblem."},{front:"Scrum",back:"Agiles Vorgehensmodell mit iterativen Sprints, Product Owner und Daily Standups."},{front:"Unit Test",back:"Automatisierter Test einer einzelnen, isolierten Code-Einheit (z.B. Methode)."}]}]},{nr:4,title:"Entrepreneurship, UX, Operations & Webtechnologien",ects:30,modules:[{id:"s4-ent",code:"ENT",name:"Entrepreneurship",ects:6,sws:"4",exam:"Schriftl. Ausarbeitung (15 S.) \xB7 75% + Vortrag 10 Min. \xB7 25%",desc:"Technologiebasierte Unternehmensgr\xFCndungen und Innovationen.",topics:[{t:"Business Model Canvas",def:"Das Business Model Canvas, entwickelt von Alexander Osterwalder, ist ein strategisches Visualisierungswerkzeug, das die neun zentralen Bausteine eines Gesch\xE4ftsmodells auf einer einzigen, \xFCbersichtlichen Seite darstellt und damit die gemeinsame Diskussion und iterative Weiterentwicklung einer Gesch\xE4ftsidee im Team erleichtert. Die neun Bausteine sind: Kundensegmente (f\xFCr wen wird Wert geschaffen), Wertangebote (welches Problem wird gel\xF6st bzw. welcher Nutzen gestiftet), Kan\xE4le (wie erreicht das Angebot den Kunden), Kundenbeziehungen (wie wird die Beziehung zum Kunden gestaltet), Erl\xF6squellen (wie verdient das Unternehmen Geld), Schl\xFCsselressourcen (welche Ressourcen sind notwendig), Schl\xFCsselaktivit\xE4ten (welche T\xE4tigkeiten sind zentral), Schl\xFCsselpartnerschaften (wer sind wichtige externe Partner) sowie Kostenstruktur (welche Kosten entstehen). Der gro\xDFe Vorteil gegen\xFCber einem klassischen, seitenlangen Businessplan liegt in der kompakten, ganzheitlichen \xDCbersicht, die es erleichtert, Wechselwirkungen zwischen den Bausteinen zu erkennen und das Gesch\xE4ftsmodell iterativ anzupassen, bevor viel Zeit in Detailplanung investiert wird.",ex:"Ein Gr\xFCnderteam f\xFCr einen nachhaltigen Online-Modeshop f\xFCllt das Canvas aus: Kundensegment sind umweltbewusste 20- bis 35-J\xE4hrige, das Wertangebot ist zertifiziert nachhaltige Mode zu fairen Preisen, Kanal ist ein eigener Online-Shop plus Instagram-Marketing, Erl\xF6squelle ist der direkte Produktverkauf \u2013 durch das Ausf\xFCllen aller neun Felder erkennt das Team fr\xFChzeitig, dass die Schl\xFCsselpartnerschaft mit zertifizierten Textilherstellern der kritischste, noch ungekl\xE4rte Baustein des gesamten Modells ist."},{t:"Gr\xFCndungsfinanzierung (VC, Business Angels)",def:"Wachstumsstarke, technologiebasierte Startups finanzieren sich h\xE4ufig nicht \xFCber klassische Bankkredite (da ihnen meist Sicherheiten und ein belastbarer Track Record fehlen), sondern \xFCber spezialisierte Risikokapitalgeber. Business Angels sind meist selbst erfahrene Unternehmer oder ehemalige Gr\xFCnder, die in der sehr fr\xFChen Phase (Pre-Seed/Seed) mit eigenem privatem Kapital sowie ihrem Netzwerk und Know-how in Startups investieren, typischerweise gegen eine Minderheitsbeteiligung. Venture-Capital-Gesellschaften (VC-Fonds) verwalten dagegen geb\xFCndeltes Kapital institutioneller Investoren und investieren meist in sp\xE4teren, bereits etwas reiferen Finanzierungsrunden (Serie A, B, C) deutlich gr\xF6\xDFere Summen, ebenfalls gegen Unternehmensanteile, mit dem Ziel, das Unternehmen innerhalb weniger Jahre stark zu skalieren und die Beteiligung anschlie\xDFend gewinnbringend zu verkaufen (Exit, z.B. \xFCber einen B\xF6rsengang oder Verkauf an einen strategischen K\xE4ufer). Beide Finanzierungsformen unterscheiden sich fundamental von Fremdkapital: Es entsteht keine R\xFCckzahlungspflicht, daf\xFCr geben die Gr\xFCnder einen Teil der Unternehmensanteile und -kontrolle ab.",ex:"Ein E-Commerce-Startup erh\xE4lt in der Seed-Phase 300.000 \u20AC von zwei Business Angels gegen 15% Unternehmensanteile, um die erste eigene Lagerhalle und ein kleines Team aufzubauen; w\xE4chst der Umsatz daraufhin stark, folgt oft eine deutlich gr\xF6\xDFere Serie-A-Finanzierungsrunde von mehreren Millionen Euro durch einen spezialisierten VC-Fonds, um die Expansion in weitere L\xE4nder zu finanzieren."},{t:"Pitch-Techniken",def:"Ein Pitch ist eine kompakte, \xFCberzeugende Kurzpr\xE4sentation einer Gesch\xE4ftsidee vor potenziellen Investoren, Partnern oder Kunden, deren Ziel es ist, in sehr begrenzter Zeit (oft nur 60\u2013120 Sekunden beim sogenannten Elevator Pitch) Interesse zu wecken und einen Folgetermin oder eine Investitionsentscheidung zu erwirken. Ein \xFCberzeugender Pitch folgt meist einer bew\xE4hrten Struktur: Zun\xE4chst wird das Problem klar und nachvollziehbar geschildert, das ein relevanter Teil des Marktes hat; dann wird die eigene L\xF6sung vorgestellt und ihr Alleinstellungsmerkmal gegen\xFCber bestehenden Alternativen herausgearbeitet; anschlie\xDFend wird die Marktgr\xF6\xDFe und das Gesch\xE4ftsmodell knapp skizziert, um die wirtschaftliche Tragf\xE4higkeit zu belegen; abschlie\xDFend folgt ein konkreter Call-to-Action (z.B. eine gesuchte Investitionssumme oder ein gew\xFCnschter n\xE4chster Schritt). Erfolgreiche Pitches zeichnen sich durch eine klare, jargon-freie Sprache, \xFCberzeugende Kennzahlen sowie souver\xE4nes, selbstbewusstes Auftreten aus, ohne die Risiken der Idee zu verschweigen.",ex:"In einem 90-sek\xFCndigen Elevator Pitch erkl\xE4rt eine Gr\xFCnderin knapp: 'Kleine Modeh\xE4ndler verlieren j\xE4hrlich Millionen durch Retouren, weil Kunden online falsche Gr\xF6\xDFen bestellen. Unser KI-gest\xFCtztes Gr\xF6\xDFenberatungs-Tool reduziert Retourenquoten nachweislich um 30%. Wir suchen 200.000 \u20AC Seed-Kapital, um in den n\xE4chsten 12 Monaten 50 zahlende Kunden zu gewinnen.' \u2013 Problem, L\xF6sung, Beleg und konkreter Call-to-Action in wenigen S\xE4tzen."},{t:"Innovationsmanagement",def:"Innovationsmanagement bezeichnet die systematische, organisierte Steuerung des gesamten Prozesses von der Ideenfindung \xFCber die Bewertung und Auswahl bis zur Markteinf\xFChrung neuer Produkte, Dienstleistungen, Prozesse oder Gesch\xE4ftsmodelle. Man unterscheidet inkrementelle Innovationen (schrittweise Verbesserungen bestehender Angebote, mit geringem Risiko, aber auch begrenztem Differenzierungspotenzial) von radikalen bzw. disruptiven Innovationen (grundlegend neue L\xF6sungsans\xE4tze, die bestehende M\xE4rkte oder Gesch\xE4ftsmodelle fundamental ver\xE4ndern k\xF6nnen, aber mit deutlich h\xF6herem Risiko verbunden sind). Etablierte Unternehmen stehen dabei h\xE4ufig vor dem sogenannten Innovator's Dilemma: Sie optimieren ihr bestehendes, profitables Gesch\xE4ft so gut, dass sie disruptive, zun\xE4chst noch unprofitable Innovationen tendenziell zu sp\xE4t erkennen oder verfolgen. Als organisatorische Antwort etablieren viele Unternehmen dedizierte Innovation Labs oder nutzen offene Innovationsans\xE4tze (Open Innovation), bei denen externe Partner, Kunden oder Startups aktiv in den Innovationsprozess eingebunden werden.",ex:"Ein etabliertes Handelsunternehmen gr\xFCndet ein separates Innovation Lab au\xDFerhalb der bestehenden Konzernstrukturen, um risikofreudiger und mit agileren Methoden neue Checkout-Technologien (z.B. kassenlose In-Store-Bezahlung) zu testen, ohne dass diese Experimente sofort an den Renditeanforderungen des Kerngesch\xE4fts gemessen werden."},{t:"Marktanalyse f\xFCr Startups",def:"Eine fundierte Marktanalyse untersucht systematisch, ob f\xFCr eine Gesch\xE4ftsidee tats\xE4chlich ausreichend zahlungsbereite Nachfrage existiert, bevor gr\xF6\xDFere Ressourcen in die Umsetzung investiert werden. Zentrale Analysedimensionen sind die Marktgr\xF6\xDFe, oft in drei Stufen gegliedert: TAM (Total Addressable Market \u2013 die theoretisch maximale Marktgr\xF6\xDFe bei vollst\xE4ndiger Marktdurchdringung), SAM (Serviceable Available Market \u2013 der mit dem konkreten Gesch\xE4ftsmodell tats\xE4chlich erreichbare Teilmarkt) und SOM (Serviceable Obtainable Market \u2013 der realistisch in den n\xE4chsten Jahren erreichbare Marktanteil). Erg\xE4nzend werden die Wettbewerbslandschaft (direkte und indirekte Konkurrenten, deren St\xE4rken und Schw\xE4chen), die Zielgruppe (demografische und verhaltensbezogene Merkmale, konkrete Bed\xFCrfnisse) sowie Markttrends und regulatorische Rahmenbedingungen analysiert. Validierungsmethoden wie Kundeninterviews, Umfragen, Landingpage-Tests (Messung des Interesses \xFCber Registrierungen, bevor das Produkt \xFCberhaupt existiert) oder ein Minimum Viable Product (MVP) helfen, Annahmen \xFCber die Marktnachfrage mit echten Daten zu \xFCberpr\xFCfen, statt sich allein auf Intuition zu verlassen.",ex:"Ein Startup, das ein Bio-Lebensmittel-Abo plant, schaltet vor der eigentlichen Produktentwicklung eine einfache Landingpage mit Registrierungsformular und bewirbt sie mit einem kleinen Werbebudget; erst als sich innerhalb von zwei Wochen gen\xFCgend Interessenten mit echten E-Mail-Adressen registrieren, gilt die grunds\xE4tzliche Marktnachfrage als validiert und das Team beginnt mit dem Aufbau der eigentlichen Lieferkette."}],quiz:[{q:"Was ist ein Business Model Canvas?",options:["Ein Marketingplan","Ein visuelles 1-Seiten-Tool zur Gesch\xE4ftsmodell-Entwicklung","Ein Buchhaltungsprogramm","Ein Vertragstyp"],correct:1,explain:"Das Business Model Canvas visualisiert alle Kernelemente eines Gesch\xE4ftsmodells auf einer Seite."},{q:"Was ist Venture Capital?",options:["Bankkredit","Risikokapital von Investoren f\xFCr Startups","Staatliche Subvention","Eigenkapital der Gr\xFCnder"],correct:1,explain:"Venture Capital ist Risikokapital, das Investoren in wachstumsstarke Startups investieren."}],cards:[{front:"Business Model Canvas",back:"Strategisches Tool zur Visualisierung aller Kernelemente eines Gesch\xE4ftsmodells."},{front:"Venture Capital",back:"Risikokapital, das Investoren gegen Unternehmensanteile in Startups investieren."},{front:"Business Angel",back:"Privater Investor, der Startups mit Kapital und Know-how unterst\xFCtzt."},{front:"MVP",back:"Minimum Viable Product \u2013 kleinste funktionsf\xE4hige Produktversion zum Testen am Markt."}]},{id:"s4-mmi",code:"MMI EC",name:"MMI und GUI Programmierung",ects:6,sws:"5",exam:"Entwurf (10 S.) \xB7 100%",desc:"Konzeption und Modellierung grafischer Benutzeroberfl\xE4chen; Richtlinien f\xFCr gebrauchstaugliche Software.",topics:[{t:"Mensch-Maschine-Interaktion (MMI) Grundlagen",def:"Die Mensch-Maschine-Interaktion (MMI, international auch Human-Computer Interaction, HCI) ist ein interdisziplin\xE4res Forschungs- und Gestaltungsfeld, das untersucht, wie Menschen technische Systeme wahrnehmen, verstehen und bedienen, mit dem Ziel, Systeme so zu gestalten, dass sie m\xF6glichst intuitiv, effizient und fehlerarm nutzbar sind. Zentrale theoretische Grundlagen stammen aus der Kognitionspsychologie (wie Menschen Informationen wahrnehmen, verarbeiten und im Ged\xE4chtnis behalten), der Ergonomie (physische und kognitive Belastungsgrenzen) sowie der Interaktionsdesign-Theorie. Ein zentrales Konzept ist das mentale Modell: die intuitive, oft unbewusste Vorstellung, die ein Nutzer davon hat, wie ein System funktioniert \u2013 gute Interfaces gestalten die Interaktion so, dass sie mit dem nat\xFCrlichen mentalen Modell der Nutzer \xFCbereinstimmt, statt sie zu zwingen, ein v\xF6llig neues, unnat\xFCrliches Bedienkonzept zu erlernen. Norman's Prinzip der Affordanz beschreibt zudem, wie visuelle Gestaltungselemente selbst signalisieren k\xF6nnen, wie sie zu bedienen sind (z.B. ein Button, der wie ein dr\xFCckbarer physischer Knopf aussieht).",ex:"Die Anordnung von Warenkorb-Icon oben rechts und Suchleiste oben mittig im Shop-Header folgt etablierten MMI-Konventionen, die sich \xFCber Jahre branchen\xFCbergreifend als mentales Modell bei den meisten Internetnutzern eingepr\xE4gt haben \u2013 weicht ein Shop grundlos von dieser Konvention ab, m\xFCssen Nutzer erst umlernen, was Reibung und Frustration erzeugt."},{t:"GUI-Design-Prinzipien",def:"Die Gestaltung grafischer Benutzeroberfl\xE4chen (GUI) folgt etablierten Design-Prinzipien, die die Nutzung intuitiver und fehlertoleranter machen. Konsistenz bedeutet, dass gleiche Elemente im gesamten System gleich aussehen und sich gleich verhalten, damit Nutzer einmal Gelerntes \xFCberall anwenden k\xF6nnen. Die Sichtbarkeit des Systemstatus fordert, dass das System den Nutzer jederzeit klar und zeitnah dar\xFCber informiert, was gerade passiert (z.B. ob eine Aktion erfolgreich war, noch l\xE4dt oder fehlgeschlagen ist), statt ihn im Unklaren zu lassen. Fehlertoleranz bedeutet, Fehleingaben m\xF6glichst zu verhindern (z.B. durch Eingabebeschr\xE4nkungen), leicht erkennbar zu machen und einfach korrigierbar zu gestalten, statt den Nutzer f\xFCr Fehler zu 'bestrafen'. Weitere wichtige Prinzipien sind Nutzerkontrolle und Freiheit (Nutzer sollten Aktionen leicht r\xFCckg\xE4ngig machen k\xF6nnen), Wiedererkennung statt Erinnerung (relevante Informationen sichtbar halten, statt Nutzer zu zwingen, sich Dinge zu merken) sowie eine klare visuelle Hierarchie, die wichtige Elemente hervorhebt.",ex:"Ein mehrstufiger Checkout-Prozess zeigt oben durchgehend einen Fortschrittsbalken mit den Schritten 'Warenkorb \u2192 Adresse \u2192 Zahlung \u2192 Best\xE4tigung', bei dem der aktuell aktive Schritt optisch hervorgehoben ist \u2013 dies erf\xFCllt direkt das Prinzip der Sichtbarkeit des Systemstatus, da der Kunde jederzeit wei\xDF, wo im Prozess er sich befindet und wie viele Schritte noch folgen."},{t:"Usability-Heuristiken",def:"Usability-Heuristiken sind praxiserprobte Faustregeln zur systematischen Bewertung der Gebrauchstauglichkeit einer Benutzeroberfl\xE4che, ohne dass daf\xFCr zwingend aufw\xE4ndige Nutzertests mit echten Probanden n\xF6tig sind. Die bekanntesten Heuristiken stammen von Jakob Nielsen und umfassen zehn Grunds\xE4tze, darunter: Sichtbarkeit des Systemstatus, \xDCbereinstimmung zwischen System und realer Welt (vertraute Sprache und Konzepte statt technischem Fachjargon), Nutzerkontrolle und Freiheit, Konsistenz und Standards, Fehlervermeidung, Wiedererkennung statt Erinnerung, Flexibilit\xE4t und Effizienz (sowohl f\xFCr Anf\xE4nger als auch erfahrene Nutzer geeignet), \xE4sthetisches und minimalistisches Design, Hilfe beim Erkennen und Beheben von Fehlern sowie Hilfe und Dokumentation. Eine sogenannte heuristische Evaluation l\xE4sst dabei mehrere Usability-Experten unabh\xE4ngig voneinander eine Oberfl\xE4che anhand dieser Kriterien systematisch durchgehen und Verst\xF6\xDFe dokumentieren und nach Schweregrad einstufen \u2013 eine schnelle und kosteng\xFCnstige Erg\xE4nzung zu aufw\xE4ndigeren Nutzertests mit echten Endanwendern.",ex:"Ein Usability-Test mit f\xFCnf realen Testpersonen pr\xFCft konkret, ob Nutzer den zentralen 'Jetzt kaufen'-Button auf einer Produktseite ohne Hilfestellung innerhalb weniger Sekunden finden und anklicken \u2013 findet mehr als eine Person den Button nicht sofort, deutet das auf einen Versto\xDF gegen die Heuristik der Sichtbarkeit wichtiger Elemente hin und signalisiert konkreten \xDCberarbeitungsbedarf."},{t:"Wireframing & Prototyping",def:"Wireframes sind bewusst grobe, meist grau- oder schwarz-wei\xDF gehaltene Strukturskizzen einer Benutzeroberfl\xE4che, die sich ausschlie\xDFlich auf Layout, Informationsarchitektur und Platzierung von Elementen konzentrieren, ohne bereits Farben, Schriftarten oder finales visuelles Design festzulegen \u2013 dieser bewusste Verzicht auf Details in fr\xFChen Phasen erlaubt es Teams, sich zun\xE4chst auf grundlegende Struktur- und Funktionsfragen zu konzentrieren, statt sich in Diskussionen \xFCber Farbnuancen zu verlieren. Prototyping geht einen Schritt weiter und macht Interaktionen tats\xE4chlich testbar: Ein Low-Fidelity-Prototyp (z.B. auf Papier) demonstriert grobe Abl\xE4ufe, w\xE4hrend ein High-Fidelity-Prototyp (klickbare digitale Mockups mit Werkzeugen wie Figma) nahezu wie die echte Anwendung wirkt und mit echten Nutzern in Usability-Tests erprobt werden kann, bevor \xFCberhaupt Code geschrieben wird. Dieser iterative Ansatz \u2013 schnell grobe Ideen visualisieren, mit Nutzern testen, Feedback einarbeiten \u2013 reduziert das Risiko, teure Entwicklungszeit in ein Design zu investieren, das sich sp\xE4ter als unbrauchbar erweist.",ex:"Bevor ein einziger Zeile Code f\xFCr eine neue Checkout-Seite geschrieben wird, erstellt das Designteam zun\xE4chst einen groben Wireframe der Seitenstruktur, entwickelt daraus einen klickbaren High-Fidelity-Prototyp in Figma und l\xE4sst zehn Testpersonen den kompletten Bestellvorgang darin durchklicken \u2013 aufgedeckte Verst\xE4ndnisprobleme werden direkt im Prototyp korrigiert, bevor die eigentliche, deutlich teurere technische Entwicklung \xFCberhaupt beginnt."},{t:"Barrierefreiheit",def:"Digitale Barrierefreiheit (Accessibility) stellt sicher, dass Websites, Apps und andere digitale Angebote auch von Menschen mit k\xF6rperlichen, sensorischen oder kognitiven Einschr\xE4nkungen vollst\xE4ndig genutzt werden k\xF6nnen, und ist in vielen L\xE4ndern f\xFCr bestimmte Anbieter mittlerweile auch gesetzlich vorgeschrieben. Der internationale Standard WCAG (Web Content Accessibility Guidelines) definiert konkrete, \xFCberpr\xFCfbare Kriterien entlang vier zentraler Prinzipien: Wahrnehmbarkeit (Inhalte m\xFCssen \xFCber verschiedene Sinne erfassbar sein, z.B. Alt-Texte f\xFCr Bilder, die von Screenreadern vorgelesen werden k\xF6nnen, und ausreichender Farbkontrast f\xFCr sehbeeintr\xE4chtigte Nutzer), Bedienbarkeit (alle Funktionen m\xFCssen auch ausschlie\xDFlich \xFCber Tastatur bedienbar sein, ohne Maus), Verst\xE4ndlichkeit (klare, vorhersehbare Sprache und Navigation) sowie Robustheit (Kompatibilit\xE4t mit unterst\xFCtzenden Technologien wie Screenreadern und Sprachsteuerung). Barrierefreiheit n\xFCtzt dabei nicht nur Menschen mit dauerhaften Einschr\xE4nkungen, sondern verbessert die Nutzbarkeit generell auch situativ (z.B. bei grellem Sonnenlicht auf dem Bildschirm oder wenn beide H\xE4nde anderweitig besch\xE4ftigt sind).",ex:"Ein Online-Shop hinterlegt f\xFCr jedes Produktfoto einen aussagekr\xE4ftigen Alt-Text (z.B. 'Roter Lederrucksack mit silbernen Schnallen, Frontansicht') und stellt sicher, dass alle Texte einen Farbkontrast von mindestens 4,5:1 zum Hintergrund haben \u2013 dadurch k\xF6nnen auch blinde Nutzer mit Screenreader-Software oder sehbehinderte Nutzer mit eingeschr\xE4nktem Kontrastsehen selbstst\xE4ndig und ohne fremde Hilfe einkaufen."}],quiz:[{q:"Wof\xFCr steht GUI?",options:["General User Info","Graphical User Interface","Global Usability Index","Guided User Instruction"],correct:1,explain:"GUI = Graphical User Interface, grafische Benutzeroberfl\xE4che."},{q:"Was ist ein Wireframe?",options:["Ein Netzwerkkabel","Eine grobe strukturelle Skizze einer Benutzeroberfl\xE4che","Ein Datenbankschema","Ein Servertyp"],correct:1,explain:"Wireframes sind einfache, strukturelle Entw\xFCrfe von UI-Layouts vor dem finalen Design."}],cards:[{front:"MMI",back:"Mensch-Maschine-Interaktion \u2013 Erforschung, wie Menschen mit Systemen interagieren."},{front:"Usability",back:"Gebrauchstauglichkeit \u2013 wie effektiv, effizient und zufriedenstellend ein System nutzbar ist."},{front:"Wireframe",back:"Grobe, strukturelle Skizze einer Benutzeroberfl\xE4che ohne visuelles Design."},{front:"Barrierefreiheit",back:"Gestaltung von Software, die auch f\xFCr Menschen mit Einschr\xE4nkungen nutzbar ist."}]},{id:"s4-oscm",code:"OSCM",name:"Operations und Supply Chain Management",ects:6,sws:"4",exam:"Klausur 60 Min. \xB7 100%",desc:"Grundlagen betrieblicher Produktions- und Logistikabl\xE4ufe.",topics:[{t:"Produktionsplanung & -steuerung",def:"Die Produktionsplanung und -steuerung (PPS) plant systematisch, in welcher Menge, zu welchem Zeitpunkt und mit welchen Ressourcen Produkte hergestellt oder beschafft werden m\xFCssen, um die erwartete Nachfrage termingerecht und kosteneffizient zu decken. Die Bedarfsplanung sch\xE4tzt zun\xE4chst die zuk\xFCnftige Nachfrage anhand historischer Verkaufsdaten, saisonaler Muster und Markttrends (Absatzprognose). Die Materialbedarfsplanung (MRP) leitet daraus ab, welche Rohstoffe, Vorprodukte oder fertige Waren in welcher Menge zu welchem Zeitpunkt ben\xF6tigt werden, unter Ber\xFCcksichtigung von Lieferzeiten (Vorlaufzeiten) der Lieferanten. Die Kapazit\xE4tsplanung stellt sicher, dass ausreichend Produktions-, Lager- und Personalkapazit\xE4t f\xFCr den geplanten Bedarf vorhanden ist. Besonders im Handel mit stark saisonalen Produkten (z.B. Weihnachtsartikel, Sommerkleidung) ist eine vorausschauende Planung entscheidend, da die Vorlaufzeiten f\xFCr Produktion und internationalen Transport oft mehrere Monate betragen und eine zu sp\xE4te Bestellung zu Lieferengp\xE4ssen genau zur Hauptverkaufszeit f\xFChren kann.",ex:"Ein Hersteller von Weihnachtsdekoration beginnt die Produktionsplanung f\xFCr die Weihnachtssaison bereits im M\xE4rz: Basierend auf den Verkaufszahlen der Vorjahre und aktuellen Trendindikatoren wird die ben\xF6tigte Menge gesch\xE4tzt, die Produktion in asiatischen Fabriken mit mehrmonatiger Vorlaufzeit beauftragt und der Seetransport so terminiert, dass die Ware bereits im September in den europ\xE4ischen Lagern eintrifft \u2013 rechtzeitig f\xFCr den Verkaufsstart im Oktober."},{t:"Lagerhaltungsstrategien",def:"Lagerhaltungsstrategien balancieren den fundamentalen Zielkonflikt zwischen Lagerkosten (Kapitalbindung, Lagerfl\xE4che, Versicherung, Verderb-/Veralterungsrisiko) und Lieferf\xE4higkeit (die F\xE4higkeit, Kundennachfrage jederzeit sofort zu bedienen, ohne dass Artikel ausverkauft sind). Der Sicherheitsbestand (Sicherheitspuffer) ist eine zus\xE4tzliche Lagermenge \xFCber den erwarteten Bedarf hinaus, die Schwankungen in Nachfrage oder Lieferzeiten abfedert und damit Fehlmengen (Out-of-Stock-Situationen) verhindert \u2013 seine optimale H\xF6he h\xE4ngt von der Nachfrage- und Lieferzeitvariabilit\xE4t sowie dem gew\xFCnschten Servicegrad ab. Die ABC-Analyse klassifiziert das Sortiment nach wirtschaftlicher Bedeutung: A-Artikel (meist ca. 20% der Artikel, aber ca. 80% des Umsatzes gem\xE4\xDF Pareto-Prinzip) erhalten intensive Steuerung und h\xF6here Sicherheitsbest\xE4nde, C-Artikel (viele Artikel mit geringem Einzelumsatzanteil) werden mit vereinfachten, kos
