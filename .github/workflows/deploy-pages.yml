name: Deploy GitHub Pages

on:
  push:
    branches: [main, claude/bau-nach-xoex2e]
  workflow_dispatch:

# Klassische Pages-Veröffentlichung über einen gh-pages-Branch. Umgeht die
# Umgebungs-Branch-Sperre der "GitHub Actions"-Quelle: Der Build wird in den
# Branch gh-pages geschrieben, GitHub Pages liefert diesen Branch aus.
permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # PAGES=1: Manifest-/Icon-Verweise bleiben in der HTML, weil die
      # Dateien mit deployt werden (echte PWA: installierbar + offline).
      - run: PAGES=1 npm run build:single
      - name: Seite vorbereiten
        run: |
          mkdir -p _site
          cp dist-single/index.html _site/index.html
          # 404 = App, damit Deep-Links (Hash-Router) funktionieren
          cp dist-single/index.html _site/404.html
          # PWA-Dateien: Manifest, Icons, Service Worker
          cp public/manifest.webmanifest public/icon.svg public/icon-180.png public/icon-192.png public/icon-512.png _site/
          # Build-Stempel in den SW: jede Veröffentlichung rotiert den Cache
          sed "s/__BUILD__/${GITHUB_SHA::12}/" public/sw.js > _site/sw.js
          # Jekyll-Verarbeitung abschalten
          touch _site/.nojekyll
      - name: In gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
