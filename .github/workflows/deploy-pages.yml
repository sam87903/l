name: Deploy GitHub Pages

on:
  push:
    branches: [main, claude/bau-nach-xoex2e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Einzeldatei-Build: eine in sich geschlossene index.html – funktioniert
      # unter jeder Adresse (auch unter /l/ bei Projekt-Pages), kein Base-Pfad
      # nötig. Die KI-Stimme lädt ihr Modell zur Laufzeit per CDN nach.
      - run: npm run build:single
      - name: Seite vorbereiten
        run: |
          mkdir -p _site
          cp dist-single/index.html _site/index.html
          # 404 auf die App leiten (Deep-Links via Hash-Router bleiben nutzbar)
          cp dist-single/index.html _site/404.html
      # Pages funktioniert nur bei öffentlichem Repo (bzw. GitHub Pro). Bei
      # privatem Repo schlägt dieser Schritt kontrolliert fehl, ohne den
      # Workflow rot zu färben – Tests und Build bleiben strikt.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
