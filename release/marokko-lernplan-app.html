n sowie etwaige Versandkosten informieren – fehlen diese Angaben oder sind sie versteckt/unklar formuliert, drohen Abmahnungen durch Wettbewerber oder Verbraucherschutzverbände.`},{t:`Urheberrecht & Wettbewerbsrecht`,def:`Das Urheberrecht (UrhG) schützt persönliche geistige Schöpfungen wie Texte, Fotos, Grafiken, Musik oder Software vor unerlaubter Vervielfältigung, Verbreitung und öffentlicher Zugänglichmachung durch Dritte – der Schutz entsteht automatisch mit der Schöpfung, ohne dass eine Registrierung nötig ist, und liegt grundsätzlich beim Urheber, sofern keine Nutzungsrechte vertraglich übertragen wurden. Das Wettbewerbsrecht, insbesondere das Gesetz gegen den unlauteren Wettbewerb (UWG), schützt demgegenüber nicht geistiges Eigentum, sondern einen fairen Wettbewerb zwischen Marktteilnehmern und verbietet unlautere Geschäftspraktiken wie irreführende Werbung (unwahre oder zur Täuschung geeignete Angaben über Produkteigenschaften, Preise oder Verfügbarkeit), aggressive Verkaufsmethoden sowie die gezielte Herabsetzung oder Nachahmung von Mitbewerbern. Verstöße gegen beide Rechtsgebiete können sowohl zivilrechtliche Unterlassungs- und Schadensersatzansprüche als auch kostenpflichtige Abmahnungen durch Konkurrenten oder Verbände nach sich ziehen.`,ex:`Übernimmt ein Online-Händler unautorisiert die Produktfotos und Beschreibungstexte eines Konkurrenten für sein eigenes Angebot, verletzt er sowohl das Urheberrecht des ursprünglichen Erstellers (unerlaubte Vervielfältigung) als auch das Wettbewerbsrecht, sofern die Kopie geeignet ist, Kunden über die Herkunft oder Eigenständigkeit des Angebots zu täuschen.`},{t:`TMG (Telemediengesetz)`,def:`Das Telemediengesetz (TMG) regelt rechtliche Rahmenbedingungen für Anbieter von Telemedien – also praktisch alle internetbasierten Dienste wie Websites, Online-Shops, Apps und soziale Netzwerke – und legt insbesondere Informations- und Kennzeichnungspflichten fest. Die bekannteste Regelung ist die Impressumspflicht (§ 5 TMG): Geschäftsmäßige Telemedien-Anbieter müssen leicht erkennbar, unmittelbar erreichbar und ständig verfügbar Angaben zu Namen bzw. Firma, Anschrift, Kontaktmöglichkeit (z.B. E-Mail), Handelsregistereintrag und ggf. Umsatzsteuer-ID bereitstellen. Das TMG regelt zudem Haftungsfragen für Diensteanbieter, etwa in welchem Umfang ein Betreiber für von Nutzern eingestellte Inhalte (z.B. Kundenbewertungen, Foreneinträge) haftet, und unterscheidet dabei zwischen eigenen und fremden Informationen sowie zwischen bloßer Durchleitung, Zwischenspeicherung und Hosting von Inhalten.`,ex:`Jeder deutsche Online-Shop benötigt ein vollständiges, über einen klar mit 'Impressum' beschrifteten Link von jeder Seite aus in maximal zwei Klicks erreichbares Impressum gemäß § 5 TMG – fehlt es oder ist es unvollständig, drohen kostenpflichtige Abmahnungen durch Mitbewerber oder Verbraucherschutzverbände.`},{t:`DSGVO, BDSG & TTDSG`,def:`Die Datenschutz-Grundverordnung (DSGVO) ist eine EU-weit unmittelbar geltende Verordnung, die den Umgang mit personenbezogenen Daten (allen Informationen, die sich auf eine identifizierte oder identifizierbare Person beziehen) einheitlich regelt und auf zentralen Grundsätzen beruht: Rechtmäßigkeit und Transparenz der Verarbeitung, Zweckbindung (Daten dürfen nur für den ursprünglich festgelegten Zweck genutzt werden), Datenminimierung (nur so viele Daten wie nötig erheben) sowie Betroffenenrechte wie Auskunft, Berichtigung, Löschung ('Recht auf Vergessenwerden') und Datenübertragbarkeit. Das Bundesdatenschutzgesetz (BDSG) ergänzt die DSGVO um nationale Konkretisierungen und Öffnungsklauseln, während das Telekommunikation-Telemedien-Datenschutz-Gesetz (TTDSG) speziell Regeln für elektronische Kommunikationsdienste und den Einsatz von Cookies bzw. vergleichbaren Tracking-Technologien festlegt – insbesondere die Pflicht, vor dem Setzen nicht technisch notwendiger Cookies eine informierte, aktive und freiwillige Einwilligung der Nutzer einzuholen (Opt-in statt Opt-out).`,ex:`Ein Online-Shop darf Marketing- und Tracking-Cookies (z.B. für personalisierte Werbung oder Analyse-Tools) erst setzen, nachdem der Nutzer über ein DSGVO- und TTDSG-konformes Cookie-Banner aktiv zugestimmt hat – ein bloßes Weiterscrollen oder ein vorangekreuztes Zustimmungsfeld reicht nach geltender Rechtsprechung nicht als wirksame Einwilligung aus.`}],quiz:[{q:`Wofür steht DSGVO?`,options:[`Datenschutz-Grundverordnung`,`Deutsche Software-Gesetzesordnung`,`Digitale Sicherheits-Grundverordnung`,`Daten-Sende-Genehmigungs-Ordnung`],correct:0,explain:`DSGVO = Datenschutz-Grundverordnung, EU-weites Datenschutzrecht.`},{q:`Was regelt das TMG?`,options:[`Steuerrecht`,`Telemedien / Online-Dienste`,`Arbeitsrecht`,`Erbrecht`],correct:1,explain:`Das Telemediengesetz (TMG) regelt rechtliche Pflichten für Online-Anbieter, z.B. Impressum.`},{q:`Was sind AGB?`,options:[`Allgemeine Geschäftsbedingungen`,`Amtliche Gewerbebescheinigung`,`Allgemeine Gewinnbeteiligung`,`Automatisierte Geschäftsbuchung`],correct:0,explain:`AGB = Allgemeine Geschäftsbedingungen, vom Verkäufer vorformulierte Vertragsbedingungen.`}],cards:[{front:`AGB`,back:`Allgemeine Geschäftsbedingungen – vorformulierte Vertragsbedingungen für viele Kunden.`},{front:`DSGVO`,back:`EU-Datenschutz-Grundverordnung, regelt Umgang mit personenbezogenen Daten.`},{front:`TMG`,back:`Telemediengesetz – regelt Impressumspflicht & Haftung für Online-Dienste.`},{front:`Widerrufsrecht`,back:`Recht des Verbrauchers, einen Online-Kauf innerhalb von 14 Tagen zu widerrufen.`},{front:`Wettbewerbsrecht (UWG)`,back:`Schützt vor unlauteren Geschäftspraktiken wie irreführender Werbung.`}]}]}})),MD,ND=o((()=>{MD={nr:3,title:`Statistik, CRM, Finanzierung & Softwaretechnik`,ects:30,modules:[{id:`s3-stat`,code:`Ang.Stat.`,name:`Angewandte Statistik`,ects:6,sws:`4`,exam:`Klausur 120 Min. · 100%`,desc:`Statistische Methoden zur Datenauswertung – Basis für Marktforschung und Data-Analytics.`,topics:[{t:`Deskriptive Statistik (Mittelwert, Median, Streuung)`,def:`Die deskriptive Statistik fasst große Datenmengen mit wenigen aussagekräftigen Kennzahlen zusammen, ohne bereits auf eine größere Grundgesamtheit zu schließen. Lagemaße beschreiben, wo sich die 'Mitte' der Daten befindet: Der arithmetische Mittelwert (Durchschnitt) summiert alle Werte und teilt durch ihre Anzahl, ist aber empfindlich gegenüber Ausreißern; der Median ist der mittlere Wert einer der Größe nach sortierten Reihe und robuster gegenüber extremen Einzelwerten; der Modus ist der am häufigsten vorkommende Wert. Streuungsmaße beschreiben dagegen, wie stark die Werte um diese Mitte herum variieren: Die Varianz ist die durchschnittliche quadrierte Abweichung vom Mittelwert, die Standardabweichung ist die Wurzel daraus und damit in derselben Einheit wie die Ursprungsdaten interpretierbar, und die Spannweite ist die Differenz zwischen größtem und kleinstem Wert. Eine geringe Streuung zeigt homogene, eine hohe Streuung stark variierende Daten an.`,ex:`Der durchschnittliche Warenkorbwert eines Shops liegt bei 65 € (Mittelwert), doch weil einige wenige Großbestellungen von über 500 € den Durchschnitt nach oben verzerren, liegt der Median – der tatsächlich 'typische' Warenkorb – nur bei 42 €, was bei der Interpretation der Kennzahl entscheidend ist.`},{t:`Wahrscheinlichkeitsrechnung`,def:`Die Wahrscheinlichkeitsrechnung quantifiziert die Chance, dass ein bestimmtes zufälliges Ereignis eintritt, als Zahl zwischen 0 (unmöglich) und 1 (sicher). Grundlegende Konzepte sind der Ereignisraum (die Menge aller möglichen Ausgänge eines Zufallsexperiments), die Additionsregel (die Wahrscheinlichkeit, dass eines von mehreren sich ausschließenden Ereignissen eintritt, ist die Summe ihrer Einzelwahrscheinlichkeiten) und die Multiplikationsregel (die Wahrscheinlichkeit, dass zwei unabhängige Ereignisse beide eintreten, ist das Produkt ihrer Einzelwahrscheinlichkeiten). Die bedingte Wahrscheinlichkeit beschreibt die Wahrscheinlichkeit eines Ereignisses unter der Voraussetzung, dass ein anderes Ereignis bereits eingetreten ist, und ist die Grundlage des Bayes-Theorems, mit dem sich Wahrscheinlichkeiten unter neuer Information systematisch aktualisieren lassen.`,ex:`Aus historischen Daten weiß ein Shop, dass 3% aller Website-Besucher tatsächlich kaufen (unbedingte Kaufwahrscheinlichkeit). Legt ein Besucher jedoch bereits einen Artikel in den Warenkorb, steigt die bedingte Kaufwahrscheinlichkeit auf 35% – dieses Wissen lässt sich nutzen, um Besuchern mit gefülltem Warenkorb gezielt einen Rabatt-Reminder per E-Mail zu senden.`},{t:`Verteilungen (Normal-, Binomialverteilung)`,def:`Eine Wahrscheinlichkeitsverteilung beschreibt, wie sich die Wahrscheinlichkeit über alle möglichen Werte einer Zufallsvariable verteilt. Die Normalverteilung (Gauß-Verteilung) ist die bekannteste stetige Verteilung, symmetrisch glockenförmig um ihren Mittelwert, und beschreibt viele natürliche Phänomene, bei denen sich viele kleine, unabhängige Einflussfaktoren zu einem Gesamtergebnis addieren; sie wird vollständig durch Mittelwert und Standardabweichung charakterisiert, wobei nach der 68-95-99,7-Regel etwa 68% aller Werte innerhalb einer Standardabweichung um den Mittelwert liegen. Die Binomialverteilung ist eine diskrete Verteilung und modelliert die Anzahl der Erfolge bei einer festen Anzahl unabhängiger Ja/Nein-Versuche mit jeweils gleicher Erfolgswahrscheinlichkeit (z.B. wie oft bei 100 Münzwürfen 'Kopf' fällt) und ist die theoretische Grundlage vieler A/B-Test-Auswertungen im E-Commerce, bei denen jeder Website-Besucher entweder konvertiert oder nicht.`,ex:`Die Lieferzeiten eines Versandhändlers folgen annähernd einer Normalverteilung mit Mittelwert 3 Tage und Standardabweichung 0,5 Tage – rund 95% aller Lieferungen kommen demnach zwischen 2 und 4 Tagen an, was der Kundenservice nutzt, um realistische Lieferzeitversprechen zu kommunizieren.`},{t:`Hypothesentests`,def:`Ein Hypothesentest ist ein statistisches Verfahren, um zu prüfen, ob ein in einer Stichprobe beobachteter Unterschied oder Effekt tatsächlich in der Grundgesamtheit existiert oder lediglich zufälliger Stichprobenschwankung geschuldet ist. Man formuliert zunächst eine Nullhypothese (meist: 'es gibt keinen Unterschied/Effekt') und eine Alternativhypothese (der zu beweisende Effekt), berechnet aus den Stichprobendaten eine Teststatistik und daraus den p-Wert – die Wahrscheinlichkeit, ein mindestens so extremes Ergebnis rein zufällig zu beobachten, wenn die Nullhypothese tatsächlich zuträfe. Ist der p-Wert kleiner als ein vorab festgelegtes Signifikanzniveau (üblicherweise 5%), wird die Nullhypothese verworfen und der Effekt gilt als statistisch signifikant. Wichtig ist dabei die Unterscheidung zwischen statistischer Signifikanz (der Effekt ist wahrscheinlich real) und praktischer Relevanz (der Effekt ist auch groß genug, um geschäftlich bedeutsam zu sein) sowie das Bewusstsein für mögliche Fehler erster Art (fälschlich signifikant) und zweiter Art (fälschlich nicht signifikant).`,ex:`Ein A/B-Test vergleicht die Konversionsraten zweier Checkout-Varianten bei jeweils 5.000 Besuchern. Variante B erzielt 4,2% statt 3,8% Konversion. Ein Hypothesentest ergibt einen p-Wert von 0,03 (unter der 5%-Schwelle) – der Unterschied gilt damit als statistisch signifikant, und der Shop kann die Nullhypothese ('kein Unterschied zwischen den Varianten') mit hoher Sicherheit verwerfen.`},{t:`Korrelation & Regression`,def:`Die Korrelation misst die Stärke und Richtung eines linearen Zusammenhangs zwischen zwei numerischen Variablen über den Korrelationskoeffizienten, der zwischen -1 (perfekter negativer Zusammenhang) über 0 (kein linearer Zusammenhang) bis +1 (perfekter positiver Zusammenhang) reicht. Wichtig ist dabei der Grundsatz 'Korrelation impliziert keine Kausalität': Auch stark korrelierte Variablen müssen nicht ursächlich zusammenhängen, sondern können beide von einer dritten, unbeobachteten Variable beeinflusst werden. Die Regressionsanalyse geht einen Schritt weiter und modelliert eine abhängige Zielvariable als (meist lineare) Funktion einer oder mehrerer unabhängiger Einflussvariablen, um daraus konkrete Vorhersagen abzuleiten – die einfache lineare Regression schätzt dabei eine Gerade, deren Steigung angibt, um wie viele Einheiten sich die Zielvariable im Schnitt ändert, wenn die Einflussvariable um eine Einheit steigt, während die multiple Regression mehrere Einflussfaktoren gleichzeitig berücksichtigt.`,ex:`Eine lineare Regression zeigt, dass jeder zusätzlich investierte Euro Werbebudget im Schnitt mit 4,50 € zusätzlichem Wochenumsatz einhergeht (Regressionskoeffizient), mit einem Korrelationskoeffizienten von 0,82 – ein starker positiver Zusammenhang, der jedoch nicht automatisch beweist, dass die Werbung allein ursächlich für den Umsatz verantwortlich ist, da z.B. saisonale Effekte beide Größen gleichzeitig beeinflussen könnten.`}],quiz:[{q:`Was misst die Standardabweichung?`,options:[`Den Mittelwert`,`Die Streuung um den Mittelwert`,`Die Anzahl der Datenpunkte`,`Den Median`],correct:1,explain:`Die Standardabweichung zeigt, wie stark Werte um den Mittelwert streuen.`},{q:`Was zeigt ein Korrelationskoeffizient von +1?`,options:[`Keinen Zusammenhang`,`Perfekten negativen Zusammenhang`,`Perfekten positiven Zusammenhang`,`Zufälligen Zusammenhang`],correct:2,explain:`+1 bedeutet perfekten positiven linearen Zusammenhang zwischen zwei Variablen.`},{q:`Was ist der Median?`,options:[`Der häufigste Wert`,`Der mittlere Wert einer sortierten Reihe`,`Die Summe aller Werte`,`Die größte Zahl`],correct:1,explain:`Der Median teilt eine sortierte Datenreihe in zwei gleich große Hälften.`}],cards:[{front:`Median`,back:`Der mittlere Wert einer der Größe nach sortierten Datenreihe.`},{front:`Standardabweichung`,back:`Maß für die Streuung von Werten um den Mittelwert.`},{front:`Normalverteilung`,back:`Glockenförmige Verteilung, bei der die meisten Werte um den Mittelwert liegen.`},{front:`Korrelation`,back:`Statistisches Maß für den linearen Zusammenhang zweier Variablen (-1 bis +1).`},{front:`Hypothesentest`,back:`Statistisches Verfahren, um eine Annahme über die Grundgesamtheit zu prüfen.`}]},{id:`s3-bwl2`,code:`BWL II`,name:`Bilanz und Erfolgsrechnung`,ects:6,sws:`4`,exam:`Klausur 60 Min. · 100%`,desc:`Vertiefung Rechnungswesen: Bilanzen und Jahresabschluss nach HGB.`,topics:[{t:`Jahresabschluss nach HGB`,def:`Der handelsrechtliche Jahresabschluss ist der jährliche Rechenschaftsbericht eines Unternehmens gegenüber Eigentümern, Gläubigern und der Öffentlichkeit und besteht bei Kapitalgesellschaften mindestens aus Bilanz, Gewinn- und Verlustrechnung (GuV) sowie einem erläuternden Anhang; größere Kapitalgesellschaften müssen zusätzlich einen Lagebericht erstellen, der die wirtschaftliche Lage und Risiken einordnet. Der Aufstellungs-, Prüfungs- und Offenlegungsumfang richtet sich nach der handelsrechtlichen Größenklasse des Unternehmens (klein, mittelgroß, groß gemäß § 267 HGB), die anhand von Bilanzsumme, Umsatzerlösen und Mitarbeiterzahl bestimmt wird – größere Gesellschaften unterliegen strengeren Prüfungs- (Wirtschaftsprüfer) und Offenlegungspflichten. Der Jahresabschluss muss dabei den GoB entsprechen und ein den tatsächlichen Verhältnissen entsprechendes Bild der Vermögens-, Finanz- und Ertragslage vermitteln.`,ex:`Eine mittelgroße GmbH muss ihren geprüften Jahresabschluss jährlich beim Bundesanzeiger einreichen, wo er für jedermann einsehbar offengelegt wird – dies dient dem Gläubigerschutz, da potenzielle Geschäftspartner sich so vor Vertragsabschluss ein Bild von der finanziellen Stabilität des Unternehmens machen können.`},{t:`Bilanzierung & Bewertung`,def:`Bilanzierungs- und Bewertungsvorschriften legen fest, ob ein Vermögensgegenstand oder eine Schuld überhaupt in der Bilanz angesetzt werden darf (Bilanzierungsfähigkeit) und mit welchem Wert er bewertet wird (Bewertungsmaßstab). Der Grundsatz der Bewertung zu Anschaffungs- oder Herstellungskosten begrenzt den Ansatz nach oben: Vermögensgegenstände dürfen höchstens mit ihren tatsächlichen Anschaffungs- bzw. Herstellungskosten (abzüglich Abschreibungen) bilanziert werden, auch wenn ihr aktueller Marktwert gestiegen ist (Anschaffungswertprinzip). Das Vorsichtsprinzip, eine der zentralen GoB, verlangt zusätzlich, drohende Verluste und Risiken bereits zu berücksichtigen, sobald sie erkennbar sind, während Gewinne erst bei tatsächlicher Realisierung ausgewiesen werden dürfen (Realisationsprinzip) – dies führt beim Umlaufvermögen zum sogenannten strengen Niederstwertprinzip: Ist der aktuelle Marktpreis niedriger als die Anschaffungskosten, muss zum niedrigeren Wert bilanziert werden.`,ex:`Ein Warenlager wurde zu Anschaffungskosten von 50.000 € eingekauft. Ist der aktuelle Marktpreis der Ware zum Bilanzstichtag auf 42.000 € gefallen (z.B. wegen Modell-Nachfolgern), muss das Unternehmen nach dem strengen Niederstwertprinzip den niedrigeren Wert von 42.000 € ansetzen und die Differenz als außerplanmäßige Abschreibung verbuchen.`},{t:`Erfolgsrechnung (GuV) im Detail`,def:`Die Gewinn- und Verlustrechnung schlüsselt detailliert auf, wie sich der Jahresüberschuss bzw. -fehlbetrag eines Unternehmens zusammensetzt, indem sie sämtliche Erträge und Aufwendungen einer Periode systematisch gegenüberstellt. Nach dem in Deutschland verbreiteten Gesamtkostenverfahren beginnt die GuV mit den Umsatzerlösen, denen der Reihe nach Materialaufwand (Kosten für Rohstoffe, Waren, bezogene Leistungen), Personalaufwand (Löhne, Gehälter, Sozialabgaben), Abschreibungen und sonstige betriebliche Aufwendungen gegenübergestellt werden, bis das Betriebsergebnis (operatives Ergebnis) erreicht ist. Anschließend werden Finanzerträge und -aufwendungen (Zinsen) sowie außerordentliche und steuerliche Effekte berücksichtigt, um zum finalen Jahresüberschuss zu gelangen. Diese stufenweise Gliederung erlaubt es, gezielt zu analysieren, auf welcher Ebene (operativ, finanziell, außerordentlich) ein Ergebnis maßgeblich beeinflusst wurde.`,ex:`Ein Online-Händler analysiert seine GuV und stellt fest, dass die Versandkosten (Teil der sonstigen betrieblichen Aufwendungen) in den letzten zwei Jahren von 8% auf 13% der Umsatzerlöse gestiegen sind und damit einen wesentlichen Teil des Rückgangs im operativen Ergebnis erklären – eine Erkenntnis, die auf Basis der reinen Jahresüberschusszahl allein nicht sichtbar geworden wäre.`},{t:`Bilanzanalyse & Kennzahlen`,def:`Die Bilanzanalyse wertet die im Jahresabschluss veröffentlichten Zahlen mithilfe standardisierter Kennzahlen aus, um die wirtschaftliche Lage eines Unternehmens einzuschätzen und im Zeit- oder Branchenvergleich einzuordnen. Zentrale Kennzahlenkategorien sind: Kapitalstrukturkennzahlen wie die Eigenkapitalquote (Eigenkapital ÷ Bilanzsumme), die die finanzielle Unabhängigkeit von Fremdkapitalgebern zeigt; Liquiditätskennzahlen wie die Liquidität 1., 2. und 3. Grades, die messen, inwieweit kurzfristige Verbindlichkeiten durch liquide Mittel bzw. kurzfristig verwertbares Umlaufvermögen gedeckt sind; Rentabilitätskennzahlen wie die Eigenkapitalrentabilität (Gewinn ÷ eingesetztes Eigenkapital) oder die Umsatzrentabilität (Gewinn ÷ Umsatz); sowie Effizienzkennzahlen wie der Lagerumschlag, der zeigt, wie oft der durchschnittliche Warenbestand innerhalb eines Jahres verkauft und ersetzt wird. Diese Kennzahlen sollten stets im Kontext der Branche und im Zeitverlauf betrachtet werden, da absolute Werte allein wenig aussagekräftig sind.`,ex:`Eine Eigenkapitalquote von 40% signalisiert eine solide, wenig fremdkapitalabhängige Finanzierungsstruktur, während ein Wert von nur 10% auf eine hohe Verschuldung und damit ein erhöhtes finanzielles Risiko hindeutet, insbesondere wenn zusätzlich die Liquidität 1. Grades unter 100% liegt und kurzfristige Verbindlichkeiten nicht vollständig durch liquide Mittel gedeckt sind.`}],quiz:[{q:`Wonach richtet sich der Jahresabschluss in Deutschland primär?`,options:[`IFRS`,`HGB`,`US-GAAP`,`ISO 9001`],correct:1,explain:`Der handelsrechtliche Jahresabschluss in Deutschland folgt dem HGB.`},{q:`Was zeigt die Eigenkapitalquote?`,options:[`Anteil des Eigenkapitals an der Bilanzsumme`,`Nur den Gewinn`,`Die Mitarbeiterzahl`,`Den Lagerbestand`],correct:0,explain:`Die Eigenkapitalquote = Eigenkapital / Bilanzsumme, zeigt finanzielle Stabilität.`}],cards:[{front:`Jahresabschluss`,back:`Besteht aus Bilanz, GuV und ggf. Anhang – jährlicher Rechenschaftsbericht eines Unternehmens.`},{front:`Eigenkapitalquote`,back:`Kennzahl: Eigenkapital ÷ Bilanzsumme – zeigt finanzielle Unabhängigkeit.`},{front:`Rückstellung`,back:`Passivposten für ungewisse zukünftige Verpflichtungen (z.B. Prozessrisiken).`},{front:`Bilanzanalyse`,back:`Auswertung von Bilanzkennzahlen zur Beurteilung der wirtschaftlichen Lage.`}]},{id:`s3-crm`,code:`CRM`,name:`Customer Relationship Management (CRM) und Web Controlling`,ects:6,sws:`5`,exam:`Seminararbeit (Gruppe, ca. 6 S./Person) · 100%`,desc:`Einführung in CRM im Online-Handel sowie wichtigste Kennzahlen und Instrumente des Web Controllings.`,topics:[{t:`CRM-Grundlagen & Customer Lifecycle`,def:`Customer Relationship Management (CRM) bezeichnet die systematische, meist softwaregestützte Steuerung sämtlicher Phasen der Beziehung zwischen einem Unternehmen und seinen Kunden mit dem Ziel, Kundenwert und -zufriedenheit über die gesamte Beziehungsdauer zu maximieren. Der Customer Lifecycle (Kundenlebenszyklus) gliedert diese Beziehung typischerweise in mehrere Phasen: Akquise (Gewinnung neuer Interessenten und Erstkunden), Onboarding (erste Kauferfahrung, Willkommenskommunikation), Bindung/Entwicklung (Ausbau der Beziehung durch Cross- und Upselling, personalisierte Kommunikation), Loyalität (der Kunde wird zum wiederkehrenden Stammkunden und ggf. Markenbotschafter) sowie potenziell Rückgewinnung (Reaktivierung abgewanderter oder inaktiver Kunden). Ein CRM-System speichert dabei alle Kundeninteraktionen (Käufe, Support-Anfragen, Kommunikation) zentral, um jede Phase gezielt und datenbasiert zu steuern statt auf Vermutungen zu basieren.`,ex:`Ein Online-Shop sendet automatisiert eine Willkommens-E-Mail mit einem kleinen Rabattcode direkt nach dem ersten Kauf (Onboarding-Phase), verschickt drei Monate später eine personalisierte Empfehlung basierend auf dem bisherigen Kaufverhalten (Bindungsphase) und reaktiviert Kunden, die sechs Monate nicht mehr gekauft haben, mit einer gezielten 'Wir vermissen dich'-Kampagne (Rückgewinnungsphase).`},{t:`Kundenbindung & Loyalty-Programme`,def:`Kundenbindungsprogramme (Loyalty-Programme) sind strukturierte Anreizsysteme, die wiederkehrendes Kaufverhalten gezielt belohnen und damit die Wechselbereitschaft von Kunden zu Wettbewerbern senken sollen. Gängige Ausgestaltungsformen sind Punktesysteme (Kunden sammeln für jeden Einkauf Punkte, die später gegen Rabatte oder Prämien eingelöst werden können), Stufenprogramme (Tier-Systeme), bei denen Kunden mit steigendem Umsatz höhere Statusstufen mit exklusiveren Vorteilen erreichen, sowie reine Rabatt- oder Cashback-Modelle. Ökonomisch rechtfertigt sich der Aufwand solcher Programme dadurch, dass die Gewinnung neuer Kunden in der Regel deutlich teurer ist als die Bindung bestehender Kunden, und dass gebundene Kunden tendenziell höhere durchschnittliche Bestellwerte, eine geringere Preissensibilität sowie eine höhere Weiterempfehlungsbereitschaft aufweisen. Der Erfolg eines Loyalty-Programms wird meist über die Wiederkaufrate, den durchschnittlichen Customer Lifetime Value teilnehmender vs. nicht teilnehmender Kunden sowie die Nutzungs-/Einlösequote gemessen.`,ex:`Ein Modehändler betreibt ein dreistufiges Punkteprogramm: Für jeden ausgegebenen Euro erhalten Kunden einen Punkt, ab 500 gesammelten Punkten erreichen sie die Silber-Stufe mit kostenlosem Versand, ab 2.000 Punkten die Gold-Stufe mit exklusivem Zugang zu Sale-Vorverkäufen – dieses gestaffelte System motiviert Kunden zu höheren und häufigeren Käufen, um die nächste Stufe zu erreichen.`},{t:`Web-Controlling-Kennzahlen (KPIs)`,def:`Web-Controlling nutzt quantitative Kennzahlen (Key Performance Indicators, KPIs), um den Erfolg einer Website oder eines Online-Shops objektiv und datenbasiert zu messen, statt sich auf subjektive Einschätzungen zu verlassen. Zentrale KPIs umfassen: die Absprungrate (Bounce Rate) – der Anteil der Besucher, die die Seite verlassen, ohne weiter zu interagieren; die durchschnittliche Verweildauer (Time on Site), die Engagement signalisiert; die Seiten pro Sitzung, die zeigen, wie tief Besucher navigieren; die Conversion Rate, also der Anteil der Besucher, die eine gewünschte Zielaktion (Kauf, Newsletter-Anmeldung) abschließen; sowie Traffic-Quellen-Kennzahlen, die aufschlüsseln, über welche Kanäle (organische Suche, bezahlte Werbung, Social Media, Direktzugriff) Besucher auf die Seite gelangen. Erst die Kombination mehrerer KPIs ergibt ein aussagekräftiges Gesamtbild, da eine einzelne Kennzahl isoliert betrachtet leicht fehlinterpretiert werden kann.`,ex:`Eine ungewöhnlich hohe Absprungrate von 75% speziell auf einer bestimmten Produktseite (im Vergleich zu 40% im Seitendurchschnitt) kann darauf hindeuten, dass die Produktbeschreibung unklar ist, wichtige Informationen (z.B. Größentabelle) fehlen oder die Ladezeit dieser Seite zu lang ist – eine gezielte Analyse dieser einzelnen KPI-Abweichung liefert konkrete Ansatzpunkte zur Optimierung.`},{t:`Conversion-Rate-Optimierung`,def:`Conversion-Rate-Optimierung (CRO) bezeichnet den systematischen, datengetriebenen Prozess, den Anteil der Website-Besucher zu erhöhen, die eine definierte Zielaktion abschließen – meist einen Kauf, aber auch Newsletter-Anmeldungen oder Kontaktanfragen. Der CRO-Prozess folgt typischerweise einem iterativen Zyklus: Zunächst werden anhand von Web-Analytics-Daten und Nutzerverhaltensanalysen (z.B. Heatmaps, Session-Recordings) Schwachstellen oder Reibungspunkte im Nutzerpfad identifiziert; darauf basierend werden Hypothesen formuliert (z.B. 'ein prominenterer Call-to-Action-Button erhöht die Klickrate'); anschließend wird die Hypothese über einen kontrollierten A/B-Test empirisch geprüft, bei dem ein Teil der Besucher zufällig die bisherige Version (Kontrollgruppe) und der andere Teil die neue Variante (Testgruppe) sieht; abschließend wird die Variante mit der statistisch signifikant besseren Performance dauerhaft übernommen. Häufige CRO-Hebel sind die Vereinfachung des Checkout-Prozesses, die Reduktion der Formularfelder, das Hinzufügen von Vertrauenssignalen (Kundenbewertungen, Sicherheitssiegel) und eine klarere Preis-/Versandkosten-Kommunikation.`,ex:`Ein Online-Shop testet zwei Checkout-Varianten: die bisherige mit fünf Formularschritten und eine neue, verkürzte Variante mit nur zwei Schritten. Nach 10.000 Besuchern je Variante zeigt die verkürzte Variante eine Abschlussrate von 4,8% gegenüber 3,9% bei der bisherigen Version – ein statistisch signifikanter Unterschied, woraufhin der Shop die verkürzte Variante dauerhaft übernimmt.`},{t:`Google Analytics Grundlagen`,def:`Google Analytics ist eines der weltweit meistgenutzten Web-Analyse-Werkzeuge und erfasst automatisiert Website-Traffic, Nutzerverhalten und Conversion-Pfade, indem ein Tracking-Code auf jeder Seite eines Shops Ereignisse (Seitenaufrufe, Klicks, Käufe) an Google übermittelt. Zentrale Berichtskategorien sind: Akquisitionsberichte, die zeigen, über welche Kanäle Besucher auf die Website gelangen (organische Suche, bezahlte Anzeigen, Social Media, Direktzugriff, Verweise von anderen Seiten); Verhaltensberichte, die zeigen, welche Seiten wie oft und wie lange besucht werden und wo Nutzer die Seite verlassen; sowie Conversion-/E-Commerce-Berichte, die Käufe, Umsätze und den gesamten Kaufpfad bis zum Abschluss nachvollziehen. Über sogenannte Zielvorhaben (Goals) und Trichter-Analysen (Funnel-Analysen) lässt sich zudem exakt identifizieren, an welcher konkreten Stelle im Kaufprozess Besucher überproportional häufig abspringen, bevor sie den Kauf abschließen.`,ex:`Über Google Analytics erkennt ein Modehändler, dass 45% aller zahlenden Kunden über organische Instagram-Verweise und Influencer-Links auf die Seite gelangen, während bezahlte Google-Ads-Anzeigen zwar viel Traffic, aber eine deutlich niedrigere Conversion Rate liefern – eine Erkenntnis, die den Händler dazu bewegt, das Marketingbudget stärker in Richtung Social-Media-Kooperationen zu verschieben.`}],quiz:[{q:`Was misst die Conversion Rate?`,options:[`Anzahl der Website-Besucher`,`Anteil der Besucher, die kaufen`,`Ladezeit der Website`,`Anzahl der Produkte im Shop`],correct:1,explain:`Conversion Rate = Anteil der Besucher, die eine gewünschte Aktion (z.B. Kauf) ausführen.`},{q:`Was ist der Customer Lifetime Value (CLV)?`,options:[`Alter des Kunden`,`Erwarteter Gesamtumsatz eines Kunden über die Kundenbeziehung`,`Anzahl der Klicks`,`Retourenquote`],correct:1,explain:`CLV schätzt den gesamten Wert eines Kunden über die gesamte Geschäftsbeziehung.`},{q:`Was ist eine typische CRM-Maßnahme?`,options:[`Personalisierte E-Mail-Kampagnen`,`Serverwartung`,`Buchhaltung`,`Produktionsplanung`],correct:0,explain:`Personalisierte Kommunikation ist ein zentrales CRM-Instrument zur Kundenbindung.`}],cards:[{front:`CRM`,back:`Customer Relationship Management – systematische Gestaltung der Kundenbeziehungen.`},{front:`Conversion Rate`,back:`Prozentsatz der Besucher, die eine gewünschte Aktion (z.B. Kauf) abschließen.`},{front:`Customer Lifetime Value`,back:`Erwarteter Gesamtumsatz/-gewinn eines Kunden über die gesamte Geschäftsbeziehung.`},{front:`Web Controlling`,back:`Systematische Analyse von Website-Kennzahlen zur Erfolgssteuerung.`},{front:`Churn Rate`,back:`Kennzahl für die Kundenabwanderungsrate in einem Zeitraum.`}]},{id:`s3-bwl6`,code:`BWL VI`,name:`Investition und Finanzierung`,ects:6,sws:`4`,exam:`Klausur 60 Min. · 100%`,desc:`Investitionsverfahren, Finanzierungsformen und Finanzmanagement.`,topics:[{t:`Statische Investitionsrechnung`,def:`Statische Investitionsrechnungsverfahren bewerten die Vorteilhaftigkeit einer Investition anhand einer einzigen, meist durchschnittlichen Rechnungsperiode und berücksichtigen dabei bewusst nicht, dass Geld zu unterschiedlichen Zeitpunkten unterschiedlich viel wert ist (Zeitwert des Geldes) – sie sind dafür einfach und schnell anzuwenden, liefern aber bei langfristigen oder stark schwankenden Zahlungsströmen nur eine grobe Näherung. Die Kostenvergleichsrechnung vergleicht die durchschnittlichen jährlichen Kosten mehrerer Investitionsalternativen. Die Gewinnvergleichsrechnung erweitert dies um die erwarteten Erlöse. Die Rentabilitätsrechnung setzt den durchschnittlichen Gewinn ins Verhältnis zum eingesetzten Kapital. Die Amortisationsrechnung (Payback-Methode) schließlich berechnet, nach welcher Zeitspanne die anfänglichen Anschaffungskosten einer Investition durch die daraus resultierenden Rückflüsse (Einzahlungsüberschüsse) wieder vollständig hereingeholt wurden – je kürzer die Amortisationsdauer, desto geringer gilt das Investitionsrisiko.`,ex:`Ein neues automatisiertes Lagersystem kostet in der Anschaffung 200.000 € und spart durch geringeren Personalbedarf jährlich 50.000 € an Kosten. Die Amortisationsrechnung zeigt: 200.000 € ÷ 50.000 €/Jahr = 4 Jahre, bis sich die Investition durch die Einsparungen amortisiert hat – ein Wert, den das Management mit der geplanten Nutzungsdauer der Anlage von z.B. 10 Jahren vergleicht, um die Investition zu bewerten.`},{t:`Dynamische Verfahren (Kapitalwertmethode)`,def:`Dynamische Investitionsrechnungsverfahren berücksichtigen im Gegensatz zu statischen Verfahren explizit den Zeitwert des Geldes: Ein Euro, der heute zur Verfügung steht, ist mehr wert als ein Euro, der erst in fünf Jahren zufließt, weil er zwischenzeitlich angelegt und verzinst werden könnte. Die Kapitalwertmethode (Net Present Value, NPV) ist das wichtigste dynamische Verfahren: Sie diskontiert (rechnet zurück) alle zukünftigen, mit der Investition verbundenen Ein- und Auszahlungen mithilfe eines Kalkulationszinssatzes (der die geforderte Mindestverzinsung bzw. die Kapitalkosten widerspiegelt) auf ihren heutigen Wert (Barwert) und summiert diese Barwerte abzüglich der anfänglichen Investitionsauszahlung. Ist der resultierende Kapitalwert positiv, gilt die Investition als wirtschaftlich vorteilhaft, da sie mehr Wert schafft, als die geforderte Mindestverzinsung erfordert; bei mehreren sich ausschließenden Alternativen wird üblicherweise diejenige mit dem höchsten positiven Kapitalwert gewählt. Verwandte dynamische Verfahren sind die interne Zinsfußmethode (der Zinssatz, bei dem der Kapitalwert genau null wird) und die Annuitätenmethode.`,ex:`Ein Unternehmen plant eine neue Fulfillment-Anlage mit 500.000 € Anschaffungskosten, die über 5 Jahre jährliche Einzahlungsüberschüsse von 130.000 € erwirtschaften soll. Bei einem Kalkulationszinssatz von 8% ergibt die Diskontierung dieser Zahlungsströme einen positiven Kapitalwert von rund 19.000 € – die Investition gilt damit als wirtschaftlich vorteilhaft, da sie die geforderte 8%-Mindestverzinsung übertrifft.`},{t:`Eigen- vs. Fremdfinanzierung`,def:`Die Finanzierungsentscheidung eines Unternehmens betrifft grundlegend die Frage, woher das für Investitionen benötigte Kapital stammt. Eigenfinanzierung stammt von den Eigentümern des Unternehmens – etwa durch Einlagen der Gründer, Kapitalerhöhungen bestehender oder neuer Gesellschafter, oder durch die Selbstfinanzierung aus einbehaltenen (thesaurierten) Gewinnen – und begründet keinen festen Rückzahlungsanspruch, dafür aber Mitspracherechte und eine Beteiligung am Gewinn (und Verlust). Fremdfinanzierung stammt dagegen von externen Gläubigern wie Banken (Kredite), Anleihegläubigern oder Lieferanten (Lieferantenkredit) und begründet einen festen, vertraglich fixierten Rückzahlungs- und Zinsanspruch unabhängig vom Geschäftserfolg, gewährt den Gläubigern aber in der Regel keine Mitspracherechte. Der sogenannte Leverage-Effekt (Hebelwirkung) beschreibt, dass Fremdkapital die Eigenkapitalrendite steigern kann, solange die Gesamtkapitalrendite über dem Fremdkapitalzinssatz liegt – gleichzeitig erhöht ein hoher Fremdkapitalanteil aber auch das finanzielle Risiko, da Zins- und Tilgungszahlungen unabhängig von der Geschäftslage geleistet werden müssen.`,ex:`Ein Startup finanziert den Bau einer neuen Lagerhalle im Wert von 1 Mio. € zu 40% aus Eigenkapital (Einlagen der Gründer und eines Investors) und zu 60% über einen Bankkredit (Fremdkapital) – dieser Finanzierungsmix nutzt den Leverage-Effekt zur Steigerung der Eigenkapitalrendite, birgt aber gleichzeitig das Risiko, dass die monatlichen Kreditraten auch in einem schwachen Geschäftsjahr bedient werden müssen.`},{t:`Finanzierungsformen (Kredit, Leasing, Factoring)`,def:`Neben der klassischen Kreditfinanzierung (ein Kreditinstitut stellt einen Geldbetrag gegen Zins- und Tilgungszahlungen zur Verfügung) existieren im Unternehmensalltag mehrere spezialisierte Finanzierungsinstrumente. Leasing ist eine zeitlich befristete Nutzungsüberlassung eines Wirtschaftsguts (z.B. Fahrzeuge, Maschinen, IT-Ausstattung) gegen regelmäßige Leasingraten, ohne dass das rechtliche Eigentum auf den Nutzer übergeht – dies schont die Liquidität, da keine hohe Einmalzahlung nötig ist, und verlagert oft Instandhaltungsrisiken auf den Leasinggeber. Factoring bezeichnet den Verkauf offener Kundenforderungen (Rechnungen mit Zahlungsziel) an eine spezialisierte Factoring-Gesellschaft, die dem Unternehmen sofort einen Großteil des Rechnungsbetrags auszahlt (abzüglich einer Gebühr) und dadurch sofortige Liquidität schafft, während das Ausfallrisiko und der Verwaltungsaufwand für das Forderungsmanagement auf die Factoring-Gesellschaft übergehen (beim echten Factoring). Diese Instrumente sind besonders für wachstumsstarke, aber liquiditätsknappe Unternehmen attraktiv, da sie Kapitalbindung reduzieren, ohne dafür klassische Kredite mit strengen Sicherheitenanforderungen aufnehmen zu müssen.`,ex:`Ein Online-Händler mit 30 Tagen Zahlungsziel gegenüber seinen Geschäftskunden verkauft seine offenen Forderungen über 100.000 € an eine Factoring-Gesellschaft und erhält dafür sofort 95.000 € ausgezahlt (5% Factoring-Gebühr) – dadurch steht ihm die Liquidität sofort zur Verfügung, um z.B. pünktlich Löhne zu zahlen, statt 30 Tage auf den Zahlungseingang seiner Kunden warten zu müssen.`}],quiz:[{q:`Was berechnet die Kapitalwertmethode?`,options:[`Den Barwert aller Zahlungsströme einer Investition`,`Nur den Kaufpreis`,`Die Steuerlast`,`Den Personalbedarf`],correct:0,explain:`Der Kapitalwert (NPV) diskontiert alle zukünftigen Zahlungen auf den heutigen Wert.`},{q:`Was ist Leasing?`,options:[`Kauf auf Raten`,`Miete von Wirtschaftsgütern gegen Gebühr`,`Eine Aktienart`,`Ein Steuervorteil`],correct:1,explain:`Leasing = zeitlich befristete Nutzungsüberlassung von Gütern gegen Zahlung.`}],cards:[{front:`Kapitalwertmethode`,back:`Dynamisches Investitionsverfahren, das alle Zahlungsströme abzinst und summiert (NPV).`},{front:`Amortisationsrechnung`,back:`Statisches Verfahren, das die Zeit bis zur Rückgewinnung des eingesetzten Kapitals berechnet.`},{front:`Leasing`,back:`Zeitlich befristete Nutzungsüberlassung von Wirtschaftsgütern gegen Zahlung.`},{front:`Factoring`,back:`Verkauf von Forderungen an ein Finanzinstitut zur sofortigen Liquiditätsbeschaffung.`}]},{id:`s3-swt`,code:`SWT EC`,name:`Softwaretechnik`,ects:6,sws:`5`,exam:`Klausur 90 Min. · 100% + Praktikum (Pflicht, unbenotet)`,desc:`Einführung in die Softwaretechnik: Requirements Engineering, UML, Entwurfsmuster, Vorgehensmodelle.`,topics:[{t:`Requirements Engineering`,def:`Requirements Engineering (Anforderungsmanagement) ist die systematische Disziplin, mit der Anforderungen an ein Softwaresystem ermittelt (Elicitation), dokumentiert, analysiert, priorisiert, abgestimmt und über den gesamten Projektverlauf hinweg verwaltet werden, bevor bzw. während Software entwickelt wird. Man unterscheidet funktionale Anforderungen (was das System konkret tun soll, z.B. 'Nutzer können Artikel in den Warenkorb legen') von nicht-funktionalen Anforderungen (Qualitätseigenschaften wie Performance, Sicherheit, Benutzerfreundlichkeit oder Skalierbarkeit). Typische Techniken zur Anforderungsermittlung sind Interviews mit Stakeholdern, Workshops, Beobachtung bestehender Arbeitsabläufe sowie das Verfassen von User Stories (kurze, aus Nutzersicht formulierte Anforderungsbeschreibungen nach dem Schema 'Als [Rolle] möchte ich [Ziel], um [Nutzen] zu erreichen') und Use Cases (detailliertere Beschreibungen von Interaktionsabläufen zwischen Nutzer und System). Mangelhaftes Requirements Engineering gilt als eine der Hauptursachen für gescheiterte oder budgetüberziehende Softwareprojekte, weil Fehlverständnisse erst spät und damit besonders teuer korrigiert werden können.`,ex:`Vor der Entwicklung eines neuen Warenkorb-Features formuliert das Entwicklungsteam gemeinsam mit dem Produktmanagement User Stories wie 'Als Kundin möchte ich Artikel im Warenkorb speichern können, auch nachdem ich mich ausgeloggt habe, damit ich meinen Einkauf später fortsetzen kann' – diese konkrete, aus Nutzersicht formulierte Anforderung lässt sich anschließend in klar testbare technische Akzeptanzkriterien übersetzen.`},{t:`UML-Diagramme (Klassen, Sequenz, Use-Case)`,def:`UML (Unified Modeling Language) ist der internationale Standard zur grafischen Modellierung von Softwaresystemen und stellt verschiedene Diagrammtypen für unterschiedliche Perspektiven bereit. Klassendiagramme gehören zu den Strukturdiagrammen und zeigen die statische Architektur eines Systems: Klassen mit ihren Attributen und Methoden sowie die Beziehungen zwischen ihnen (Assoziation, Vererbung, Aggregation, Komposition). Sequenzdiagramme gehören zu den Verhaltensdiagrammen und zeigen den zeitlichen Ablauf von Nachrichtenaustausch zwischen mehreren Objekten oder Systemkomponenten – wer ruft wann welche Methode bei wem auf. Use-Case-Diagramme visualisieren aus einer höheren, fachlichen Flughöhe, welche Akteure (Nutzer oder externe Systeme) welche Funktionalitäten (Anwendungsfälle) eines Systems nutzen, ohne technische Details der Umsetzung zu zeigen. Zusammen ergeben diese komplementären Diagrammtypen ein vollständigeres Bild eines Softwaresystems als jeder einzelne Diagrammtyp für sich.`,ex:`Ein Sequenzdiagramm für den Checkout-Prozess zeigt exakt die zeitliche Reihenfolge der Nachrichten: Kunde sendet Kaufanfrage an Shop-System → Shop-System fragt Zahlungsstatus beim Zahlungsdienstleister an → Zahlungsdienstleister bestätigt die Zahlung → Shop-System löst Versandauftrag beim Lagersystem aus – dieses Diagramm macht auf einen Blick sichtbar, welche Systeme in welcher Reihenfolge miteinander kommunizieren müssen.`},{t:`Entwurfsmuster (Design Patterns)`,def:`Entwurfsmuster (Design Patterns) sind bewährte, in der Softwareentwicklungspraxis wiederholt erprobte und dokumentierte Lösungsschablonen für wiederkehrende, strukturell ähnliche Entwurfsprobleme – sie sind kein fertiger Code, sondern eine allgemeine, übertragbare Vorlage, die auf das konkrete Problem angepasst wird. Die 1994 vom sogenannten 'Gang of Four' veröffentlichten klassischen Design Patterns werden traditionell in drei Kategorien eingeteilt: Erzeugungsmuster (Creational Patterns) regeln, wie Objekte erzeugt werden (z.B. das Singleton-Pattern, das sicherstellt, dass von einer Klasse zur Laufzeit nur genau eine Instanz existiert); Strukturmuster (Structural Patterns) regeln, wie Klassen und Objekte zu größeren Strukturen zusammengesetzt werden (z.B. das Adapter-Pattern, das inkompatible Schnittstellen kompatibel macht); Verhaltensmuster (Behavioral Patterns) regeln, wie Objekte miteinander kommunizieren und Verantwortlichkeiten verteilen (z.B. das Observer-Pattern, bei dem mehrere Objekte automatisch über Zustandsänderungen eines anderen Objekts benachrichtigt werden). Design Patterns fördern Wiederverwendbarkeit, verbessern die Verständlichkeit im Team (durch gemeinsames Vokabular) und vermeiden häufige Entwurfsfehler.`,ex:`Das Singleton-Pattern wird eingesetzt, um sicherzustellen, dass pro Nutzersitzung genau ein Warenkorb-Objekt existiert, unabhängig davon, von wie vielen unterschiedlichen Stellen im Code auf den Warenkorb zugegriffen wird – ohne dieses Muster könnten versehentlich mehrere, widersprüchliche Warenkorb-Instanzen entstehen.`},{t:`Testverfahren & Qualitätssicherung`,def:`Softwaretests stellen systematisch sicher, dass ein Softwaresystem die spezifizierten Anforderungen korrekt erfüllt, und werden üblicherweise in einer aufsteigenden Teststufen-Pyramide organisiert. Unit-Tests (Komponententests) prüfen die kleinste isolierte Code-Einheit – meist eine einzelne Methode oder Funktion – automatisiert und unabhängig von anderen Systemteilen und bilden die breite Basis der Testpyramide, da sie schnell, zahlreich und günstig auszuführen sind. Integrationstests prüfen darauf aufbauend das korrekte Zusammenspiel mehrerer bereits einzeln getesteter Komponenten (z.B. ob das Bestellsystem korrekt mit dem Zahlungsdienstleister kommuniziert). Systemtests prüfen das gesamte, vollständig integrierte System gegen die fachlichen Anforderungen, häufig aus Nutzersicht. Abnahmetests schließlich werden vom Auftraggeber oder Endnutzer selbst durchgeführt, um die Freigabe für den produktiven Einsatz zu erteilen. Automatisierte Tests, die bei jeder Codeänderung automatisch erneut ausgeführt werden (Regressionstests), sind heute Standard, um sicherzustellen, dass neue Änderungen keine bestehende Funktionalität versehentlich brechen.`,ex:`Ein automatisierter Unit-Test prüft isoliert, ob die Rabattberechnungsfunktion bei Eingabe des Gutscheincodes 'SOMMER10' korrekt 10% vom Warenkorbwert abzieht, bei einem ungültigen Code aber keinen Rabatt gewährt und keine Fehlermeldung im System auslöst – dieser Test läuft bei jeder Codeänderung automatisch mit, um sicherzustellen, dass die Rabattlogik durch spätere Anpassungen nicht versehentlich beschädigt wird.`},{t:`Vorgehensmodelle (Wasserfall, Scrum)`,def:`Vorgehensmodelle strukturieren, in welcher Reihenfolge und mit welcher Organisationsform die Phasen eines Softwareentwicklungsprojekts (Anforderungsanalyse, Design, Implementierung, Test, Betrieb) durchlaufen werden. Das klassische Wasserfallmodell ist linear-sequenziell: Jede Phase wird vollständig abgeschlossen, bevor die nächste beginnt, was eine klare Planbarkeit und Dokumentation ermöglicht, aber wenig Flexibilität bei sich ändernden Anforderungen bietet und Fehler oft erst spät im Projekt sichtbar macht. Agile Vorgehensmodelle wie Scrum durchbrechen diese starre Linearität zugunsten kurzer, iterativer Entwicklungszyklen (Sprints, meist 1–4 Wochen), an deren Ende jeweils ein potenziell auslieferbares Produktinkrement steht; zentrale Scrum-Rollen sind der Product Owner (verantwortet die fachlichen Prioritäten im Product Backlog), das Entwicklungsteam und der Scrum Master (moderiert den Prozess und beseitigt Hindernisse), während tägliche kurze Abstimmungen (Daily Standups) und regelmäßige Rückblicke (Sprint Reviews, Retrospektiven) für kontinuierliche Anpassung sorgen. Agile Modelle eignen sich besonders gut für Projekte mit unklaren oder sich häufig ändernden Anforderungen, wie es im schnelllebigen E-Commerce-Umfeld typisch ist.`,ex:`Ein E-Commerce-Entwicklungsteam plant seine Arbeit in zweiwöchigen Scrum-Sprints: Zu Sprint-Beginn wählt das Team gemeinsam mit dem Product Owner priorisierte Einträge aus dem Product Backlog aus (z.B. 'Wunschliste-Feature entwickeln'), führt täglich ein 15-minütiges Daily Standup durch, um Fortschritt und Hindernisse zu besprechen, und liefert am Sprint-Ende ein fertig getestetes, potenziell direkt einsetzbares Feature aus – im Gegensatz zum starren Wasserfallmodell kann das Team so flexibel auf neue Erkenntnisse oder veränderte Kundenwünsche reagieren.`}],quiz:[{q:`Wofür steht UML?`,options:[`Unified Modeling Language`,`Universal Machine Learning`,`User Management Layer`,`Unit Model Logic`],correct:0,explain:`UML = Unified Modeling Language, Standard-Notation für Softwaremodellierung.`},{q:`Was ist ein Entwurfsmuster (Design Pattern)?`,options:[`Ein fertiges Programm`,`Eine wiederverwendbare Lösung für ein wiederkehrendes Entwurfsproblem`,`Ein Datenbankschema`,`Ein Testverfahren`],correct:1,explain:`Design Patterns sind bewährte, wiederverwendbare Lösungsschablonen für Software-Probleme.`},{q:`Welches Vorgehensmodell ist iterativ und agil?`,options:[`Wasserfallmodell`,`Scrum`,`V-Modell`,`Spiralmodell (klassisch)`],correct:1,explain:`Scrum ist ein agiles, iteratives Vorgehensmodell mit kurzen Sprints.`}],cards:[{front:`Requirements Engineering`,back:`Systematisches Ermitteln, Dokumentieren und Verwalten von Anforderungen an Software.`},{front:`UML-Klassendiagramm`,back:`Zeigt Klassen, Attribute, Methoden und Beziehungen in einem Softwaresystem.`},{front:`Design Pattern`,back:`Bewährte, wiederverwendbare Lösung für ein wiederkehrendes Entwurfsproblem.`},{front:`Scrum`,back:`Agiles Vorgehensmodell mit iterativen Sprints, Product Owner und Daily Standups.`},{front:`Unit Test`,back:`Automatisierter Test einer einzelnen, isolierten Code-Einheit (z.B. Methode).`}]}]}})),PD,FD=o((()=>{PD={nr:4,title:`Entrepreneurship, UX, Operations & Webtechnologien`,ects:30,modules:[{id:`s4-ent`,code:`ENT`,name:`Entrepreneurship`,ects:6,sws:`4`,exam:`Schriftl. Ausarbeitung (15 S.) · 75% + Vortrag 10 Min. · 25%`,desc:`Technologiebasierte Unternehmensgründungen und Innovationen.`,topics:[{t:`Business Model Canvas`,def:`Das Business Model Canvas, entwickelt von Alexander Osterwalder, ist ein strategisches Visualisierungswerkzeug, das die neun zentralen Bausteine eines Geschäftsmodells auf einer einzigen, übersichtlichen Seite darstellt und damit die gemeinsame Diskussion und iterative Weiterentwicklung einer Geschäftsidee im Team erleichtert. Die neun Bausteine sind: Kundensegmente (für wen wird Wert geschaffen), Wertangebote (welches Problem wird gelöst bzw. welcher Nutzen gestiftet), Kanäle (wie erreicht das Angebot den Kunden), Kundenbeziehungen (wie wird die Beziehung zum Kunden gestaltet), Erlösquellen (wie verdient das Unternehmen Geld), Schlüsselressourcen (welche Ressourcen sind notwendig), Schlüsselaktivitäten (welche Tätigkeiten sind zentral), Schlüsselpartnerschaften (wer sind wichtige externe Partner) sowie Kostenstruktur (welche Kosten entstehen). Der große Vorteil gegenüber einem klassischen, seitenlangen Businessplan liegt in der kompakten, ganzheitlichen Übersicht, die es erleichtert, Wechselwirkungen zwischen den Bausteinen zu erkennen und das Geschäftsmodell iterativ anzupassen, bevor viel Zeit in Detailplanung investiert wird.`,ex:`Ein Gründerteam für einen nachhaltigen Online-Modeshop füllt das Canvas aus: Kundensegment sind umweltbewusste 20- bis 35-Jährige, das Wertangebot ist zertifiziert nachhaltige Mode zu fairen Preisen, Kanal ist ein eigener Online-Shop plus Instagram-Marketing, Erlösquelle ist der direkte Produktverkauf – durch das Ausfüllen aller neun Felder erkennt das Team frühzeitig, dass die Schlüsselpartnerschaft mit zertifizierten Textilherstellern der kritischste, noch ungeklärte Baustein des gesamten Modells ist.`},{t:`Gründungsfinanzierung (VC, Business Angels)`,def:`Wachstumsstarke, technologiebasierte Startups finanzieren sich häufig nicht über klassische Bankkredite (da ihnen meist Sicherheiten und ein belastbarer Track Record fehlen), sondern über spezialisierte Risikokapitalgeber. Business Angels sind meist selbst erfahrene Unternehmer oder ehemalige Gründer, die in der sehr frühen Phase (Pre-Seed/Seed) mit eigenem privatem Kapital sowie ihrem Netzwerk und Know-how in Startups investieren, typischerweise gegen eine Minderheitsbeteiligung. Venture-Capital-Gesellschaften (VC-Fonds) verwalten dagegen gebündeltes Kapital institutioneller Investoren und investieren meist in späteren, bereits etwas reiferen Finanzierungsrunden (Serie A, B, C) deutlich größere Summen, ebenfalls gegen Unternehmensanteile, mit dem Ziel, das Unternehmen innerhalb weniger Jahre stark zu skalieren und die Beteiligung anschließend gewinnbringend zu verkaufen (Exit, z.B. über einen Börsengang oder Verkauf an einen strategischen Käufer). Beide Finanzierungsformen unterscheiden sich fundamental von Fremdkapital: Es entsteht keine Rückzahlungspflicht, dafür geben die Gründer einen Teil der Unternehmensanteile und -kontrolle ab.`,ex:`Ein E-Commerce-Startup erhält in der Seed-Phase 300.000 € von zwei Business Angels gegen 15% Unternehmensanteile, um die erste eigene Lagerhalle und ein kleines Team aufzubauen; wächst der Umsatz daraufhin stark, folgt oft eine deutlich größere Serie-A-Finanzierungsrunde von mehreren Millionen Euro durch einen spezialisierten VC-Fonds, um die Expansion in weitere Länder zu finanzieren.`},{t:`Pitch-Techniken`,def:`Ein Pitch ist eine kompakte, überzeugende Kurzpräsentation einer Geschäftsidee vor potenziellen Investoren, Partnern oder Kunden, deren Ziel es ist, in sehr begrenzter Zeit (oft nur 60–120 Sekunden beim sogenannten Elevator Pitch) Interesse zu wecken und einen Folgetermin oder eine Investitionsentscheidung zu erwirken. Ein überzeugender Pitch folgt meist einer bewährten Struktur: Zunächst wird das Problem klar und nachvollziehbar geschildert, das ein relevanter Teil des Marktes hat; dann wird die eigene Lösung vorgestellt und ihr Alleinstellungsmerkmal gegenüber bestehenden Alternativen herausgearbeitet; anschließend wird die Marktgröße und das Geschäftsmodell knapp skizziert, um die wirtschaftliche Tragfähigkeit zu belegen; abschließend folgt ein konkreter Call-to-Action (z.B. eine gesuchte Investitionssumme oder ein gewünschter nächster Schritt). Erfolgreiche Pitches zeichnen sich durch eine klare, jargon-freie Sprache, überzeugende Kennzahlen sowie souveränes, selbstbewusstes Auftreten aus, ohne die Risiken der Idee zu verschweigen.`,ex:`In einem 90-sekündigen Elevator Pitch erklärt eine Gründerin knapp: 'Kleine Modehändler verlieren jährlich Millionen durch Retouren, weil Kunden online falsche Größen bestellen. Unser KI-gestütztes Größenberatungs-Tool reduziert Retourenquoten nachweislich um 30%. Wir suchen 200.000 € Seed-Kapital, um in den nächsten 12 Monaten 50 zahlende Kunden zu gewinnen.' – Problem, Lösung, Beleg und konkreter Call-to-Action in wenigen Sätzen.`},{t:`Innovationsmanagement`,def:`Innovationsmanagement bezeichnet die systematische, organisierte Steuerung des gesamten Prozesses von der Ideenfindung über die Bewertung und Auswahl bis zur Markteinführung neuer Produkte, Dienstleistungen, Prozesse oder Geschäftsmodelle. Man unterscheidet inkrementelle Innovationen (schrittweise Verbesserungen bestehender Angebote, mit geringem Risiko, aber auch begrenztem Differenzierungspotenzial) von radikalen bzw. disruptiven Innovationen (grundlegend neue Lösungsansätze, die bestehende Märkte oder Geschäftsmodelle fundamental verändern können, aber mit deutlich höherem Risiko verbunden sind). Etablierte Unternehmen stehen dabei häufig vor dem sogenannten Innovator's Dilemma: Sie optimieren ihr bestehendes, profitables Geschäft so gut, dass sie disruptive, zunächst noch unprofitable Innovationen tendenziell zu spät erkennen oder verfolgen. Als organisatorische Antwort etablieren viele Unternehmen dedizierte Innovation Labs oder nutzen offene Innovationsansätze (Open Innovation), bei denen externe Partner, Kunden oder Startups aktiv in den Innovationsprozess eingebunden werden.`,ex:`Ein etabliertes Handelsunternehmen gründet ein separates Innovation Lab außerhalb der bestehenden Konzernstrukturen, um risikofreudiger und mit agileren Methoden neue Checkout-Technologien (z.B. kassenlose In-Store-Bezahlung) zu testen, ohne dass diese Experimente sofort an den Renditeanforderungen des Kerngeschäfts gemessen werden.`},{t:`Marktanalyse für Startups`,def:`Eine fundierte Marktanalyse untersucht systematisch, ob für eine Geschäftsidee tatsächlich ausreichend zahlungsbereite Nachfrage existiert, bevor größere Ressourcen in die Umsetzung investiert werden. Zentrale Analysedimensionen sind die Marktgröße, oft in drei Stufen gegliedert: TAM (Total Addressable Market – die theoretisch maximale Marktgröße bei vollständiger Marktdurchdringung), SAM (Serviceable Available Market – der mit dem konkreten Geschäftsmodell tatsächlich erreichbare Teilmarkt) und SOM (Serviceable Obtainable Market – der realistisch in den nächsten Jahren erreichbare Marktanteil). Ergänzend werden die Wettbewerbslandschaft (direkte und indirekte Konkurrenten, deren Stärken und Schwächen), die Zielgruppe (demografische und verhaltensbezogene Merkmale, konkrete Bedürfnisse) sowie Markttrends und regulatorische Rahmenbedingungen analysiert. Validierungsmethoden wie Kundeninterviews, Umfragen, Landingpage-Tests (Messung des Interesses über Registrierungen, bevor das Produkt überhaupt existiert) oder ein Minimum Viable Product (MVP) helfen, Annahmen über die Marktnachfrage mit echten Daten zu überprüfen, statt sich allein auf Intuition zu verlassen.`,ex:`Ein Startup, das ein Bio-Lebensmittel-Abo plant, schaltet vor der eigentlichen Produktentwicklung eine einfache Landingpage mit Registrierungsformular und bewirbt sie mit einem kleinen Werbebudget; erst als sich innerhalb von zwei Wochen genügend Interessenten mit echten E-Mail-Adressen registrieren, gilt die grundsätzliche Marktnachfrage als validiert und das Team beginnt mit dem Aufbau der eigentlichen Lieferkette.`}],quiz:[{q:`Was ist ein Business Model Canvas?`,options:[`Ein Marketingplan`,`Ein visuelles 1-Seiten-Tool zur Geschäftsmodell-Entwicklung`,`Ein Buchhaltungsprogramm`,`Ein Vertragstyp`],correct:1,explain:`Das Business Model Canvas visualisiert alle Kernelemente eines Geschäftsmodells auf einer Seite.`},{q:`Was ist Venture Capital?`,options:[`Bankkredit`,`Risikokapital von Investoren für Startups`,`Staatliche Subvention`,`Eigenkapital der Gründer`],correct:1,explain:`Venture Capital ist Risikokapital, das Investoren in wachstumsstarke Startups investieren.`}],cards:[{front:`Business Model Canvas`,back:`Strategisches Tool zur Visualisierung aller Kernelemente eines Geschäftsmodells.`},{front:`Venture Capital`,back:`Risikokapital, das Investoren gegen Unternehmensanteile in Startups investieren.`},{front:`Business Angel`,back:`Privater Investor, der Startups mit Kapital und Know-how unterstützt.`},{front:`MVP`,back:`Minimum Viable Product – kleinste funktionsfähige Produktversion zum Testen am Markt.`}]},{id:`s4-mmi`,code:`MMI EC`,name:`MMI und GUI Programmierung`,ects:6,sws:`5`,exam:`Entwurf (10 S.) · 100%`,desc:`Konzeption und Modellierung grafischer Benutzeroberflächen; Richtlinien für gebrauchstaugliche Software.`,topics:[{t:`Mensch-Maschine-Interaktion (MMI) Grundlagen`,def:`Die Mensch-Maschine-Interaktion (MMI, international auch Human-Computer Interaction, HCI) ist ein interdisziplinäres Forschungs- und Gestaltungsfeld, das untersucht, wie Menschen technische Systeme wahrnehmen, verstehen und bedienen, mit dem Ziel, Systeme so zu gestalten, dass sie möglichst intuitiv, effizient und fehlerarm nutzbar sind. Zentrale theoretische Grundlagen stammen aus der Kognitionspsychologie (wie Menschen Informationen wahrnehmen, verarbeiten und im Gedächtnis behalten), der Ergonomie (physische und kognitive Belastungsgrenzen) sowie der Interaktionsdesign-Theorie. Ein zentrales Konzept ist das mentale Modell: die intuitive, oft unbewusste Vorstellung, die ein Nutzer davon hat, wie ein System funktioniert – gute Interfaces gestalten die Interaktion so, dass sie mit dem natürlichen mentalen Modell der Nutzer übereinstimmt, statt sie zu zwingen, ein völlig neues, unnatürliches Bedienkonzept zu erlernen. Norman's Prinzip der Affordanz beschreibt zudem, wie visuelle Gestaltungselemente selbst signalisieren können, wie sie zu bedienen sind (z.B. ein Button, der wie ein drückbarer physischer Knopf aussieht).`,ex:`Die Anordnung von Warenkorb-Icon oben rechts und Suchleiste oben mittig im Shop-Header folgt etablierten MMI-Konventionen, die sich über Jahre branchenübergreifend als mentales Modell bei den meisten Internetnutzern eingeprägt haben – weicht ein Shop grundlos von dieser Konvention ab, müssen Nutzer erst umlernen, was Reibung und Frustration erzeugt.`},{t:`GUI-Design-Prinzipien`,def:`Die Gestaltung grafischer Benutzeroberflächen (GUI) folgt etablierten Design-Prinzipien, die die Nutzung intuitiver und fehlertoleranter machen. Konsistenz bedeutet, dass gleiche Elemente im gesamten System gleich aussehen und sich gleich verhalten, damit Nutzer einmal Gelerntes überall anwenden können. Die Sichtbarkeit des Systemstatus fordert, dass das System den Nutzer jederzeit klar und zeitnah darüber informiert, was gerade passiert (z.B. ob eine Aktion erfolgreich war, noch lädt oder fehlgeschlagen ist), statt ihn im Unklaren zu lassen. Fehlertoleranz bedeutet, Fehleingaben möglichst zu verhindern (z.B. durch Eingabebeschränkungen), leicht erkennbar zu machen und einfach korrigierbar zu gestalten, statt den Nutzer für Fehler zu 'bestrafen'. Weitere wichtige Prinzipien sind Nutzerkontrolle und Freiheit (Nutzer sollten Aktionen leicht rückgängig machen können), Wiedererkennung statt Erinnerung (relevante Informationen sichtbar halten, statt Nutzer zu zwingen, sich Dinge zu merken) sowie eine klare visuelle Hierarchie, die wichtige Elemente hervorhebt.`,ex:`Ein mehrstufiger Checkout-Prozess zeigt oben durchgehend einen Fortschrittsbalken mit den Schritten 'Warenkorb → Adresse → Zahlung → Bestätigung', bei dem der aktuell aktive Schritt optisch hervorgehoben ist – dies erfüllt direkt das Prinzip der Sichtbarkeit des Systemstatus, da der Kunde jederzeit weiß, wo im Prozess er sich befindet und wie viele Schritte noch folgen.`},{t:`Usability-Heuristiken`,def:`Usability-Heuristiken sind praxiserprobte Faustregeln zur systematischen Bewertung der Gebrauchstauglichkeit einer Benutzeroberfläche, ohne dass dafür zwingend aufwändige Nutzertests mit echten Probanden nötig sind. Die bekanntesten Heuristiken stammen von Jakob Nielsen und umfassen zehn Grundsätze, darunter: Sichtbarkeit des Systemstatus, Übereinstimmung zwischen System und realer Welt (vertraute Sprache und Konzepte statt technischem Fachjargon), Nutzerkontrolle und Freiheit, Konsistenz und Standards, Fehlervermeidung, Wiedererkennung statt Erinnerung, Flexibilität und Effizienz (sowohl für Anfänger als auch erfahrene Nutzer geeignet), ästhetisches und minimalistisches Design, Hilfe beim Erkennen und Beheben von Fehlern sowie Hilfe und Dokumentation. Eine sogenannte heuristische Evaluation lässt dabei mehrere Usability-Experten unabhängig voneinander eine Oberfläche anhand dieser Kriterien systematisch durchgehen und Verstöße dokumentieren und nach Schweregrad einstufen – eine schnelle und kostengünstige Ergänzung zu aufwändigeren Nutzertests mit echten Endanwendern.`,ex:`Ein Usability-Test mit fünf realen Testpersonen prüft konkret, ob Nutzer den zentralen 'Jetzt kaufen'-Button auf einer Produktseite ohne Hilfestellung innerhalb weniger Sekunden finden und anklicken – findet mehr als eine Person den Button nicht sofort, deutet das auf einen Verstoß gegen die Heuristik der Sichtbarkeit wichtiger Elemente hin und signalisiert konkreten Überarbeitungsbedarf.`},{t:`Wireframing & Prototyping`,def:`Wireframes sind bewusst grobe, meist grau- oder schwarz-weiß gehaltene Strukturskizzen einer Benutzeroberfläche, die sich ausschließlich auf Layout, Informationsarchitektur und Platzierung von Elementen konzentrieren, ohne bereits Farben, Schriftarten oder finales visuelles Design festzulegen – dieser bewusste Verzicht auf Details in frühen Phasen erlaubt es Teams, sich zunächst auf grundlegende Struktur- und Funktionsfragen zu konzentrieren, statt sich in Diskussionen über Farbnuancen zu verlieren. Prototyping geht einen Schritt weiter und macht Interaktionen tatsächlich testbar: Ein Low-Fidelity-Prototyp (z.B. auf Papier) demonstriert grobe Abläufe, während ein High-Fidelity-Prototyp (klickbare digitale Mockups mit Werkzeugen wie Figma) nahezu wie die echte Anwendung wirkt und mit echten Nutzern in Usability-Tests erprobt werden kann, bevor überhaupt Code geschrieben wird. Dieser iterative Ansatz – schnell grobe Ideen visualisieren, mit Nutzern testen, Feedback einarbeiten – reduziert das Risiko, teure Entwicklungszeit in ein Design zu investieren, das sich später als unbrauchbar erweist.`,ex:`Bevor ein einziger Zeile Code für eine neue Checkout-Seite geschrieben wird, erstellt das Designteam zunächst einen groben Wireframe der Seitenstruktur, entwickelt daraus einen klickbaren High-Fidelity-Prototyp in Figma und lässt zehn Testpersonen den kompletten Bestellvorgang darin durchklicken – aufgedeckte Verständnisprobleme werden direkt im Prototyp korrigiert, bevor die eigentliche, deutlich teurere technische Entwicklung überhaupt beginnt.`},{t:`Barrierefreiheit`,def:`Digitale Barrierefreiheit (Accessibility) stellt sicher, dass Websites, Apps und andere digitale Angebote auch von Menschen mit körperlichen, sensorischen oder kognitiven Einschränkungen vollständig genutzt werden können, und ist in vielen Ländern für bestimmte Anbieter mittlerweile auch gesetzlich vorgeschrieben. Der internationale Standard WCAG (Web Content Accessibility Guidelines) definiert konkrete, überprüfbare Kriterien entlang vier zentraler Prinzipien: Wahrnehmbarkeit (Inhalte müssen über verschiedene Sinne erfassbar sein, z.B. Alt-Texte für Bilder, die von Screenreadern vorgelesen werden können, und ausreichender Farbkontrast für sehbeeinträchtigte Nutzer), Bedienbarkeit (alle Funktionen müssen auch ausschließlich über Tastatur bedienbar sein, ohne Maus), Verständlichkeit (klare, vorhersehbare Sprache und Navigation) sowie Robustheit (Kompatibilität mit unterstützenden Technologien wie Screenreadern und Sprachsteuerung). Barrierefreiheit nützt dabei nicht nur Menschen mit dauerhaften Einschränkungen, sondern verbessert die Nutzbarkeit generell auch situativ (z.B. bei grellem Sonnenlicht auf dem Bildschirm oder wenn beide Hände anderweitig beschäftigt sind).`,ex:`Ein Online-Shop hinterlegt für jedes Produktfoto einen aussagekräftigen Alt-Text (z.B. 'Roter Lederrucksack mit silbernen Schnallen, Frontansicht') und stellt sicher, dass alle Texte einen Farbkontrast von mindestens 4,5:1 zum Hintergrund haben – dadurch können auch blinde Nutzer mit Screenreader-Software oder sehbehinderte Nutzer mit eingeschränktem Kontrastsehen selbstständig und ohne fremde Hilfe einkaufen.`}],quiz:[{q:`Wofür steht GUI?`,options:[`General User Info`,`Graphical User Interface`,`Global Usability Index`,`Guided User Instruction`],correct:1,explain:`GUI = Graphical User Interface, grafische Benutzeroberfläche.`},{q:`Was ist ein Wireframe?`,options:[`Ein Netzwerkkabel`,`Eine grobe strukturelle Skizze einer Benutzeroberfläche`,`Ein Datenbankschema`,`Ein Servertyp`],correct:1,explain:`Wireframes sind einfache, strukturelle Entwürfe von UI-Layouts vor dem finalen Design.`}],cards:[{front:`MMI`,back:`Mensch-Maschine-Interaktion – Erforschung, wie Menschen mit Systemen interagieren.`},{front:`Usability`,back:`Gebrauchstauglichkeit – wie effektiv, effizient und zufriedenstellend ein System nutzbar ist.`},{front:`Wireframe`,back:`Grobe, strukturelle Skizze einer Benutzeroberfläche ohne visuelles Design.`},{front:`Barrierefreiheit`,back:`Gestaltung von Software, die auch für Menschen mit Einschränkungen nutzbar ist.`}]},{id:`s4-oscm`,code:`OSCM`,name:`Operations und Supply Chain Management`,ects:6,sws:`4`,exam:`Klausur 60 Min. · 100%`,desc:`Grundlagen betrieblicher Produktions- und Logistikabläufe.`,topics:[{t:`Produktionsplanung & -steuerung`,def:`Die Produktionsplanung und -steuerung (PPS) plant systematisch, in welcher Menge, zu welchem Zeitpunkt und mit welchen Ressourcen Produkte hergestellt oder beschafft werden müssen, um die erwartete Nachfrage termingerecht und kosteneffizient zu decken. Die Bedarfsplanung schätzt zunächst die zukünftige Nachfrage anhand historischer Verkaufsdaten, saisonaler Muster und Markttrends (Absatzprognose). Die Materialbedarfsplanung (MRP) leitet daraus ab, welche Rohstoffe, Vorprodukte oder fertige Waren in welcher Menge zu welchem Zeitpunkt benötigt werden, unter Berücksichtigung von Lieferzeiten (Vorlaufzeiten) der Lieferanten. Die Kapazitätsplanung stellt sicher, dass ausreichend Produktions-, Lager- und Personalkapazität für den geplanten Bedarf vorhanden ist. Besonders im Handel mit stark saisonalen Produkten (z.B. Weihnachtsartikel, Sommerkleidung) ist eine vorausschauende Planung entscheidend, da die Vorlaufzeiten für Produktion und internationalen Transport oft mehrere Monate betragen und eine zu späte Bestellung zu Lieferengpässen genau zur Hauptverkaufszeit führen kann.`,ex:`Ein Hersteller von Weihnachtsdekoration beginnt die Produktionsplanung für die Weihnachtssaison bereits im März: Basierend auf den Verkaufszahlen der Vorjahre und aktuellen Trendindikatoren wird die benötigte Menge geschätzt, die Produktion in asiatischen Fabriken mit mehrmonatiger Vorlaufzeit beauftragt und der Seetransport so terminiert, dass die Ware bereits im September in den europäischen Lagern eintrifft – rechtzeitig für den Verkaufsstart im Oktober.`},{t:`Lagerhaltungsstrategien`,def:`Lagerhaltungsstrategien balancieren den fundamentalen Zielkonflikt zwischen Lagerkosten (Kapitalbindung, Lagerfläche, Versicherung, Verderb-/Veralterungsrisiko) und Lieferfähigkeit (die Fähigkeit, Kundennachfrage jederzeit sofort zu bedienen, ohne dass Artikel ausverkauft sind). Der Sicherheitsbestand (Sicherheitspuffer) ist eine zusätzliche Lagermenge über den erwarteten Bedarf hinaus, die Schwankungen in Nachfrage oder Lieferzeiten abfedert und damit Fehlmengen (Out-of-Stock-Situationen) verhindert – seine optimale Höhe hängt von der Nachfrage- und Lieferzeitvariabilität sowie dem gewünschten Servicegrad ab. Die ABC-Analyse klassifiziert das Sortiment nach wirtschaftlicher Bedeutung: A-Artikel (meist ca. 20% der Artikel, aber ca. 80% des Umsatzes gemäß Pareto-Prinzip) erhalten intensive Steuerung und höhere Sicherheitsbestände, C-Artikel (viele Artikel mit geringem Einzelumsatzanteil) werden mit vereinfachten, kostengünstigeren Regeln gesteuert. Dieses differenzierte Vorgehen erlaubt es, das begrenzte Managementaufwand- und Kapitalbudget gezielt dort einzusetzen, wo der wirtschaftliche Hebel am größten ist.`,ex:`Ein Elektronikhändler hält für seine umsatzstärksten A-Artikel (z.B. aktuelle Smartphone-Modelle) einen großzügigen Sicherheitsbestand, um auch bei unerwarteten Nachfragespitzen sofort lieferfähig zu bleiben, während er für langsam drehende C-Artikel (z.B. Nischenzubehör) bewusst geringere Bestände und längere Nachbestellzeiten in Kauf nimmt, da ein gelegentlicher kurzfristiger Ausverkauf hier wirtschaftlich weniger schmerzhaft ist als die Kapitalbindung durch hohe Lagerbestände.`},{t:`Supply-Chain-Grundmodelle`,def:`Eine Supply Chain (Lieferkette) umfasst alle Organisationen, Prozesse, Informationen und physischen Warenflüsse, die notwendig sind, um ein Produkt von der Rohstoffgewinnung über mehrere Verarbeitungsstufen bis zum Endkunden zu bringen. Man unterscheidet dabei drei parallel laufende Flüsse: den physischen Materialfluss (Rohstoffe, Halbfertig- und Fertigwaren bewegen sich vorwärts durch die Kette), den Informationsfluss (Bestellungen, Bedarfsprognosen und Statusmeldungen bewegen sich in beide Richtungen zwischen den Stufen) sowie den Finanzfluss (Zahlungen bewegen sich meist rückwärts, vom Endkunden zurück zu den vorgelagerten Stufen). Klassische Supply-Chain-Modelle unterscheiden zudem push-basierte Systeme (Produktion erfolgt basierend auf Prognosen, bevor konkrete Kundenbestellungen vorliegen) von pull-basierten Systemen (Produktion wird erst durch eine tatsächliche Kundenbestellung ausgelöst) – die meisten realen Lieferketten kombinieren beide Prinzipien an unterschiedlichen Stufen (Push-Pull-Grenze).`,ex:`Die Lieferkette eines Modehändlers reicht vom Baumwollanbau über die Textilweberei und Konfektionsnäherei bis zum internationalen Transport in ein zentrales Verteilzentrum und schließlich zum Versand an die Haustür des Endkunden – dabei fließt physisch die Ware stromabwärts, während Bestellinformationen und Bedarfsprognosen stromaufwärts an die Produktionsstufen zurückgemeldet werden, damit diese ihre Kapazität entsprechend planen können.`},{t:`Bullwhip-Effekt`,def:`Der Bullwhip-Effekt (Peitscheneffekt) beschreibt das Phänomen, dass sich bereits kleine, ganz normale Schwankungen in der tatsächlichen Endkundennachfrage entlang der vorgelagerten Stufen einer Lieferkette zunehmend verstärken und aufschaukeln, sodass Hersteller am Anfang der Kette weitaus größere Nachfrageschwankungen wahrnehmen und darauf überproportional reagieren, als tatsächlich vom Endkunden ausgelöst wurden. Ursachen sind u.a.: verzögerte und unvollständige Informationsweitergabe zwischen den Stufen, Mindestbestellmengen und Mengenrabatte, die zu unregelmäßigen statt gleichmäßigen Bestellungen führen, Sicherheitsbestandsaufschläge, die auf jeder Stufe zusätzlich draufgerechnet werden, sowie psychologische Überreaktionen bei kurzfristigen Nachfragespitzen (Angstbestellungen, um bloß nicht selbst in Lieferengpässe zu geraten). Der Effekt führt zu ineffizienter Kapazitätsplanung, überhöhten Lagerbeständen und volatiler Produktionsauslastung entlang der gesamten Kette und lässt sich durch verbesserten Informationsaustausch (z.B. Echtzeit-Verkaufsdaten, die allen Stufen gleichzeitig zugänglich sind) sowie stabilere Bestellrhythmen deutlich abmildern.`,ex:`Steigt die Nachfrage im Einzelhandel für ein Produkt kurzfristig nur um 10%, bestellt der Einzelhändler beim Großhändler vorsichtshalber 20% mehr (um Sicherheitsreserven aufzubauen), der Großhändler bestellt daraufhin beim Hersteller 40% mehr, und der Hersteller plant seine Produktion sogar um 60% hoch – am Ende der Kette entsteht dadurch eine massive Überproduktion, obwohl die ursprüngliche Nachfrageänderung beim Endkunden vergleichsweise moderat war.`},{t:`Just-in-Time-Konzepte`,def:`Just-in-Time (JIT) ist ein aus der japanischen Automobilindustrie (v.a. Toyota) stammendes Logistik- und Produktionskonzept, das darauf abzielt, Materialien und Waren exakt in der benötigten Menge und zum benötigten Zeitpunkt anzuliefern, statt große Lagerbestände vorzuhalten – mit dem Ziel, Kapitalbindung, Lagerkosten und Verschwendung (im Sinne der Lean-Philosophie) zu minimieren. Voraussetzung für ein funktionierendes JIT-System sind sehr zuverlässige, eng getaktete Lieferanten, eine hohe Prozessstabilität sowie meist ein enger, oft standortnaher Verbund zwischen Lieferant und Abnehmer, da schon kleine Lieferverzögerungen bei fehlendem Sicherheitspuffer sofort zu Produktions- oder Lieferstopps führen können. Der große Vorteil liegt in massiv reduzierter Kapitalbindung und Lagerfläche; der Nachteil ist eine erhöhte Verwundbarkeit gegenüber Lieferkettenstörungen, wie viele Unternehmen während globaler Lieferkettenkrisen schmerzhaft erfahren mussten, was seither vielerorts zu einem bewussten Umdenken hin zu etwas höheren strategischen Sicherheitsbeständen (Just-in-Case) geführt hat.`,ex:`Ein Fulfillment-Zentrum eines Online-Händlers bestellt Verpackungskartons nicht in großen Mengen auf Vorrat, sondern lässt sie vom Lieferanten mehrmals wöchentlich exakt in der Menge anliefern, die dem prognostizierten Versandvolumen der kommenden Tage entspricht – das spart wertvolle Lagerfläche und Kapitalbindung, setzt aber eine sehr zuverlässige, eng getaktete Lieferbeziehung voraus.`}],quiz:[{q:`Was ist der Bullwhip-Effekt?`,options:[`Ein Produktionsfehler`,`Aufschaukelnde Nachfrageschwankungen entlang der Lieferkette`,`Ein Lagertyp`,`Eine Transportmethode`],correct:1,explain:`Der Bullwhip-Effekt beschreibt sich verstärkende Nachfrageschwankungen entlang der Supply Chain.`},{q:`Was bedeutet Just-in-Time?`,options:[`Lagerbestände just rechtzeitig zur Bedarfsdeckung anliefern`,`Lager voll auffüllen`,`Nur einmal jährlich bestellen`,`Produkte vor Bedarf lagern`],correct:0,explain:`Just-in-Time minimiert Lagerbestände durch bedarfsgenaue Anlieferung.`}],cards:[{front:`Supply Chain`,back:`Die gesamte Lieferkette vom Rohstoff bis zum Endkunden.`},{front:`Bullwhip-Effekt`,back:`Sich entlang der Lieferkette verstärkende Nachfrageschwankungen.`},{front:`Just-in-Time`,back:`Logistikkonzept mit bedarfsgenauer, lagerarmer Anlieferung.`},{front:`Sicherheitsbestand`,back:`Zusätzlicher Lagerbestand zur Absicherung gegen Nachfrage-/Lieferschwankungen.`}]},{id:`s4-sww`,code:`SWW`,name:`Shop und Warenwirtschaftssysteme`,ects:6,sws:`5`,exam:`Entwurf (10 S.) · 100%`,desc:`Einführung in Aufbau und Betrieb eines Online-Shops und Warenwirtschaftssystems.`,topics:[{t:`Shopsystem-Architektur (Shopify, Magento etc.)`,def:`Ein Shopsystem ist die technische Softwareplattform, die alle Kernfunktionen eines Online-Shops bereitstellt: Produktkatalog und -präsentation, Warenkorb, Checkout-Prozess, Zahlungsabwicklung sowie grundlegende Bestandsverwaltung. Man unterscheidet grundsätzlich SaaS-Lösungen (Software-as-a-Service, z.B. Shopify), bei denen der Anbieter Hosting, Wartung und Sicherheitsupdates übernimmt und der Händler dafür eine monatliche Gebühr zahlt, ohne eigene Serverinfrastruktur betreiben zu müssen; Open-Source-Systeme (z.B. Magento/Adobe Commerce, WooCommerce), die kostenlos nutzbar und vollständig anpassbar sind, aber eigenes technisches Know-how oder eine Agentur für Betrieb und Wartung erfordern; sowie Individualentwicklungen (Custom-Lösungen), die vollständige Flexibilität bieten, aber den höchsten Entwicklungs- und Wartungsaufwand verursachen. Die Wahl des richtigen Shopsystems hängt von Faktoren wie erwartetem Bestellvolumen, benötigten individuellen Funktionen, technischem Know-how im Unternehmen und Budget ab.`,ex:`Ein kleiner Modehändler wählt Shopify, weil er innerhalb weniger Tage ohne eigene IT-Abteilung startklar sein kann und über den App-Store zahlreiche fertige Payment- und Marketing-Plugins nachrüsten kann; ein großer Konzern mit sehr spezifischen, individuellen Prozessanforderungen entscheidet sich dagegen für eine aufwändigere Magento- oder Individualentwicklung, um maximale Flexibilität bei der Anpassung an interne Systeme zu erhalten.`},{t:`Warenwirtschaft & Bestandsführung`,def:`Ein Warenwirtschaftssystem (WWS) steuert und dokumentiert in Echtzeit sämtliche warenbezogenen Bewegungen eines Unternehmens: Wareneingang (Einbuchen gelieferter Ware inkl. Qualitätsprüfung), Lagerbestandsführung (fortlaufende Verwaltung, wie viele Einheiten jedes Artikels an welchem Lagerort verfügbar sind) sowie Warenausgang (Ausbuchen bei Verkauf, Kommissionierung oder Retoure). Ein zentraler technischer Mechanismus ist die Bestandssynchronisation: Bei jedem Verkauf – egal über welchen Kanal (Online-Shop, Marktplatz, stationäre Filiale) – wird der verfügbare Bestand automatisch und in Echtzeit reduziert, damit derselbe Artikel nicht versehentlich mehrfach über verschiedene Kanäle verkauft wird, obwohl nur eine Einheit tatsächlich vorrätig ist (Überverkauf/Oversell). Moderne Warenwirtschaftssysteme unterstützen zudem automatisierte Nachbestell-Trigger, die auslösen, sobald ein definierter Mindestbestand (Meldebestand) unterschritten wird.`,ex:`Verkauft ein Händler den letzten verfügbaren Artikel eines Produkts gleichzeitig über seinen eigenen Online-Shop und Amazon, muss das Warenwirtschaftssystem den Bestand in Echtzeit über beide Kanäle synchronisieren und den Artikel sofort überall als 'ausverkauft' markieren – ohne diese Echtzeit-Synchronisation könnte der Artikel versehentlich doppelt verkauft werden, was zu einer notwendigen, kundenunfreundlichen Stornierung führt.`},{t:`Schnittstellen (ERP, PIM)`,def:`Ein modernes E-Commerce-System besteht selten aus einer einzigen monolithischen Software, sondern aus mehreren spezialisierten Systemen, die über technische Schnittstellen (meist APIs) miteinander verbunden werden. Ein ERP-System (Enterprise Resource Planning) ist die zentrale, unternehmensweite Software zur Planung und Steuerung sämtlicher Ressourcen – Finanzbuchhaltung, Einkauf, Personalwesen, Lagerhaltung – und übernimmt oft die betriebswirtschaftliche 'Wahrheit' über Bestände, Preise und Finanzdaten. Ein PIM-System (Product Information Management) ist demgegenüber spezialisiert auf die zentrale Pflege aller Produktinformationen (Beschreibungen, Bilder, technische Daten, Übersetzungen), die anschließend konsistent an verschiedene Ausgabekanäle (eigener Shop, Marktplätze, gedruckter Katalog) verteilt werden. Die Schnittstelle zwischen Shopsystem und diesen Backend-Systemen sorgt dafür, dass Bestelldaten, Bestände und Produktinformationen automatisch synchron gehalten werden, statt manuell und fehleranfällig mehrfach gepflegt werden zu müssen.`,ex:`Sobald eine Bestellung im Online-Shop eingeht, überträgt eine automatisierte ERP-Schnittstelle die Bestelldaten unmittelbar in die Finanzbuchhaltung (für die Rechnungsstellung) und ins Lagersystem (für die Kommissionierung) – ohne diese automatisierte Schnittstelle müsste ein Mitarbeiter jede Bestellung manuell in mehrere Systeme übertragen, was bei hohem Bestellvolumen weder skalierbar noch fehlerfrei wäre.`},{t:`Produktdatenmanagement`,def:`Produktdatenmanagement bezeichnet die zentrale, strukturierte Pflege sämtlicher produktbezogener Informationen – Bezeichnung, Beschreibungstexte, technische Attribute, Bilder, Preise, Übersetzungen in verschiedene Sprachen – an einer einzigen Quelle (Single Source of Truth), von der aus die Daten konsistent an alle verschiedenen Verkaufs- und Kommunikationskanäle verteilt werden, statt an jedem Kanal separat und potenziell widersprüchlich gepflegt zu werden. Diese zentrale Pflege wird umso wichtiger, je mehr Kanäle ein Unternehmen gleichzeitig bespielt (eigener Online-Shop, mehrere Marktplätze mit jeweils eigenen Datenanforderungen, stationäre Filialen, gedruckte Kataloge, internationale Ländershops mit unterschiedlichen Sprachen), da inkonsistente Produktdaten zwischen Kanälen nicht nur Ve
