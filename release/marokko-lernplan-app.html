engesellschaft – Kapitalgesellschaft mit mind. 50.000 € Grundkapital, Anteile als Aktien handelbar, für große/börsennotierte Unternehmen.`,AND:`Boolescher Operator – Ergebnis ist nur wahr, wenn BEIDE Eingaben wahr sind. In Java: &&`,"APA-Stil":`Internationaler Zitierstandard (American Psychological Association): Quellenangabe im Text als (Autor, Jahr, S. X).`,API:`Application Programming Interface – Schnittstelle, über die zwei Programme/Systeme automatisiert Daten austauschen (z.B. Shop ruft DHL-API auf).`,ASCII:`American Standard Code for Information Interchange – Zeichenkodierung, die Buchstaben/Zeichen als Zahlen (0–127) darstellt.`,Abschreibung:`Planmäßige Verteilung der Anschaffungskosten eines Wirtschaftsguts über seine Nutzungsdauer (Wertminderung durch Gebrauch).`,AfA:`Absetzung für Abnutzung – steuerlicher Fachbegriff für Abschreibung; AfA-Tabelle gibt Nutzungsdauern vor.`,Aktiva:`Linke Seite der Bilanz – zeigt, WOFÜR das Kapital verwendet wurde (Anlage- & Umlaufvermögen).`,"Aktives Erinnern":`Lerntechnik, bei der man Wissen aus dem Gedächtnis abruft statt nur passiv zu lesen – deutlich effektiver für Langzeitgedächtnis.`,Aktivkonto:`Bilanzkonto auf der Vermögensseite; Zugänge werden im Soll, Abgänge im Haben gebucht (z.B. Kasse, Bank).`,Anki:`Kostenlose Karteikarten-App, die mit Spaced-Repetition-Algorithmus arbeitet – zeigt unsichere Karten häufiger.`,"Anki-Review":`Tägliche Wiederholungssession in Anki, bei der fällige Karten abgefragt werden.`,Anlagevermögen:`Langfristig im Unternehmen gebundenes Vermögen (Maschinen, Software, Gebäude) – Teil der Aktivseite der Bilanz.`,Anschaffungskosten:`Gesamtkosten zum Erwerb eines Wirtschaftsguts (Kaufpreis + Nebenkosten), Basis für Abschreibungsberechnung.`,B2B:`Business-to-Business – Geschäftsmodell, bei dem Unternehmen an andere Unternehmen verkaufen (z.B. Amazon Business).`,B2C:`Business-to-Consumer – Geschäftsmodell, bei dem Unternehmen direkt an Endverbraucher verkaufen (z.B. Zalando).`,Betriebstyp:`Klassifizierung von Handelsunternehmen nach Sortiment, Preis und Service (z.B. Discounter, Fachhandel, Marktplatz).`,Bilanzsumme:`Summe aller Aktiva = Summe aller Passiva; Grundgleichung der doppelten Buchführung.`,Binärsystem:`Zahlensystem mit Basis 2 (nur Ziffern 0 und 1) – die interne Sprache aller Computer.`,Bit:`Kleinste Speichereinheit eines Computers; kann nur 0 oder 1 sein.`,Buchführungspflicht:`Gesetzliche Pflicht nach § 238 HGB für Kaufleute, Geschäftsvorfälle systematisch in Büchern zu dokumentieren.`,Buchungssatz:`Formale Darstellung einer Buchung: 'Soll-Konto an Haben-Konto, Betrag' (z.B. Kasse an Bank 500 €).`,Buchwert:`Aktueller Restwert eines Wirtschaftsguts nach Abzug bisheriger Abschreibungen.`,Byte:`8 Bit zusammengefasst – Standard-Speichereinheit (1 Byte kann 256 verschiedene Werte darstellen).`,C2C:`Consumer-to-Consumer – Verbraucher verkaufen direkt an Verbraucher über eine Plattform (z.B. eBay Kleinanzeigen).`,"CO2-Kompensation":`Ausgleich von Versand-Emissionen durch Investition in Klimaschutzprojekte – wichtiges Nachhaltigkeitsthema im E-Commerce-Versand.`,CPU:`Central Processing Unit – der Hauptprozessor, der Berechnungen durchführt und Programme ausführt.`,Casting:`Typkonvertierung in Java – Umwandlung eines Datentyps in einen anderen (implizit oder explizit).`,"Category Management":`Strategische Steuerung von Produktkategorien im Handel zur Optimierung von Sortiment, Platzierung und Umsatz.`,Client:`Das anfragende Gerät/Programm (z.B. dein Browser), das Daten von einem Server anfordert.`,"Conversion Rate":`Prozentsatz der Website-Besucher, die tatsächlich einen Kauf abschließen – zentrale E-Commerce-Kennzahl.`,"Corona-Effekt":`Starker Anstieg des Online-Handels 2020/2021 durch Lockdowns und verändertes Kaufverhalten.`,D2C:`Direct-to-Consumer – Hersteller verkauft direkt an Endkunden ohne Zwischenhändler (z.B. Nike.com).`,DNS:`Domain Name System – 'Telefonbuch des Internets', übersetzt Domainnamen (amazon.de) in IP-Adressen.`,Datentyp:`Klassifizierung einer Variable in Java (z.B. int, double, boolean, String), bestimmt Speicherart und erlaubte Operationen.`,"De-Morgan":`Logikregeln zur Vereinfachung negierter Ausdrücke: NOT(A AND B) = NOT A OR NOT B.`,Deklaration:`Festlegung von Name und Datentyp einer Variable in Java (z.B. int preis;).`,Direktgeschäft:`Online-Vertriebsform, bei der ein Händler über einen eigenen Shop direkt verkauft (kein Marktplatz).`,Discounter:`Betriebstyp mit schmalem, flachem Sortiment und Preisführerschaft (z.B. Aldi, Lidl).`,Disintermediation:`Ausschaltung von Handelsstufen durch direkten Verkauf vom Hersteller an den Endkunden (z.B. via D2C).`,Disruption:`Radikale Marktveränderung durch neue Technologie, die etablierte Geschäftsmodelle verdrängt.`,Dropshipping:`Fulfillment-Modell, bei dem der Hersteller/Großhändler direkt an den Endkunden versendet – Händler braucht kein eigenes Lager.`,"E-Commerce":`Elektronischer Handel – Kauf und Verkauf von Waren/Dienstleistungen über digitale Kanäle (Internet).`,Eigenkapital:`Kapital, das den Eigentümern des Unternehmens gehört – Teil der Passivseite der Bilanz.`,Einzelhandel:`Handelsstufe, die Waren direkt an Endverbraucher verkauft (im Gegensatz zum Großhandel).`,Fachhandel:`Betriebstyp mit tiefem Sortiment in einer Warengruppe und hoher Beratungskompetenz (z.B. MediaMarkt).`,Fremdkapital:`Von außen geliehenes Kapital (Kredite, Verbindlichkeiten) – Teil der Passivseite der Bilanz.`,Fulfillment:`Gesamtprozess von Lagerung über Kommissionierung bis Versand und Retourenabwicklung im E-Commerce.`,GAFA:`Sammelbegriff für Google, Apple, Facebook (Meta), Amazon – die dominanten US-Tech-Plattformen.`,GbR:`Gesellschaft bürgerlichen Rechts – einfachste Personengesellschaft, mind. 2 Personen, unbeschränkte Haftung.`,GmbH:`Gesellschaft mit beschränkter Haftung – Kapitalgesellschaft mit 25.000 € Stammkapital, häufigste Rechtsform für Online-Shops.`,GoB:`Grundsätze ordnungsmäßiger Buchführung – ungeschriebene Regeln für korrekte, nachvollziehbare Buchführung.`,Großhandel:`Handelsstufe, die große Warenmengen an Wiederverkäufer (nicht Endverbraucher) verkauft.`,Güterarten:`Klassifizierung wirtschaftlicher Güter in Sachgüter, Dienstleistungen und Rechte.`,HGB:`Handelsgesetzbuch – zentrales deutsches Gesetz für Kaufleute, regelt u.a. Buchführungspflicht.`,"HRW Moodle":`Digitale Lernplattform der Hochschule Ruhr West für Vorlesungsmaterialien, Abgaben und Kommunikation.`,HTTP:`HyperText Transfer Protocol – unverschlüsseltes Protokoll zur Datenübertragung im Web.`,HTTPS:`HTTP + SSL/TLS-Verschlüsselung – sicherer Standard, Pflicht für jeden seriösen Online-Shop.`,Haben:`Rechte Seite eines T-Kontos; bei Passivkonten bedeutet eine Buchung im Haben eine Erhöhung.`,Haftungsbeschränkung:`Rechtlicher Schutz, bei dem nur das Gesellschaftsvermögen (nicht das Privatvermögen) für Schulden haftet (z.B. bei GmbH).`,Handelsfunktion:`Aufgabe, die der Handel in der Wertschöpfungskette übernimmt (Überbrückung, Quantität, Qualität, Kredit, Werbung).`,Handelsmanagement:`Disziplin, die sich mit Strategie, Organisation und Steuerung von Handelsunternehmen beschäftigt.`,Handelsregister:`Öffentliches Verzeichnis, in dem Kaufleute und Kapitalgesellschaften rechtsverbindlich eingetragen werden.`,Hedonistisch:`Kaufmotivation aus Freude/Genuss am Einkaufserlebnis selbst (Gegensatz: utilitaristisch).`,Hexadezimal:`Zahlensystem mit Basis 16 (0–9, A–F) – kompakte Darstellung binärer Daten (z.B. Farbcodes #FF5733).`,Initialisierung:`Erstmalige Wertzuweisung an eine deklarierte Variable in Java (z.B. preis = 9.99;).`,Inventar:`Detailliertes, mengenmäßiges Verzeichnis aller Vermögensgegenstände und Schulden zu einem Stichtag.`,Inventur:`Körperliche Bestandsaufnahme (Zählen, Messen, Wiegen) aller Vermögensgegenstände als Basis für das Inventar.`,JVM:`Java Virtual Machine – Laufzeitumgebung, die Java-Code plattformunabhängig auf jedem Betriebssystem ausführt.`,Jahresüberschuss:`Positives Ergebnis der GuV-Rechnung (Erträge > Aufwendungen) – erhöht das Eigenkapital.`,"Java-Vertiefung":`Intensiveres Üben von Java-Konzepten über die Grundlagen hinaus, z.B. durch Praxisaufgaben.`,Kapitalgesellschaft:`Rechtsform, bei der das Kapital (nicht die Person) im Vordergrund steht – Haftung meist beschränkt (GmbH, AG, UG).`,Kapselung:`OOP-Prinzip: Attribute einer Klasse werden privat gehalten und nur über Methoden (Getter/Setter) zugänglich gemacht.`,Kaufentscheidungsprozess:`5-stufiger Prozess: Problemerkennung → Informationssuche → Bewertung → Kauf → Nachkaufverhalten.`,Kaufhemmnis:`Faktor, der einen Online-Kauf verhindert oder verzögert (z.B. fehlendes Vertrauen, hohe Versandkosten).`,Kaufmann:`Person, die ein Handelsgewerbe betreibt und damit unter die Vorschriften des HGB fällt.`,Klasse:`Bauplan für Objekte in Java – definiert Attribute (Eigenschaften) und Methoden (Verhalten).`,Konstruktor:`Spezielle Java-Methode, die beim Erstellen eines Objekts automatisch aufgerufen wird, um es zu initialisieren.`,Kontrollstruktur:`Sprachelement, das den Programmablauf steuert (if/else, for, while, switch).`,Lernkurve:`Grafische Darstellung, wie sich Lernfortschritt über Zeit entwickelt – typisch steil am Anfang, flacher später.`,Lernplan:`Strukturierter Zeitplan zur systematischen Vorbereitung auf Prüfungen oder neue Lerninhalte.`,"Letzte Meile":`Letzter Transportabschnitt vom Verteilzentrum zum Endkunden – teuerster Teil der Logistikkette (40–50% der Kosten).`,Literaturverzeichnis:`Vollständige, formal korrekte Liste aller in einer wissenschaftlichen Arbeit zitierten Quellen.`,Logikgatter:`Elektronisches Bauteil, das boolesche Operationen (AND, OR, NOT) physisch in Hardware umsetzt.`,Marktplatz:`Online-Plattform, auf der mehrere Drittanbieter ihre Produkte verkaufen können (z.B. Amazon Marketplace).`,Maximalprinzip:`Wirtschaftlichkeitsprinzip: Mit gegebenem Mitteleinsatz den größtmöglichen Ertrag erzielen.`,Methode:`Funktion innerhalb einer Java-Klasse, die eine bestimmte Aktion ausführt und Parameter/Rückgabewerte haben kann.`,"Mind-Map":`Visuelle Lernmethode, bei der ein Thema im Zentrum steht und verzweigte Unterthemen drumherum angeordnet werden.`,Minimalprinzip:`Wirtschaftlichkeitsprinzip: Ein gegebenes Ziel mit dem geringstmöglichen Mitteleinsatz erreichen.`,Multichannel:`Vertrieb über mehrere, aber getrennt agierende Kanäle (Filiale + Online-Shop ohne Verknüpfung).`,NAND:`Boolescher Operator – Negation von AND; liefert nur dann falsch, wenn beide Eingaben wahr sind.`,NOT:`Boolescher Operator, der einen Wahrheitswert invertiert (aus wahr wird falsch und umgekehrt). In Java: !`,Netzwerkeffekte:`Phänomen, bei dem eine Plattform für jeden neuen Nutzer wertvoller wird, je mehr Nutzer sie bereits hat.`,Nutzungsdauer:`Zeitraum, über den ein Wirtschaftsgut voraussichtlich genutzt wird – Basis der Abschreibungsberechnung.`,OR:`Boolescher Operator – Ergebnis ist wahr, wenn MINDESTENS EINE Eingabe wahr ist. In Java: ||`,Objekt:`Konkrete Instanz einer Klasse in Java – ein 'fertig gebautes' Exemplar nach dem Bauplan der Klasse.`,Omnichannel:`Nahtlos vernetzte Vertriebskanäle mit einheitlichem Kundenerlebnis (z.B. online bestellen, im Laden abholen).`,Parameter:`Eingabewert, der einer Methode beim Aufruf übergeben wird, um sie zu konfigurieren.`,Passiva:`Rechte Seite der Bilanz – zeigt, WOHER das Kapital stammt (Eigen- & Fremdkapital).`,Passivkonto:`Bilanzkonto auf der Kapitalseite; Zugänge werden im Haben, Abgänge im Soll gebucht (z.B. Verbindlichkeiten).`,"Payment Gateway":`Technische Schnittstelle, die Online-Zahlungen zwischen Shop, Kunde und Zahlungsanbieter sicher abwickelt.`,Plagiat:`Unrechtmäßige Übernahme fremder Texte/Ideen ohne korrekte Quellenangabe – führt zum Nichtbestehen der Arbeit.`,Plattform:`Digitales Geschäftsmodell, das Angebot und Nachfrage verschiedener Akteure zusammenbringt (z.B. Amazon, Airbnb).`,Port:`Nummerierte 'Tür' an einem Server, über die eine bestimmte Anwendung erreichbar ist (z.B. Port 443 für HTTPS).`,Primärquelle:`Originalquelle/Erstveröffentlichung eines Sachverhalts (z.B. das Originalbuch von Deges).`,Produktionsfaktoren:`Grundlegende Einsatzmittel der Wirtschaft: Arbeit, Betriebsmittel, Werkstoffe und der dispositive Faktor.`,RAM:`Random Access Memory – flüchtiger Arbeitsspeicher, in dem laufende Programme zwischengespeichert werden.`,ROPO:`Research Online, Purchase Offline – Kunde informiert sich online, kauft aber im stationären Laden.`,Reflexion:`Bewusstes Nachdenken über eigenen Lernfortschritt, um Stärken und Schwächen zu identifizieren.`,Restbuchwert:`Verbleibender Wert eines Wirtschaftsguts nach bereits erfolgten Abschreibungen.`,Retoure:`Rücksendung einer bestellten Ware durch den Kunden – verursacht erhebliche Zusatzkosten im E-Commerce.`,Rückgabewert:`Wert, den eine Java-Methode nach ihrer Ausführung mit 'return' an den Aufrufer zurückgibt.`,"SSL/TLS":`Verschlüsselungsprotokolle, die HTTPS-Verbindungen absichern und Daten vor Abhören schützen.`,Saldo:`Differenz zwischen Soll- und Haben-Summe eines Kontos – zeigt den aktuellen Kontostand.`,Sekundärquelle:`Quelle, die über eine Primärquelle berichtet oder sie interpretiert (z.B. ein Statista-Bericht über offizielle Zahlen).`,Semesterstart:`Beginn der Vorlesungszeit – bei dir der 1. September 2026 an der HRW.`,Seminararbeit:`Wissenschaftliche schriftliche Ausarbeitung zu einem Thema – im ECM-Modul Sem.1 als 25-seitige Gruppenarbeit gefordert.`,Server:`Computer/Programm, das Anfragen von Clients entgegennimmt und Daten/Webseiten bereitstellt.`,Soll:`Linke Seite eines T-Kontos; bei Aktivkonten bedeutet eine Buchung im Soll eine Erhöhung.`,Sortimentsbreite:`Anzahl unterschiedlicher Warengruppen im Sortiment eines Händlers.`,Sortimentstiefe:`Anzahl verschiedener Varianten/Ausführungen innerhalb einer Warengruppe.`,"Spaced Repetition":`Lernmethode mit zeitlich gestaffelten Wiederholungen – Basis des Anki-Algorithmus, maximal effizient fürs Langzeitgedächtnis.`,Stakeholder:`Alle Personen/Gruppen mit berechtigtem Interesse am Unternehmen (Mitarbeiter, Kunden, Investoren, Staat).`,Stammkapital:`Mindestkapital, das Gesellschafter bei Gründung einer GmbH einbringen müssen (gesetzlich 25.000 €).`,"Stationärer Handel":`Handel mit physischen Verkaufsstellen (Ladengeschäfte) im Gegensatz zum Online-Handel.`,String:`Java-Datentyp für Zeichenketten/Text (z.B. "Hallo Welt") – technisch eine Klasse, kein primitiver Typ.`,"T-Konto":`Visuelle Darstellung eines Buchführungskontos in T-Form: links Soll, rechts Haben.`,"TCP/IP":`Grundlegendes Protokollpaar des Internets – TCP sichert zuverlässige Übertragung, IP adressiert Geräte.`,TOPO:`Try Offline, Purchase Online – Kunde probiert im Laden, kauft aber günstiger online.`,Trust:`Vertrauen des Kunden in einen Online-Shop – entscheidender Faktor für die Kaufentscheidung im E-Commerce.`,UG:`Unternehmergesellschaft (haftungsbeschränkt) – vereinfachte GmbH-Variante, gründbar bereits ab 1 € Stammkapital.`,Umlaufvermögen:`Kurzfristig im Unternehmen gebundenes Vermögen (Waren, Forderungen, Kasse) – Teil der Aktivseite.`,Umsatzsteuer:`Steuer auf Warenverkäufe (19% bzw. 7%), die Unternehmen einnehmen und ans Finanzamt abführen.`,Utilitaristisch:`Kaufmotivation, die rein zweckorientiert und rational ist – Gegensatz zum hedonistischen Kauf.`,Variable:`Benannter Speicherplatz in Java, der einen Wert eines bestimmten Datentyps enthält.`,Vererbung:`OOP-Prinzip, bei dem eine Unterklasse Attribute und Methoden einer Oberklasse automatisch übernimmt.`,"Von-Neumann":`Klassische Computerarchitektur mit gemeinsamem Speicher für Programme und Daten, gesteuert durch eine CPU.`,Vorsteuer:`Umsatzsteuer, die ein Unternehmen beim Einkauf zahlt und vom Finanzamt zurückerstattet bekommt.`,Wahrheitstabelle:`Tabellarische Darstellung aller möglichen Ein-/Ausgabe-Kombinationen einer logischen Operation.`,Wertschöpfungskette:`Abfolge von Aktivitäten, die ein Produkt vom Rohstoff bis zum Endkunden durchläuft und dabei an Wert gewinnt.`,Wiederholung:`Aktives erneutes Durcharbeiten von bereits gelerntem Stoff zur Festigung im Langzeitgedächtnis.`,Wirtschaftlichkeit:`Verhältnis von erzieltem Ertrag zu eingesetzten Mitteln – zentrales ökonomisches Prinzip.`,Wissenschaftssprache:`Präzise, unpersönliche und sachliche Ausdrucksweise, die in akademischen Arbeiten erwartet wird.`,XOR:`Boolescher Operator (Exklusiv-Oder) – wahr, wenn GENAU EINE der beiden Eingaben wahr ist.`,Zahlungsausfallrisiko:`Risiko des Händlers, dass ein Kunde nach Lieferung nicht bezahlt (besonders bei Kauf auf Rechnung).`,Zitation:`Korrekte Kennzeichnung übernommener Gedanken/Texte mit Quellenangabe in wissenschaftlichen Arbeiten.`,bevh:`Bundesverband E-Commerce und Versandhandel Deutschland – wichtigste Quelle für deutsche E-Commerce-Marktzahlen.`,boolean:`Java-Datentyp, der nur zwei Werte annehmen kann: true oder false.`,break:`Java-Schlüsselwort, das eine Schleife oder switch-Anweisung sofort beendet.`,continue:`Java-Schlüsselwort, das den Rest der aktuellen Schleifeniteration überspringt und zur nächsten springt.`,"dispositiver Faktor":`Vierter Produktionsfaktor – die Leitungs- und Entscheidungsfunktion des Managements/Unternehmers.`,"do-while":`Java-Schleifentyp, der den Code-Block mindestens einmal ausführt und die Bedingung erst danach prüft (Gegensatz zu while).`,"doppelte Buchführung":`Buchführungssystem, bei dem jeder Geschäftsvorfall auf mindestens zwei Konten erfasst wird (Soll und Haben).`,"externes Rechnungswesen":`Rechnungswesen-Teil, der für außenstehende Adressaten (Finanzamt, Investoren) gesetzlich vorgeschrieben ist – z.B. Bilanz, GuV.`,"for-Schleife":`Java-Schleifentyp für eine bekannte Anzahl von Wiederholungen, z.B. for(int i=0;i<10;i++).`,"if-else":`Java-Kontrollstruktur zur bedingten Ausführung von Code-Blöcken je nach Wahrheitswert einer Bedingung.`,int:`Java-Datentyp für ganze Zahlen (ohne Nachkommastellen), z.B. int menge = 5;`,switch:`Java-Kontrollstruktur zur übersichtlichen Auswahl zwischen vielen festen Fällen (Alternative zu langen if-else-Ketten).`,"while-Schleife":`Java-Schleifentyp, der läuft, solange eine Bedingung wahr ist – Anzahl der Durchläufe ist vorher unbekannt.`,"§ 238 HGB":`Zentrale Gesetzesvorschrift, die die Buchführungspflicht für Kaufleute in Deutschland festlegt.`,Überbrückungsfunktion:`Handelsfunktion, die Raum- und Zeitunterschiede zwischen Herstellung und Verbrauch eines Gutes überbrückt.`}})),qO,JO,YO,XO,ZO,QO,$O,ek,tk,nk,rk,ik=o((()=>{qO=`_termWrap_wphbi_3`,JO=`_termBtn_wphbi_9`,YO=`_termBtnOpen_wphbi_23`,XO=`_termPopup_wphbi_29`,ZO=`_termPopupTitle_wphbi_37`,QO=`_termPopupText_wphbi_49`,$O=`_subHead_wphbi_55`,ek=`_subDot_wphbi_65`,tk=`_subDetail_wphbi_73`,nk=`_subDesc_wphbi_78`,rk={termWrap:qO,termBtn:JO,termBtnOpen:YO,termPopup:XO,termPopupTitle:ZO,termPopupText:QO,subHead:$O,subDot:ek,subDetail:tk,subDesc:nk}})),ak,ok,sk,ck=o((()=>{ak=u(p(),1),Ab(),HC(),fx(),KO(),Fb(),ik(),ok=A(),sk=(0,ak.memo)(function({term:e,color:t,isOpen:n,onToggle:r}){let i=GO[e];return(0,ok.jsxs)(`div`,{className:rk.termWrap,style:{"--c":t},children:[(0,ok.jsxs)(`button`,{className:Nb(rk.termBtn,n&&rk.termBtnOpen,`hover-pop`),onClick:r,"aria-expanded":n,children:[e,(0,ok.jsx)(Ob.span,{animate:{rotate:n?180:0},style:{display:`inline-flex`},children:(0,ok.jsx)(pS,{size:11,"aria-hidden":`true`})})]}),n&&i&&(0,ok.jsx)(Ob.div,{initial:{opacity:0,y:-4,scale:.98},animate:{opacity:1,y:0,scale:1},children:(0,ok.jsxs)(W,{tint:t,className:rk.termPopup,children:[(0,ok.jsxs)(`div`,{className:rk.termPopupTitle,children:[(0,ok.jsx)(`span`,{className:rk.subDot,"aria-hidden":`true`}),e]}),(0,ok.jsx)(`p`,{className:rk.termPopupText,children:i})]})})]})})})),lk,uk=o((()=>{Hr(),lk={1:{lernziel:`Du verstehst, was Betriebswirtschaftslehre als Wissenschaft bedeutet und warum BWL-Grundkenntnisse für E-Commerce-Führungskräfte unerlässlich sind. Du unterscheidest die drei Güterarten (Sachgüter, Dienstleistungen, Rechte), kennst die vier betrieblichen Produktionsfaktoren und kannst das Wirtschaftlichkeitsprinzip in seinen beiden Ausprägungen (Minimal- und Maximalprinzip) mit konkreten E-Commerce-Beispielen erklären.`,prüfung:`Klausur BWL EC: Minimal-/Maximalprinzip mit Zahlenbeispiel, Güterarten klassifizieren, Produktionsfaktoren benennen (Arbeit, Betriebsmittel, Werkstoffe, dispositiver Faktor), betriebliche Ziele und Zielkonflikte erläutern`,begriffe:[`Wirtschaftlichkeit`,`Güterarten`,`Produktionsfaktoren`,`Stakeholder`,`Minimalprinzip`,`Maximalprinzip`,`dispositiver Faktor`],subs:[{t:`Wirtschaft & knappe Güter`,desc:`Wirtschaft entsteht, weil Bedürfnisse der Menschen unbegrenzt sind, aber Güter knapp. Die BWL untersucht, wie Unternehmen mit diesen knappen Ressourcen (Produktionsfaktoren) möglichst effizient umgehen. Für E-Commerce bedeutet das: Wie setzt ein Online-Händler sein Budget (Kapital) und seine Mitarbeiter (Arbeit) optimal ein?`,items:[{c:`▶`,l:`SimpleClub – Was ist BWL?`,u:M(`SimpleClub Was ist BWL`)},{c:`▶`,l:`Studyflix – Güterarten`,u:N(`Güterarten Wirtschaft`)},{c:`🧠`,l:`Knowunity BWL Grundlagen`,u:P(`BWL Grundlagen Wirtschaft Güter`)},{c:`💬`,l:`Studocu BWL`,u:Br(`BWL Wirtschaft Grundlagen Hochschule`)}]},{t:`Wirtschaftlichkeitsprinzip & betriebliche Ziele`,desc:`Das Wirtschaftlichkeitsprinzip besagt: Entweder ein gegebenes Ziel mit minimalem Einsatz erreichen (Minimalprinzip) – oder mit gegebenem Einsatz das Maximum herausholen (Maximalprinzip). Betriebliche Ziele umfassen Sachziele (Produkte, Dienstleistungen), Formalziele (Gewinn, Liquidität) und soziale Ziele. Zielkonflikte entstehen z.B., wenn Nachhaltigkeitsziele den Gewinn kurzfristig senken.`,items:[{c:`▶`,l:`YouTube – Wirtschaftlichkeitsprinzip`,u:M(`Wirtschaftlichkeitsprinzip Minimal Maximalprinzip BWL`)},{c:`▶`,l:`Studyflix – Betriebliche Ziele`,u:N(`betriebliche Ziele Unternehmen`)},{c:`🧠`,l:`Knowunity – Zielkonflikte`,u:P(`betriebliche Ziele Zielkonflikte BWL`)},{c:`💬`,l:`Studocu – BWL Zusammenfassung`,u:Br(`BWL Grundlagen Unternehmensziele Hochschule`)}]}]},2:{lernziel:`Du kennst die wichtigsten deutschen Unternehmensrechtsformen und kannst für jeden Online-Shop-Typ die passende empfehlen. Du verstehst den grundlegenden Unterschied zwischen Personen- (GbR, OHG, KG) und Kapitalgesellschaften (GmbH, AG, UG), insbesondere hinsichtlich Haftung, Stammkapital und Gründungsaufwand. Du weißt, warum die meisten E-Commerce-Startups die UG oder GmbH wählen und ab wann eine AG sinnvoll ist.`,prüfung:`Klausur BWL EC: Rechtsformen-Tabelle vervollständigen (Haftung, Stammkapital, Leitungsorgan, Mindestpersonen), Unterschied GmbH vs. AG erklären, passende Rechtsform für ein Unternehmensbeispiel empfehlen und begründen`,begriffe:[`GmbH`,`AG`,`UG`,`GbR`,`Haftungsbeschränkung`,`Stammkapital`,`Handelsregister`,`Kapitalgesellschaft`],subs:[{t:`Rechtsformen im Überblick`,desc:`Deutschland kennt sechs wichtige Rechtsformen: Einzelunternehmen (volle Haftung, kein Mindestkapital), GbR (mindestens 2 Personen, unbeschränkte Haftung), GmbH (25.000 € Stammkapital, beschränkte Haftung – die häufigste Wahl für Online-Shops), UG (ab 1 € Stammkapital, vereinfachte GmbH), AG (50.000 € Grundkapital, für börsennotierte Unternehmen) und KG/OHG.`,items:[{c:`▶`,l:`Studyflix – Rechtsformen`,u:N(`Rechtsformen GmbH AG UG`)},{c:`🧠`,l:`Knowunity – Rechtsformen Tabelle`,u:P(`Rechtsformen GmbH AG Vergleich Tabelle`)},{c:`💬`,l:`Studocu – Rechtsformen`,u:Br(`Rechtsformen Unternehmen GmbH AG Hochschule`)},{c:`▶`,l:`YouTube – GmbH erklärt`,u:M(`GmbH einfach erklärt Gründung Stammkapital`)}]},{t:`Haftung & Kapital – Entscheidungskriterien für E-Commerce`,desc:`Das zentrale Entscheidungskriterium ist die Haftungsfrage: Wer für Verbindlichkeiten des Unternehmens persönlich einsteht. Bei GmbH und AG haftet nur das Gesellschaftsvermögen. Für einen neuen Online-Shop empfiehlt sich die UG (haftungsbeschränkt) als günstiger Einstieg – mit der Option auf spätere Umwandlung in eine GmbH, sobald ausreichend Rücklagen gebildet wurden.`,items:[{c:`▶`,l:`YouTube – Rechtsform wählen E-Commerce`,u:M(`Welche Rechtsform Online-Shop E-Commerce GmbH UG`)},{c:`🧠`,l:`Knowunity – Haftung Rechtsformen`,u:P(`Haftung Rechtsformen Unterschiede`)},{c:`💬`,l:`Studocu – Rechtsform Praxisfall`,u:Br(`Rechtsformen E-Commerce Online-Shop Hochschule`)}]}]},3:{lernziel:`Du verstehst, warum Buchführung gesetzlich verpflichtend ist und welche Kaufleute dem HGB unterliegen. Du kennst den Unterschied zwischen freiwilliger und gesetzlicher Buchführungspflicht, den Ablauf einer Inventur und was das Inventar von der Bilanz unterscheidet. Du verstehst die sechs Grundsätze ordnungsmäßiger Buchführung (GoB) und warum sie insbesondere für E-Commerce-Unternehmen mit internationalen Lieferanten relevant sind.`,prüfung:`Klausur BWL EC: GoB nennen und erklären, Buchführungspflicht nach § 238 HGB beschreiben, Unterschied Inventur / Inventar / Bilanz erläutern, Kaufmannsbegriff definieren`,begriffe:[`HGB`,`Buchführungspflicht`,`GoB`,`Inventur`,`Inventar`,`Kaufmann`,`externes Rechnungswesen`,`§ 238 HGB`],subs:[{t:`Buchführungspflicht nach HGB`,desc:`Nach § 238 HGB ist jeder Kaufmann verpflichtet, Bücher zu führen und in diesen seine Handelsgeschäfte und die Lage seines Vermögens nach den Grundsätzen ordnungsmäßiger Buchführung ersichtlich zu machen. Ein Online-Händler, der als Einzelkaufmann oder GmbH handelt, unterliegt dieser Pflicht. Kleinunternehmer unter 600.000 € Umsatz können unter Umständen eine vereinfachte EÜR nutzen.`,items:[{c:`▶`,l:`YouTube – Buchführungspflicht HGB`,u:M(`Buchführungspflicht HGB § 238 Kaufleute`)},{c:`📚`,l:`wiwiweb.de Buchführung`,u:`https://www.wiwiweb.de/`},{c:`🧠`,l:`Knowunity – Buchführungspflicht`,u:P(`Buchführung Pflicht HGB Grundlagen`)},{c:`💬`,l:`Studocu – Rechnungswesen`,u:Br(`Buchführung Rechnungswesen Grundlagen Hochschule`)}]},{t:`GoB – 6 Grundsätze ordnungsmäßiger Buchführung`,desc:`Die GoB sind ungeschriebene Regeln der Buchführungspraxis: (1) Richtigkeit & Willkürfreiheit, (2) Vollständigkeit, (3) Übersichtlichkeit & Nachvollziehbarkeit, (4) Einzelbewertung, (5) Vorsichtsprinzip, (6) Periodenabgrenzung (Abgrenzungsprinzip). Für E-Commerce besonders relevant: Das Vorsichtsprinzip beim Bewerten von Warenbeständen und das Realisationsprinzip bei mehrmonatigen Softwareprojekten.`,items:[{c:`▶`,l:`YouTube – GoB erklärt`,u:M(`Grundsätze ordnungsmäßiger Buchführung GoB einfach erklärt`)},{c:`▶`,l:`Studyflix – Rechnungswesen`,u:N(`Rechnungswesen Grundlagen Überblick`)},{c:`🧠`,l:`Knowunity – GoB`,u:P(`GoB Grundsätze ordnungsmäßige Buchführung`)}]}]},4:{lernziel:`Du beherrschst das Grundprinzip der doppelten Buchführung: Jeder Geschäftsvorfall wird auf zwei Konten gebucht – einmal im Soll und einmal im Haben. Du kannst T-Konten für Aktiv- und Passivkonten korrekt anlegen, eröffnen und abschließen. Du verstehst die Merkregel 'Soll an Haben' und kannst für gängige E-Commerce-Vorgänge (Wareneingang auf Ziel, PayPal-Zahlung, Kauf auf Rechnung) eigenständig Buchungssätze bilden.`,prüfung:`Klausur BWL EC: T-Konten eröffnen und führen, Buchungssätze bilden (z.B. Waren auf Ziel kaufen: Wareneingang 500 € an Verbindlichkeiten 500 €), Saldo berechnen, Abschluss eines Aktivkontos`,begriffe:[`Soll`,`Haben`,`T-Konto`,`Buchungssatz`,`Aktivkonto`,`Passivkonto`,`Saldo`,`doppelte Buchführung`],subs:[{t:`Das T-Konto – Soll links, Haben rechts`,desc:`Das T-Konto ist die visuelle Grundlage der Buchführung. Links steht immer das Soll, rechts immer das Haben – unabhängig davon, ob es ein Aktiv- oder Passivkonto ist. Bei Aktivkonten (z.B. Kasse) bedeutet eine Buchung im Soll eine Erhöhung; bei Passivkonten (z.B. Verbindlichkeiten) bedeutet eine Buchung im Haben eine Erhöhung. Ein Shop-Beispiel: Warenbestand (Aktiv) steigt durch Wareneinkauf → Buchung im Soll.`,items:[{c:`▶`,l:`Studyflix – Soll & Haben`,u:N(`Soll Haben T-Konto Buchführung`)},{c:`📚`,l:`wiwiweb.de – T-Konto Übungen`,u:`https://www.wiwiweb.de/`},{c:`🧠`,l:`Knowunity – T-Konten`,u:P(`T-Konto Buchführung Soll Haben`)},{c:`💬`,l:`Studocu – Buchungssätze Aufgaben`,u:Br(`Buchungssätze T-Konto Aufgaben Lösungen`)}]},{t:`Buchungssätze für E-Commerce-Vorgänge`,desc:`Praxisbeispiele für Buchungssätze: (1) Wareneinkauf auf Ziel: Wareneingang 500 € / Verbindlichkeiten 500 €. (2) Zahlung per Banküberweisung: Verbindlichkeiten 500 € / Bank 500 €. (3) Online-Verkauf (Ausgangsrechnung): Forderungen 119 € / Umsatzerlöse 100 € / USt 19 €. Diese Vorgänge erscheinen regelmäßig in der Klausur!`,items:[{c:`▶`,l:`YouTube – Buchungssatz bilden`,u:M(`Buchungssatz bilden Soll Haben einfach erklärt`)},{c:`▶`,l:`Studyflix – Buchungssatz`,u:N(`Buchungssatz Schema`)},{c:`🧠`,l:`Knowunity – Buchungssätze E-Commerce`,u:P(`Buchungssätze Wareneinkauf Verkauf Buchführung`)}]}]},5:{lernziel:`Du kannst eine Bilanz lesen und die wichtigsten Positionen auf Aktiv- (Anlagevermögen, Umlaufvermögen) und Passivseite (Eigenkapital, Fremdkapital) einordnen. Du verstehst, wie die Gewinn- und Verlustrechnung (GuV) aufgebaut ist und erkennst den Zusammenhang zwischen Bilanz, GuV und Eigenkapital. Du kannst die vier Bilanzveränderungstypen unterscheiden.`,prüfung:`Klausur BWL EC: Bilanzpositionen zuordnen (aktiv oder passiv?), Bilanzveränderungstypen nennen und erkennen, GuV-Schema ausfüllen, Jahresüberschuss/-fehlbetrag berechnen, Bilanzsumme-Gleichung (Aktiva = Passiva) anwenden`,begriffe:[`Aktiva`,`Passiva`,`Eigenkapital`,`Fremdkapital`,`Anlagevermögen`,`Umlaufvermögen`,`Jahresüberschuss`,`Bilanzsumme`],subs:[{t:`Bilanzaufbau – Aktiva und Passiva`,desc:`Die Bilanz ist eine Momentaufnahme des Vermögens (Aktiva) und der Finanzierung (Passiva) zu einem Stichtag. Aktiva: Anlagevermögen (langfristig: Maschinen, Software, Patente) + Umlaufvermögen (kurzfristig: Waren, Forderungen, Kasse). Passiva: Eigenkapital (was Eigentümer eingebracht haben) + Fremdkapital (Schulden bei Banken, Lieferanten). Für Zalando bedeutet das: Lagerwaren und Forderungen aus Retouren sind das größte Umlaufvermögen.`,items:[{c:`▶`,l:`Studyflix – Bilanz erklärt`,u:N(`Bilanz Aktiva Passiva Aufbau`)},{c:`🧠`,l:`Knowunity – Bilanz Aufbau`,u:P(`Bilanz Aktiva Passiva Aufbau einfach`)},{c:`💬`,l:`Studocu – Bilanz Aufgaben`,u:Br(`Bilanz Jahresabschluss BWL Hochschule Aufgaben`)}]},{t:`GuV & die 4 Bilanzveränderungstypen`,desc:`Die GuV zeigt Ertrag vs. Aufwand in einer Periode. Vier Bilanzveränderungstypen: (1) Aktiv-Tausch: Kasse ↑, Bank ↓ – Bilanzsumme gleich. (2) Passiv-Tausch: EK ↑, Verbindlichkeiten ↓. (3) Aktiv-Passiv-Mehrung: Ware ↑ (Aktiv), Verbindlichkeiten ↑ (Passiv) – Bilanzsumme steigt. (4) Aktiv-Passiv-Minderung: Bank ↓, Kredit ↓ – Bilanzsumme sinkt.`,items:[{c:`▶`,l:`Studyflix – GuV Rechnung`,u:N(`GuV Gewinn Verlustrechnung Aufbau`)},{c:`▶`,l:`YouTube – Bilanzveränderungen`,u:M(`Bilanzveränderungen 4 Typen Buchführung einfach`)},{c:`🧠`,l:`Knowunity – GuV`,u:P(`GuV Gewinn Verlustrechnung einfach Aufbau`)}]}]},6:{lernziel:`Du verstehst, warum Anlagevermögen abgeschrieben wird und kannst lineare und degressive Abschreibung für typische E-Commerce-Assets (Server, Laptop, Lagerhalle) berechnen. Du kennst den Unterschied zwischen Vorsteuer (VSt) und Umsatzsteuer (USt) aus Händler- und Kundensicht und kannst den USt-Buchungssatz für einen Online-Kauf korrekt bilden.`,prüfung:`Klausur BWL EC: Jahresabschreibung linear berechnen (Anschaffungskosten / Nutzungsdauer), Buchwert zum Stichtag ermitteln, USt-Buchungssatz bilden (Nettobetrag / USt 19% / Bruttobetrag), Vorsteuer vs. Umsatzsteuer aus Unternehmenssicht erklären`,begriffe:[`Abschreibung`,`AfA`,`Buchwert`,`Restbuchwert`,`Vorsteuer`,`Umsatzsteuer`,`Nutzungsdauer`,`Anschaffungskosten`],subs:[{t:`Lineare Abschreibung & AfA-Tabelle`,desc:`Anlagevermögen verliert durch Nutzung an Wert. Die lineare Abschreibung verteilt die Kosten gleichmäßig über die Nutzungsdauer: AfA = Anschaffungskosten / Nutzungsdauer. Beispiel Shopify-Server-Hardware: 12.000 € / 4 Jahre = 3.000 €/Jahr. Das Finanzamt gibt in der AfA-Tabelle vor, wie lange verschiedene Güter genutzt werden dürfen (PC = 3 Jahre, Lkw = 6 Jahre, Gebäude = 33 Jahre).`,items:[{c:`▶`,l:`Studyflix – Abschreibungsarten`,u:N(`Abschreibung linear degressiv AfA`)},{c:`🧠`,l:`Knowunity – Abschreibung Aufgaben`,u:P(`Abschreibung lineare Berechnung Aufgaben`)},{c:`💬`,l:`Studocu – Abschreibung Lösungen`,u:Br(`Abschreibungen Rechnungswesen Aufgaben Lösungen`)},{c:`▶`,l:`YouTube – AfA Buchwert berechnen`,u:M(`Abschreibung AfA Buchwert berechnen Beispiel`)}]},{t:`Umsatzsteuer – VSt & USt im E-Commerce`,desc:`Als Unternehmer zahlst du beim Einkauf Vorsteuer (VSt), die du vom Finanzamt zurückholst, und erhebst beim Verkauf Umsatzsteuer (USt), die du ans Finanzamt abführst. Du bist quasi Steuereinnehmer des Staates. Buchungssatz Warenverkauf: Forderungen 119 € / Umsatzerlöse 100 € / USt-Verbindlichkeiten 19 €. Im EU-Onlinehandel: Ab 10.000 € Jahresumsatz grenzüberschreitend greift das OSS-Verfahren (One Stop Shop).`,items:[{c:`▶`,l:`Studyflix – Umsatzsteuer`,u:N(`Umsatzsteuer Vorsteuer einfach erklärt`)},{c:`🧠`,l:`Knowunity – USt Buchungssatz`,u:P(`Umsatzsteuer Vorsteuer Buchungssatz`)},{c:`▶`,l:`YouTube – USt E-Commerce`,u:M(`Umsatzsteuer E-Commerce Online-Handel OSS`)}]}]},7:{lernziel:`Du festigst alle Inhalte aus Woche 1 durch aktive Wiederholung mit Anki und Mind-Map. Ziel: Du kannst ohne Hilfsmittel T-Konten aufstellen, Buchungssätze bilden, die 4 Bilanzveränderungstypen nennen und das Wirtschaftlichkeitsprinzip erklären. Spaced Repetition (Anki) ist bewiesen die effektivste Methode für Klausurvorbereitung.`,prüfung:`Gesamtwiederholung Woche 1 – alle Themen sind direkt klausurrelevant im BWL-EC-Modul`,begriffe:[`Spaced Repetition`,`Aktives Erinnern`,`Mind-Map`,`Anki`,`Wiederholung`,`Lernkurve`],subs:[{t:`Anki effektiv nutzen – Spaced Repetition`,desc:`Anki ist eine Karteikarten-App, die auf dem Prinzip des Spaced Repetition basiert: Karten, die du noch nicht gut kennst, zeigt sie öfter; sichere Karten weniger oft. Damit lernst du in minimalster Zeit maximal viel. Erstelle für jede BWL-Definition und jeden Buchungssatz eine eigene Karte. Ziel für Woche 1: 35+ Karten, Trefferquote > 80%.`,items:[{c:`🃏`,l:`Anki App (iOS/Android/Desktop)`,u:`https://apps.ankiweb.net/`},{c:`▶`,l:`YouTube – Anki Tutorial Deutsch`,u:M(`Anki Tutorial Deutsch Karteikarten Spaced Repetition`)},{c:`🧠`,l:`Knowunity – BWL Gesamtübersicht`,u:P(`BWL Zusammenfassung Prüfungsvorbereitung`)}]},{t:`Mind-Map als Verbindungsstruktur`,desc:`Zeichne eine Mind-Map mit 'BWL' im Zentrum und allen 6 Themen der Woche als Äste: Grundbegriffe, Rechtsformen, Buchführung, Soll/Haben, Bilanz, Abschreibungen. Trage unter jedem Ast die wichtigsten 3 Schlüsselbegriffe ein. Das visuelle Ordnen stärkt das Langzeitgedächtnis und hilft dir, Klausurthemen schnell einzuordnen.`,items:[{c:`▶`,l:`YouTube – Mind-Map Methode`,u:M(`Mind Map erstellen Lernmethode effektiv`)},{c:`💬`,l:`Studocu – BWL Klausur`,u:Br(`BWL Klausuraufgaben Lösungen Hochschule`)}]}]},8:{lernziel:`Du verstehst, was Handelsmanagement als Disziplin bedeutet und welche wirtschaftliche Funktion Handelsbetriebe in der Wertschöpfungskette übernehmen. Du kennst die 5 klassischen Handelsfunktionen und kannst erklären, wie E-Commerce diese verändert oder teilweise obsolet macht. Du kennst die 10 Handelskompetenzen nach dem HBL-EC-Modul der HRW.`,prüfung:`Klausur HBL EC: 5 Handelsfunktionen nennen und beschreiben, Unterschied Einzel-/Großhandel, Disintermediation erklären, Handelskompetenzen benennen`,begriffe:[`Handelsfunktion`,`Einzelhandel`,`Großhandel`,`Disintermediation`,`Handelsmanagement`,`Wertschöpfungskette`,`Überbrückungsfunktion`],subs:[{t:`Die 5 klassischen Handelsfunktionen`,desc:`Handelsbetriebe erfüllen 5 Funktionen: (1) Überbrückungsfunktion (Raum & Zeit: Ware vom Hersteller zum Kunden bringen), (2) Quantitätsfunktion (große Mengen vom Hersteller, kleine an Kunden), (3) Qualitätsfunktion (Sortimentszusammenstellung), (4) Kreditfunktion (Kauf auf Rechnung ermöglichen), (5) Werbefunktion (Produkte bekannt machen). Im E-Commerce entfallen teilweise Raum- und Zeitfunktionen durch Direktversand (Dropshipping).`,items:[{c:`▶`,l:`YouTube – Handelsfunktionen`,u:M(`Handelsfunktionen 5 Funktionen Handel erklärt`)},{c:`🧠`,l:`Knowunity – Handelsmanagement`,u:P(`Handelsmanagement Handelsfunktionen Einzelhandel`)},{c:`💬`,l:`Studocu – HBL Zusammenfassung`,u:Br(`Handelsmanagement HBL Zusammenfassung Hochschule`)}]},{t:`Disintermediation – wenn Handel überflüssig wird`,desc:`Disintermediation beschreibt die Ausschaltung von Handelsstufen durch das Internet: Hersteller können direkt an Endkunden verkaufen (D2C). Nike verkauft über nike.com direkt, Tesla über eigene Showrooms. Das zwingt den traditionellen Handel zur Spezialisierung und Innovation. Im HBL-EC-Modul ist dieser Wandel ein zentrales Thema.`,items:[{c:`▶`,l:`YouTube – Disintermediation`,u:M(`Disintermediation Handel Internet D2C erklärt`)},{c:`📖`,l:`Gabler – Handelsmanagement`,u:`https://wirtschaftslexikon.gabler.de/`},{c:`📊`,l:`HDE – Handelsdaten`,u:`https://einzelhandel.de/`}]}]},9:{lernziel:`Du kannst die verschiedenen Betriebstypen des stationären und digitalen Handels unterscheiden: Fachhandel, Verbrauchermarkt, Discounter, Versandhandel, Online-Marktplatz. Du verstehst Sortimentsstrategie (Breite vs. Tiefe) und Category Management und erkennst den Unterschied zwischen Multi-, Cross- und Omnichannel-Handel.`,prüfung:`Klausur HBL EC: Betriebstypen zuordnen und Beispiele nennen, Sortimentsbreite vs. -tiefe erläutern, Omnichannel vs. Multichannel unterscheiden, Category Management beschreiben`,begriffe:[`Betriebstyp`,`Sortimentsbreite`,`Sortimentstiefe`,`Category Management`,`Omnichannel`,`Multichannel`,`Fachhandel`,`Discounter`],subs:[{t:`Betriebstypen im Überblick`,desc:`Fachhandel: tiefes Sortiment (z.B. MediaMarkt für Elektronik), hohe Beratungskompetenz. Verbrauchermarkt/SB-Warenhaus: breites, tiefes Sortiment (Kaufland). Discounter: schmales, flaches Sortiment, Preisführerschaft (Aldi, Lidl). Versandhandel/E-Commerce: kein stationärer Punkt, unbegrenzte Sortimentsbreite möglich (Amazon). Marktplatz: Plattform für Drittanbieter (Amazon Marketplace, Etsy).`,items:[{c:`▶`,l:`YouTube – Betriebstypen`,u:M(`Betriebstypen Einzelhandel Fachhandel Discounter Verbrauchermarkt`)},{c:`🧠`,l:`Knowunity – Betriebstypen`,u:P(`Betriebstypen Handel Übersicht`)},{c:`💬`,l:`Studocu – HBL Mitschriften`,u:Br(`Handelsmanagement Betriebstypen Sortiment`)}]},{t:`Omnichannel – die Zukunft des Handels`,desc:`Omnichannel bedeutet, dass alle Verkaufskanäle (Filiale, Website, App, Social Commerce) nahtlos vernetzt sind und ein einheitliches Kundenerlebnis bieten: Bestellung online, Abholung im Laden (Click & Collect), Rückgabe im Store. Im Gegensatz zu Multichannel, bei dem Kanäle parallel, aber getrennt existieren. Zalando und H&M sind Paradebeispiele für Omnichannel-Händler.`,items:[{c:`▶`,l:`YouTube – Omnichannel erklärt`,u:M(`Omnichannel Multichannel Crosschannel Unterschied`)},{c:`📊`,l:`HDE Handelsverband`,u:`https://einzelhandel.de/`},{c:`🧠`,l:`Knowunity – Omnichannel`,u:P(`Omnichannel Multichannel Handel erklärt`)}]}]},10:{lernziel:`Du kennst die aktuellen Umsatzzahlen des deutschen E-Commerce-Markts und kannst die wichtigsten Entwicklungsphasen seit 1995 benennen. Du verstehst, warum Online-Handel ein Disruptor für den stationären Handel ist und welche Unternehmen als 'GAFA' bezeichnet werden. Du kannst die Wertschöpfungsstufen des E-Commerce beschreiben.`,prüfung:`Klausur ECM: E-Commerce Umsatzzahlen DE (aktuelle Größenordnung kennen), Entwicklungsgeschichte Internethandel, Disruption und Disintermediation erklären, GAFA beschreiben`,begriffe:[`E-Commerce`,`Disruption`,`GAFA`,`Wertschöpfungskette`,`Stationärer Handel`,`bevh`,`Corona-Effekt`],subs:[{t:`E-Commerce Entwicklung & aktuelle Zahlen`,desc:`Deutsche E-Commerce-Geschichte: 1995 erste Online-Shops, 1999 eBay & Amazon DE, 2005 Zalando-Gründung, 2011–2019 kontinuierliches Wachstum, 2020–2021 Corona-Boom (+30%), danach Normalisierung. Heute: Laut bevh erzielte der deutsche Online-Handel 2023 ca. 79,7 Mrd. Euro Umsatz. Die wichtigsten Kategorien: Mode, Elektronik, Möbel. Amazon, Otto und Zalando sind die Top-3-Plattformen in Deutschland.`,items:[{c:`📊`,l:`Statista – E-Commerce DE Umsatz`,u:`https://de.statista.com/themen/3979/e-commerce-in-deutschland/`},{c:`📊`,l:`bevh – Marktdaten`,u:`https://www.bevh.org/zahlen-daten-fakten/`},{c:`📖`,l:`Deges Kap.1.5 – Ökonomische Bedeutung (S.20)`,u:j(36)},{c:`📖`,l:`Deges Kap.1.5.3 – Corona-Effekt (S.26)`,u:j(42)}]},{t:`Disruption durch E-Commerce`,desc:`E-Commerce hat ganze Branchen disruptiert: Buchhandel (Hugendubel schließt Filialen wegen Amazon), Musik (CD-Handel ersetzt durch Streaming), Reisebüros (durch booking.com). Disruption nach Christensen: Neue Technologie tritt zunächst im Niedrigpreissegment an und verdrängt dann die etablierten Spieler von unten. Im HRW-Modul ECM ist dieses Konzept Prüfungsstoff.`,items:[{c:`📖`,l:`Deges Kap.1.4 – Disruption (S.16)`,u:j(32)},{c:`▶`,l:`YouTube – Disruption Handel`,u:M(`Disruption Branchentransformation E-Commerce stationärer Handel`)}]}]},11:{lernziel:`Du unterscheidest sicher zwischen B2C, B2B, C2C und D2C und kannst für jedes Modell drei reale Beispiele nennen. Du verstehst das Konzept der Plattformökonomie mit Netzeffekten und kannst erklären, warum Marktplätze wie Amazon Daten als Wettbewerbsvorteil nutzen. Du kennst den Unterschied zwischen Online-Direktgeschäft und Marktplatzmodell.`,prüfung:`Klausur ECM: Geschäftsmodelle definieren und mit Beispielen belegen, Netzwerkeffekte erklären, Vor-/Nachteile Marktplatz vs. eigener Shop, Plattformökonomie beschreiben`,begriffe:[`B2C`,`B2B`,`C2C`,`D2C`,`Plattform`,`Netzwerkeffekte`,`Marktplatz`,`Direktgeschäft`],subs:[{t:`Geschäftsmodelle im E-Commerce`,desc:`B2C (Business-to-Consumer): Unternehmen an Endverbraucher (Zalando, Amazon Retail). B2B (Business-to-Business): Unternehmen an Unternehmen (Amazon Business, Alibaba). C2C (Consumer-to-Consumer): Verbraucher an Verbraucher über Plattform (eBay Kleinanzeigen, Vinted). D2C (Direct-to-Consumer): Hersteller direkt an Endkunde ohne Zwischenhändler (Nike.com, Tesla). D2C wächst stark, weil Hersteller Kundendaten selbst kontrollieren wollen.`,items:[{c:`📖`,l:`Deges Kap.2.1 – Marktformen (S.53)`,u:j(68)},{c:`📖`,l:`Deges Kap.2.1.5 – D2C (S.59)`,u:j(74)},{c:`🧠`,l:`Knowunity – Geschäftsmodelle`,u:P(`B2B B2C D2C Geschäftsmodelle E-Commerce`)},{c:`▶`,l:`YouTube – D2C erklärt`,u:M(`D2C Direct to Consumer Geschäftsmodell erklärt`)}]},{t:`Plattformökonomie & Netzwerkeffekte`,desc:`Plattformen schaffen Mehrwert durch Vernetzung von Angebot und Nachfrage. Je mehr Nutzer eine Plattform hat, desto attraktiver wird sie für neue Nutzer – das sind positive Netzwerkeffekte. Amazon hatte 2023 über 300 Millionen Kunden weltweit und über 2 Millionen aktive Drittanbieter. Diese Datenmacht ermöglicht personalisierte Empfehlungen (Recommendation Engine) und Preisoptimierung in Echtzeit.`,items:[{c:`📖`,l:`Deges Kap.2.3 – Marktplätze (S.62)`,u:j(77)},{c:`📖`,l:`Deges Kap.2.5.3 – Big Data & KI (S.96)`,u:j(111)},{c:`▶`,l:`YouTube – Plattformökonomie`,u:M(`Plattformökonomie Amazon Netzeffekte erklärt`)},{c:`💬`,l:`Studocu – Plattformökonomie`,u:Br(`Plattformökonomie Netzeffekte Hochschule`)}]}]},12:{lernziel:`Du kannst den fünfstufigen Kaufentscheidungsprozess beschreiben und auf Online-Kaufsituationen anwenden. Du kennst den ROPO-Effekt und seinen Gegensatz (TOPO) und verstehst ihre Bedeutung für Omnichannel-Strategien. Du kannst hedonistischen vom utilitaristischen Kauf unterscheiden und verschiedene Konsumententypologien benennen.`,prüfung:`Klausur ECM: Kaufentscheidungsprozess skizzieren (5 Phasen), ROPO-Effekt erklären, Konsumententypologien (hedonistisch, utilitaristisch) unterscheiden, Vertrauen als Kaufhemmnis im E-Commerce`,begriffe:[`Kaufentscheidungsprozess`,`ROPO`,`TOPO`,`Hedonistisch`,`Utilitaristisch`,`Trust`,`Conversion Rate`,`Kaufhemmnis`],subs:[{t:`5-stufiger Kaufentscheidungsprozess`,desc:`(1) Problemerkennung: Ich brauche neue Kopfhörer. (2) Informationssuche: Google, YouTube-Reviews, Amazon-Rezensionen. (3) Alternativbewertung: Sony vs. Apple vs. Sennheiser – Preisvergleich, Testberichte. (4) Kaufentscheidung: Kauf auf Amazon mit Prime. (5) Nachkaufverhalten: Bewertung schreiben, Retoure prüfen, Empfehlung an Freunde. E-Commerce-Händler müssen in jeder Phase präsent sein (SEO, Ads, Trust-Signale, After-Sales).`,items:[{c:`📖`,l:`Deges Kap.4.2 – Kaufentscheidung (S.130)`,u:j(144)},{c:`▶`,l:`YouTube – Kaufentscheidungsprozess`,u:M(`Kaufentscheidungsprozess 5 Phasen E-Commerce`)},{c:`🧠`,l:`Knowunity – Kaufentscheidung`,u:P(`Kaufentscheidungsprozess Konsument Phasen`)}]},{t:`ROPO-Effekt & Konsumententypologien`,desc:`ROPO = Research Online, Purchase Offline: Kunde informiert sich online, kauft aber im Laden. TOPO = Try Offline, Purchase Online: Kunde probiert im Laden an, kauft günstiger online. Beide Effekte zeigen: Online und stationär sind nicht getrennt, sondern verflochten. Konsumententypologien: Hedonisten kaufen aus Freude am Einkaufen (Impulskauf); Utilitaristen kaufen zielorientiert, rational und preisbewusst.`,items:[{c:`📖`,l:`Deges Kap.4.3 – Konsumententypologien (S.139)`,u:j(153)},{c:`▶`,l:`YouTube – ROPO-Effekt`,u:M(`ROPO Effekt Research Online Purchase Offline`)},{c:`💬`,l:`Studocu – Konsumentenverhalten`,u:Br(`Konsumentenverhalten E-Commerce Online Shopping`)}]}]},13:{lernziel:`Du kennst die wichtigsten Zahlungsmethoden im deutschen E-Commerce aus Kunden- und Händlersicht und kannst deren Kosten und Ausfallrisiken einschätzen. Du verstehst Fulfillment-Modelle (Inhouse, 3PL, Dropshipping) und weißt, warum die 'letzte Meile' der teuerste Teil der Lieferkette ist. Du kennst Nachhaltigkeitsansätze im E-Commerce-Versand.`,prüfung:`Klausur ECM: Payment-Methoden Vor-/Nachteile aus Händlersicht nennen, Fulfillment-Modelle beschreiben, Retouren und ihre Kosten erklären, Nachhaltigkeit der letzten Meile`,begriffe:[`Payment Gateway`,`Zahlungsausfallrisiko`,`Fulfillment`,`3PL`,`Dropshipping`,`Letzte Meile`,`Retoure`,`CO2-Kompensation`],subs:[{t:`Payment-Methoden aus Händlersicht`,desc:`Kauf auf Rechnung: Beliebteste Methode in DE (30%+ Marktanteil), hohes Zahlungsausfallrisiko für Händler. PayPal: Schnell, sicher, aber Gebühren 1,5–3%. Klarna (BNPL): Ratenkauf, Händler erhält sofort Geld, Klarna trägt das Ausfallrisiko gegen Gebühr. Kreditkarte: Weltweit, aber chargeback-Risiko. SEPA-Lastschrift: Günstig, aber Rückbuchungsrisiko. Für E-Commerce-Händler: Breites Payment-Angebot erhöht Conversion Rate!`,items:[{c:`▶`,l:`YouTube – Payment E-Commerce`,u:M(`Payment Methoden E-Commerce Vergleich PayPal Klarna Kreditkarte`)},{c:`🧠`,l:`Knowunity – Payment`,u:P(`Payment E-Commerce Zahlungsmethoden Online-Shop`)},{c:`💬`,l:`Studocu – Payment`,u:Br(`Payment Fulfillment E-Commerce Hochschule`)}]},{t:`Fulfillment & Nachhaltigkeit der letzten Meile`,desc:`Fulfillment umfasst: Lagerung, Kommissionierung, Verpackung, Versand, Retouren. 3 Modelle: (1) Inhouse: Händler macht alles selbst (Kontrolle, aber kapitalintensiv). (2) 3PL (Third-Party Logistics): DHL, Hermes übernehmen Logistik. (3) Dropshipping: Hersteller versendet direkt – kein Lager nötig, aber weniger Kontrolle. Die letzte Meile (vom Depot zum Kunden) macht 40–50% der Logistikkosten aus. Nachhaltigkeit: E-Fahrzeuge, Paketstationen, CO2-neutrale Optionen.`,items:[{c:`▶`,l:`YouTube – Fulfillment & Letzte Meile`,u:M(`Fulfillment letzte Meile E-Commerce Logistik erklärt`)},{c:`📊`,l:`DHL Nachhaltigkeit`,u:`https://www.dhl.com/de-de/home/nachhaltigkeit.html`},{c:`🧠`,l:`Knowunity – Logistik`,u:P(`Logistik Fulfillment E-Commerce letzte Meile`)}]}]},14:{lernziel:`Du kennst den strukturellen Aufbau einer wissenschaftlichen Seminararbeit und kannst jeden Abschnitt mit Inhalt füllen. Du verstehst den Unterschied zwischen Primär- und Sekundärquellen, findest seriöse wissenschaftliche Quellen und kannst korrekt zitieren. WICHTIG: Im ECM-Modul Semester 1 schreibst du eine 25-seitige Gruppenarbeit zu einem realen Handelsunternehmen.`,prüfung:`Seminararbeit ECM Sem.1: 25 Seiten Gruppenarbeit, wissenschaftliche Sprache, korrekte Zitation (APA oder Harvard), Literaturverzeichnis, Eigenständigkeitserklärung`,begriffe:[`Seminararbeit`,`Zitation`,`Literaturverzeichnis`,`Primärquelle`,`Sekundärquelle`,`APA-Stil`,`Wissenschaftssprache`,`Plagiat`],subs:[{t:`Aufbau der wissenschaftlichen Seminararbeit`,desc:`Klassischer Aufbau (7 Teile): (1) Titelblatt (Name, Modul, Betreuer, Datum). (2) Inhaltsverzeichnis mit Seitenzahlen. (3) Abbildungsverzeichnis (falls vorhanden). (4) Einleitung (Thema + Fragestellung + Aufbau der Arbeit – ca. 1 Seite). (5) Hauptteil (Theorie, Analyse, Ergebnisse – 20+ Seiten). (6) Fazit & Ausblick (ca. 1 Seite). (7) Literaturverzeichnis. Sprache: Wissenschaftlich, kein 'Ich', unpersönlich, präzise.`,items:[{c:`▶`,l:`YouTube – Seminararbeit Aufbau`,u:M(`Seminararbeit schreiben Aufbau Gliederung Anleitung`)},{c:`📚`,l:`Scribbr – Gliederung`,u:`https://www.scribbr.de/richtig-zitieren/gliederung/`},{c:`🧠`,l:`Knowunity – Wiss. Schreiben`,u:P(`Wissenschaftlich schreiben Seminararbeit Aufbau`)},{c:`💬`,l:`Studocu – Seminararbeit Beispiel`,u:Br(`Seminararbeit E-Commerce Beispiel Hochschule`)}]},{t:`Zitation & seriöse Quellen finden`,desc:`In-Text-Zitation APA: (Deges, 2023, S. 20). Literaturverzeichnis: Deges, F. (2023). Grundlagen des E-Commerce (2. Aufl.). Springer Gabler. Seriöse Quellen: Springer Link, EBSCO, Google Scholar, statista.com (Vorsicht: nur als Sekundärquelle), bevh.org. Vorsicht: Wikipedia und Blogs sind keine zitierfähigen Quellen! Das Buch von Deges ist dein Primärwerk für das ECM-Modul.`,items:[{c:`📚`,l:`Scribbr – APA Zitieren`,u:`https://www.scribbr.de/category/richtig-zitieren/`},{c:`📚`,l:`Citavi Tutorials`,u:`https://www.citavi.com/de/tutorials`},{c:`🌐`,l:`Google Scholar`,u:`https://scholar.google.de/`},{c:`📖`,l:`Springer Link`,u:`https://link.springer.com/`}]}]},15:{lernziel:`Du kennst die grundlegenden Hardware-Komponenten eines Computers (CPU, RAM, Festplatte, Mainboard, GPU) und verstehst das Von-Neumann-Prinzip. Du kannst Zahlen sicher zwischen Dezimal-, Binär-, Oktal- und Hexadezimalsystem umrechnen – das ist direkt klausurrelevant im GIP-EC-Modul! Du verstehst, warum Computer intern im Binärsystem arbeiten.`,prüfung:`Klausur GIP EC: Umrechnung Dezimal ↔ Binär ↔ Hex (Rechenaufgaben mit Lösungsweg!), Von-Neumann-Architektur skizzieren, Hardware-Komponenten benennen und erklären`,begriffe:[`CPU`,`RAM`,`Binärsystem`,`Hexadezimal`,`Von-Neumann`,`Bit`,`Byte`,`ASCII`],subs:[{t:`Computeraufbau & Von-Neumann-Architektur`,desc:`Ein Computer nach Von-Neumann besteht aus: CPU (rechnet und steuert), Hauptspeicher RAM (flüchtig, schnell), Festplatte/SSD (persistent, langsam), Eingabe (Tastatur) und Ausgabe (Monitor). Die CPU besteht aus ALU (Arithmetisch-Logische Einheit, rechnet), Steuerwerk (organisiert Abläufe) und Registern (ultraschneller Speicher). Für Java-Programmierung wichtig: Dein Programm liegt als .class-Datei auf der Festplatte, wird in den RAM geladen und von der CPU ausgeführt.`,items:[{c:`▶`,l:`YouTube – Computeraufbau`,u:M(`Computeraufbau CPU RAM Festplatte einfach erklärt`)},{c:`🧠`,l:`Knowunity – Computeraufbau`,u:P(`Computeraufbau CPU RAM Speicher Informatik`)},{c:`📊`,l:`Studyflix – Von-Neumann`,u:N(`Von Neumann Architektur`)}]},{t:`Zahlensysteme – Umrechnung für die Klausur`,desc:`Dezimal (Basis 10): Unser Alltag. Binär (Basis 2): Nur 0 und 1 – so denkt der Computer. Hexadezimal (Basis 16): Kompakte Darstellung binärer Daten (Farben in HTML: #FF5733). Umrechnung Dezimal → Binär: Wiederholtes Dividieren durch 2, Rest aufschreiben von unten nach oben. Beispiel: 42 = 101010₂. Umrechnung Hex: Jede Hex-Stelle entspricht 4 Bit (0=0000, F=1111, A=1010). Diese Aufgaben kommen garantiert in der GIP-Klausur!`,items:[{c:`📊`,l:`Studyflix – Binärsystem`,u:N(`Binärsystem Umrechnung Dezimal`)},{c:`📊`,l:`Studyflix – Hexadezimal`,u:N(`Hexadezimalsystem Umrechnung`)},{c:`▶`,l:`YouTube – Binär Dezimal`,u:M(`Dezimal Binär Hexadezimal Umrechnung Aufgaben`)},{c:`💬`,l:`Studocu – Zahlensysteme`,u:Br(`Zahlensysteme Informatik Binär Hex Hochschule`)}]}]},16:{lernziel:`Du kannst Wahrheitstabellen für AND, OR, NOT, XOR und NAND eigenständig aufstellen und auswerten. Du kennst die De-Morgan-Regeln und kannst logische Ausdrücke vereinfachen. Du verstehst, wie boolesche Logik die Grundlage für if-Bedingungen in Java bildet. Diese Themen sind ausdrücklich Klausurstoff im GIP-EC-Modul der HRW.`,prüfung:`Klausur GIP EC: Wahrheitstabellen aufstellen (2–3 Aufgaben), De-Morgan anwenden und vereinfachen, boolesche Ausdrücke auswerten, Verbindung zu Java-Bedingungen (&&, ||, !) erklären`,begriffe:[`AND`,`OR`,`NOT`,`XOR`,`NAND`,`De-Morgan`,`Wahrheitstabelle`,`Logikgatter`],subs:[{t:`Grundoperatoren & Wahrheitstabellen`,desc:`AND (UND): Nur wahr, wenn BEIDE Eingaben wahr sind. OR (ODER): Wahr, wenn MINDESTENS EINE Eingabe wahr ist. NOT (NICHT): Invertiert den Wert. XOR (Exklusiv-Oder): Wahr, wenn GENAU EINE Eingabe wahr ist. NAND: Gegenteil von AND. In Java: && = AND, || = OR, ! = NOT. Klausurbeispiel: Ausdruck !(A && B) = !A || !B nach De-Morgan vereinfachen.`,items:[{c:`📊`,l:`Studyflix – Aussagenlogik`,u:N(`Aussagenlogik Wahrheitstabelle AND OR NOT`)},{c:`🧠`,l:`Knowunity – Boolesche Algebra`,u:P(`Boolesche Algebra Wahrheitstabelle AND OR NOT`)},{c:`▶`,l:`YouTube – Wahrheitstabellen`,u:M(`Wahrheitstabelle AND OR NOT XOR Informatik`)},{c:`💬`,l:`Studocu – Aufgaben`,u:Br(`Aussagenlogik Boolesche Algebra Aufgaben Informatik`)}]},{t:`De-Morgan-Regeln – vereinfachen für die Klausur`,desc:`De-Morgans Gesetze: (1) NOT(A AND B) = NOT A OR NOT B. (2) NOT(A OR B) = NOT A AND NOT B. Merkhilfe: 'Klammer auflösen = Vorzeichen wechseln + AND↔OR tauschen'. Praxisbeispiel: Eine Warenbestellbedingung im E-Commerce: 'Bestelle, wenn Lager leer UND Nachfrage hoch' → mit NOT vereinfachen für die Systemlogik. De-Morgan erscheint in jeder GIP-Klausur!`,items:[{c:`📊`,l:`Studyflix – De-Morgan`,u:N(`De Morgan Regel Vereinfachung`)},{c:`▶`,l:`YouTube – De-Morgan erklärt`,u:M(`De-Morgan Regel Informatik einfach erklärt Aufgaben`)},{c:`🧠`,l:`Knowunity – De-Morgan`,u:P(`De Morgan Regel Logik Informatik Klausur`)}]}]},17:{lernziel:`Du verstehst, warum Java als Programmiersprache im GIP-EC-Modul der HRW verwendet wird (plattformunabhängig dank JVM, weit verbreitet im Enterprise-Bereich). Du kannst Variablen mit int, double, long, boolean, char und String deklarieren und initialisieren. Du verstehst Typkonvertierung (implizites und explizites Casting) und kannst dein erstes Hello-World-Programm in Java schreiben.`,prüfung:`Klausur/Praktikum GIP EC: Variablen deklarieren, Datentypen unterscheiden und konvertieren, einfache Ein-/Ausgabe mit System.out.println() und Scanner, Typfehler erkennen`,begriffe:[`Variable`,`Datentyp`,`int`,`String`,`boolean`,`Casting`,`JVM`,`Deklaration`,`Initialisierung`],subs:[{t:`Java Grundstruktur & Datentypen`,desc:`Jedes Java-Programm beginnt mit einer Klasse und einer main()-Methode. Primitive Datentypen: int (ganze Zahlen, z.B. int lagerbestand = 100;), double (Dezimalzahlen, z.B. double preis = 9.99;), boolean (wahr/falsch, z.B. boolean verfügbar = true;), char (einzelnes Zeichen). Referenztypen: String (Zeichenkette, z.B. String name = "Sneaker";). ACHTUNG: String mit großem S – ist eine Klasse, kein primitiver Typ!`,items:[{c:`💻`,l:`W3Schools – Java Variables`,u:`https://www.w3schools.com/java/java_variables.asp`},{c:`💻`,l:`W3Schools – Data Types`,u:`https://www.w3schools.com/java/java_data_types.asp`},{c:`🧠`,l:`Knowunity – Java Variablen`,u:P(`Java Variablen Datentypen Programmierung`)},{c:`▶`,l:`YouTube – Java Deutsch`,u:M(`Java Tutorial Deutsch Variablen Datentypen Anfänger`)}]},{t:`Type Casting & erstes Programm`,desc:`Implizites Casting: Kleiner Typ → größer funktioniert automatisch: int → double. Explizites Casting: Größer → kleiner muss manuell erfolgen: (int) meinDouble – dabei gehen Nachkommastellen verloren. Dein erstes Programm: public class Hallo { public static void main(String[] args) { System.out.println("Hallo Marokko!"); } }. Scanner für Eingabe: Scanner sc = new Scanner(System.in); String eingabe = sc.nextLine();`,items:[{c:`💻`,l:`W3Schools – Type Casting`,u:`https://www.w3schools.com/java/java_type_casting.asp`},{c:`▶`,l:`YouTube – Java Grundlagen`,u:M(`Java erstes Programm Hello World Deutsch Tutorial`)},{c:`💬`,l:`Studocu – Java Mitschriften`,u:Br(`Java Programmierung Grundlagen Hochschule`)}]}]},18:{lernziel:`Du kannst if/else-Verzweigungen, else-if-Ketten und switch-Anweisungen in Java schreiben und einsetzen. Du beherrschst die drei Schleifentypen: for (bekannte Iterationsanzahl), while (unbekannte Anzahl) und do-while (mindestens einmal). Diese Kontrollstrukturen sind die Basis für alle GIP-Praktikumsaufgaben.`,prüfung:`Klausur/Praktikum GIP EC: Code-Tracing (Was gibt dieses Programm aus?), eigene Schleifen und Bedingungen schreiben, Endlosschleifen erkennen, break und continue erklären`,begriffe:[`if-else`,`switch`,`for-Schleife`,`while-Schleife`,`do-while`,`break`,`continue`,`Kontrollstruktur`],subs:[{t:`Bedingungen & Verzweigungen in Java`,desc:`if (bedingung) { // wenn wahr } else if (andere) { // alternativ } else { // sonst }. Bedingungen verwenden Vergleichsoperatoren: == (gleich), != (ungleich), > < >= <=. switch für viele feste Fälle: switch(tag) { case 1: System.out.println("Mo"); break; default: ... }. E-Commerce-Beispiel: if (bestand > 0 && preis < budget) { kaufen(); } else { wunschliste(); }`,items:[{c:`💻`,l:`W3Schools – Java Conditions`,u:`https://www.w3schools.com/java/java_conditions.asp`},{c:`💻`,l:`W3Schools – Switch`,u:`https://www.w3schools.com/java/java_switch.asp`},{c:`🧠`,l:`Knowunity – Java if-else`,u:P(`Java if else Bedingungen Programmierung`)},{c:`▶`,l:`YouTube – if/else Java`,u:M(`Java if else Bedingungen switch Kontrollstrukturen Deutsch`)}]},{t:`Schleifen: for, while, do-while`,desc:`for-Schleife (Anzahl bekannt): for (int i = 0; i < 10; i++) { System.out.println(i); } – zählt 0 bis 9. while-Schleife (Anzahl unbekannt): while (user.hatGeld()) { kaufen(); } – solange Bedingung wahr. do-while (mindestens einmal): do { eingabe(); } while (!eingabe.valid()); – führt mindestens einmal aus, dann prüft. break beendet die Schleife sofort; continue überspringt den Rest der aktuellen Iteration.`,items:[{c:`💻`,l:`W3Schools – For Loop`,u:`https://www.w3schools.com/java/java_for_loop.asp`},{c:`💻`,l:`W3Schools – While Loop`,u:`https://www.w3schools.com/java/java_while_loop.asp`},{c:`🌐`,l:`CodingBat – Java Übungen`,u:`https://codingbat.com/java`},{c:`▶`,l:`YouTube – Schleifen Java`,u:M(`Java for while Schleife Deutsch Anfänger Übungen`)}]}]},19:{lernziel:`Du kannst eigene Methoden in Java definieren, Parameter übergeben und Rückgabewerte nutzen. Du verstehst das OOP-Konzept: Klassen sind Baupläne, Objekte sind Instanzen. Du kannst eine einfache Klasse 'Produkt' mit Attributen, Konstruktor und Getter-/Setter-Methoden schreiben. Du verstehst Vererbung und Polymorphie auf konzeptioneller Ebene.`,prüfung:`Klausur/Praktikum GIP EC: Methoden schreiben und aufrufen (Parameter, Rückgabetyp), einfache Klasse implementieren, Konstruktor und Getter/Setter, Vererbungshierarchie verstehen und zeichnen`,begriffe:[`Methode`,`Parameter`,`Rückgabewert`,`Klasse`,`Objekt`,`Konstruktor`,`Vererbung`,`Kapselung`],subs:[{t:`Methoden definieren & aufrufen`,desc:`Eine Methode kapselt wiederverwendbaren Code: public static int addiere(int a, int b) { return a + b; } – aufruf: int ergebnis = addiere(5, 3); → ergebnis = 8. Methodenbestandteile: Zugriffsmodifizierer (public), Rückgabetyp (int oder void), Name (addiere), Parameter ((int a, int b)), Methodenrumpf ({...}), Return-Anweisung. E-Commerce-Beispiel: berechneGesamtpreis(double preis, int menge, double rabatt)`,items:[{c:`💻`,l:`W3Schools – Java Methods`,u:`https://www.w3schools.com/java/java_methods.asp`},{c:`💻`,l:`W3Schools – Parameters`,u:`https://www.w3schools.com/java/java_methods_param.asp`},{c:`🧠`,l:`Knowunity – Java Methoden`,u:P(`Java Methoden Parameter Rückgabewert`)},{c:`▶`,l:`YouTube – Methoden Java`,u:M(`Java Methoden Parameter Rückgabewert Deutsch`)}]},{t:`OOP: Klassen, Objekte & Vererbung`,desc:`Klasse = Bauplan. Objekt = konkrete Instanz. Beispielklasse: class Produkt { String name; double preis; Produkt(String n, double p) { name=n; preis=p; } String getName() { return name; } } – Objekt erstellen: Produkt sneaker = new Produkt("Air Max", 149.99); System.out.println(sneaker.getName()); Vererbung: class DigitalesProdukt extends Produkt { } – erbt alle Attribute und Methoden von Produkt.`,items:[{c:`💻`,l:`W3Schools – Java Classes`,u:`https://www.w3schools.com/java/java_classes.asp`},{c:`💻`,l:`W3Schools – OOP`,u:`https://www.w3schools.com/java/java_oop.asp`},{c:`▶`,l:`YouTube – OOP Java`,u:M(`Objektorientierung Java Klassen Vererbung Deutsch`)},{c:`🌐`,l:`CodinGame – Java üben`,u:`https://www.codingame.com/start/`}]}]},20:{lernziel:`Du kannst erklären, was passiert, wenn du 'amazon.de' im Browser eingibst – von der DNS-Auflösung über TCP/IP-Handshake bis zur HTTP-Anfrage und HTML-Antwort. Du kennst den Unterschied zwischen HTTP und HTTPS (SSL/TLS-Verschlüsselung) und weißt, warum HTTPS für E-Commerce-Shops Pflicht ist. Diese Grundlagen bereiten dich auf das Datenbanken-Modul in Semester 2 vor.`,prüfung:`Relevant in mehreren Modulen: HTTP vs. HTTPS erklären, DNS-Auflösung beschreiben, Client-Server-Modell skizzieren, API-Begriff definieren, IP-Adressen und Ports`,begriffe:[`HTTP`,`HTTPS`,`DNS`,`TCP/IP`,`SSL/TLS`,`Client`,`Server`,`API`,`Port`],subs:[{t:`Vom Browser bis zur Webseite – Schritt für Schritt`,desc:`(1) Du tippst amazon.de. (2) Browser fragt den DNS-Server: 'Welche IP hat amazon.de?' → Antwort: 54.239.28.85. (3) Browser baut TCP-Verbindung auf (3-Way-Handshake). (4) HTTPS: SSL/TLS-Verschlüsselung aktiviert. (5) Browser sendet HTTP-Request: GET /index.html HTTP/1.1. (6) Server antwortet mit HTTP-Response: 200 OK + HTML-Code. (7) Browser rendert HTML zu sichtbarer Webseite. Das alles in unter 1 Sekunde!`,items:[{c:`▶`,l:`YouTube – Internet erklärt`,u:M(`Wie funktioniert Internet HTTP DNS TCP IP Schritt Schritt Deutsch`)},{c:`📚`,l:`MDN – Internet`,u:`https://developer.mozilla.org/de/docs/Learn/Common_questions/Web_mechanics/How_does_the_Internet_work`},{c:`🧠`,l:`Knowunity – Netzwerke`,u:P(`Internet HTTP DNS IP Netzwerke Informatik`)}]},{t:`HTTP vs. HTTPS & APIs`,desc:`HTTP (HyperText Transfer Protocol): Unverschlüsselt – Daten können abgefangen werden. HTTPS: HTTP + SSL/TLS-Verschlüsselung – alle Daten (Kreditkarten, Passwörter) verschlüsselt. Seit 2021 straft Google HTTP-Seiten in Rankings ab. API (Application Programming Interface): Eine Schnittstelle, über die zwei Programme kommunizieren. Beispiel: Shopify-Shop ruft die DHL-API auf, um eine Sendungsverfolgung zu starten. REST-APIs sind der Standard im E-Commerce.`,items:[{c:`▶`,l:`YouTube – HTTPS erklärt`,u:M(`HTTPS SSL TLS Verschlüsselung einfach erklärt`)},{c:`▶`,l:`YouTube – API erklärt`,u:M(`API einfach erklärt REST API Deutsch`)},{c:`💬`,l:`Studocu – Netzwerke`,u:Br(`Informatik Netzwerke HTTP HTTPS API Hochschule`)}]}]},21:{lernziel:`Du reflektierst die drei Wochen Marokko-Lernplan: Was hast du wirklich gemeistert? Wo sind noch Lücken? Du erstellst einen konkreten, realistischen Lernplan für August (bis Vorlesungsbeginn 1.9.2026). Du kennst die Anforderungen der Seminararbeit im ECM-Modul und kannst schon erste Themenideen sammeln. Du bist mental und fachlich bereit für Semester 1.`,prüfung:`Kein Klausurthema – aber die beste Investition in einen starken Semesterstart. Nutze August für Java-Vertiefung (Praktikum!) und BWL-Klausuraufgaben.`,begriffe:[`Reflexion`,`Lernplan`,`Seminararbeit`,`Java-Vertiefung`,`Anki-Review`,`HRW Moodle`,`Semesterstart`],subs:[{t:`Rückblick & Lückenanalyse`,desc:`Gehe alle 20 Tage durch und beantworte ehrlich: (1) Kann ich das Thema ohne Unterlagen erklären? (2) Würde ich eine Klausuraufgabe dazu lösen können? Markiere Schwächethemen rot. Typische Schwächen nach Woche 1: Buchungssätze und T-Konten. Nach Woche 2: Konsumentenverhalten und Plattformökonomie. Nach Woche 3: Java und Boolesche Algebra. Diese Themen kommen in August intensiver dran.`,items:[{c:`🃏`,l:`Anki – alle Karten durchgehen`,u:`https://apps.ankiweb.net/`},{c:`🧠`,l:`Knowunity – Prüfungsvorbereitung`,u:P(`Studium Prüfungsvorbereitung Lernplan`)},{c:`🎓`,l:`Springer Flashcards (Deges)`,u:`https://flashcards.springernature.com/login`}]},{t:`August-Plan & Semesterstart-Vorbereitung`,desc:`Empfohlener August-Plan: Woche 1 (1.-7.8): BWL-Klausuraufgaben üben + Buchführung vertiefen. Woche 2 (8.-14.8): Java-Übungen auf CodingBat + W3Schools durcharbeiten. Woche 3 (15.-21.8): Deges-Buch Kapitel 1-3 lesen + Seminararbeitsthema recherchieren. Woche 4 (22.-31.8): HRW Moodle-Zugang einrichten, Campus-Karte holen, Stundenplan organisieren, Anki-Decks finalisieren.`,items:[{c:`🎓`,l:`HRW Moodle`,u:`https://elearning.hs-ruhrwest.de/`},{c:`💻`,l:`Udemy – Java Kurs`,u:`https://www.udemy.com/topic/java/?price=price-free`},{c:`📖`,l:`Deges Buch öffnen`,u:zr},{c:`📚`,l:`HRW Bibliothek`,u:`https://www.hs-ruhrwest.de/studium/bibliothek/`}]}]}}}));function dk(e){let t=e.w===1?`BWL`:e.w===2&&e.nr<=9?`HBL`:e.w===2?`ECM`:`GIP`;return QD.find(e=>e.id===t)}var fk,Z,pk,mk,hk=o((()=>{fk=u(p(),1),HC(),fx(),KE(),XE(),ck(),uk(),tO(),pw(),Qr(),Fb(),zE(),ik(),Z=A(),pk={lernziel:``,prüfung:``,begriffe:[],subs:[]},mk=(0,fk.memo)(function({day:e,color:t,startDate:n,isDone:r,onToggleDone:i}){let[a,o]=(0,fk.useState)(!1),[s,c]=(0,fk.useState)(()=>new Set),[l,u]=(0,fk.useState)(null),d=lk[e.nr]??pk,f=dk(e),p=()=>o(e=>!e),m=e=>c(t=>{let n=new Set(t);return n.has(e)?n.delete(e):n.add(e),n});return(0,Z.jsxs)(W,{tint:a||r?t:void 0,className:Y.day,style:{"--c":t},children:[(0,Z.jsxs)(`div`,{className:`${Y.head} hover-pop`,onClick:p,...Mb(p),"aria-expanded":a,children:[(0,Z.jsxs)(`div`,{className:Y.dayNum,children:[(0,Z.jsx)(`div`,{className:Y.dayNumBig,children:Zr(e.nr)}),(0,Z.jsx)(`div`,{className:Y.dayDate,children:qr(n,e.nr-1)||`Tag`})]}),(0,Z.jsx)(`div`,{className:Y.dayDivider}),(0,Z.jsxs)(`div`,{className:Y.dayBody,children:[(0,Z.jsxs)(`div`,{className:Nb
