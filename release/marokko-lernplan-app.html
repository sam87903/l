rwirrung bei Kunden, sondern auch rechtliche Risiken (z.B. widersprüchliche Preisangaben) verursachen können. Ein gutes Produktdatenmanagement beschleunigt zudem die Markteinführung neuer Produkte erheblich, da neue Artikel nur einmal zentral angelegt werden müssen, um automatisch auf allen angeschlossenen Kanälen zu erscheinen.`,ex:`Ein PIM-System hält die Produktbeschreibung, technischen Daten und Bilder eines Wanderrucksacks zentral gepflegt und verteilt diese automatisch konsistent an den eigenen Online-Shop, den Amazon-Marktplatz-Eintrag und den gedruckten Saisonkatalog – ändert sich eine technische Spezifikation, muss sie nur an einer einzigen Stelle korrigiert werden, statt an drei separaten Systemen.`},{t:`Omnichannel-Integration`,def:`Omnichannel-Integration bezeichnet die technische und organisatorische Verknüpfung aller Vertriebs- und Kommunikationskanäle eines Unternehmens (Online-Shop, stationäre Filialen, mobile App, Marktplätze, Callcenter) zu einem einheitlichen, nahtlos zusammenarbeitenden Gesamtsystem, sodass Kunden unabhängig vom genutzten Kanal ein konsistentes Erlebnis erhalten. Technische Voraussetzung ist ein zentrales, kanalübergreifendes Warenwirtschafts- und Kundendatensystem, das Bestände, Preise, Bestellhistorien und Kundenprofile in Echtzeit über alle Kanäle synchronisiert (Single Customer View und Single Stock View). Erst dadurch werden Omnichannel-Services wie Click & Collect (online bestellen, in der Filiale abholen), Ship-from-Store (Filialen versenden Online-Bestellungen aus ihrem lokalen Bestand, um Lieferzeiten zu verkürzen) oder ein einheitliches, kanalübergreifendes Rückgaberecht praktisch umsetzbar. Ohne eine solche technische Integration bleiben verschiedene Kanäle isolierte, in sich geschlossene Systeme mit potenziell widersprüchlichen Beständen und Kundendaten.`,ex:`Ein Kunde bestellt online einen Artikel und wählt die Option, ihn noch am selben Tag in einer nahegelegenen Filiale abzuholen (Click & Collect) – dies funktioniert nur, weil das zentrale Omnichannel-System in Echtzeit den tatsächlichen Bestand genau dieser Filiale kennt und die Bestellung automatisch dorthin zur Kommissionierung weiterleitet, statt aus einem entfernten Zentrallager zu versenden.`}],quiz:[{q:`Was verwaltet ein Warenwirtschaftssystem primär?`,options:[`Nur Kundendaten`,`Bestände, Bestellungen und Lagerbewegungen`,`Nur Marketing-Kampagnen`,`Ausschließlich Gehälter`],correct:1,explain:`Ein Warenwirtschaftssystem (WWS) steuert Warenbestände, Ein-/Verkauf und Lagerbewegungen.`},{q:`Wofür steht PIM?`,options:[`Product Information Management`,`Personal Inventory Method`,`Payment Integration Module`,`Product Import Manager`],correct:0,explain:`PIM = Product Information Management, zentrale Verwaltung von Produktdaten.`}],cards:[{front:`Warenwirtschaftssystem`,back:`Software zur Steuerung von Warenbeständen, Bestellungen und Lagerbewegungen.`},{front:`ERP`,back:`Enterprise Resource Planning – integrierte Unternehmenssoftware für Ressourcenplanung.`},{front:`PIM`,back:`Product Information Management – zentrale Pflege und Verteilung von Produktdaten.`},{front:`Shopsystem`,back:`Softwareplattform zum Betrieb eines Online-Shops (z.B. Shopify, Magento, OXID).`}]},{id:`s4-app`,code:`APP`,name:`Webtechnologien und mobile Anwendungen`,ects:6,sws:`5`,exam:`Portfolioprüfung: E-Klausur 50% + Projektarbeit 50%`,desc:`Einführung in Webtechnologien und die Entwicklung von Web- und mobilen Anwendungen.`,topics:[{t:`HTML5 & CSS3`,def:`HTML (HyperText Markup Language) ist die grundlegende Auszeichnungssprache des Web und strukturiert Inhalte über verschachtelte Elemente (Tags). HTML5, die aktuelle Version, führte insbesondere semantische Elemente ein (wie header, nav, article, footer), die nicht nur visuell, sondern auch inhaltlich-strukturell kennzeichnen, welche Rolle ein Seitenabschnitt hat – das verbessert sowohl die Zugänglichkeit für Screenreader als auch die Auffindbarkeit durch Suchmaschinen (SEO). CSS (Cascading Style Sheets) ist demgegenüber ausschließlich für die visuelle Gestaltung zuständig: Farben, Schriftarten, Abstände und Layout. CSS3 erweiterte frühere Versionen um mächtige Layout-Systeme wie Flexbox (eindimensionale Anordnung von Elementen) und CSS Grid (zweidimensionale Rasterlayouts) sowie um Media Queries, mit denen sich das Layout abhängig von der Bildschirmgröße des jeweiligen Geräts anpassen lässt (Responsive Design) – ein zentrales Konzept, da heute ein Großteil des Web-Traffics über mobile Endgeräte mit stark unterschiedlichen Bildschirmgrößen erfolgt.`,ex:`Ein Online-Shop nutzt ein responsives CSS-Grid-Layout für seinen Produktkatalog: Auf einem großen Desktop-Monitor werden vier Produktkarten pro Zeile nebeneinander angezeigt, während dieselbe HTML-Struktur dank Media Queries auf einem schmalen Smartphone-Bildschirm automatisch auf eine einzige Spalte umbricht, ohne dass horizontal gescrollt werden muss.`},{t:`JavaScript-Grundlagen`,def:`JavaScript ist die Programmiersprache, die Webseiten von statischen Dokumenten in interaktive Anwendungen verwandelt, indem sie direkt im Browser des Nutzers ausgeführt wird. Zentrales Konzept ist das DOM (Document Object Model): eine baumartige, programmatisch zugängliche Repräsentation der HTML-Struktur einer Seite im Speicher des Browsers, die JavaScript zur Laufzeit lesen und verändern kann (DOM-Manipulation) – etwa um Inhalte dynamisch hinzuzufügen, zu entfernen oder zu aktualisieren, ohne die gesamte Seite neu vom Server laden zu müssen. Ereignissteuerung (Event Handling) erlaubt es, auf Nutzerinteraktionen wie Klicks, Tastatureingaben oder Formularabsendungen zu reagieren, indem bestimmte Funktionen (Event Listener) registriert werden, die automatisch ausgeführt werden, sobald das entsprechende Ereignis eintritt. Moderne JavaScript-Anwendungen nutzen zudem asynchrone Programmierung (z.B. über Promises oder async/await), um Daten von einem Server nachzuladen, ohne währenddessen die gesamte Benutzeroberfläche zu blockieren.`,ex:`Klickt ein Kunde auf den 'In den Warenkorb'-Button eines Produkts, registriert JavaScript diesen Klick über einen Event Listener, aktualisiert sofort die Warenkorb-Anzeige im DOM (ohne die Seite neu zu laden) und sendet parallel asynchron eine Anfrage an den Server, um den Warenkorbinhalt auch serverseitig zu speichern.`},{t:`React-Basics`,def:`React ist eine von Meta entwickelte, weit verbreitete JavaScript-Bibliothek zum Bau von Benutzeroberflächen nach einem komponentenbasierten Ansatz: Eine komplexe Oberfläche wird in kleinere, in sich geschlossene, wiederverwendbare Bausteine (Komponenten) zerlegt, die jeweils ihr eigenes Aussehen und Verhalten kapseln und beliebig oft an unterschiedlichen Stellen der Anwendung wiederverwendet werden können. React nutzt dabei ein virtuelles DOM: Änderungen werden zunächst in einer schnellen, im Speicher gehaltenen Kopie der Seitenstruktur berechnet, bevor React effizient nur die tatsächlich notwendigen, minimalen Änderungen am echten Browser-DOM vornimmt – das verbessert die Performance gegenüber direkter, unstrukturierter DOM-Manipulation erheblich. Über den sogenannten State (Zustand) können Komponenten sich veränderliche Daten merken (z.B. wie viele Artikel im Warenkorb liegen), und ändert sich dieser State, aktualisiert React automatisch alle betroffenen Teile der Benutzeroberfläche, ohne dass der Entwickler die DOM-Aktualisierung manuell steuern muss (deklaratives Programmiermodell).`,ex:`Statt für jedes einzelne Produkt im Katalog eigenen, dupliziert geschriebenen HTML-Code zu pflegen, definiert ein Entwicklerteam eine einzige ProductCard-Komponente, die Produktname, Bild und Preis als Parameter (Props) entgegennimmt, und rendert diese eine Komponente anschließend hundertfach mit jeweils unterschiedlichen Produktdaten – ändert sich später das visuelle Design einer Produktkarte, muss der Code nur an dieser einen zentralen Stelle angepasst werden.`},{t:`XML/JSON & REST/HTTP`,def:`XML (Extensible Markup Language) und JSON (JavaScript Object Notation) sind beides textbasierte Datenformate zum strukturierten Austausch von Daten zwischen Systemen, wobei sich JSON aufgrund seiner deutlich kompakteren, leichter lesbaren Syntax (verschachtelte Schlüssel-Wert-Paare) in modernen Web-APIs weitgehend gegenüber dem älteren, verbose-eren XML durchgesetzt hat. REST (Representational State Transfer) ist ein weit verbreiteter Architekturstil zur Gestaltung von Web-APIs, bei dem Ressourcen (z.B. ein Produkt, eine Bestellung) über eindeutige URLs adressiert werden und mit standardisierten HTTP-Methoden bearbeitet werden: GET liest eine Ressource aus, POST erstellt eine neue Ressource, PUT/PATCH aktualisiert eine bestehende Ressource, DELETE löscht sie. HTTP-Statuscodes signalisieren dabei standardisiert den Ausgang einer Anfrage (200 für Erfolg, 404 für nicht gefunden, 500 für Serverfehler). Diese Standardisierung erlaubt es, dass völlig unterschiedliche Systeme (z.B. ein Online-Shop und ein externer Versanddienstleister) unabhängig von ihrer jeweiligen internen Technologie zuverlässig miteinander kommunizieren können.`,ex:`Ein Online-Shop ruft per GET-Anfrage an eine REST-API des Versanddienstleisters den aktuellen Sendungsstatus eines Pakets ab; die Antwort kommt im JSON-Format zurück, z.B. {"status": "zugestellt", "datum": "2026-06-28"}, und der Shop zeigt diese Information direkt im Kundenkonto an, ohne dass der Kunde die Website des Versanddienstleisters separat besuchen muss.`},{t:`Mobile Web & Sicherheit`,def:`Mobile Webentwicklung berücksichtigt die spezifischen Anforderungen kleinerer Bildschirme und touchbasierter Bedienung: größere, leichter antippbare Bedienelemente (empfohlene Mindestgröße oft 44×44 Pixel), vereinfachte Navigation, reduzierte Datenmengen für langsamere mobile Verbindungen sowie die Berücksichtigung von Touch-Gesten (Wischen, Zoomen mit zwei Fingern) statt reiner Maussteuerung. Im Bereich Websicherheit ist HTTPS (die verschlüsselte Version von HTTP, technisch realisiert über TLS-Zertifikate) heute Grundvoraussetzung für jede seriöse Website, insbesondere für Formulare mit sensiblen Daten wie Zahlungsinformationen, da HTTPS die Kommunikation zwischen Browser und Server vor Abhören und Manipulation durch Dritte schützt. Input-Validierung – sowohl clientseitig (im Browser, für schnelles Nutzerfeedback) als auch zwingend serverseitig (da clientseitige Prüfungen umgangen werden können) – verhindert, dass fehlerhafte oder böswillig manipulierte Eingaben (z.B. SQL-Injection- oder Cross-Site-Scripting-Angriffe) das System kompromittieren.`,ex:`Eine mobile Checkout-Seite verwendet großzügig dimensionierte, gut mit dem Daumen antippbare Buttons für 'Weiter' und 'Jetzt kaufen', übermittelt sämtliche eingegebenen Zahlungsdaten ausschließlich über eine HTTPS-verschlüsselte Verbindung und validiert serverseitig streng, dass eine eingegebene Kreditkartennummer tatsächlich dem erwarteten Format entspricht, bevor sie überhaupt an den Zahlungsdienstleister weitergeleitet wird.`}],quiz:[{q:`Welches Datenformat wird häufig bei REST-APIs verwendet?`,options:[`JSON`,`MP3`,`EXE`,`CSV ausschließlich`],correct:0,explain:`JSON ist das Standard-Datenaustauschformat für REST-APIs.`},{q:`Wofür steht CSS?`,options:[`Computer Style Sheets`,`Cascading Style Sheets`,`Central System Styling`,`Coded Style Syntax`],correct:1,explain:`CSS = Cascading Style Sheets, zur Gestaltung von HTML-Dokumenten.`},{q:`Was ist React?`,options:[`Eine Datenbank`,`Ein JavaScript-Framework für Benutzeroberflächen`,`Ein Servertyp`,`Ein Bildformat`],correct:1,explain:`React ist eine JavaScript-Bibliothek von Meta zum Bau von UI-Komponenten.`}],cards:[{front:`HTML5`,back:`Aktuelle Version der Auszeichnungssprache zur Strukturierung von Webinhalten.`},{front:`REST-API`,back:`Architekturstil für Webservices, die über HTTP mit Ressourcen interagieren.`},{front:`JSON`,back:`JavaScript Object Notation – leichtgewichtiges Datenformat für den Datenaustausch.`},{front:`React`,back:`JavaScript-Bibliothek zum Bau komponentenbasierter Benutzeroberflächen.`},{front:`Responsive Design`,back:`Gestaltungsansatz, der Webseiten an verschiedene Bildschirmgrößen anpasst.`}]}]}})),ID,LD=o((()=>{ID={nr:5,title:`E-Commerce-Geschäftsmodelle, Marktforschung & Wahlmodule`,ects:30,modules:[{id:`s5-ebm`,code:`EBM`,name:`Geschäftsmodelle im E-Commerce`,ects:6,sws:`5`,exam:`Entwurf 5 Min. · 50% + Vortrag 10 Min. · 50%`,desc:`Vertiefte Analyse von Geschäftsmodellen im E-Commerce.`,topics:[{t:`Geschäftsmodell-Innovation`,def:`Geschäftsmodell-Innovation verändert gezielt einzelne oder mehrere Bausteine eines bestehenden Geschäftsmodells – etwa die Erlösquelle, den Vertriebskanal, die Zielgruppe oder die Art der Wertschöpfung – um neuen, differenzierenden Kundennutzen zu schaffen, ohne notwendigerweise ein technologisch neues Produkt zu entwickeln. Im Gegensatz zur reinen Produktinnovation (ein neues oder verbessertes physisches Produkt) verändert Geschäftsmodell-Innovation die grundlegende Art und Weise, wie ein Unternehmen Wert schafft, an Kunden liefert und dafür Erlöse erzielt. Typische Innovationsmuster sind der Wechsel von Einmalkäufen zu wiederkehrenden Erlösmodellen (Abo statt Kauf), die Verlagerung von reinem Produktverkauf zu ergänzenden Dienstleistungen (Product-as-a-Service), das Hinzufügen einer Plattformkomponente zu einem bislang linearen Geschäft, oder die Erschließung neuer Kundensegmente durch radikal vereinfachte, günstigere Angebotsvarianten. Geschäftsmodell-Innovation gilt oft als nachhaltiger wettbewerbsfähiger als reine Produktinnovation, weil sie von Konkurrenten schwerer kurzfristig kopierbar ist.`,ex:`Ein klassischer Büromöbelhändler, der bislang nur Einmalverkäufe tätigte, führt ein monatliches Abo-Modell ein, bei dem Unternehmen Büromöbel gegen eine laufende Gebühr mieten statt kaufen, inklusive Wartung und flexiblem Austausch bei wachsendem oder schrumpfendem Personalbestand – dieselbe physische Ware wird durch ein neues Erlösmodell für eine neue Kundengruppe (kleine, wachsende Startups ohne hohes Investitionskapital) attraktiv.`},{t:`Erlösmodelle (Abo, Freemium, Marketplace)`,def:`Erlösmodelle definieren, auf welche konkrete Art und Weise ein Unternehmen aus seinem Wertangebot tatsächlich Geld verdient, und beeinflussen maßgeblich Cashflow-Struktur, Kundenbindung und Skalierbarkeit eines Geschäfts. Das Abonnement-Modell erzielt wiederkehrende, planbare Zahlungen (meist monatlich oder jährlich) für dauerhaften Zugang zu einem Produkt oder Service, was besonders stabile, vorhersehbare Umsätze (Recurring Revenue) und eine enge, langfristige Kundenbeziehung ermöglicht. Das Freemium-Modell bietet eine kostenlose Basisversion mit eingeschränktem Funktionsumfang an, um eine große Nutzerbasis aufzubauen, und monetarisiert anschließend nur einen kleinen Anteil dieser Nutzer über kostenpflichtige Zusatzfunktionen (Premium-Features) – der Erfolg hängt stark von einer ausreichend hohen Konversionsrate von kostenlosen zu zahlenden Nutzern ab. Das Marketplace-Modell erzielt Erlöse nicht durch eigenen Warenverkauf, sondern durch Provisionen oder Gebühren auf Transaktionen unabhängiger Drittanbieter, die über die eigene Plattform verkaufen – hier liegt der wirtschaftliche Hebel primär im Transaktionsvolumen, nicht in eigener Wertschöpfung.`,ex:`Netflix erzielt seine Erlöse ausschließlich über monatliche Abogebühren (Abo-Modell) und profitiert von planbaren, wiederkehrenden Einnahmen; Spotify kombiniert eine werbefinanzierte Gratisversion mit einem kostenpflichtigen Premium-Abo ohne Werbung (Freemium); Etsy verdient dagegen nicht am eigenen Produktverkauf, sondern über eine Provision auf jeden Verkauf unabhängiger Kunsthandwerker, die die Plattform als Vertriebskanal nutzen (Marketplace-Modell).`},{t:`Skalierung digitaler Geschäftsmodelle`,def:`Skalierbarkeit bezeichnet die Fähigkeit eines Geschäftsmodells, den Umsatz deutlich stärker zu steigern als die dafür notwendigen Kosten – im Idealfall sinken die durchschnittlichen Kosten pro zusätzlichem Kunden sogar, je größer das Unternehmen wird (sinkende Grenzkosten, Skaleneffekte). Digitale Geschäftsmodelle skalieren häufig besonders gut, weil die Grenzkosten für einen zusätzlichen digitalen Nutzer (z.B. ein weiterer Software-Nutzer oder Streaming-Abonnent) nahe null liegen, sobald die initiale Entwicklungsinvestition einmal getätigt wurde – anders als bei physischen Produkten, bei denen jede zusätzliche Einheit spürbare Grenzkosten für Material, Produktion und Versand verursacht. Wichtige Voraussetzungen für erfolgreiche Skalierung sind eine technisch robuste, für hohe Nutzerzahlen ausgelegte Infrastruktur, standardisierte (nicht individuell anzupassende) Prozesse sowie ein Geschäftsmodell, das nicht linear mit der Personalstärke wächst. Nicht jedes digitale Geschäft skaliert automatisch gut – Modelle mit hohem individuellem Beratungs- oder Serviceaufwand pro Kunde stoßen trotz digitaler Grundlage schneller an Skalierungsgrenzen.`,ex:`Ein B2B-Software-Abo-Anbieter gewinnt 10.000 neue zahlende Kunden hinzu, ohne dafür proportional mehr Personal einstellen zu müssen, da die Software bereits entwickelt ist und jeder zusätzliche Nutzer nur minimale zusätzliche Serverkosten verursacht – der Umsatz wächst dadurch deutlich schneller als die Kostenbasis, was die Gewinnmarge mit zunehmender Größe strukturell verbessert.`},{t:`Fallstudienanalyse erfolgreicher E-Commerce-Modelle`,def:`Die Fallstudienanalyse (Case Study Analysis) ist eine strukturierte Methode, um aus der detaillierten Untersuchung realer, bereits erfolgreicher (oder auch gescheiterter) Unternehmen übertragbare Erfolgsfaktoren, Muster und Lehren abzuleiten, statt Geschäftsmodelle rein theoretisch zu entwickeln. Eine methodisch saubere Fallstudienanalyse untersucht typischerweise systematisch: die anfängliche Ausgangssituation und das ursprüngliche Problem, das gelöst werden sollte; die konkreten strategischen Entscheidungen, die getroffen wurden (und die Alternativen, die verworfen wurden); die tatsächlich erzielten quantitativen und qualitativen Ergebnisse; sowie kritisch, welche Faktoren tatsächlich ursächlich für den Erfolg waren im Gegensatz zu Faktoren, die lediglich zufällig oder marktspezifisch begünstigend wirkten (Survivorship Bias – man sieht meist nur die erfolgreichen Fälle, nicht die vielen gescheiterten Unternehmen mit ähnlicher Strategie). Eine gute Fallstudienanalyse hinterfragt daher stets, ob ein beobachtetes Erfolgsmuster tatsächlich kausal übertragbar ist oder nur im spezifischen Kontext dieses einen Unternehmens funktionierte.`,ex:`Eine Fallstudie zu Zalando untersucht systematisch, wie die frühzeitige Einführung kostenloser Retouren und einer sehr langen Rückgabefrist das Vertrauen und damit die Konversionsrate bei online gekaufter Mode signifikant steigerte – gleichzeitig hinterfragt eine gute Analyse kritisch, ob dieses Modell auch für kleinere Händler mit geringerer Marktmacht und schwächerer Verhandlungsposition gegenüber Logistikpartnern in gleicher Weise wirtschaftlich tragfähig wäre.`}],quiz:[{q:`Was ist ein Freemium-Modell?`,options:[`Alles kostenpflichtig`,`Basisversion kostenlos, Zusatzfunktionen kostenpflichtig`,`Nur Werbefinanzierung`,`Einmalzahlung ohne Abo`],correct:1,explain:`Freemium = kostenlose Basisversion, Premium-Funktionen gegen Bezahlung.`},{q:`Was kennzeichnet ein skalierbares Geschäftsmodell?`,options:[`Umsatz wächst linear mit Personal`,`Umsatz wächst überproportional zu den Kosten`,`Nur regional begrenzt`,`Erfordert viel manuelle Arbeit pro Kunde`],correct:1,explain:`Skalierbarkeit bedeutet, dass Wachstum nicht proportional mehr Ressourcen erfordert.`}],cards:[{front:`Freemium`,back:`Geschäftsmodell mit kostenloser Basisversion und kostenpflichtigen Zusatzfunktionen.`},{front:`Skalierbarkeit`,back:`Fähigkeit eines Geschäftsmodells, Umsatz überproportional zu den Kosten zu steigern.`},{front:`Marketplace-Modell`,back:`Plattform, die Drittanbieter und Käufer zusammenbringt und Provision erhält.`}]},{id:`s5-edv`,code:`EDV I`,name:`Marktforschung – Statistische Auswertung mit SPSS`,ects:6,sws:`4`,exam:`E-Assessment 15 Min. · 30% + Vortrag 15 Min. · 70%`,desc:`Praktische Marktforschung mit dem Statistikprogramm SPSS.`,topics:[{t:`Fragebogendesign & Datenerhebung`,def:`Ein methodisch sauberes Fragebogendesign ist die Grundvoraussetzung für belastbare Marktforschungsergebnisse. Zentrale Prinzipien sind: die Vermeidung suggestiver oder wertender Formulierungen, die Befragte unbewusst zu einer bestimmten Antwort lenken (z.B. 'Wie sehr gefällt Ihnen unser hervorragender Service?' statt neutral 'Wie bewerten Sie unseren Service?'); klare, eindeutige und für alle Befragten gleich verständliche Fragen ohne Fachjargon oder Doppeldeutigkeiten; die Verwendung geeigneter Antwortskalen, insbesondere der Likert-Skala (meist 5- oder 7-stufig, von starker Ablehnung bis starker Zustimmung), die feinere Abstufungen als reine Ja/Nein-Fragen erlaubt. Bei der Datenerhebung ist zudem die Repräsentativität der Stichprobe entscheidend: Nur wenn die befragte Gruppe in ihren relevanten Merkmalen (Alter, Geschlecht, Kaufverhalten) der interessierenden Grundgesamtheit ähnelt, lassen sich die Ergebnisse überhaupt verallgemeinern – eine unrepräsentative, verzerrte Stichprobe (z.B. nur besonders zufriedene Bestandskunden) führt zu irreführenden Schlussfolgerungen, egal wie sorgfältig der Fragebogen selbst gestaltet ist.`,ex:`Eine Kundenzufriedenheitsumfrage nutzt eine 5-stufige Likert-Skala von 'sehr unzufrieden' über 'neutral' bis 'sehr zufrieden' statt einer reinen Ja/Nein-Frage, um feinere Abstufungen der Zufriedenheit zu erfassen, und stellt durch zufällige Auswahl der Befragten aus der gesamten Kundendatenbank (statt nur aktiver Vielkäufer) sicher, dass auch unzufriedene oder inaktive Kunden angemessen repräsentiert sind.`},{t:`Datenaufbereitung in SPSS`,def:`Bevor Rohdaten aus einer Umfrage statistisch ausgewertet werden können, müssen sie in SPSS (Statistical Package for the Social Sciences, einer der verbreitetsten Statistik-Software für Sozial- und Marktforschung) systematisch aufbereitet werden. Der Prozess umfasst typischerweise: das Einlesen der Rohdaten (oft aus Excel- oder CSV-Exporten von Online-Umfragetools), die Kodierung von Textantworten in numerische Werte, mit denen statistische Verfahren rechnen können (z.B. 'weiblich' = 1, 'männlich' = 2), die Datenbereinigung, bei der widersprüchliche, unplausible oder eindeutig fehlerhafte Antworten identifiziert und behandelt werden, sowie den systematischen Umgang mit fehlenden Werten (fehlt eine Antwort, weil eine Frage übersprungen wurde, oder wurde sie bewusst verweigert – beides muss unterschiedlich kodiert und in der späteren Analyse berücksichtigt werden, um die Ergebnisse nicht zu verzerren). Erst nach dieser sorgfältigen Aufbereitung liefern nachfolgende statistische Berechnungen verlässliche und interpretierbare Ergebnisse.`,ex:`Bei der Auswertung einer Kundenumfrage werden Antworten, bei denen Befragte eine Pflichtfrage zum Einkommen übersprungen haben, in SPSS explizit als 'fehlender Wert' (Missing Value) markiert statt versehentlich als 0 interpretiert zu werden – würde man sie fälschlich als 0 behandeln, würde der berechnete Durchschnittswert für das Einkommen systematisch und irreführend nach unten verzerrt.`},{t:`Deskriptive Auswertung`,def:`Die deskriptive Auswertung fasst die erhobenen Umfragedaten mit Kennzahlen und visuellen Darstellungen so zusammen, dass sich Muster und Verteilungen auf einen Blick erfassen lassen, bevor komplexere statistische Tests durchgeführt werden. Typische deskriptive Kennzahlen sind Häufigkeitsverteilungen (wie oft welche Antwortkategorie gewählt wurde, meist als Prozentangabe), Mittelwerte und Mediane für numerische Fragen (z.B. durchschnittliche Zufriedenheitsbewertung), sowie Streuungsmaße, die zeigen, wie einheitlich oder gespalten die Meinungen der Befragten tatsächlich sind. Visuelle Darstellungen wie Balkendiagramme (für kategoriale Daten wie Altersgruppen), Kreisdiagramme (für Anteilsverhältnisse) oder Histogramme (für die Verteilung numerischer Werte) erleichtern es, Ergebnisse auch fachfremden Stakeholdern verständlich zu kommunizieren. Die deskriptive Auswertung liefert dabei noch keine Aussage darüber, ob beobachtete Unterschiede statistisch bedeutsam oder zufällig sind – dafür sind nachgelagerte Signifikanztests notwendig.`,ex:`SPSS erstellt automatisch ein Balkendiagramm zur Altersverteilung der befragten Online-Käufer, das auf einen Blick zeigt, dass die Altersgruppe 25–34 Jahre mit 38% deutlich überrepräsentiert ist gegenüber älteren Altersgruppen – eine Erkenntnis, die das Marketingteam direkt nutzt, um Werbebotschaften gezielter auf diese dominante Zielgruppe zuzuschneiden.`},{t:`Signifikanztests in SPSS`,def:`Signifikanztests prüfen mithilfe von SPSS statistisch, ob ein in den Umfragedaten beobachteter Unterschied zwischen Gruppen (z.B. zwischen Männern und Frauen, oder zwischen zwei Werbevarianten) tatsächlich in der Grundgesamtheit existiert oder lediglich zufälliger Stichprobenschwankung geschuldet ist. Der t-Test vergleicht die Mittelwerte zweier Gruppen (z.B. durchschnittliche Zahlungsbereitschaft von Männern vs. Frauen) und prüft, ob der beobachtete Unterschied statistisch signifikant ist. Die Varianzanalyse (ANOVA) erweitert dieses Prinzip auf den Vergleich von mehr als zwei Gruppen gleichzeitig (z.B. drei oder mehr Altersgruppen). Der Chi-Quadrat-Test prüft dagegen Zusammenhänge zwischen kategorialen Variablen (z.B. ob die Präferenz für eine Zahlungsart vom Wohnort abhängt). In allen Fällen liefert SPSS einen p-Wert, der mit dem vorab festgelegten Signifikanzniveau (meist 5%) verglichen wird, um zu entscheiden, ob der beobachtete Unterschied als statistisch abgesichert gilt oder nicht.`,ex:`Ein t-Test in SPSS vergleicht die durchschnittliche Zahlungsbereitschaft für ein Premium-Produkt zwischen männlichen und weiblichen Befragten und liefert einen p-Wert von 0,21 – da dieser deutlich über der 5%-Signifikanzschwelle liegt, muss die Nullhypothese ('kein Unterschied zwischen den Geschlechtern') beibehalten werden, der beobachtete kleine Unterschied in der Stichprobe gilt somit als statistisch nicht signifikant und vermutlich zufällig.`},{t:`Ergebnisinterpretation & Präsentation`,def:`Die abschließende Phase jeder Marktforschungsstudie besteht darin, komplexe statistische Kennwerte und Testergebnisse in klare, verständliche und handlungsleitende Aussagen für Entscheidungsträger zu übersetzen, die selbst meist keine statistische Ausbildung haben. Dabei gilt es, mehrere typische Fehlerquellen zu vermeiden: statistische Signifikanz nicht mit praktischer Relevanz zu verwechseln (ein winziger, aber signifikanter Unterschied kann geschäftlich bedeutungslos sein), Korrelationen nicht vorschnell als Kausalität zu interpretieren, sowie Ergebnisse nicht über den tatsächlich untersuchten Kontext hinaus zu verallgemeinern. Eine gute Ergebnispräsentation stellt die zentrale Erkenntnis zuerst voran (statt sich in methodischen Details zu verlieren), visualisiert Kernaussagen mit einfachen, aussagekräftigen Diagrammen und leitet aus den Daten konkrete, umsetzbare Handlungsempfehlungen ab, statt nur nackte Zahlen zu präsentieren.`,ex:`Aus der statistisch signifikanten Erkenntnis, dass Kunden mit Warenkorbwerten unter 50 € eine deutlich höhere Kaufabbruchrate aufweisen, sobald Versandkosten angezeigt werden, leitet das Marketingteam die konkrete, unmittelbar umsetzbare Handlungsempfehlung ab, kostenlosen Versand ab einem Mindestbestellwert von 50 € einzuführen – eine für die Geschäftsführung sofort verständliche und handlungsorientierte Übersetzung der zugrundeliegenden statistischen Analyse.`}],quiz:[{q:`Wofür wird SPSS hauptsächlich genutzt?`,options:[`Bildbearbeitung`,`Statistische Datenauswertung`,`Buchhaltung`,`Videoschnitt`],correct:1,explain:`SPSS ist eine Software speziell für statistische Datenanalyse in der Marktforschung.`},{q:`Was ist eine Voraussetzung für valide Marktforschungsergebnisse?`,options:[`Möglichst kleine Stichprobe`,`Repräsentative Stichprobe`,`Nur Freunde befragen`,`Keine Fragebögen nötig`],correct:1,explain:`Eine repräsentative Stichprobe ist entscheidend für verallgemeinerbare Ergebnisse.`}],cards:[{front:`SPSS`,back:`Statistiksoftware (Statistical Package for the Social Sciences) für Datenauswertung.`},{front:`Stichprobe`,back:`Teilmenge einer Grundgesamtheit, die für eine Untersuchung befragt/analysiert wird.`},{front:`Signifikanztest`,back:`Statistisches Verfahren zur Prüfung, ob ein Ergebnis zufällig oder bedeutsam ist.`},{front:`Likert-Skala`,back:`Bewertungsskala (z.B. 1-5) zur Messung von Einstellungen in Umfragen.`}]},{id:`s5-scsm`,code:`SCSM`,name:`Social Commerce und Social Media`,ects:6,sws:`5`,exam:`Entwurf (5 S.) · 50% + Vortrag 20 Min. · 50%`,desc:`Verkauf und Marketing über soziale Medien und Social-Commerce-Plattformen.`,topics:[{t:`Social-Media-Plattformen im Vergleich`,def:`Social-Media-Plattformen unterscheiden sich fundamental in Nutzerdemografie, bevorzugtem Inhaltsformat und den zugrundeliegenden Empfehlungsalgorithmen, weshalb eine erfolgreiche Social-Media-Strategie plattformspezifisch statt einheitlich gestaltet werden muss. Instagram ist primär visuell geprägt (Fotos, kurze Videos/Reels, Stories) und eignet sich besonders für ästhetisch ansprechende Produktkategorien wie Mode, Beauty oder Lifestyle. TikTok setzt auf kurze, algorithmisch stark personalisierte Videoinhalte mit sehr hoher viraler Reichweitenchance auch für Accounts ohne große bestehende Followerschaft, bevorzugt eine jüngere Zielgruppe und einen unterhaltsamen, unpolierten Stil. LinkedIn ist auf berufliche Inhalte und B2B-Kommunikation fokussiert und eignet sich für Geschäftskunden-Marketing, Employer Branding und Fachwissen-Content. Facebook erreicht demgegenüber eine im Schnitt ältere Zielgruppe und eignet sich gut für zielgruppengenaue bezahlte Werbung dank umfangreicher Targeting-Optionen. Die Wahl der richtigen Plattform(en) sollte sich konsequent an der tatsächlichen Zielgruppe und dem Produkttyp orientieren, statt einfach jede populäre Plattform gleichermaßen zu bespielen.`,ex:`Ein Modehändler mit junger Zielgruppe investiert sein Content-Budget primär in Instagram (ästhetische Produktfotos, Reels) und TikTok (unterhaltsame Outfit-Videos), während ein B2B-Software-Anbieter für Warenwirtschaftssysteme fast ausschließlich auf LinkedIn setzt, um Einkaufsentscheider in Unternehmen mit Fachcontent zu erreichen.`},{t:`Influencer-Marketing`,def:`Influencer-Marketing nutzt Personen mit einer glaubwürdigen, engagierten Reichweite in sozialen Medien, um Produkte oder Marken auf eine authentischere, weniger werbliche Weise zu bewerben, als es klassische Anzeigenwerbung leisten kann. Man unterscheidet nach Reichweitengröße mehrere Kategorien: Mega- und Makro-Influencer (mehrere hunderttausend bis Millionen Follower, hohe Reichweite, aber oft geringere prozentuale Engagement-Rate und hohe Kooperationskosten), Micro-Influencer (typischerweise 10.000 bis 100.000 Follower, oft thematisch fokussiert auf eine Nische, mit deutlich höherer Vertrauensbindung und Engagement-Rate innerhalb ihrer Community) sowie Nano-Influencer (unter 10.000 Follower, sehr persönliche, glaubwürdige Beziehung zu ihren Followern). Die Wahl zwischen wenigen reichweitenstarken oder vielen kleineren, thematisch passenden Influencern hängt vom Kampagnenziel ab: Für breite Markenbekanntheit eignen sich eher Makro-Influencer, für Vertrauensaufbau und tatsächliche Konversionen oft ein Netzwerk vieler Micro-Influencer. Transparenz ist rechtlich zwingend: Bezahlte Kooperationen müssen als Werbung gekennzeichnet werden.`,ex:`Statt eine einzelne, teure Kooperation mit einem reichweitenstarken Mega-Influencer einzugehen, arbeitet ein Beauty-Startup gezielt mit zwanzig thematisch passenden Micro-Influencern zusammen, die das Produkt in authentischen Unboxing- und Anwendungsvideos vorstellen – die Summe der kleineren, aber hoch engagierten Communities erzeugt oft eine glaubwürdigere und kosteneffizientere Wirkung als eine einzelne Großkampagne.`},{t:`Social-Commerce-Features (Shop-Tags, Live-Shopping)`,def:`Social Commerce bezeichnet die direkte Integration von Kauffunktionen in soziale Medien, sodass der gesamte oder zumindest der überwiegende Teil des Kaufprozesses innerhalb der Social-Media-App selbst abläuft, statt Nutzer auf eine externe Website weiterzuleiten – dadurch wird die Reibung zwischen Produktentdeckung und Kaufabschluss minimiert. Shop-Tags (z.B. Instagram Shopping) verlinken Produkte direkt in Fotos oder Videos, sodass Nutzer per Antippen sofort Preis und Kaufoption sehen. Live-Shopping überträgt das aus Teleshopping bekannte Format ins digitale Zeitalter: Ein Host präsentiert Produkte in einem Live-Video-Stream, beantwortet Fragen der Zuschauer in Echtzeit im Chat und Zuschauer können die gezeigten Produkte unmittelbar während der Übertragung kaufen – dieses Format erzeugt durch die Live-Interaktion und oft zeitlich begrenzte Angebote ein starkes Gefühl von Dringlichkeit und Community. Diese Formate sind besonders in asiatischen Märkten (allen voran China) bereits stark etabliert und gewinnen auch in westlichen Märkten zunehmend an Bedeutung.`,ex:`Bei einer Instagram-Live-Shopping-Session präsentiert eine Marke live neue Produkte, beantwortet direkt im Chat Fragen zu Größen und Materialien, und Zuschauer können die gerade gezeigten Artikel per Klick auf einen eingeblendeten Shop-Tag sofort kaufen, ohne die App zu verlassen oder auf eine externe Website weitergeleitet zu werden.`},{t:`Content-Strategie & Community-Management`,def:`Eine Content-Strategie plant systematisch, welche Themen, Formate und Frequenzen von Inhalten auf welchen Kanälen veröffentlicht werden, um konsistent auf übergeordnete Marketingziele (Markenbekanntheit, Engagement, Konversion) einzuzahlen, statt Inhalte spontan und unkoordiniert zu veröffentlichen. Ein Redaktionsplan (Content-Kalender) legt dabei im Voraus fest, welche Art von Content an welchem Wochentag erscheint, um eine ausgewogene Mischung verschiedener Content-Typen (z.B. Produktvorstellungen, Behind-the-Scenes-Einblicke, nutzergenerierte Inhalte, unterhaltsame Formate) sicherzustellen und die Content-Produktion planbar zu organisieren. Community-Management ergänzt die reine Inhaltsproduktion um den aktiven, zeitnahen Dialog mit der Zielgruppe: Kommentare beantworten, auf Direktnachrichten reagieren, sowohl positives als auch kritisches Feedback konstruktiv aufgreifen und dadurch eine loyale, engagierte Community aufbauen. Ein professionelles Community-Management etabliert zudem klare interne Richtlinien (Tonalität, Reaktionszeiten, Umgang mit negativen Kommentaren oder Shitstorms), um auch in schwierigen Situationen konsistent und professionell zu reagieren.`,ex:`Ein Redaktionsplan eines Online-Shops legt fest: Montags erscheint neuer Produkt-Content, mittwochs ein Behind-the-Scenes-Einblick ins Team, freitags eine Kunden-Erfolgsgeschichte (Social Proof) – durch diese geplante Abwechslung wirkt der Kanal weder rein werblich noch beliebig, und das Community-Management-Team reagiert innerhalb von maximal zwei Stunden auf jede Kundenanfrage in den Kommentaren.`},{t:`Performance-Messung Social Ads`,def:`Die Erfolgsmessung bezahlter Social-Media-Werbung (Social Ads) stützt sich auf mehrere komplementäre Kennzahlen, die jeweils unterschiedliche Aspekte des Kampagnenerfolgs abbilden und gemeinsam betrachtet werden müssen, da keine einzelne Kennzahl allein aussagekräftig ist. Die Reichweite zeigt, wie viele individuelle Nutzer eine Anzeige gesehen haben. Die Klickrate (Click-Through-Rate, CTR) misst den Anteil der Betrachter, die tatsächlich auf die Anzeige geklickt haben, und gibt Aufschluss über die Attraktivität von Bild/Video und Werbetext. Die Kosten pro Klick (CPC) und die Kosten pro Conversion (CPA – Cost per Acquisition) zeigen, wie wirtschaftlich effizient eine Kampagne tatsächlich Kunden oder Verkäufe generiert. Entscheidend ist dabei, den gesamten Trichter (Funnel) zu betrachten statt einzelner isolierter Kennzahlen: Eine Anzeige mit niedriger CTR kann dennoch hocheffizient sein, wenn die wenigen tatsächlichen Klicks überdurchschnittlich oft zu einem Kauf führen (hohe Konversionsrate), während eine Anzeige mit sehr hoher CTR, aber kaum Konversionen, in Wahrheit ineffizient Werbebudget verbrennt.`,ex:`Eine Social-Ad-Kampagne erzielt nur eine unterdurchschnittliche Klickrate von 0,8%, konvertiert aber 12% der Klicks tatsächlich zu einem Kauf (weit über dem Branchendurchschnitt von 3%) – trotz der niedrigen CTR ist diese Kampagne wirtschaftlich hocheffizient, weil sie eine sehr präzise, kaufbereite Zielgruppe anspricht, was sich erst bei gemeinsamer Betrachtung von CTR und Conversion Rate zeigt.`}],quiz:[{q:`Was ist Social Commerce?`,options:[`Rein organische Werbung ohne Kaufoption`,`Kaufabwicklung direkt innerhalb sozialer Medien`,`Nur B2B-Handel`,`Offline-Verkauf mit Social-Media-Werbung`],correct:1,explain:`Social Commerce ermöglicht den Kaufabschluss direkt innerhalb der Social-Media-Plattform.`},{q:`Was ist ein Micro-Influencer?`,options:[`Influencer mit sehr großer Reichweite (>1 Mio.)`,`Influencer mit kleinerer, aber engagierter Followerschaft`,`Ein Bot-Account`,`Ein Unternehmenskonto`],correct:1,explain:`Micro-Influencer haben kleinere, aber oft sehr engagierte und thematisch fokussierte Communities.`}],cards:[{front:`Social Commerce`,back:`Kaufabwicklung direkt innerhalb sozialer Netzwerke (z.B. Instagram Shopping).`},{front:`Influencer-Marketing`,back:`Kooperation mit reichweitenstarken Personen zur Produktbewerbung.`},{front:`Engagement Rate`,back:`Kennzahl für Interaktionen (Likes, Kommentare) im Verhältnis zur Reichweite.`},{front:`Live-Shopping`,back:`Live-Videoformat, in dem Produkte in Echtzeit vorgestellt und direkt gekauft werden können.`}]},{id:`s5-wahl1`,code:`Wahlmodul 1`,name:`Wahlmodul (frei wählbar)`,ects:6,sws:`4`,exam:`Je nach gewähltem Modul`,desc:`Ein frei wählbares Modul aus dem Wahlkatalog (siehe Wahlmodul-Verzeichnis).`,topics:[{t:`Wahlpflichtbereich`,def:`Du wählst eines von über 30 Wahlmodulen aus dem HRW-Katalog – von KI über UX Design bis Retail Management.`,ex:`Siehe das anklickbare Wahlmodul-Verzeichnis am Ende dieser Seite für alle Optionen und Lerninhalte.`}],quiz:[],cards:[]},{id:`s5-wahl2`,code:`Wahlmodul 2`,name:`Wahlmodul (frei wählbar)`,ects:6,sws:`4`,exam:`Je nach gewähltem Modul`,desc:`Ein frei wählbares Modul aus dem Wahlkatalog (siehe Wahlmodul-Verzeichnis).`,topics:[{t:`Wahlpflichtbereich`,def:`Du wählst eines von über 30 Wahlmodulen aus dem HRW-Katalog – von KI über UX Design bis Retail Management.`,ex:`Siehe das anklickbare Wahlmodul-Verzeichnis am Ende dieser Seite für alle Optionen und Lerninhalte.`}],quiz:[],cards:[]}]}})),RD,zD=o((()=>{RD={nr:6,title:`Wahlmodule & Praxissemester (Teil I)`,ects:30,modules:[{id:`s6-wahl0`,code:`Wahlmodul 3`,name:`Wahlmodul (frei wählbar)`,ects:6,sws:`4`,exam:`Je nach gewähltem Modul`,desc:`Ein frei wählbares Modul aus dem Wahlkatalog (siehe Wahlmodul-Verzeichnis unten).`,topics:[{t:`Wahlpflichtbereich`,def:`Freie Wahl aus dem HRW-Katalog, Vertiefung nach persönlichem Interesse.`,ex:`Siehe Wahlmodul-Verzeichnis unten für alle Optionen und Lerninhalte.`}],quiz:[],cards:[]},{id:`s6-wahl1`,code:`Wahlmodul 4`,name:`Wahlmodul (frei wählbar)`,ects:6,sws:`4`,exam:`Je nach gewähltem Modul`,desc:`Ein frei wählbares Modul aus dem Wahlkatalog (siehe Wahlmodul-Verzeichnis unten).`,topics:[{t:`Wahlpflichtbereich`,def:`Freie Wahl aus dem HRW-Katalog, Vertiefung nach persönlichem Interesse.`,ex:`Siehe Wahlmodul-Verzeichnis unten für alle Optionen und Lerninhalte.`}],quiz:[],cards:[]},{id:`s6-wahl2`,code:`Wahlmodul 5`,name:`Wahlmodul (frei wählbar)`,ects:6,sws:`4`,exam:`Je nach gewähltem Modul`,desc:`Ein frei wählbares Modul aus dem Wahlkatalog (siehe Wahlmodul-Verzeichnis unten).`,topics:[{t:`Wahlpflichtbereich`,def:`Freie Wahl aus dem HRW-Katalog, Vertiefung nach persönlichem Interesse.`,ex:`Siehe Wahlmodul-Verzeichnis unten für alle Optionen und Lerninhalte.`}],quiz:[],cards:[]},{id:`s6-praxis1`,code:`Praxis I`,name:`Praxissemester – Teil I`,ects:12,sws:`—`,exam:`Praxisbericht / Nachweis · unbenotet`,desc:`Erster Teil des Praxissemesters: Anwendung des Studienwissens in einem Unternehmen der E-Commerce-/Handelsbranche.`,topics:[{t:`Unternehmenssuche & Bewerbungsprozess`,def:`Die Suche nach einer geeigneten Praxisstelle sollte idealerweise 3 bis 6 Monate vor dem geplanten Praxissemesterbeginn starten, da attraktive Unternehmen im E-Commerce- und Handelsumfeld ihre Praktikumsplätze oft frühzeitig besetzen. Zu den wichtigsten Suchwegen zählen die offiziellen Praxispartner-Verzeichnisse der Hochschule (Unternehmen, die bereits Erfahrung mit HRW-Studierenden haben und curricular passende Aufgaben anbieten können), allgemeine Jobportale und Karriereseiten von Zielunternehmen sowie Initiativbewerbungen bei Unternehmen, die aktuell keine ausgeschriebene Praktikumsstelle führen, aber grundsätzlich für Praxissemester offen sind. Eine überzeugende Bewerbung sollte klar herausstellen, welche bereits erworbenen Studieninhalte (z.B. Grundlagen aus BWL, Marketing, Programmierung, Statistik) konkret zum Nutzen des aufnehmenden Unternehmens eingebracht werden können, statt nur allgemein Lernbereitschaft zu betonen.`,ex:`Ein Student bewirbt sich fünf Monate vor Praxissemesterbeginn gezielt bei einem regionalen Praxispartner im E-Commerce- oder Handelsumfeld und hebt in seinem Anschreiben konkret hervor, dass er bereits SQL-Grundlagen und Web-Analytics-Kenntnisse aus dem Studium mitbringt, die er direkt im Marketing- oder IT-Bereich des Unternehmens anwenden kann.`},{t:`Praktische Mitarbeit im Fachbereich`,def:`Der Kern des Praxissemesters ist die aktive, verantwortungsvolle Mitarbeit in einem konkreten Fachbereich des aufnehmenden Unternehmens – etwa Online-Marketing, IT/Softwareentwicklung, Logistik, Category Management oder Controlling – mit realen, geschäftsrelevanten Aufgaben statt reiner Beobachtung oder Zuarbeit ohne inhaltlichen Bezug zum Studium. Idealerweise erhalten Studierende im Laufe des Praktikums zunehmend eigenverantwortliche Teilaufgaben oder sogar ein kleines eigenes Projekt, statt dauerhaft nur unterstützende Routinetätigkeiten zu übernehmen, da erst eigenverantwortliches Arbeiten einen echten Lerneffekt und aussagekräftige Erfahrungen für den späteren Praxisbericht liefert. Ein regelmäßiger, strukturierter Austausch mit dem betrieblichen Betreuer hilft dabei, frühzeitig Erwartungen abzustimmen und den Aufgabenbereich im Verlauf des Praktikums sinnvoll zu erweitern.`,ex:`Ein Praktikant im Category Management eines Online-Händlers unterstützt zunächst bei der Pflege von Produktdaten und Preisen, übernimmt aber bereits nach wenigen Wochen eigenverantwortlich die komplette Analyse und Neustrukturierung einer bislang wenig erfolgreichen Produktkategorie, inklusive konkreter Handlungsempfehlungen an den Category Manager.`},{t:`Anwendung von Studieninhalten im Betrieb`,def:`Ein zentrales Ausbildungsziel des Praxissemesters ist der bewusste Transfer bereits erlernter theoretischer Studieninhalte auf reale betriebliche Fragestellungen, um zu erfahren, wie sich Konzepte aus BWL, Marketing, Statistik, Programmierung oder Recht in der betrieblichen Praxis tatsächlich anwenden lassen und wo Theorie und Praxis voneinander abweichen. Dieser Theorie-Praxis-Transfer funktioniert in beide Richtungen: Einerseits ermöglichen bereits vorhandene Studieninhalte, betriebliche Probleme fundierter zu analysieren als ohne entsprechendes Vorwissen; andererseits zeigt die praktische Anwendung oft, dass reale Situationen komplexer, mehrdeutiger oder politisch beeinflusster sind als vereinfachte Lehrbuchbeispiele, was das eigene Verständnis der Theorie vertieft und kritischer werden lässt. Studierende, die diesen bewussten Transfer aktiv reflektieren, statt Studieninhalte und Praxiserfahrung getrennt nebeneinander stehen zu lassen, ziehen den größten Lernnutzen aus dem Praxissemester.`,ex:`Ein Student nutzt sein im CRM-Modul erworbenes theoretisches Wissen über Kundensegmentierung, um im Praktikum eine reale Kundendatenbank nach Kaufhäufigkeit und -wert zu segmentieren und darauf aufbauend eine gezielte, nach Segment differenzierte Newsletter-Kampagne zu konzipieren – ein direkter, konkreter Transfer von Vorlesungsinhalt in eine reale unternehmerische Anwendung.`},{t:`Dokumentation der Tätigkeiten`,def:`Eine sorgfältige, kontinuierliche Dokumentation der eigenen Tätigkeiten während des gesamten Praxissemesters ist die notwendige Grundlage für einen später überzeugenden, inhaltlich substanziellen Praxisbericht – wird die Dokumentation erst am Ende nachträglich aus der Erinnerung rekonstruiert, gehen wichtige Details, konkrete Zahlen und differenzierte Lernerfahrungen unweigerlich verloren. Empfehlenswert ist ein regelmäßiges (z.B. wöchentliches) kurzes Protokoll, das festhält, welche konkreten Aufgaben bearbeitet wurden, welche neuen Kenntnisse oder Fähigkeiten dabei erworben wurden, welche Herausforderungen oder Probleme auftraten und wie diese gelöst wurden, sowie eine kurze persönliche Reflexion des eigenen Lernfortschritts. Diese laufende Dokumentation erleichtert nicht nur das spätere Schreiben des Praxisberichts erheblich, sondern hilft auch dabei, den eigenen Kompetenzzuwachs über die Zeit bewusst wahrzunehmen und gezielt zu steuern.`,ex:`Ein wöchentliches Protokoll hält fest: 'Woche 6: Eigenständige Analyse der Retourenquote für Kategorie X durchgeführt, dabei erstmals selbstständig eine SQL-Abfrage über die Warenwirtschaftsdatenbank geschrieben; Herausforderung war das Verständnis der komplexen Datenbankstruktur, gelöst durch Rücksprache mit dem IT-Team' – solche konkreten, zeitnah festgehaltenen Einträge bilden am Ende des Praktikums die Grundlage für einen detaillierten, authentischen Praxisbericht.`}],quiz:[{q:`Wie viele ECTS umfasst das gesamte Praxissemester (Teil I + II)?`,options:[`12`,`20`,`28`,`6`],correct:2,explain:`Teil I (12 CR) + Teil II inkl. Praxisseminar (16 CR) = 28 ECTS gesamt.`},{q:`Was ist ein zentrales Ziel des Praxissemesters?`,options:[`Reine Urlaubszeit`,`Theoretisches Wissen in der Praxis anwenden`,`Nur Prüfungen schreiben`,`Auslandsaufenthalt Pflicht`],correct:1,explain:`Das Praxissemester verbindet Theorie mit praktischer Berufserfahrung im Unternehmen.`}],cards:[{front:`Praxissemester`,back:`Praktisches Studiensemester in einem Unternehmen, Anwendung des bisherigen Studienwissens.`},{front:`Praxisbericht`,back:`Schriftliche Dokumentation der Tätigkeiten und Lernerfahrungen während des Praktikums.`}]}]}})),BD,VD=o((()=>{BD={nr:7,title:`Praxissemester (Teil II), Bachelorarbeit & Kolloquium`,ects:30,modules:[{id:`s7-praxis2`,code:`Praxis II`,name:`Praxissemester – Teil II (inkl. Praxisseminar)`,ects:16,sws:`—`,exam:`Praxisbericht + Seminarleistung · unbenotet`,desc:`Zweiter Teil des Praxissemesters inklusive begleitendem Praxisseminar zur Reflexion der Praxiserfahrungen.`,topics:[{t:`Fortsetzung der praktischen Tätigkeit`,def:`Im zweiten Teil des Praxissemesters vertieft sich die praktische Mitarbeit typischerweise deutlich: Nachdem im ersten Teil vor allem die betrieblichen Abläufe, Systeme und das Team kennengelernt wurden, übernehmen Studierende nun zunehmend eigenständige Verantwortung für konkrete Teilaufgaben oder sogar ganze kleine Projekte, oft mit direktem Kontakt zu weiteren Abteilungen oder sogar externen Partnern. Dieser Verantwortungszuwachs spiegelt einen natürlichen Lernkurven-Effekt wider: Mit wachsender Vertrautheit mit den betrieblichen Prozessen, Systemen und der Unternehmenskultur können Studierende komplexere, weniger eng angeleitete Aufgaben übernehmen als zu Beginn des Praktikums. Ein bewusstes Einfordern von mehr Verantwortung im zweiten Praktikumsteil – etwa durch aktives Vorschlagen eigener kleiner Projektideen gegenüber dem betrieblichen Betreuer – maximiert den Lerneffekt und die Aussagekraft der später zu erstellenden Praxisdokumentation.`,ex:`Nachdem ein Praktikant im ersten Praxisteil vor allem unterstützend an der Datenpflege im Category Management mitgewirkt hat, übernimmt er im zweiten Teil eigenverantwortlich die komplette Optimierung einer schwach performenden Produktkategorie – von der Datenanalyse über die Ableitung konkreter Handlungsempfehlungen bis zur eigenständigen Präsentation der Ergebnisse vor dem zuständigen Team.`},{t:`Praxisseminar: Erfahrungsaustausch`,def:`Das begleitende Praxisseminar bringt Studierende, die ihr Praxissemester in ganz unterschiedlichen Unternehmen und Fachbereichen absolviert haben, zu einem strukturierten, moderierten Erfahrungsaustausch zusammen. Ziel ist es, über die eigene, notwendigerweise begrenzte Einzelerfahrung hinaus einen breiteren Einblick zu gewinnen, wie unterschiedliche Unternehmen – je nach Größe, Branche und Digitalisierungsgrad – ähnliche betriebliche Herausforderungen (z.B. Kundenbindung, Retourenmanagement, Lieferkettenorganisation) jeweils anders lösen. Der strukturierte Austausch fördert zudem die kritische Reflexion der eigenen Praxiserfahrung im Vergleich zu den Berichten der Kommilitonen und schärft das Bewusstsein dafür, dass es selten nur eine 'richtige' betriebliche Lösung gibt, sondern verschiedene, jeweils kontextabhängig sinnvolle Ansätze. Häufig werden im Praxisseminar auch übergreifende Themen wie Karriereplanung, Berufseinstieg oder die Themenfindung für die anstehende Bachelorarbeit gemeinsam besprochen.`,ex:`Im Praxisseminar berichten Studierende aus unterschiedlichen Unternehmen, wie diese jeweils mit hohen Retourenquoten umgehen: Während ein großer Modehändler auf ein automatisiertes, KI-gestütztes Größenberatungssystem setzt, um Fehlkäufe vorab zu vermeiden, verfolgt ein kleinerer Elektronikhändler eine strengere Rückgabepolitik mit gezielter Kundenberatung vor dem Kauf – dieser Vergleich zeigt exemplarisch, wie unterschiedlich dasselbe betriebliche Problem je nach Unternehmenskontext gelöst werden kann.`},{t:`Reflexion der Praxiserfahrung`,def:`Die bewusste, strukturierte Reflexion der eigenen Praxiserfahrung geht über die reine Dokumentation der ausgeführten Tätigkeiten hinaus und fragt gezielt danach, was tatsächlich gelernt wurde, welche eigenen Stärken und Entwicklungsfelder sich gezeigt haben, und wie sich das eigene Verständnis von Theorie und Praxis durch die Erfahrung verändert hat. Typische Reflexionsfragen sind: Welche im Studium erlernten Konzepte haben sich in der Praxis als besonders nützlich oder gerade nicht anwendbar erwiesen? Welche fachlichen oder überfachlichen Kompetenzen (z.B. Kommunikation, Projektmanagement, Umgang mit Unsicherheit) wurden am stärksten weiterentwickelt? Welche eigenen beruflichen Interessen und Stärken haben sich durch die praktische Erfahrung deutlicher herauskristallisiert, etwa im Hinblick auf die spätere Berufswahl? Diese Reflexion ist nicht nur akademisch gefordert, sondern hat einen echten praktischen Nutzen für die eigene Karriereplanung und die Auswahl des Bachelorarbeitsthemas.`,ex:`Ein Student reflektiert am Ende des Praxissemesters, dass ihm die praktische, selbst durchgeführte SQL-Datenanalyse im Unternehmen ein deutlich tieferes und sichereres Verständnis vermittelt hat als die rein theoretische Behandlung des Themas in der Vorlesung, und erkennt daraus, dass er sich beruflich stärker in Richtung datengetriebener Rollen wie Business Intelligence oder Web-Analytics orientieren möchte.`},{t:`Vorbereitung auf die Bachelorarbeit`,def:`Das zweite Praxissemester bietet eine wertvolle Gelegenheit, sowohl inhaltlich als auch organisatorisch die anschließende Bachelorarbeit vorzubereiten. Inhaltlich entstehen viele überzeugende Bachelorarbeitsthemen direkt aus konkreten, im Unternehmen erlebten Problemstellungen, da diese praxisrelevant, mit echten Daten zugänglich und häufig auch für das aufnehmende Unternehmen selbst von Interesse sind (was wiederum Datenzugang und Unterstützung während der Bachelorarbeit erleichtert). Organisatorisch umfasst die Vorbereitung die frühzeitige Kontaktaufnahme mit einem geeigneten betreuenden Dozenten, die grobe Eingrenzung eines Themenfelds sowie das Klären, ob und in welchem Umfang das Unternehmen Daten, Zugang zu Interviewpartnern oder sonstige Unterstützung für eine unternehmensbezogene Abschlussarbeit bereitstellen kann. Wer diese Vorbereitung bereits während des zweiten Praxisteils beginnt, statt erst danach, gewinnt wertvolle Vorlaufzeit und kann das Bachelorarbeitsthema oft noch gezielt mit den letzten Wochen der praktischen Tätigkeit abstimmen.`,ex:`Aus der eigenverantwortlichen Mitarbeit im Category Management entsteht bei einem Studenten die konkrete Idee, seine Bachelorarbeit über die datengetriebene Optimierung von Sortimentsentscheidungen im Online-Handel zu schreiben – er klärt bereits während der letzten Praktikumswochen mit seinem Unternehmen ab, ob er dafür anonymisierte Verkaufsdaten für seine empirische Analyse nutzen darf.`}],quiz:[{q:`Was ist Ziel des Praxisseminars?`,options:[`Reine Notenvergabe`,`Reflexion und Austausch über die Praxiserfahrungen`,`Zusätzliche Klausur`,`Firmenbesuch der Dozenten`],correct:1,explain:`Im Praxisseminar reflektieren Studierende gemeinsam ihre Praxiserfahrungen.`}],cards:[{front:`Praxisseminar`,back:`Begleitveranstaltung zum Praxissemester zur Reflexion und zum Erfahrungsaustausch.`}]},{id:`s7-ba`,code:`BA`,name:`Bachelorarbeit`,ects:12,sws:`—`,exam:`Schriftliche Arbeit (i.d.R. 40–60 S.) · benotet`,desc:`Eigenständige wissenschaftliche Abschlussarbeit zu einem Thema aus dem E-Commerce-Umfeld.`,topics:[{t:`Themenfindung & Exposé`,def:`Die Themenfindung grenzt aus einem oft noch breiten Interessensgebiet (z.B. 'Retourenmanagement' oder 'Personalisierung im E-Commerce') eine konkrete, klar beantwortbare Forschungsfrage ein, die weder zu breit (nicht innerhalb der vorgegebenen Bearbeitungszeit seriös zu bearbeiten) noch zu eng (zu wenig Substanz für eine vollständige Abschlussarbeit) gefasst ist. Das Exposé ist ein kurzes, meist 2- bis 5-seitiges Konzeptpapier, das vor dem eigentlichen Schreibbeginn erstellt und mit dem betreuenden Dozenten abgestimmt wird: Es skizziert die Forschungsfrage und deren Relevanz, den aktuellen Forschungs- bzw. Praxisstand, das geplante methodische Vorgehen sowie eine vorläufige Kapitelgliederung. Ein sorgfältig erarbeitetes Exposé erspart spätere grundlegende Kurskorrekturen, da methodische oder inhaltliche Schwachstellen idealerweise bereits vor Beginn der eigentlichen, zeitaufwändigen Schreibarbeit erkannt und mit dem Betreuer geklärt werden.`,ex:`Ein Exposé grenzt das breite Interessensgebiet 'schnelle Lieferung' auf die konkrete, klar untersuchbare Forschungsfrage ein: 'Welchen Einfluss hat die Verfügbarkeit von Same-Day-Delivery auf die Kundenzufriedenheit und Wiederkaufabsicht bei deutschen Online-Modehändlern?' – und skizziert bereits, dass diese Frage über eine eigene Kundenumfrage empirisch untersucht werden soll.`},{t:`Wissenschaftliches Arbeiten & Methodik`,def:`Wissenschaftliches Arbeiten folgt verbindlichen methodischen Standards, die eine Bachelorarbeit von einem bloßen Meinungsessay unterscheiden: eine klar formulierte, eingrenzbare Forschungsfrage, die die gesamte Arbeit konsequent leitet; eine nachvollziehbare, logisch aufgebaute Argumentation, bei der jeder Schluss auf vorherigen, belegten Aussagen aufbaut; eine kritische, nicht unreflektierte Auswertung und Einordnung von Quellen (nicht jede gefundene Information ist gleichermaßen verlässlich oder relevant); sowie durchgängige methodische Transparenz, bei der für Dritte nachvollziehbar dokumentiert wird, wie genau zu Ergebnissen gelangt wurde, damit die Arbeit im Prinzip reproduzierbar wäre. Eigene Meinungen oder unbelegte Behauptungen haben in einer wissenschaftlichen Arbeit grundsätzlich keinen Platz, es sei denn, sie werden explizit als eigene, aus den Ergebnissen abgeleitete Einschätzung gekennzeichnet und argumentativ begründet.`,ex:`Statt zu behaupten 'Kostenlose Retouren sind für Online-Händler generell vorteilhaft', belegt eine wissenschaftlich sauber arbeitende Bachelorarbeit diese Aussage durch konkrete zitierte Studienergebnisse und eigene Datenanalysen, differenziert dabei aber auch zwischen Branchen und Unternehmensgrößen, für die diese pauschale Aussage möglicherweise nicht gleichermaßen zutrifft.`},{t:`Literaturrecherche & Zitation`,def:`Die systematische Literaturrecherche identifiziert und bewertet relevante wissenschaftliche Quellen (Fachbücher, referierte Zeitschriftenartikel, seriöse Studien) zum gewählten Thema, meist über wissenschaftliche Datenbanken, Bibliothekskataloge und Google Scholar, wobei die Qualität und Aktualität der gefundenen Quellen kritisch bewertet werden muss (nicht jede im Internet auffindbare Quelle erfüllt wissenschaftliche Qualitätsstandards). Die Zitation kennzeichnet transparent und nachvollziehbar, welche Gedanken, Daten oder Formulierungen aus fremden Quellen übernommen wurden, um Plagiate (die unausgewiesene Übernahme fremden geistigen Eigentums, ein schwerwiegender akademischer Verstoß) zu vermeiden und die eigene Argumentation durch etablierte Erkenntnisse zu untermauern. Gängige Zitationsstile wie APA oder die in den Wirtschaftswissenschaften verbreitete deutsche Zitierweise (Fußnoten) folgen jeweils festen, formalen Regeln für Verweise im Text sowie das abschließende Literaturverzeichnis, deren konsequente und einheitliche Anwendung über die gesamte Arbeit hinweg verpflichtend ist.`,ex:`Eine Aussage zur durchschnittlichen Retourenquote im deutschen Online-Modehandel wird nicht einfach unbelegt behauptet, sondern korrekt mit Quellenangabe zitiert, etwa im APA-Stil als '(Deges, 2023, S. 45)', wobei die vollständige bibliografische Angabe der Quelle zusätzlich im Literaturverzeichnis am Ende der Arbeit aufgeführt wird.`},{t:`Empirische oder konzeptionelle Bearbeitung`,def:`Je nach Art der Forschungsfrage wird eine Bachelorarbeit entweder empirisch oder konzeptionell (theoretisch-analytisch) bearbeitet, wobei auch Mischformen möglich sind. Die empirische Bearbeitung sammelt und analysiert eigene, neu erhobene oder bereits vorhandene Daten (z.B. eine selbst durchgeführte Kundenumfrage, Experteninterviews oder die Auswertung eines Unternehmensdatensatzes) mit geeigneten quantitativen (statistischen) oder qualitativen (interpretativen) Methoden, um die Forschungsfrage mit konkreter, selbst erhobener Evidenz zu beantworten. Die konzeptionelle Bearbeitung stützt sich dagegen primär auf die systematische Analyse und Synthese bereits vorhandener Fachliteratur, um bestehende Theorien, Modelle oder Konzepte kritisch zu vergleichen, neu zusammenzuführen oder auf einen neuen Anwendungskontext zu übertragen, ohne eigene neue Daten zu erheben. Die Wahl des Bearbeitungstyps sollte sich konsequent aus der Art der Forschungsfrage ergeben – eine Frage nach subjektiver Kundenwahrnehmung erfordert meist empirische Daten, eine Frage nach der theoretischen Einordnung eines Konzepts eher eine konzeptionelle Literaturanalyse.`,ex:`Für die Forschungsfrage zum Einfluss von Same-Day-Delivery auf die Kundenzufriedenheit entwickelt die Studentin einen eigenen strukturierten Fragebogen, befragt 150 tatsächliche Online-Käufer und wertet die Ergebnisse empirisch mit statistischen Methoden (u.a. Signifikanztests) aus, statt sich ausschließlich auf bereits publizierte Studien anderer Autoren zu stützen.`},{t:`Schriftliche Ausarbeitung nach wiss. Standards`,def:`Die eigentliche schriftliche Ausarbeitung folgt einem etablierten, weitgehend standardisierten Aufbau: Eine Einleitung führt in das Thema ein, begründet dessen Relevanz, formuliert die zentrale Forschungsfrage und gibt einen kurzen Überblick über den Aufbau der Arbeit. Der theoretische/konzeptionelle Grundlagenteil arbeitet relevante Begriffe, Theorien und den aktuellen Forschungsstand auf. Der Hauptteil (empirische Analyse oder konzeptionelle Argumentation) bearbeitet die eigentliche Forschungsfrage systematisch und ausführlich. Das Fazit fasst die zentralen Ergebnisse zusammen, beantwortet explizit die eingangs gestellte Forschungsfrage, benennt selbstkritisch die Grenzen und methodischen Limitationen der eigenen Arbeit und gibt oft einen Ausblick auf weiterführende Forschungsfragen. Der Sprachstil ist durchgehend sachlich, präzise und unpersönlich (Vermeidung von Ich-Formulierungen und umgangssprachlichen Wendungen), wobei Fachbegriffe konsistent und korrekt verwendet werden.`,ex:`Das Fazit einer Bachelorarbeit beantwortet explizit die eingangs gestellte Forschungsfrage ('Same-Day-Delivery erhöht die Kundenzufriedenheit signifikant, jedoch nur bei Bestellwerten über 50 €'), benennt aber selbstkritisch die Limitation, dass die Stichprobe von 150 Befragten nur eine bestimmte Altersgruppe überproportional abbildet und die Ergebnisse daher nicht ohne Weiteres auf die Gesamtbevölkerung übertragen werden können.`}],quiz:[{q:`Was ist ein Exposé?`,options:[`Die fertige Bachelorarbeit`,`Ein Kurzkonzept zur Themenvorstellung vor Beginn der Arbeit`,`Ein Literaturverzeichnis`,`Die mündliche Prüfung`],correct:1,explain:`Ein Exposé skizziert Thema, Fragestellung und Vorgehen, bevor die eigentliche Arbeit beginnt.`},{q:`Was zeichnet eine gute wissenschaftliche Fragestellung aus?`,options:[`Möglichst vage formuliert`,`Klar abgegrenzt und beantwortbar`,`Nie in der Einleitung genannt`,`Rein subjektive Meinung`],correct:1,explain:`Eine gute Forschungsfrage ist klar abgegrenzt, präzise und mit den verfügbaren Methoden beantwortbar.`}],cards:[{front:`Exposé`,back:`Kurzes Konzeptpapier zur Themenvorstellung vor Beginn der Bachelorarbeit.`},{front:`Forschungsfrage`,back:`Klar abgegrenzte, zentrale Fragestellung, die die Arbeit beantworten soll.`},{front:`Literaturrecherche`,back:`Systematische Suche und Auswertung wissenschaftlicher Quellen zum Thema.`}]},{id:`s7-koll`,code:`Kolloq.`,name:`Bachelorarbeit (Kolloquium)`,ects:2,sws:`—`,exam:`Mündliche Prüfung · benotet`,desc:`Mündliche Verteidigung der Bachelorarbeit vor Prüfungskommission.`,topics:[{t:`Kurzpräsentation der Arbeit`,def:`Zu Beginn des Kolloquiums stellt der Kandidat oder die Kandidatin die eigene Bachelorarbeit in einer knapp bemessenen, meist 15- bis 20-minütigen Präsentation vor der Prüfungskommission vor. Diese Präsentation muss die zentrale Forschungsfrage und deren Relevanz klar herausstellen, das methodische Vorgehen nachvollziehbar zusammenfassen (ohne sich in technischen Details zu verlieren) und die wichtigsten Ergebnisse sowie deren praktische oder theoretische Bedeutung pointiert darstellen – angesichts der knappen Zeit ist eine strenge inhaltliche Priorisierung entscheidend, da unmöglich alle Details der oft 40 bis 60 Seiten umfassenden schriftlichen Arbeit in wenigen Minuten wiedergegeben werden können. Eine gelungene Kurzpräsentation endet zudem mit einer klaren, expliziten Beantwortung der ursprünglichen Forschungsfrage und schafft damit die inhaltliche Grundlage für die anschließende Fragerunde der Prüfer.`,ex:`Ein Student präsentiert in 18 Minuten kompakt, wie er methodisch mittels einer eigenen Kundenumfrage den Einfluss von Same-Day-Delivery auf die Kundenzufriedenheit untersucht hat, zeigt die wichtigsten statistischen Ergebnisse anhand von zwei bis drei aussagekräftigen Diagrammen und schließt mit der klaren Kernaussage, unter welchen Bedingungen sich die Investition in Same-Day-Delivery aus Kundensicht besonders lohnt.`},{t:`Verteidigung der Methodik & Ergebnisse`,def:`Im Anschluss an die Kurzpräsentation muss der Kandidat die in der Bachelorarbeit gewählte Methodik gegenüber kritischen Rückfragen der Prüfungskommission begründen und verteidigen – dies erfordert ein tieferes Verständnis der eigenen methodischen Entscheidungen, als nur zu wissen, was durchgeführt wurde. Typische Verteidigungsaspekte sind: Warum wurde genau diese Methode (z.B. eine quantitative Umfrage statt qualitativer Interviews) und nicht eine Alternative gewählt? Ist die gewählte Stichprobengröße und -zusammensetzung für belastbare Aussagen ausreichend? Welche alternativen Erklärungen für die beobachteten Ergebnisse wurden erwogen und warum wurden sie verworfen? Eine überzeugende Verteidigung zeigt nicht nur technisches Methodenwissen, sondern auch ein reflektiertes Bewusstsein für die Grenzen und Schwächen der eigenen gewählten Vorgehensweise, statt diese zu verschweigen oder zu verharmlosen.`,ex:`Der Kandidat erklärt und begründet auf Nachfrage der Kommission, warum eine Stichprobe von 150 Umfrageteilnehmenden für seine statistische Analyse als ausreichend groß galt (unter Verweis auf die berechnete statistische Power der durchgeführten Signifikanztests), räumt aber gleichzeitig selbstkritisch ein, dass die Stichprobe geografisch nicht vollständig repräsentativ für ganz Deutschland war.`},{t:`Fragerunde mit Prüfern`,def:`In der abschließenden Fragerunde stellen die Mitglieder der Prüfungskommission gezielt vertiefende Fragen zu Inhalt, Methodik, theoretischem Hintergrund oder den Grenzen (Limitationen) der vorgelegten Arbeit, um zu prüfen, ob der Kandidat sein Thema tatsächlich durchdrungen hat und nicht nur die schriftliche Arbeit auswendig wiedergeben kann. Häufige Fragetypen betreffen die Übertragbarkeit der Ergebnisse auf andere Kontexte, Branchen oder Länder, alternative methodische Herangehensweisen, die der Kandidat nicht gewählt hat, die praktische Relevanz und mögliche Handlungsempfehlungen für Unternehmen, sowie mögliche Anschlussfragen für weiterführende zukünftige Forschung. Eine überzeugende Antwort zeigt intellektuelle Flexibilität, Ehrlichkeit bezüglich der Grenzen der eigenen Arbeit sowie die Fähigkeit, spontan und unter Zeitdruck fundiert über das eigene Thema nachzudenken, statt lediglich vorbereitete Antworten abzuspulen.`,ex:`Eine Prüferin fragt kritisch nach, ob sich die für den Modehandel gewonnenen Erkenntnisse zu Same-Day-Delivery auch auf andere Branchen wie den Lebensmittel- oder Elektronikhandel übertragen ließen – der Kandidat antwortet differenziert, dass die grundsätzliche Wirkungsrichtung vermutlich ähnlich sei, die Zahlungsbereitschaft für schnelle Lieferung aber je nach Produktkategorie und Dringlichkeit des Bedarfs stark variieren dürfte, was in seiner Arbeit nicht empirisch untersucht wurde.`}],quiz:[{q:`Was passiert im Kolloquium?`,options:[`Eine neue Klausur wird geschrieben`,`Die Bachelorarbeit wird mündlich präsentiert und verteidigt`,`Nur die Note wird bekanntgegeben`,`Ein neues Thema wird vergeben`],correct:1,explain:`Im Kolloquium präsentiert und verteidigt man die eigene Bachelorarbeit mündlich.`}],cards:[{front:`Kolloquium`,back:`Mündliche Prüfung zur Verteidigung der Bachelorarbeit vor einer Prüfungskommission.`}]}]}})),HD,UD=o((()=>{kD(),jD(),ND(),FD(),LD(),zD(),VD(),HD=[OD,AD,MD,PD,ID,RD,BD]})),WD,GD,KD,qD=o((()=>{WD=u(p(),1),HC(),fx(),KE(),DD(),UD(),pw(),fi(),Fb(),vD(),zE(),GD=A(),KD=(0,WD.memo)(function({open:e,onToggle:t,openQuizIds:n,onToggleQuiz:r}){let{quizBest:i,saveQuizResult:a}=si(),[o,s]=(0,WD.useState)(()=>new Set([`1`])),c=(0,WD.useMemo)(()=>HD.map(e=>({nr:e.nr,modules:e.modules.filter(e=>e.quiz?.length>0)})).filter(e=>e.modules.length>0),[]),l=e=>s(t=>{let n=new Set(t);return n.has(e)?n.delete(e):n.add(e),n});return(0,GD.jsxs)(W,{tint:J.teal,id:`quiz-verzeichnis`,style:{marginBottom:`var(--s-4)`,overflow:`hidden`},children:[(0,GD.jsxs)(`div`,{className:`${Y.head} hover-pop`,onClick:t,...Mb(t),"aria-expanded":e,children:[(0,GD.jsx)(`span`,{"aria-hidden":`true`,children:`🧩`}),(0,GD.jsx)(`span`,{style:{flex:1,fontSize:`var(--fs-xs)`,fontWeight:800,letterSpacing:`0.08em`,textTransform:`uppercase`,color:J.teal},children:`Quiz-Verzeichnis`}),(0,GD.jsxs)(`span`,{style:{fontSize:`var(--fs-xs)`,color:`var(--muted)`},children:[c.reduce((e,t)=>e+t.modules.length,0),` Module`]}),e?(0,GD.jsx)(gS,{size:15,"aria-hidden":`true`}):(0,GD.jsx)(pS,{size:15,"aria-hidden":`true`})]}),(0,GD.jsx)(WE,{open:e,children
