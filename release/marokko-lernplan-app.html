rcen (Knappheit) umgeht. Es existiert in zwei Ausprägungen: Beim Minimalprinzip ist ein bestimmtes Ziel (z.B. eine Produktionsmenge oder ein Umsatzziel) fest vorgegeben, und der Mitteleinsatz (Kosten, Zeit, Personal) soll dafür minimiert werden. Beim Maximalprinzip ist umgekehrt der Mitteleinsatz fix vorgegeben (z.B. ein Budget), und mit diesem soll der größtmögliche Ertrag erzielt werden. Beide Prinzipien sind zwei Seiten derselben Wirtschaftlichkeitslogik: Wirtschaftlichkeit = Ertrag ÷ Aufwand, ein Wert über 1 zeigt, dass mehr erwirtschaftet wurde als eingesetzt wurde. Über das reine Ertrags-Aufwands-Verhältnis hinaus verfolgt jedes Unternehmen ein Zielsystem aus mehreren, teils konkurrierenden Zielarten: Sachziele definieren, WAS angeboten wird (Produkt-/Leistungsprogramm, Marktsegmente, Qualität); Formalziele beschreiben, WIE erfolgreich gewirtschaftet wird (Gewinn, Rentabilität, Liquidität, Marktanteil, Umsatzwachstum); soziale und ökologische Ziele (auch Humanziele bzw. Nachhaltigkeitsziele genannt) betreffen Mitarbeiterzufriedenheit, faire Arbeitsbedingungen, Umweltschutz und gesellschaftliche Verantwortung (CSR). Diese Zielarten stehen in der Praxis häufig in Zielkonflikten zueinander – etwa wenn eine höhere Servicequalität die Formalziele belastet, oder wenn ökologische Standards kurzfristig die Rentabilität senken. Ein gutes Management muss diese Zielkonflikte transparent machen und über Zielhierarchien oder Zielgewichtung auflösen.`,ex:`Ein Online-Modehändler hat exakt 5.000 € Werbebudget und möchte damit so viele Neukunden-Bestellungen wie möglich generieren – klassische Anwendung des Maximalprinzips. Würde er stattdessen vorgeben 'Ich brauche 200 neue Kunden' und das günstigste Budget dafür suchen, wäre das Minimalprinzip. Ein Zielkonflikt entsteht, wenn er zusätzlich klimaneutralen Versand anbieten will (soziales Ziel), der die Versandkosten um 15% erhöht und damit das Gewinnziel schmälert.`},{t:`Rechtsformen von Unternehmen`,def:`Die Wahl der Rechtsform bestimmt zentrale unternehmerische Rahmenbedingungen: Haftung, Kapitalbedarf, Steuerlast, Publizitätspflichten und Mitspracherechte. Personengesellschaften umfassen das Einzelunternehmen (ein Inhaber, volle unbeschränkte Haftung, keine Formvorschriften), die GbR (mind. zwei Gesellschafter, gemeinsame Zweckverfolgung, gesamtschuldnerische unbeschränkte Haftung), die OHG (Handelsgewerbe, im Handelsregister eingetragen, ebenfalls unbeschränkte Haftung aller Gesellschafter) und die KG (mind. ein unbeschränkt haftender Komplementär und mind. ein nur mit seiner Einlage haftender Kommanditist). Kapitalgesellschaften sind eigenständige juristische Personen mit eigener Rechtspersönlichkeit, unabhängig von den Gesellschaftern: Die GmbH erfordert 25.000 € Stammkapital (davon mindestens 12.500 € bei Gründung tatsächlich einzuzahlen), die UG (haftungsbeschränkt) als 'Mini-GmbH' kann bereits mit 1 € gegründet werden, muss aber Gewinne teilweise als gesetzliche Rücklage thesaurieren bis das GmbH-Mindestkapital erreicht ist, und die AG benötigt 50.000 € Grundkapital sowie Vorstand, Aufsichtsrat und Hauptversammlung. Mit der Rechtsform verändern sich zudem Buchführungspflichten (Kapitalgesellschaften sind stets buchführungspflichtig), Publizitätspflichten (z.B. Offenlegung im Bundesanzeiger) sowie Mitbestimmungsrechte der Arbeitnehmer ab bestimmten Unternehmensgrößen. Die Entscheidung ist daher immer eine Abwägung zwischen Haftungsschutz, Gründungsaufwand, steuerlicher Behandlung und Außenwirkung gegenüber Banken, Lieferanten und Investoren.`,ex:`Zwei Gründer starten einen Online-Sneaker-Shop mit 3.000 € Startkapital. Wegen des geringen Kapitals wählen sie zunächst die UG (haftungsbeschränkt) mit 1.500 € Stammkapital statt einer GmbH – ihr Privatvermögen bleibt geschützt. Wächst der Umsatz auf über 500.000 € jährlich und bauen sie 25.000 € Rücklagen auf, können sie später in eine GmbH umwandeln, um seriöser gegenüber Lieferanten und Investoren aufzutreten.`},{t:`Buchführungspflicht & GoB`,def:`§ 238 Abs. 1 HGB verpflichtet jeden Kaufmann, Bücher zu führen und darin seine Handelsgeschäfte sowie die Lage seines Vermögens nach den Grundsätzen ordnungsmäßiger Buchführung (GoB) ersichtlich zu machen. Kaufmann im rechtlichen Sinn ist grundsätzlich jeder, der ein Handelsgewerbe betreibt (Ist-Kaufmann), sowie jeder, der sich freiwillig ins Handelsregister eintragen lässt (Kann-Kaufmann). Kleingewerbetreibende und Freiberufler, die bestimmte Umsatz- und Gewinnschwellen nicht überschreiten (§ 241a HGB: 800.000 € Umsatz bzw. 80.000 € Gewinn pro Jahr), sind von der doppelten Buchführung befreit und dürfen vereinfacht per Einnahmen-Überschuss-Rechnung (EÜR) ihren Gewinn ermitteln. Die GoB selbst sind kein geschlossenes Gesetzeswerk, sondern ein Bündel kodifizierter und ungeschriebener, aus der kaufmännischen Praxis abgeleiteter Ordnungsprinzipien: Richtigkeit und Willkürfreiheit (Buchungen müssen den tatsächlichen Geschäftsvorfall widerspiegeln), Vollständigkeit (kein Geschäftsvorfall darf fehlen), Klarheit und Übersichtlichkeit, Nachprüfbarkeit (lückenloser Zusammenhang zwischen Beleg und Buchung – 'keine Buchung ohne Beleg'), das Vorsichtsprinzip (Verluste werden antizipiert, Gewinne erst bei Realisierung verbucht) sowie zeitgerechte und geordnete Erfassung. Diese Prinzipien dienen dem Gläubigerschutz und der Vergleichbarkeit von Abschlüssen und sind Grundlage jeder Betriebsprüfung.`,ex:`Ein Online-Händler mit GmbH-Rechtsform und 800.000 € Jahresumsatz ist eindeutig buchführungspflichtig und muss jede Wareneinfuhr, jede Marktplatzabrechnung und jede PayPal-Gutschrift lückenlos mit Belegen dokumentieren – ein Betriebsprüfer muss jede Buchung bis zum Ursprungsbeleg zurückverfolgen können (Belegprinzip als Ausprägung der GoB).`},{t:`Soll/Haben, T-Konten, Buchungssätze`,def:`Die doppelte Buchführung ist das zentrale technische Verfahren des Rechnungswesens: Jeder Geschäftsvorfall wird stets auf mindestens zwei Konten erfasst – einmal auf der linken Seite (Soll) und einmal auf der rechten Seite (Haben) – wodurch die fundamentale Bilanzgleichung Aktiva = Passiva jederzeit erhalten bleibt und sich Fehlbuchungen über Kontrollsummen aufdecken lassen. Konten werden schematisch als T-Konten dargestellt: eine senkrechte Linie trennt Soll (links) von Haben (rechts). Für Aktivkonten (Bestandskonten des Vermögens wie Kasse, Bank, Warenbestand, Forderungen) gilt: Anfangsbestand und Zugänge stehen im Soll, Abgänge im Haben. Für Passivkonten (Eigenkapital, Verbindlichkeiten, Rückstellungen) gilt es spiegelverkehrt: Anfangsbestand und Zugänge im Haben, Abgänge im Soll. Ein Buchungssatz ist die formale Kurzschreibweise eines Geschäftsvorfalls nach dem Schema 'Soll-Konto an Haben-Konto, Betrag' und liest sich wie ein Satz: Das im Soll genannte Konto wird belastet, das im Haben genannte entlastet bzw. erkannt. Komplexere Vorfälle können auch zusammengesetzte Buchungssätze mit mehreren Soll- oder Haben-Konten erfordern, wobei die Summe aller Soll-Beträge stets der Summe aller Haben-Beträge entsprechen muss.`,ex:`Ein Fashion-Shop kauft Ware im Wert von 2.000 € auf Rechnung (30 Tage Zahlungsziel) ein. Buchungssatz: Wareneingang 2.000 € an Verbindlichkeiten 2.000 €. Zahlt er 15 Tage später per Überweisung, lautet der zweite Buchungssatz: Verbindlichkeiten 2.000 € an Bank 2.000 € – das Bankkonto wird im Haben entlastet, die Schuld im Soll getilgt.`},{t:`Bilanz, GuV, Abschreibungen`,def:`Die Bilanz und die Gewinn- und Verlustrechnung (GuV) sind die zentralen Bestandteile des handelsrechtlichen Jahresabschlusses (§ 242 HGB). Die Bilanz ist eine stichtagsbezogene Gegenüberstellung von Vermögen und Kapital: Auf der Aktivseite steht die Mittelverwendung, gegliedert in Anlagevermögen (langfristig gebundene Werte wie Maschinen, Gebäude, Lizenzen) und Umlaufvermögen (kurzfristig verfügbare Werte wie Warenbestand, Forderungen, liquide Mittel); auf der Passivseite steht die Mittelherkunft, gegliedert in Eigenkapital und Fremdkapital (Verbindlichkeiten, Rückstellungen). Beide Bilanzseiten sind per Definition immer gleich groß (Bilanzsumme). Die GuV ist demgegenüber zeitraumbezogen: Sie stellt alle Erträge (z.B. Umsatzerlöse) den Aufwendungen (Material-, Personalaufwand, Abschreibungen) einer Periode gegenüber und ermittelt den Jahresüberschuss oder -fehlbetrag, der anschließend das Eigenkapital in der Folgebilanz erhöht bzw. mindert. Abschreibungen (AfA) sind das Bindeglied zwischen beiden Rechenwerken: Sie verteilen Anschaffungs-/Herstellungskosten von Anlagevermögen systematisch über die betriebsgewöhnliche Nutzungsdauer (oft anhand amtlicher AfA-Tabellen), reduzieren dadurch jährlich den Restbuchwert in der Bilanz und schlagen sich gleichzeitig als Aufwand in der GuV nieder. Man unterscheidet die lineare Abschreibung (gleichbleibender Jahresbetrag) von der degressiven Abschreibung (fallende Jahresbeträge) sowie außerplanmäßige Abschreibungen bei dauerhafter Wertminderung.`,ex:`Ein E-Commerce-Unternehmen kauft einen Lagerstapler für 24.000 €, Nutzungsdauer 8 Jahre. Lineare Jahresabschreibung: 24.000 € ÷ 8 = 3.000 €/Jahr. Nach 3 Jahren steht der Stapler mit einem Restbuchwert von 15.000 € in der Bilanz, während die jährlichen 3.000 € als Aufwand die GuV und damit den Jahresüberschuss mindern.`}],quiz:[{q:`Was besagt das Minimalprinzip?`,options:[`Maximalen Ertrag mit festem Mitteleinsatz erzielen`,`Ein festes Ziel mit minimalem Mitteleinsatz erreichen`,`Immer die billigste Option wählen`,`Nur bei Verlust wirtschaften`],correct:1,explain:`Minimalprinzip = gegebenes Ziel mit geringstmöglichem Aufwand erreichen.`},{q:`Welche Rechtsform hat unbeschränkte Haftung?`,options:[`GmbH`,`AG`,`GbR`,`UG`],correct:2,explain:`Bei der GbR haften die Gesellschafter unbeschränkt und persönlich.`},{q:`Auf welcher Seite steht bei einem Aktivkonto der Zugang?`,options:[`Haben`,`Soll`,`Beide gleich`,`Keine, nur bei Passivkonten`],correct:1,explain:`Aktivkonten: Zugang im Soll, Abgang im Haben.`}],cards:[{front:`Wirtschaftlichkeitsprinzip`,back:`Verhältnis von Ertrag zu Mitteleinsatz optimieren – Minimal- oder Maximalprinzip.`},{front:`GmbH`,back:`Kapitalgesellschaft, 25.000 € Stammkapital, Haftung auf Gesellschaftsvermögen beschränkt.`},{front:`GoB`,back:`Grundsätze ordnungsmäßiger Buchführung – Regeln für korrekte, nachvollziehbare Buchhaltung.`},{front:`T-Konto`,back:`Visuelle Kontodarstellung: links Soll, rechts Haben.`},{front:`Aktiva`,back:`Linke Bilanzseite – zeigt, wofür das Kapital verwendet wurde (Vermögen).`}]},{id:`s1-hbl`,code:`HBL`,name:`Grundlagen des Handelsmanagements`,ects:6,sws:`4`,exam:`Klausur 60 Min. · 100%`,desc:`Einführung in das Handelsmanagement: Handelsfunktionen, Betriebstypen, Sortimentspolitik.`,topics:[{t:`5 klassische Handelsfunktionen`,def:`Der Handel ist volkswirtschaftlich als eigenständige Wirtschaftsstufe zwischen Produktion und Konsum zu verstehen, die Wert schafft, indem sie güterwirtschaftliche und informatorische Lücken zwischen Herstellern und Endkunden schließt. Klassischerweise werden fünf Grundfunktionen unterschieden: (1) Die Raum- und Zeit-Überbrückungsfunktion transportiert Ware von Produktionsstandorten zu den Kunden und lagert sie zwischen Produktion und Bedarf zwischen; (2) die Mengen-/Quantitätsfunktion (Umgruppierungsfunktion) zerlegt große, industriell produzierte Mengen in kleinere, konsumgerechte Einheiten; (3) die Qualitäts-/Sortimentsfunktion bündelt Produkte unterschiedlicher Hersteller zu einem für die Zielgruppe sinnvollen Sortiment und übernimmt dabei häufig Qualitätskontrolle; (4) die Kreditfunktion (Finanzierungsfunktion) ermöglicht Zahlungsziele, Ratenkäufe oder Vorfinanzierung und verlagert damit Liquiditätsrisiken zwischen den Marktstufen; (5) die Werbe- und Beratungsfunktion informiert über Produkte, schafft Aufmerksamkeit und unterstützt die Kaufentscheidung durch fachkundige Beratung. Im digitalen Handel verschieben sich diese Funktionen deutlich: Die Raum-/Zeitfunktion wird zunehmend von spezialisierten Fulfillment-Dienstleistern übernommen, während persönliche Beratung immer häufiger durch algorithmische Empfehlungen, Kundenbewertungen und Erklärvideos ersetzt wird – die Funktion bleibt bestehen, nur ihr Träger verändert sich.`,ex:`Amazon erfüllt alle 5 Funktionen digital: Es lagert Millionen Artikel in Fulfillment-Zentren (Überbrückung), bietet Einzelstücke statt Großgebinde (Menge), bündelt Produkte unzähliger Hersteller durchsuchbar (Sortiment), ermöglicht Rechnungskauf und Ratenzahlung (Kredit) und zeigt Rezensionen sowie Anzeigen (Werbung/Beratung).`},{t:`Einzel- vs. Großhandel`,def:`Großhandel und Einzelhandel unterscheiden sich primär nach der Marktstufe, auf der sie agieren, sowie nach ihren typischen Kunden. Der Großhandel (Wholesale) kauft üblicherweise in großen Mengen unmittelbar bei Herstellern oder Importeuren ein und verkauft diese in geringeren, aber weiterhin gewerblichen Mengen an Wiederverkäufer, Weiterverarbeiter oder Großabnehmer weiter (klassisches B2B-Geschäft) – typisch sind Mengenrabatte, längere Zahlungsziele und häufig ein Mindestbestellwert. Der Einzelhandel (Retail) verkauft dagegen einzelne Artikel direkt an private Endverbraucher (B2C) und übernimmt dabei zusätzliche, kundennahe Serviceleistungen wie Beratung, Umtausch- und Rückgaberecht, kleinteilige Verpackung sowie ein ansprechendes Einkaufserlebnis. Handelsspannen unterscheiden sich entsprechend: Großhändler kalkulieren meist mit geringeren prozentualen Aufschlägen bei hohem Volumen, Einzelhändler mit höheren Margen bei geringerem Stückvolumen. Im E-Commerce verschwimmen diese Grenzen zunehmend, da digitale Plattformen beide Geschäftsmodelle parallel unter einem Dach abbilden können – etwa wenn ein Konzern sowohl einen B2B-Marktplatz mit Staffelpreisen als auch einen klassischen Endkunden-Shop betreibt und beide über dieselbe Logistikinfrastruktur abwickelt.`,ex:`Ein Sportartikelhersteller verkauft Laufschuhe paketweise (je 50 Paar) mit 20% Mengenrabatt und 60 Tagen Zahlungsziel an einen Sporthändler (Großhandel/B2B). Derselbe Hersteller betreibt zugleich einen eigenen Online-Shop, über den Privatkunden einzelne Paare zum vollen Preis sofort per Kreditkarte kaufen (Einzelhandel/B2C).`},{t:`Betriebstypen (Fachhandel, Discounter, Marktplatz)`,def:`Betriebstypen des Handels sind idealtypische Kombinationen aus Sortimentsbreite und -tiefe, Preis-/Leistungsniveau, Servicegrad, Standortkonzept und Vertriebsweg, an denen sich Handelsunternehmen strategisch positionieren. Der Fachhandel konzentriert sich auf ein enges, aber tiefes Sortiment mit hoher fachlicher Beratungskompetenz im mittleren bis Premium-Preissegment. Verbrauchermärkte und SB-Warenhäuser kombinieren große Sortimentsbreite und -tiefe mit Selbstbedienung und mittlerem Preisniveau, um möglichst viele Bedarfe eines Haushalts in einem Einkauf abzudecken. Discounter reduzieren Sortimentsbreite und -tiefe bewusst auf ein rotierendes Kernsortiment, um über schlanke Prozesse, hohe Umschlagsgeschwindigkeit und geringe Handling-Kosten einen dauerhaften Preisvorteil zu erzielen. Der reine Online-/Versandhandel verzichtet vollständig auf physische Verkaufsflächen und kann dadurch – dank zentraler Lagerhaltung statt Regalflächenbeschränkung – ein nahezu unbegrenztes Sortiment anbieten (Long-Tail-Effekt: auch Nischenprodukte mit geringer Einzelnachfrage werden profitabel, weil sie über viele Regionen hinweg verkauft werden). Marktplätze sind streng genommen gar kein Händler, sondern eine reine Vermittlungs- und Infrastrukturplattform, auf der unabhängige Drittanbieter ihre Produkte listen und dafür Provisionen sowie Gebühren an den Plattformbetreiber zahlen.`,ex:`MediaMarkt (Fachhandel: tiefes Elektroniksortiment, geschulte Berater), Kaufland (Verbrauchermarkt: breit und tief, Selbstbedienung), Aldi (Discounter: rotierendes Schmalsortiment), Zalando (Online-Versandhandel: über 6.000 Marken ohne eigene Läden) und Amazon Marketplace (reine Vermittlungsplattform mit Millionen Drittanbietern) zeigen die Grundtypen nebeneinander.`},{t:`Sortimentsbreite & -tiefe`,def:`Die Sortimentspolitik ist eine der zentralen strategischen Stellschrauben im Handel und wird über zwei unabhängige Dimensionen gesteuert. Die Sortimentsbreite gibt an, wie viele unterschiedliche Warengruppen bzw. Produktkategorien ein Händler führt – ein breites Sortiment erlaubt es, möglichst viele unterschiedliche Kundenbedürfnisse unter einem Dach zu bedienen und dadurch Kundenbindung sowie durchschnittlichen Bestellwert (Cross-Selling) zu erhöhen. Die Sortimentstiefe gibt an, wie viele Varianten – Marken, Modelle, Farben, Größen, Ausstattungsstufen – innerhalb einer einzelnen Warengruppe angeboten werden; eine hohe Tiefe erhöht die Auswahl und die Wahrscheinlichkeit, dass ein Kunde exakt sein gewünschtes Produkt findet. Aus der Kombination beider Dimensionen ergeben sich vier idealtypische Sortimentsstrategien: schmal und flach (typisch für Discounter), schmal und tief (typisch für Fachgeschäfte), breit und flach (kleinere Gemischtwarenläden) sowie breit und tief (große Kaufhäuser oder Online-Marktplätze). Eine größere Sortimentstiefe erhöht zwar die Kundenzufriedenheit durch Auswahl, gleichzeitig aber auch Lagerkomplexität, Kapitalbindung im Bestand und das Risiko von Ladenhütern.`,ex:`Zalando führt Mode, Schuhe, Accessoires, Sport und Beauty (hohe Breite) und bietet allein bei Sneakern hunderte Modelle in zig Farb-/Größenkombinationen (hohe Tiefe) – eine bewusste breit-und-tief-Strategie, um möglichst viele Kaufanlässe eines Kunden auf einer Plattform abzudecken.`},{t:`Omnichannel vs. Multichannel`,def:`Multichannel-Handel bedeutet, dass ein Unternehmen mehrere Vertriebs- und Kommunikationskanäle – Filiale, Online-Shop, Katalog, App, Marktplatz – parallel betreibt, diese aber organisatorisch, technisch und häufig auch von den Verantwortlichkeiten her getrennt funktionieren. Das führt in der Praxis oft zu inkonsistenten Erfahrungen: unterschiedliche Preise oder Verfügbarkeiten je Kanal, getrennte Kundenkonten, keine kanalübergreifende Rückgabemöglichkeit. Omnichannel-Handel geht einen entscheidenden Schritt weiter: Alle Kanäle werden technisch und organisatorisch nahtlos vernetzt, sodass der Kunde ein einheitliches, konsistentes Markenerlebnis erlebt, unabhängig davon, über welchen Kanal er gerade interagiert. Typische Omnichannel-Services sind Click & Collect (online bestellen, in der Filiale abholen), Click & Reserve (online reservieren, vor Ort anprobieren und kaufen), In-Store-Return für online gekaufte Ware sowie ein einheitliches Kundenkonto mit Bonuspunkten und Bestellhistorie über alle Kanäle. Voraussetzung ist eine vollständig integrierte IT-Landschaft: ein zentrales Warenwirtschaftssystem, das Lagerbestände in Echtzeit über alle Kanäle synchronisiert, sowie eine einheitliche Kundendatenbank (Single Customer View), die verhindert, dass derselbe Kunde online und offline als zwei unterschiedliche Personen behandelt wird.`,ex:`H&M lässt Kunden online einen Artikel reservieren, in der nächsten Filiale anprobieren und dort sofort kaufen oder zurückgeben (Click & Collect/Return) – Bestand und Kundendaten sind kanalübergreifend in Echtzeit synchronisiert. Ein reiner Multichannel-Händler hätte getrennte Lagerbestände, sodass ein online reservierter Artikel in der Filiale u.U. fehlen würde.`}],quiz:[{q:`Welche Handelsfunktion beschreibt das Überbrücken von Raum und Zeit?`,options:[`Kreditfunktion`,`Überbrückungsfunktion`,`Werbefunktion`,`Qualitätsfunktion`],correct:1,explain:`Die Überbrückungsfunktion bringt Ware vom Hersteller zum Kunden über Raum und Zeit.`},{q:`Was kennzeichnet einen Discounter?`,options:[`Tiefes Sortiment, hohe Beratung`,`Schmales, flaches Sortiment, Preisführerschaft`,`Nur online aktiv`,`Ausschließlich Luxusgüter`],correct:1,explain:`Discounter wie Aldi/Lidl setzen auf schmales Sortiment und niedrige Preise.`},{q:`Was ist Omnichannel?`,options:[`Nur ein Verkaufskanal`,`Getrennte, parallele Kanäle`,`Nahtlos vernetzte Kanäle mit einheitlichem Erlebnis`,`Nur stationärer Handel`],correct:2,explain:`Omnichannel verknüpft alle Kanäle nahtlos (z.B. online bestellen, im Laden abholen).`}],cards:[{front:`Handelsfunktion`,back:`Aufgabe des Handels in der Wertschöpfungskette (Überbrückung, Menge, Qualität, Kredit, Werbung).`},{front:`Sortimentsbreite`,back:`Anzahl unterschiedlicher Warengruppen im Angebot eines Händlers.`},{front:`Sortimentstiefe`,back:`Anzahl verschiedener Varianten innerhalb einer Warengruppe.`},{front:`Disintermediation`,back:`Ausschaltung von Handelsstufen durch Direktverkauf (z.B. D2C).`},{front:`Category Management`,back:`Strategische Steuerung von Produktkategorien zur Sortiments- und Umsatzoptimierung.`}]},{id:`s1-ecm`,code:`B EC`,name:`Grundlagen des E-Commerce`,ects:6,sws:`6`,exam:`Klausur 120 Min. · 50% + Seminararbeit (Gruppe, 25 S.) mit mündl. Prüfung · 50%`,desc:`Grundlagen des E-Commerce/Online-Handels: Geschäftsmodelle, Plattformökonomie, Konsumentenverhalten.`,topics:[{t:`E-Commerce-Historie & ökonomische Bedeutung`,def:`Die Entwicklung des E-Commerce lässt sich in mehreren historischen Wellen nachzeichnen. In der Pionierphase Mitte der 1990er-Jahre entstanden die ersten kommerziellen Websites; 1995 gründete Jeff Bezos Amazon zunächst als reinen Online-Buchhandel, 1999 startete eBay seinen deutschen Marktplatz für Privatverkäufe. In den 2000er-Jahren schufen der Ausbau von Breitbandinternet, sinkende Technologiekosten und wachsendes Vertrauen in Online-Zahlungsverfahren (u.a. durch PayPal) die Grundlage für ein breiteres Publikum. In den 2010er-Jahren beschleunigte der mobile Durchbruch (Smartphones, Apps, mobile Zahlungen) den Wandel zusätzlich, während gleichzeitig Amazon und Zalando zu globalen Größen aufstiegen. Die Corona-Pandemie 2020/2021 wirkte als historischer Beschleuniger: Weil stationäre Geschäfte zeitweise schließen mussten, verlagerte sich Kaufverhalten strukturell und dauerhaft Richtung Online. Ökonomisch ist der deutsche E-Commerce-Markt heute laut Branchenverband bevh ein Umsatzvolumen von rund 80 Mrd. € jährlich und beeinflusst damit nicht nur die Wettbewerbsfähigkeit einzelner Händler, sondern auch gesamtwirtschaftliche Größen wie Beschäftigung im Einzelhandel, die Struktur von Innenstädten (Leerstand durch Kaufkraftabwanderung) und internationale Warenströme durch grenzüberschreitenden Online-Handel.`,ex:`Der deutsche Online-Modehandel wuchs 2020 pandemiebedingt zweistellig, während stationäre Modegeschäfte teils über 30% Umsatzverlust verzeichneten – ein Beispiel dafür, wie externe Schocks Handelsstrukturen dauerhaft Richtung Online verschieben können.`},{t:`B2B/B2C/C2C/D2C-Geschäftsmodelle`,def:`Die vier zentralen E-Commerce-Geschäftsmodelle unterscheiden sich danach, welche Marktseiten an der Transaktion beteiligt sind und wer die Kontrolle über Kundenbeziehung und Markenerlebnis behält. B2C (Business-to-Consumer) bezeichnet den Verkauf eines Unternehmens an private Endverbraucher und ist das klassische Modell des Online-Handels (z.B. Zalando). B2B (Business-to-Business) bezeichnet den Verkauf zwischen Unternehmen, häufig mit abweichenden Preisstrukturen (Staffelpreise, individuelle Konditionen), größeren Bestellmengen und komplexeren Beschaffungsprozessen mit mehreren Entscheidern (z.B. Amazon Business). C2C (Consumer-to-Consumer) vermittelt den Verkauf zwischen Privatpersonen über eine zentrale Plattform, die selbst nicht Eigentümerin der Ware ist, sondern über Vermittlungsgebühren oder Abonnements Einnahmen erzielt (z.B. eBay Kleinanzeigen, Vinted). D2C (Direct-to-Consumer) beschreibt ein Modell, bei dem ein Hersteller bewusst auf den mehrstufigen Handel verzichtet und direkt an Endkunden verkauft – meist über einen eigenen Online-Shop. Der strategische Vorteil von D2C liegt in der vollständigen Kontrolle über Markenpräsentation, Preisgestaltung und vor allem über wertvolle Erstanbieter-Kundendaten (First-Party-Data); der Nachteil ist der Verzicht auf die etablierte Reichweite, Logistik und Kundenbasis traditioneller Handelspartner.`,ex:`Nike verkauft weiterhin über Zalando (B2C via Drittanbieter), baut aber gezielt nike.com als D2C-Kanal aus, um Kundendaten direkt zu erfassen und limitierte Editionen exklusiv selbst zu vermarkten – ein Trend vieler Markenhersteller weg vom reinen Handelspartner-Modell.`},{t:`Plattformökonomie & Netzwerkeffekte`,def:`Plattformunternehmen unterscheiden sich fundamental von klassischen linearen Handelsunternehmen dadurch, dass sie in der Regel selbst kein oder kaum eigenes Warenvermögen besitzen, sondern als vermittelnde Infrastruktur zwischen zwei oder mehr Marktseiten fungieren – etwa zwischen Käufern und Verkäufern – und für diese Vermittlungsleistung Gebühren, Provisionen oder Werbeeinnahmen erzielen. Der zentrale ökonomische Werttreiber von Plattformen sind Netzwerkeffekte. Man unterscheidet direkte (same-side) Netzwerkeffekte, bei denen der Nutzen für eine Nutzergruppe unmittelbar mit der Anzahl der Mitglieder derselben Gruppe steigt, von indirekten (cross-side) Netzwerkeffekten, bei denen der Nutzen einer Marktseite mit der Anzahl der Teilnehmer auf der jeweils anderen Marktseite steigt (mehr Käufer machen die Plattform für Verkäufer attraktiver, und umgekehrt ziehen mehr Verkäufer wiederum mehr Käufer an). Diese sich selbst verstärkenden Effekte führen in vielen digitalen Märkten zu einer Tendenz hin zu 'Winner-take-most'- oder sogar 'Winner-take-all'-Marktstrukturen, in denen wenige dominante Plattformen den überwiegenden Teil des Marktes kontrollieren. Zusätzlich verschaffen die im Betrieb gesammelten Nutzer- und Transaktionsdaten der etablierten Plattform einen kumulativen Datenvorteil, der Empfehlungsalgorithmen, Preisfindung und Produktentwicklung verbessert und Neueinsteigern den Markteintritt zusätzlich erschwert.`,ex:`Amazon Marketplace: Je mehr Drittanbieter listen, desto attraktiver wird die Plattform für Käufer; je mehr Käufer aktiv sind, desto attraktiver wird sie für neue Verkäufer – dieser sich selbst verstärkende Netzwerkeffekt hat Amazon zur dominanten Plattform mit über 2 Mio. aktiven Drittanbietern gemacht.`},{t:`Kaufentscheidungsprozess & ROPO-Effekt`,def:`Der Kaufentscheidungsprozess wird in der Konsumentenverhaltensforschung klassisch in fünf aufeinanderfolgende Phasen unterteilt. In der Problemerkennung wird dem Konsumenten ein Bedürfnis bewusst (ausgelöst durch interne Reize wie Bedarf oder externe Reize wie Werbung). In der Informationssuche recherchiert der Kunde mögliche Lösungen – heute überwiegend online über Suchmaschinen, Vergleichsportale, Social Media und Influencer-Empfehlungen. In der Bewertung der Alternativen vergleicht er Angebote anhand von Preis, Qualität, Bewertungen und Markenvertrauen. In der Kaufentscheidung erfolgt der eigentliche Kaufabschluss auf einem gewählten Kanal. Im Nachkaufverhalten entscheidet sich, ob der Kunde zufrieden ist, das Produkt behält oder retourniert, eine Bewertung hinterlässt und eine Wiederkaufabsicht entsteht. Dabei spielt der ROPO-Effekt (Research Online, Purchase Offline) eine zentrale Rolle: Viele Kunden recherchieren online, kaufen aber bewusst stationär – etwa weil sie das Produkt vorab anfassen, anprobieren oder sofort mitnehmen möchten. Das spiegelbildliche Gegenstück TOPO (Try Offline, Purchase Online) beschreibt den umgekehrten Weg: im Laden anprobieren, aber anschließend günstiger online kaufen. Beide Effekte belegen, dass sich Online- und Offline-Handel in der Realität kaum trennscharf abgrenzen lassen.`,ex:`Ein Kunde vergleicht Kopfhörer anhand von YouTube-Reviews und Amazon-Bewertungen (Informationssuche), geht dann aber in den Elektronikmarkt, um sie live zu testen und sofort mitzunehmen (ROPO). Ein anderer Kunde probiert Kleidungsgrößen im Laden an, bestellt das passende Teil aber abends günstiger online (TOPO).`},{t:`Payment & Fulfillment`,def:`Payment und Fulfillment bilden gemeinsam das operative Rückgrat jeder E-Commerce-Transaktion nach Abschluss des Kaufakts. Im Bereich Payment stehen Händlern verschiedene Zahlungsmethoden mit unterschiedlichem Risiko-, Kosten- und Komfortprofil zur Verfügung: Der Kauf auf Rechnung ist bei Kunden sehr beliebt, weil er das Ausfallrisiko beim Kunden lässt, bevor er die Ware sieht, birgt für den Händler jedoch ein erhebliches Forderungsausfallrisiko. PayPal und Kreditkarte bieten hohen Komfort und schnelle Abwicklung, kosten aber prozentuale Transaktionsgebühren. Buy-now-pay-later-Anbieter wie Klarna übernehmen das komplette Ausfallrisiko gegen eine Gebühr und zahlen dem Händler sofort aus, was die Konversionsrate erhöhen kann. SEPA-Lastschrift ist günstig, birgt aber ein Rückbuchungsrisiko innerhalb der gesetzlichen Widerspruchsfrist. Im Bereich Fulfillment umfasst der Prozess den kompletten physischen Weg einer Bestellung: Wareneingang und Einlagerung, Kommissionierung (Zusammenstellen der Bestellung), Verpackung, Übergabe an den Versanddienstleister sowie Retourenabwicklung inkl. Qualitätsprüfung. Händler wählen zwischen Inhouse-Fulfillment (volle Kontrolle, hohe Fixkosten), Auslagerung an spezialisierte 3PL-Logistikdienstleister (Skalierbarkeit ohne eigene Infrastruktur) oder Dropshipping (der Hersteller versendet direkt, kein eigenes Lagerrisiko, aber weniger Kontrolle über Lieferzeit und Markenerlebnis).`,ex:`Ein Modehändler bietet Kauf auf Rechnung (erhöht die Konversion, aber mit Ausfallrisiko) und Klarna-Ratenkauf an; im Hintergrund lagert er Bestseller im eigenen Lager, lässt saisonale Nischenartikel aber per Dropshipping direkt vom Hersteller verschicken, um Kapital nicht in selten verkaufte Ware zu binden.`}],quiz:[{q:`Was bedeutet D2C?`,options:[`Data to Cloud`,`Direct to Consumer`,`Distribution to Company`,`Digital to Customer`],correct:1,explain:`D2C: Hersteller verkauft direkt an Endkunden, ohne Zwischenhändler.`},{q:`Was beschreibt der ROPO-Effekt?`,options:[`Online recherchieren, offline kaufen`,`Immer nur online kaufen`,`Retouren ohne Produktoption`,`Reine Offline-Werbung`],correct:0,explain:`ROPO = Research Online, Purchase Offline.`},{q:`Was sind Netzwerkeffekte?`,options:[`Serverausfälle bei hoher Last`,`Plattform wird wertvoller, je mehr Nutzer sie hat`,`Preissenkung bei mehr Konkurrenz`,`Netzwerkkabel-Standards`],correct:1,explain:`Je mehr Nutzer eine Plattform hat, desto attraktiver wird sie für neue Nutzer.`}],cards:[{front:`B2C`,back:`Business-to-Consumer – Unternehmen verkauft direkt an Endverbraucher.`},{front:`Plattformökonomie`,back:`Geschäftsmodell, das Angebot und Nachfrage verschiedener Akteure auf einer Plattform zusammenbringt.`},{front:`ROPO-Effekt`,back:`Research Online, Purchase Offline – online informieren, im Laden kaufen.`},{front:`Fulfillment`,back:`Gesamtprozess von Lagerung über Kommissionierung bis Versand und Retouren.`},{front:`GAFA`,back:`Sammelbegriff für Google, Apple, Facebook (Meta), Amazon.`}]},{id:`s1-gip`,code:`GIP EC`,name:`Grundlagen der Informatik und Programmierung`,ects:6,sws:`5`,exam:`Klausur 120 Min. · 100% + Praktikum (Pflicht, unbenotet)`,desc:`Einführung in Informatik-Grundlagen und Programmierung mit Java.`,topics:[{t:`Zahlensysteme (Binär, Hex)`,def:`Digitale Rechner verarbeiten sämtliche Informationen – Zahlen, Text, Bilder, Programme – ausschließlich in binärer Form, also im Zahlensystem zur Basis 2 mit den einzigen Ziffern 0 und 1 (Bits), weil sich zwei eindeutig unterscheidbare physikalische Zustände (z.B. Spannung an/aus) technisch am zuverlässigsten realisieren lassen. Da lange Binärfolgen für Menschen schwer lesbar sind, wird in der Praxis häufig das Hexadezimalsystem zur Basis 16 verwendet (Ziffern 0–9 gefolgt von A–F für die Werte 10–15), weil sich exakt vier Binärstellen (ein Nibble) verlustfrei in genau eine Hexadezimalziffer übersetzen lassen – dadurch wird die Darstellung kompakter, etwa bei Farbcodes in HTML/CSS (#FF5733) oder Speicheradressen. Die Umrechnung von Dezimal- in Binärzahlen erfolgt durch fortgesetzte Division der Dezimalzahl durch 2, wobei die entstehenden Reste von unten (zuletzt berechnet) nach oben (zuerst berechnet) gelesen die Binärzahl ergeben. Die Umrechnung von Binär- in Hexadezimalzahlen erfolgt durch Gruppierung der Binärziffern von rechts in 4er-Blöcke, die anschließend einzeln in ihre Hexadezimal-Entsprechung übersetzt werden. Auch die Umrechnung in die Gegenrichtung folgt demselben Prinzip: Jede Hex-Ziffer wird durch ihre 4-Bit-Binärentsprechung ersetzt.`,ex:`Die Dezimalzahl 214 wird binär zu 11010110 (128+64+16+4+2=214) und lässt sich in zwei 4er-Blöcke (1101 | 0110) aufteilen, was hexadezimal D6 ergibt – genau dieser Umrechnungstyp taucht regelmäßig als Klausuraufgabe auf.`},{t:`Boolesche Algebra & Aussagenlogik`,def:`Die boolesche Algebra, benannt nach dem Mathematiker George Boole, ist die formale Grundlage der digitalen Logik und arbeitet ausschließlich mit den zwei Wahrheitswerten wahr (1) und falsch (0). Die vier grundlegenden Verknüpfungsoperatoren sind: AND (Konjunktion, in Java &&), das nur dann wahr liefert, wenn beide verknüpften Aussagen gleichzeitig wahr sind; OR (Disjunktion, in Java ||), das bereits dann wahr liefert, wenn mindestens eine der beiden Aussagen wahr ist; NOT (Negation, in Java !), das den Wahrheitswert seiner Eingabe umkehrt; und XOR (exklusives Oder), das nur dann wahr liefert, wenn genau eine der beiden Eingaben wahr ist, nicht aber beide gleichzeitig. Die nach Augustus De Morgan benannten De-Morgan-Regeln erlauben das systematische Umformen negierter Verknüpfungsausdrücke und sind in der Programmierung äußerst nützlich, um komplexe Bedingungen zu vereinfachen: NOT(A AND B) ist logisch identisch zu (NOT A) OR (NOT B), und NOT(A OR B) ist logisch identisch zu (NOT A) AND (NOT B). Diese Regeln bilden die theoretische Basis von Bedingungsausdrücken in nahezu jeder Programmiersprache sowie die physikalische Grundlage digitaler Schaltkreise und Logikgatter in der Hardware-Entwicklung.`,ex:`Eine Bestelllogik soll auslösen, wenn NICHT (Lager leer UND Nachfrage niedrig) gilt – nach De-Morgan äquivalent zu (Lager nicht leer) ODER (Nachfrage nicht niedrig). In Java: if (!(lagerLeer && nachfrageNiedrig)) entspricht exakt if (!lagerLeer || !nachfrageNiedrig).`},{t:`Java: Variablen & Datentypen`,def:`Eine Variable ist in Java ein benannter, typgebundener Speicherplatz im Arbeitsspeicher, dessen Inhalt sich während der Programmlaufzeit ändern kann. Java ist streng typisiert, das heißt jede Variable muss vor ihrer ersten Verwendung mit einem festen Datentyp deklariert werden. Man unterscheidet primitive Datentypen, die direkt Werte speichern (int für 32-Bit-Ganzzahlen, long für sehr große Ganzzahlen, double für Fließkommazahlen doppelter Genauigkeit, float für einfache Genauigkeit, boolean für wahr/falsch, char für ein einzelnes Unicode-Zeichen, byte und short für kleinere Ganzzahlbereiche), von Referenztypen, die stattdessen eine Speicheradresse auf ein Objekt im Heap enthalten – der wichtigste Referenztyp im Alltag ist String für Zeichenketten, der deshalb großgeschrieben wird, weil er technisch eine eigene Klasse ist. Jede Variable sollte möglichst direkt bei der Deklaration mit einem sinnvollen Startwert initialisiert werden, um Fehler durch undefinierte Werte zu vermeiden. Bei der Typkonvertierung (Casting) unterscheidet man die implizite (automatische) Konvertierung, die immer dann stattfindet, wenn kein Informationsverlust droht (z.B. int zu double), von der expliziten (manuellen) Konvertierung mittels vorangestelltem Klammer-Cast wie (int), die nötig ist, wenn vom größeren zum kleineren Typ konvertiert wird und dabei möglicherweise Nachkommastellen oder Wertebereich verloren gehen.`,ex:`int lagerbestand = 120; double einzelpreis = 29.99; boolean istVerfuegbar = lagerbestand > 0; String produktname = "Wanderrucksack"; double gesamtwert = lagerbestand * einzelpreis; – implizite Konvertierung von int zu double bei der Multiplikation.`},{t:`Kontrollstrukturen (if/else, Schleifen)`,def:`Kontrollstrukturen sind die syntaktischen Bausteine, mit denen ein Programm vom rein sequenziellen Ablauf abweichen und stattdessen Entscheidungen treffen oder Codeabschnitte wiederholen kann. Bedingte Anweisungen steuern Verzweigungen: Eine if-Anweisung führt einen Block nur aus, wenn eine Bedingung wahr ist; eine optionale else-if-Kette prüft weitere Bedingungen der Reihe nach; ein abschließendes else fängt alle übrigen Fälle ab; eine switch-Anweisung bietet bei vielen festen, diskreten Fallunterscheidungen eine übersichtlichere Alternative zu langen if-else-Ketten. Schleifen wiederholen einen Codeblock: Die for-Schleife wird verwendet, wenn die Anzahl der Wiederholungen von vornherein bekannt ist (mit Zählvariable, Bedingung und Inkrement in einer Zeile); die while-Schleife prüft ihre Bedingung vor jedem Durchlauf und eignet sich, wenn die Anzahl vorab unbekannt ist; die do-while-Schleife führt den Block mindestens ein einziges Mal aus, bevor sie ihre Abbruchbedingung überhaupt zum ersten Mal prüft. Innerhalb von Schleifen ermöglichen zwei Sprunganweisungen zusätzliche Kontrolle: break bricht die gesamte Schleife sofort und vollständig ab, während continue lediglich den Rest des aktuellen Durchlaufs überspringt und sofort mit der nächsten Iteration fortfährt.`,ex:`for (int i = 1; i <= 10; i++) { if (lagerbestand[i] == 0) continue; System.out.println(produkt[i] + " ist verfügbar"); } durchläuft zehn Produkte, überspringt aber ausverkaufte Artikel und listet nur verfügbare auf.`},{t:`Methoden & objektorientierte Grundlagen`,def:`Eine Methode ist ein benannter, wiederverwendbarer Codeabschnitt, der eine klar abgegrenzte Aufgabe erledigt: Sie kann optionale Parameter entgegennehmen und liefert entweder über return einen Wert eines festgelegten Rückgabetyps zurück oder verwendet void, wenn kein Wert zurückgegeben wird. Die objektorientierte Programmierung (OOP) organisiert Software nicht als lose Ansammlung von Funktionen, sondern in Klassen und Objekten: Eine Klasse ist ein Bauplan, der festlegt, welche Attribute (Eigenschaften) und Methoden (Verhalten) ihre Instanzen besitzen; ein Objekt ist eine konkrete, im Speicher existierende Instanz dieser Klasse mit eigenen, individuellen Attributwerten. Ein Konstruktor ist eine spezielle, nach der Klasse benannte Methode ohne Rückgabetyp, die automatisch beim Erzeugen eines neuen Objekts mit new aufgerufen wird und typischerweise die Attribute mit übergebenen Startwerten initialisiert. Vererbung (mit extends realisiert) erlaubt es, eine Unterklasse zu definieren, die automatisch sämtliche Attribute und Methoden einer Oberklasse übernimmt und zusätzlich um eigene ergänzen oder bestehende Methoden überschreiben (Overriding) kann – das fördert Wiederverwendbarkeit, vermeidet Codeduplikate und bildet reale Hierarchien direkt im Code ab.`,ex:`class Produkt { String name; double preis; Produkt(String n, double p){name=n; preis=p;} double getBrutto(double mwst){return preis*(1+mwst);} } – ein Objekt Produkt sneaker = new Produkt("Air Max", 129.99); ruft dann sneaker.getBrutto(0.19) auf, um den Bruttopreis inkl. 19% Mehrwertsteuer zu berechnen (154.69 €).`}],quiz:[{q:`Wie viele Werte kann 1 Bit annehmen?`,options:[`1`,`2`,`4`,`8`],correct:1,explain:`Ein Bit ist binär: 0 oder 1 – also 2 mögliche Werte.`},{q:`Was liefert NOT(A AND B) nach De-Morgan?`,options:[`NOT A AND NOT B`,`NOT A OR NOT B`,`A OR B`,`A AND B`],correct:1,explain:`De-Morgan: NOT(A AND B) = NOT A OR NOT B.`},{q:`Welcher Java-Datentyp speichert Text?`,options:[`int`,`boolean`,`String`,`double`],correct:2,explain:`String ist der Java-Referenztyp für Zeichenketten/Text.`}],cards:[{front:`Binärsystem`,back:`Zahlensystem mit Basis 2 (nur 0 und 1) – die Sprache des Computers.`},{front:`Boolescher Operator AND`,back:`Ergebnis nur wahr, wenn beide Eingaben wahr sind. In Java: &&`},{front:`for-Schleife`,back:`Java-Schleife für bekannte Wiederholungsanzahl: for(int i=0;i<10;i++)`},{front:`Klasse (Java)`,back:`Bauplan für Objekte – definiert Attribute und Methoden.`},{front:`Konstruktor`,back:`Spezielle Methode, die beim Erstellen eines Objekts automatisch aufgerufen wird.`}]},{id:`s1-eng`,code:`ENGECom`,name:`English`,ects:6,sws:`4`,exam:`Mehrteilig: Draft 25% + Presentation 40% + schriftl. Prüfung 35%`,desc:`Business-Englisch für den E-Commerce-Kontext, mit Anwesenheitspflicht.`,topics:[{t:`Business Vocabulary E-Commerce`,def:`Professionelles Business-Englisch im E-Commerce-Kontext erfordert einen präzisen, fachspezifischen Wortschatz, der weit über Alltagsenglisch hinausgeht und sich grob in mehrere Kategorien gliedern lässt. Finanzielle Kennzahlen umfassen Begriffe wie revenue (Umsatz), profit margin (Gewinnspanne), conversion rate (Konversionsrate), churn rate (Abwanderungsrate) und customer lifetime value (erwarteter Gesamtwert eines Kunden über die gesamte Beziehung). Prozessbegriffe umfassen supply chain (Lieferkette), fulfillment (Auftragsabwicklung), inventory management (Bestandsmanagement) und customer journey (die gesamte Kundenreise von der ersten Wahrnehmung bis zum Nachkauf). Stakeholder-Begriffe unterscheiden shareholder (formale Anteilseigner mit Kapitalbeteiligung) von stakeholder im weiteren Sinne (jede Interessengruppe mit legitimem Interesse am Unternehmen, also auch Mitarbeiter, Kunden, Lieferanten und die Gesellschaft). Zusätzlich sollten Studierende auf systematische Unterschiede zwischen britischem und amerikanischem Geschäftsenglisch achten (colour/color, organisation/organization, unterschiedliche Anredekonventionen) sowie den jeweils angemessenen Formalitätsgrad wählen – ein interner Chat mit Kollegen erfordert einen anderen Ton als ein formeller Investorenbericht oder eine Kundenkommunikation.`,ex:`In einem Quartalsbericht könnte stehen: 'Our conversion rate increased by 12% after the checkout redesign, while churn rate among returning customers dropped significantly, positively impacting overall revenue.' – ein Satz mit vier zentralen Fachbegriffen im Kontext.`},{t:`Präsentationstechniken auf Englisch`,def:`Eine überzeugende englischsprachige Geschäftspräsentation folgt typischerweise einer klaren dreiteiligen Struktur. Der Hook (Einstieg) soll innerhalb der ersten Sekunden Aufmerksamkeit erzeugen, etwa durch eine überraschende Statistik, eine provokante rhetorische Frage oder eine kurze, relevante Anekdote. Der Body (Hauptteil) sollte auf maximal drei bis vier klar abgegrenzte Kernbotschaften begrenzt bleiben, die jeweils durch Daten, Diagramme oder konkrete Beispiele untermauert werden, statt das Publikum mit zu vielen Details zu überfrachten. Der Call-to-Action (Abschluss) formuliert am Ende eine konkrete, umsetzbare Handlungsaufforderung. Auf rhetorischer Ebene helfen Signalwörter zur Gliederung ('firstly... secondly... in conclusion...'), aktive statt passive Sprachkonstruktionen sowie bewusste Pausen zur Betonung wichtiger Punkte. Beim Umgang mit Rückfragen im Anschluss an eine Präsentation ist es eine bewährte Technik, die gestellte Frage zunächst in eigenen Worten zu paraphrasieren ('That's a great question about...'), bevor man antwortet – das verschafft zusätzliche Bedenkzeit und stellt sicher, dass die Frage korrekt verstanden wurde.`,ex:`Eine Produktpräsentation beginnt mit: 'Did you know that 70% of online shopping carts are abandoned before checkout?' (Hook), führt durch drei Lösungsansätze (Body) und endet mit: 'That's why we recommend implementing a one-click checkout by Q3.' (Call-to-Action).`},{t:`Schriftliche Ausarbeitung (Draft)`,def:`Ein Draft bezeichnet im akademischen wie im geschäftlichen Kontext eine bewusst vorläufige, häufig noch unvollständige oder unpolierte Fassung eines Textes, die nicht als Endprodukt gedacht ist, sondern als Zwischenschritt, um frühzeitig strukturelles und inhaltliches Feedback von Dozierenden, Kolleg:innen oder Vorgesetzten einzuholen, bevor unverhältnismäßig viel Zeit in sprachlichen Feinschliff investiert wird, der später ohnehin überarbeitet werden müsste. Üblich ist ein mehrstufiger, iterativer Schreibprozess: Ein first draft enthält meist nur eine grobe Gliederung und die wichtigsten Kernargumente in vorläufiger Formulierung; ein revised draft integriert erhaltenes Feedback und verbessert Struktur sowie Argumentationslogik; der final draft ist schließlich die sprachlich und formal ausgefeilte Abgabeversion. In diesem Prozess bezieht sich Feedback in den frühen Phasen typischerweise auf inhaltliche und strukturelle Aspekte (Ist die Argumentation logisch? Fehlen wichtige Belege?), während sprachliche und grammatikalische Korrekturen bewusst erst in späteren Runden im Fokus stehen, um zu vermeiden, dass Zeit in Formulierungen investiert wird, die inhaltlich ohnehin noch verworfen werden könnten.`,ex:`Vor der Abgabe eines Business Case zur Einführung eines neuen Bezahlverfahrens reicht ein Student einen ersten Draft mit Rohgliederung ein; basierend auf dem Feedback ('add more quantitative evidence in section 2') entsteht der überarbeitete, deutlich stärkere finale Draft.`},{t:`Verhandlungs- & Meeting-Englisch`,def:`Souveränes Verhandeln und Moderieren von Meetings auf Englisch erfordert einen Werkzeugkasten an situativ passenden Redewendungen für unterschiedliche Gesprächsphasen. Zustimmung lässt sich abgestuft signalisieren, von einfacher Bestätigung ('That makes sense') bis zu starker Übereinstimmung ('I completely agree with that point'). Höflicher, konstruktiver Widerspruch, der die Geschäftsbeziehung nicht belastet, gelingt über abmildernde Formulierungen wie 'I see your point, but...' oder 'I'm not entirely sure that would work, because...', statt direkt zu widersprechen. Kompromissvorschläge werden typischerweise über vorsichtig formulierte Fragen eingeleitet, etwa 'Could we consider a middle ground here?' oder 'What if we met halfway on the pricing?'. Die professionelle Moderation eines Meetings umfasst das Eröffnen mit einer klaren Agenda ('Today we'll cover three points...'), das aktive Steuern und ausgewogene Verteilen von Redebeiträgen sowie das Zusammenfassen am Ende zur Sicherstellung eines gemeinsamen Verständnisses ('To summarize what we've discussed today...'). Wichtig ist zudem ein Bewusstsein für interkulturelle Unterschiede: Verhandlungspartner aus unterschiedlichen Kulturkreisen unterscheiden sich teils erheblich in ihrer bevorzugten Direktheit, ihrem Verhandlungstempo und ihrer Erwartungshaltung an Small Talk vor dem eigentlichen Geschäftlichen.`,ex:`In einer Preisverhandlung mit einem britischen Lieferanten reagiert der Einkäufer diplomatisch: 'I understand your position, but our budget is quite tight this quarter. Could we possibly agree on a 5% discount for orders above 10,000 units?' – ein höflicher Kompromissvorschlag statt Konfrontation.`}],quiz:[{q:`Was bedeutet 'stakeholder' im Business-Englisch?`,options:[`Nur Aktionäre`,`Alle Interessengruppen eines Unternehmens`,`Ein Firmensitz`,`Ein Vertragstyp`],correct:1,explain:`Stakeholder = alle Personen/Gruppen mit Interesse am Unternehmen.`},{q:`Welches Wort passt zu 'supply chain'?`,options:[`Lieferkette`,`Aktienkurs`,`Personalabteilung`,`Marketingstrategie`],correct:0,explain:`'Supply chain' ist der englische Begriff für Lieferkette.`}],cards:[{front:`Stakeholder`,back:`Person or group with an interest in a company's activities and outcomes.`},{front:`Revenue`,back:`Total income generated by a business before expenses (Umsatz).`},{front:`Supply Chain`,back:`Lieferkette – the network involved in producing and delivering a product.`},{front:`Draft`,back:`A preliminary written version of a document before final submission.`}]}]}})),AD,jD=o((()=>{AD={nr:2,title:`Datenbanken, Marketing, Mathematik & Recht`,ects:30,modules:[{id:`s2-dat`,code:`DAT`,name:`Datenbanken`,ects:6,sws:`5`,exam:`Klausur 90 Min. · 100% + Praktikum (Pflicht, unbenotet)`,desc:`Grundlagen relationaler Datenbanken, praktische Arbeit mit MySQL und SQL.`,topics:[{t:`ER-Modell & Datenmodellierung`,def:`Das Entity-Relationship-Modell (ERM) ist die zentrale konzeptionelle Methode zur Modellierung von Datenstrukturen, bevor eine Datenbank technisch umgesetzt wird. Es bildet reale Objekte der Anwendungswelt als Entitäten ab (z.B. Kunde, Produkt, Bestellung), die durch Attribute näher beschrieben werden (Kunde hat Name, E-Mail, Adresse), und modelliert die Beziehungen zwischen diesen Entitäten. Jede Beziehung erhält eine Kardinalität: 1:1 (eine Entität entspricht genau einer anderen), 1:n (eine Entität kann mit vielen anderen verbunden sein, aber nicht umgekehrt) oder n:m (beide Seiten mehrfach verknüpft, was in der relationalen Umsetzung eine eigene Zwischentabelle erfordert). Aus dem fertigen ER-Diagramm lassen sich systematisch relationale Tabellen mit Primär- und Fremdschlüsseln ableiten – das ERM ist die Brücke zwischen fachlicher Anforderung und technischem Datenbankschema.`,ex:`Ein Online-Shop-ERM zeigt: Kunde tätigt Bestellung (1:n, ein Kunde kann viele Bestellungen haben, eine Bestellung gehört zu genau einem Kunden), während Bestellung enthält Produkt eine n:m-Beziehung ist (eine Bestellung enthält mehrere Produkte, ein Produkt taucht in mehreren Bestellungen auf) und daher in eine Zwischentabelle Bestellposition aufgelöst wird.`},{t:`Relationale Algebra`,def:`Die relationale Algebra ist die formale mathematische Grundlage, auf der SQL-Abfragen aufbauen, und definiert eine Menge von Operationen, die aus einer oder mehreren Tabellen (Relationen) neue Tabellen erzeugen. Die Selektion (σ) filtert Zeilen einer Tabelle anhand einer Bedingung heraus, ohne Spalten zu verändern. Die Projektion (π) wählt dagegen bestimmte Spalten aus und blendet andere aus. Der Verbund (Join) verknüpft zwei Tabellen anhand gemeinsamer Attribute (meist Primär-/Fremdschlüssel) zu einer neuen, breiteren Tabelle. Weitere Operationen sind Vereinigung, Differenz und das kartesische Produkt. Jede SQL-Abfrage lässt sich gedanklich in eine Abfolge solcher elementarer Operationen zerlegen, was beim Verständnis und bei der Optimierung komplexer Abfragen hilft.`,ex:`Um den Umsatz aller Bestellungen über 100 € pro Kunde zu ermitteln, filtert man zunächst mit einer Selektion die Bestellungen (Betrag > 100), führt dann einen Join mit der Kundentabelle über die Kunden-ID durch und projiziert abschließend nur die Spalten Kundenname und Betrag.`},{t:`SQL: SELECT, JOIN, Aggregation`,def:`SQL (Structured Query Language) ist die Standardsprache zur Abfrage und Bearbeitung relationaler Datenbanken. Die SELECT-Anweisung liest Daten aus einer oder mehreren Tabellen aus und kann über eine WHERE-Klausel gefiltert werden. JOIN-Operationen verknüpfen mehrere Tabellen über gemeinsame Schlüsselspalten: Der INNER JOIN liefert nur Zeilen, die in beiden Tabellen eine Entsprechung haben, während ein LEFT JOIN zusätzlich alle Zeilen der linken Tabelle behält, auch wenn keine Entsprechung existiert. Aggregatfunktionen wie SUM (Summe), COUNT (Anzahl), AVG (Durchschnitt), MIN und MAX fassen mehrere Zeilen zu einem einzigen Kennwert zusammen und werden häufig zusammen mit GROUP BY verwendet, das die Ergebnismenge zunächst in Gruppen (z.B. je Kunde) aufteilt, bevor die Aggregation pro Gruppe berechnet wird. HAVING filtert anschließend die bereits aggregierten Gruppen, während WHERE die Zeilen vor der Aggregation filtert.`,ex:`SELECT kunde.name, SUM(betrag) AS umsatz FROM bestellung JOIN kunde ON bestellung.kunden_id = kunde.id GROUP BY kunde.name HAVING SUM(betrag) > 500 berechnet den Gesamtumsatz je Kunde und zeigt nur Kunden mit über 500 € Umsatz.`},{t:`Normalisierung (1.–3. NF)`,def:`Die Normalisierung ist ein systematisches Verfahren zur Strukturierung relationaler Datenbanken, das Datenredundanz reduziert und Anomalien bei Einfüge-, Änderungs- und Löschvorgängen vermeidet. Die erste Normalform (1. NF) fordert, dass jede Tabellenspalte nur atomare, nicht weiter zerlegbare Werte enthält (keine Listen oder Mehrfachwerte in einer Zelle). Die zweite Normalform (2. NF) baut darauf auf und fordert zusätzlich, dass jedes Nicht-Schlüsselattribut vollständig vom gesamten Primärschlüssel abhängt, nicht nur von einem Teil davon (relevant bei zusammengesetzten Schlüsseln). Die dritte Normalform (3. NF) fordert darüber hinaus, dass kein Nicht-Schlüsselattribut transitiv von einem anderen Nicht-Schlüsselattribut abhängt, sondern ausschließlich direkt vom Primärschlüssel. In der Praxis wird oft bewusst von der strengen Normalisierung abgewichen (Denormalisierung), um Abfragen zu beschleunigen, wenn Lesegeschwindigkeit wichtiger ist als minimale Redundanz.`,ex:`Würde man die Kundenadresse in jeder einzelnen Bestellzeile wiederholen, verstieße das gegen die Normalisierung: Ändert sich die Adresse, müssten alle Zeilen aktualisiert werden. Stattdessen wird die Adresse einmalig in einer eigenen Kundentabelle gespeichert, und die Bestelltabelle verweist nur über die Kunden-ID (Fremdschlüssel) darauf.`},{t:`Einblick in NoSQL-Datenbanken`,def:`NoSQL-Datenbanken ('Not only SQL') verzichten bewusst auf das starre, im Voraus festgelegte Tabellenschema relationaler Datenbanken und bieten stattdessen flexible Datenmodelle, die sich für große, heterogene oder schnell wachsende Datenmengen eignen. Man unterscheidet mehrere Kategorien: Dokumentbasierte Datenbanken (z.B. MongoDB) speichern Datensätze als flexible, JSON-ähnliche Dokumente, bei denen unterschiedliche Datensätze unterschiedliche Felder haben können. Key-Value-Stores (z.B. Redis) speichern einfache Schlüssel-Wert-Paare mit sehr hoher Lese-/Schreibgeschwindigkeit, oft für Caching. Spaltenorientierte Datenbanken (z.B. Cassandra) eignen sich für sehr große Datenmengen mit hohem Schreibdurchsatz. Graphdatenbanken (z.B. Neo4j) modellieren explizit Beziehungen zwischen Datenpunkten und eignen sich für stark vernetzte Daten wie soziale Netzwerke oder Empfehlungssysteme. Der Kompromiss gegenüber relationalen Datenbanken liegt meist in geringerer Konsistenzgarantie zugunsten höherer Skalierbarkeit und Flexibilität (CAP-Theorem).`,ex:`Ein Produktkatalog eines Marktplatzes, bei dem Elektronikartikel völlig andere Attribute (Akkulaufzeit, Prozessor) haben als Kleidung (Größe, Material), passt schlecht in ein starres relationales Schema mit festen Spalten, aber sehr gut in eine dokumentbasierte NoSQL-Datenbank wie MongoDB, bei der jedes Produktdokument nur die für es relevanten Felder enthält.`}],quiz:[{q:`Was beschreibt das ER-Modell?`,options:[`Entitäten und ihre Beziehungen`,`Nur Tabellenformate`,`Ein Programmiersprachen-Standard`,`Ein Backup-Verfahren`],correct:0,explain:`Entity-Relationship-Modell zeigt Entitäten und ihre Beziehungen zueinander.`},{q:`Welcher SQL-Befehl liest Daten aus?`,options:[`INSERT`,`UPDATE`,`DELETE`,`SELECT`],correct:3,explain:`SELECT liest (liefert) Daten aus einer oder mehreren Tabellen.`},{q:`Wozu dient die Normalisierung?`,options:[`Datenredundanz vermeiden`,`Tabellen verschlüsseln`,`Server beschleunigen`,`Backups erstellen`],correct:0,explain:`Normalisierung reduziert Redundanz und verbessert Datenintegrität.`}],cards:[{front:`Primärschlüssel`,back:`Eindeutiger Identifikator einer Tabellenzeile (z.B. Kunden-ID).`},{front:`JOIN`,back:`SQL-Operation, die Daten aus mehreren Tabellen anhand einer Beziehung verknüpft.`},{front:`Normalisierung`,back:`Prozess zur Reduktion von Datenredundanz durch Aufteilung in mehrere Tabellen.`},{front:`NoSQL`,back:`Nicht-relationale Datenbanken (z.B. dokumentbasiert) für flexible, große Datenmengen.`},{front:`Fremdschlüssel`,back:`Attribut, das auf den Primärschlüssel einer anderen Tabelle verweist.`}]},{id:`s2-mkt`,code:`M EC`,name:`Marketing`,ects:6,sws:`4`,exam:`Test 90 Min. · 50% + Gruppenprojekt (Entwurf, 5 S.) · 50%`,desc:`Einführung in die Instrumente des Marketing – Marketing-Mix im E-Commerce-Kontext.`,topics:[{t:`Marketing-Mix: Product, Price, Place, Promotion`,def:`Der klassische Marketing-Mix nach E. Jerome McCarthy fasst die vier zentralen, vom Unternehmen aktiv gestaltbaren Marketinginstrumente zusammen ('4 Ps'). Die Produktpolitik (Product) umfasst alle Entscheidungen rund um das Leistungsangebot: Sortiment, Qualität, Design, Markierung, Verpackung und Zusatzleistungen wie Garantie oder Kundenservice. Die Preispolitik (Price) legt Preisniveau, Rabatt- und Zahlungskonditionen fest und beeinflusst direkt Umsatz und Positionierung. Die Distributionspolitik (Place) betrifft die Wahl der Vertriebswege und -kanäle, über die ein Produkt den Kunden erreicht (z.B. eigener Online-Shop, Marktplätze, stationärer Handel). Die Kommunikationspolitik (Promotion) umfasst alle Maßnahmen, mit denen ein Unternehmen sein Angebot bekannt macht und Kaufanreize schafft, etwa Werbung, Öffentlichkeitsarbeit, Verkaufsförderung und Social-Media-Marketing. Im digitalen Kontext wird der Mix oft um weitere Ps erweitert (z.B. People, Process, Physical Evidence bei Dienstleistungen).`,ex:`Ein neu gestarteter Online-Sportshop trifft Marketing-Mix-Entscheidungen auf allen vier Ebenen gleichzeitig: Er wählt ein auf Laufsport spezialisiertes Sortiment (Product), positioniert sich preislich im mittleren Segment mit gelegentlichen Rabattaktionen (Price), verkauft ausschließlich über einen eigenen Online-Shop plus Amazon-Marktplatz (Place) und bewirbt sich über Instagram-Kooperationen mit Laufinfluencern (Promotion).`},{t:`Zielgruppenanalyse & Segmentierung`,def:`Die Marktsegmentierung teilt einen heterogenen Gesamtmarkt in intern möglichst homogene, untereinander aber klar abgrenzbare Kundengruppen (Segmente) ein, um diese gezielter mit passenden Angeboten und Botschaften anzusprechen als mit einer undifferenzierten Massenansprache. Man unterscheidet mehrere Segmentierungskriterien: demografische Kriterien (Alter, Geschlecht, Einkommen, Bildung), geografische Kriterien (Region, Stadt/Land), psychografische Kriterien (Werte, Lebensstil, Persönlichkeit) und verhaltensbezogene Kriterien (Kaufhäufigkeit, Markentreue, Preissensibilität, Nutzungsintensität). Eine gute Segmentierung erfüllt mehrere Anforderungen: Die Segmente müssen messbar (erfassbare Daten verfügbar), erreichbar (über gezielte Kanäle ansprechbar), wirtschaftlich groß genug (Substanz) und in ihrem Kaufverhalten tatsächlich unterschiedlich (Differenzierbarkeit) sein. Auf Basis der Segmentierung folgt im Marketing-Prozess das Targeting (Auswahl der zu bearbeitenden Segmente) und die Positionierung (wie sich das Angebot im Kopf der Zielgruppe von der Konkurrenz abheben soll).`,ex:`Ein Sportartikelhändler segmentiert seinen Markt nach Nutzungsintensität in Gelegenheitssportler (kaufen selten, preissensibel, einfache Grundausstattung) und Leistungssportler (kaufen häufiger, weniger preissensibel, legen Wert auf Spitzentechnologie) und entwickelt für beide Segmente unterschiedliche Produktlinien, Preispunkte und Werbebotschaften.`},{t:`Markenführung (Branding)`,def:`Markenführung (Branding) umfasst alle strategischen und operativen Maßnahmen, mit denen ein Unternehmen ein konsistentes, unverwechselbares Markenbild in den Köpfen seiner Zielgruppe aufbaut und pflegt. Zentrale Bausteine sind die Markenidentität (wofür die Marke intern stehen soll: Werte, Mission, Persönlichkeit), das Markenimage (wie die Marke tatsächlich von außen wahrgenommen wird – idealerweise deckt sich dies mit der Identität) sowie die Markenbekanntheit (wie viele Personen der Zielgruppe die Marke überhaupt kennen und mit welchen Assoziationen). Eine starke Marke schafft Vertrauen, reduziert das wahrgenommene Kaufrisiko, ermöglicht höhere Preisspielräume (Markenpremium) und fördert Kundenloyalität über wiederholte Käufe hinweg. Konsistenz ist dabei entscheidend: Visuelle Elemente (Logo, Farben, Typografie), Tonalität der Kommunikation und das Kundenerlebnis sollten über alle Berührungspunkte (Website, App, Verpackung, Kundenservice, Social Media) hinweg einheitlich gestaltet sein, um Wiedererkennung zu erzeugen.`,ex:`Zalando setzt über Website, App, Werbeanzeigen und Verpackung konsequent denselben orangefarbenen Markenauftritt sowie einen einheitlichen, jugendlich-lockeren Kommunikationsstil ein – diese Konsistenz über alle Touchpoints hinweg stärkt die Wiedererkennung und das Vertrauen der Kunden in die Marke.`},{t:`Preispolitik & Preisstrategien`,def:`Die Preispolitik legt fest, zu welchem Preis und unter welchen Konditionen (Rabatte, Zahlungsziele, Finanzierungsangebote) ein Produkt angeboten wird, und ist eines der am direktesten gewinnwirksamen Marketinginstrumente. Bei der Markteinführung neuer Produkte stehen zwei gegensätzliche Grundstrategien zur Wahl: Die Skimming-Strategie (Abschöpfungsstrategie) setzt zunächst einen hohen Einführungspreis an, um zahlungsbereite Frühkäufer (Innovatoren) abzuschöpfen, und senkt den Preis anschließend schrittweise, um sukzessive preissensiblere Kundensegmente zu erschließen – geeignet bei hoher Produktdifferenzierung und geringer anfänglicher Konkurrenz. Die Penetrationsstrategie (Durchdringungsstrategie) setzt dagegen von Beginn an einen niedrigen Preis an, um schnell hohe Marktanteile und Skaleneffekte zu erzielen, bevor Wettbewerber reagieren können – geeignet bei hoher Preiselastizität und dem Ziel schneller Marktdurchdringung. Daneben existieren weitere Preisstrategien wie die dynamische Preisbildung (Preise ändern sich in Echtzeit nach Nachfrage, Wettbewerb oder Lagerbestand) und psychologische Preissetzung (z.B. 9,99 € statt 10 €).`,ex:`Ein neues Smartphone-Modell wird zum Marktstart bewusst teuer positioniert, um technikaffine Frühkäufer mit hoher Zahlungsbereitschaft abzuschöpfen (Skimming), und wird einige Monate später schrittweise günstiger, sobald Konkurrenzmodelle erscheinen und die breitere Masse angesprochen werden soll.`}],quiz:[{q:`Welche 4 Elemente umfasst der klassische Marketing-Mix?`,options:[`Product, Price, Place, Promotion`,`Plan, Price, People, Product`,`Product, Profit, Place, Person`,`Price, Promotion, Profit, Plan`],correct:0,explain:`Die 4 Ps: Product, Price, Place, Promotion.`},{q:`Was ist Preisskimming?`,options:[`Niedrigpreis-Einstieg`,`Hochpreis-Einstieg, der sinkt`,`Preise nie ändern`,`Nur Rabattaktionen`],correct:1,explain:`Skimming = hoher Einstiegspreis, der über Zeit gesenkt wird.`}],cards:[{front:`Marketing-Mix (4P)`,back:`Product, Price, Place, Promotion – die vier klassischen Marketinginstrumente.`},{front:`Preisskimming`,back:`Hoher Einführungspreis, der schrittweise gesenkt wird, um verschiedene Käufersegmente abzuschöpfen.`},{front:`Penetrationsstrategie`,back:`Niedriger Einführungspreis zur schnellen Marktdurchdringung.`},{front:`Zielgruppensegmentierung`,back:`Aufteilung des Marktes in homogene Kundengruppen nach Merkmalen.`}]},{id:`s2-mat`,code:`MAT 1`,name:`Mathematik 1 (Ingenieurmathematik)`,ects:6,sws:`6`,exam:`Klausur 120 Min. · 100%`,desc:`Mathematisches Grundwissen: Funktionen, Vektorrechnung, Folgen, Differential- und Integralrechnung, komplexe Zahlen.`,topics:[{t:`Logik, Mengen & Funktionen`,def:`Die Aussagenlogik untersucht die Verknüpfung von Aussagen (die entweder wahr oder falsch sind) über Operatoren wie UND, ODER und NICHT und bildet die formale Grundlage vieler mathematischer Beweise. Die Mengenlehre beschreibt Zusammenfassungen von Objekten (Mengen) und definiert Operationen zwischen ihnen: die Vereinigung (alle Elemente, die in mindestens einer Menge vorkommen), der Durchschnitt (alle Elemente, die in beiden Mengen vorkommen) und die Differenz (Elemente einer Menge, die nicht in der anderen vorkommen). Der Funktionsbegriff beschreibt eine eindeutige Zuordnungsvorschrift, die jedem Element einer Definitionsmenge (den x-Werten) genau ein Element einer Zielmenge (den y-Werten) zuordnet. Wichtige Funktionseigenschaften sind Definitionsbereich (erlaubte Eingabewerte), Wertebereich (mögliche Ausgabewerte), Monotonie (steigend/fallend) sowie Nullstellen (x-Werte, an denen die Funktion den Wert 0 annimmt).`,ex:`Die lineare Funktion f(x) = 2x + 3 ordnet jedem x-Wert eindeutig einen y-Wert zu (z.B. f(5) = 13) und lässt sich als Kostenfunktion interpretieren, bei der 3 die Fixkosten und 2 die variablen Kosten pro Einheit darstellen.`},{t:`Vektor- & Matrizenrechnung`,def:`Ein Vektor ist ein mathematisches Objekt, das im Gegensatz zu einer einzelnen Zahl (Skalar) sowohl einen Betrag (Länge) als auch eine Richtung besitzt und üblicherweise als geordnetes Zahlentupel dargestellt wird. Vektoren lassen sich addieren, subtrahieren und mit einem Skalar multiplizieren; das Skalarprodukt zweier Vektoren liefert eine einzelne Zahl und wird u.a. zur Berechnung von Winkeln zwischen Vektoren verwendet. Eine Matrix ist ein rechteckiges Schema von Zahlen, angeordnet in Zeilen und Spalten, und dient insbesondere zur kompakten Darstellung und Lösung linearer Gleichungssysteme: Ein System mehrerer linearer Gleichungen mit mehreren Unbekannten lässt sich als Matrix-Vektor-Gleichung schreiben und mit Verfahren wie dem Gauß-Algorithmus systematisch lösen. Matrizen lassen sich addieren, mit einem Skalar multiplizieren und unter bestimmten Bedingungen miteinander multiplizieren (Matrizenmultiplikation), was in der Praxis z.B. bei linearen Transformationen oder in der Datenanalyse verwendet wird.`,ex:`Eine 3×4-Matrix bildet die Lagerbestände von drei Produkten an vier verschiedenen Lagerstandorten ab; durch Matrizenmultiplikation mit einem Preisvektor lässt sich in einem Rechenschritt der Gesamtwert des Lagerbestands je Standort berechnen.`},{t:`Folgen & Reihen`,def:`Eine Zahlenfolge ist eine geordnete, abzählbare Liste von Zahlen, deren einzelne Glieder nach einer festen mathematischen Vorschrift gebildet werden – etwa einer expliziten Formel (die jedes Glied direkt aus seiner Position berechnet) oder einer rekursiven Vorschrift (die jedes Glied aus dem vorherigen berechnet). Bei einer arithmetischen Folge ist die Differenz zwischen aufeinanderfolgenden Gliedern konstant (lineares Wachstum), bei einer geometrischen Folge ist dagegen der Quotient zwischen aufeinanderfolgenden Gliedern konstant (exponentielles Wachstum bzw. exponentieller Zerfall). Eine Reihe ist die fortlaufende Summe der Glieder einer Folge; man unterscheidet endliche Reihen (Partialsummen) von unendlichen Reihen, die unter bestimmten Bedingungen gegen einen endlichen Grenzwert konvergieren können, obwohl unendlich viele Glieder addiert werden.`,ex:`Ein Startup rechnet mit monatlich 8% Umsatzwachstum – eine geometrische Folge mit dem Quotienten 1,08. Nach 12 Monaten hat sich der Umsatz dadurch nicht linear, sondern um den Faktor 1,08 hoch 12 (rund das 2,5-fache) erhöht, was die Dynamik exponentiellen Wachstums verdeutlicht.`},{t:`Differentialrechnung`,def:`Die Differentialrechnung berechnet Ableitungen von Funktionen und beantwortet damit die Frage, wie stark sich der Funktionswert bei einer minimalen Änderung des Eingabewerts verändert – geometrisch entspricht die Ableitung an einer Stelle der Steigung der Tangente an den Funktionsgraphen an genau diesem Punkt. Wichtige Ableitungsregeln sind die Potenzregel (die Ableitung von xⁿ ist n·xⁿ⁻¹), die Summenregel, die Produktregel und die Kettenregel für verschachtelte Funktionen. Ökonomisch lässt sich die erste Ableitung einer Funktion oft als Grenzrate interpretieren: Die Ableitung einer Kostenfunktion liefert die Grenzkosten (die zusätzlichen Kosten für genau eine weitere produzierte Einheit), die Ableitung einer Erlösfunktion die Grenzerlöse. Die zweite Ableitung gibt zusätzlich Aufschluss über die Krümmung des Graphen und wird u.a. genutzt, um Maxima und Minima einer Funktion (z.B. den gewinnmaximalen Preis) zu identifizieren und zu klassifizieren.`,ex:`Eine Kostenfunktion K(x) = 0,5x² + 20x + 500 hat die Ableitung K'(x) = x + 20. Bei einer bereits produzierten Menge von x=100 Einheiten betragen die Grenzkosten für die 101. Einheit also rund 120 € – deutlich mehr als die durchschnittlichen Stückkosten, weil die Produktion in diesem Bereich überproportional teurer wird.`},{t:`Integralrechnung & komplexe Zahlen`,def:`Die Integralrechnung ist die Umkehroperation der Differentialrechnung: Während die Ableitung die Steigung einer Funktion an einem Punkt liefert, berechnet das bestimmte Integral die Fläche zwischen dem Funktionsgraphen und der x-Achse über einem festgelegten Intervall – dies lässt sich ökonomisch etwa nutzen, um aus einer Grenzkostenfunktion die gesamten (kumulierten) Kosten über eine Produktionsmenge hinweg zu berechnen. Das unbestimmte Integral (die Stammfunktion) liefert dagegen eine ganze Funktionsfamilie, deren Ableitung wieder die ursprüngliche Funktion ergibt. Komplexe Zahlen erweitern den reellen Zahlenraum um die imaginäre Einheit i, definiert als Wurzel aus -1 (eine im Reellen unlösbare Gleichung), und werden in der Form a + bi geschrieben, wobei a der Realteil und b der Imaginärteil ist. Komplexe Zahlen ermöglichen es, Gleichungen zu lösen, die im Reellen keine Lösung haben (z.B. x² = -1), und finden Anwendung u.a. in der Elektrotechnik und Signalverarbeitung.`,ex:`Integriert man die Grenzkostenfunktion K'(x) = x + 20 über das Intervall von 0 bis 100, erhält man die gesamten Produktionskosten für 100 Einheiten: das Integral ergibt [0,5x² + 20x] von 0 bis 100 = 5.000 + 2.000 = 7.000 €.`}],quiz:[{q:`Was ist die Ableitung von x²?`,options:[`x`,`2x`,`x²`,`2`],correct:1,explain:`Die Potenzregel: d/dx(xⁿ) = n·xⁿ⁻¹, also d/dx(x²) = 2x.`},{q:`Was beschreibt eine Matrix?`,options:[`Eine einzelne Zahl`,`Ein rechteckiges Zahlenschema`,`Nur Dezimalzahlen`,`Eine Funktion 3. Grades`],correct:1,explain:`Eine Matrix ist ein rechteckiges Schema von Zahlen in Zeilen und Spalten.`},{q:`Was ist die imaginäre Einheit i?`,options:[`√-1`,`√1`,`0`,`∞`],correct:0,explain:`i ist definiert als Wurzel aus -1, Basis komplexer Zahlen.`}],cards:[{front:`Differentialrechnung`,back:`Berechnung von Ableitungen – beschreibt die Änderungsrate/Steigung einer Funktion.`},{front:`Integralrechnung`,back:`Berechnung von Flächen unter Kurven / Umkehrung der Ableitung.`},{front:`Vektor`,back:`Mathematisches Objekt mit Richtung und Betrag, dargestellt als geordnetes Zahlentupel.`},{front:`Komplexe Zahl`,back:`Zahl der Form a+bi, bestehend aus Realteil a und Imaginärteil b.`},{front:`Folge`,back:`Geordnete, abzählbare Liste von Zahlen nach einer bestimmten Vorschrift.`}]},{id:`s2-pme`,code:`PME`,name:`Prozessmanagement im E-Commerce`,ects:6,sws:`4`,exam:`Schriftliche Ausarbeitung (5 S.) · 100%`,desc:`Einführung in das Prozessmanagement mit Vertiefung im E-Commerce-Kontext.`,topics:[{t:`Prozessmodellierung (BPMN Grundlagen)`,def:`BPMN (Business Process Model and Notation) ist ein international standardisierter, grafischer Notationsstandard zur eindeutigen und für alle Beteiligten verständlichen Darstellung von Geschäftsprozessen. Zentrale Elemente sind Start- und Endereignisse (kreisförmige Symbole, die den Beginn und das Ende eines Prozesses markieren), Aktivitäten bzw. Aufgaben (rechteckige Symbole für einzelne Arbeitsschritte), Gateways bzw. Entscheidungspunkte (rautenförmige Symbole, an denen sich der Prozessfluss abhängig von einer Bedingung verzweigt oder wieder zusammenführt) sowie Sequenzflüsse (Pfeile, die die Reihenfolge der Schritte festlegen). Zusätzlich lassen sich in BPMN sogenannte Swimlanes (Bahnen) verwenden, um zu visualisieren, welche Rolle oder Abteilung für welchen Prozessschritt verantwortlich ist. Der große Vorteil von BPMN liegt darin, dass sowohl Fachabteilungen als auch IT-Entwickler dieselbe, eindeutige Notation verstehen und darauf aufbauend Prozesse analysieren, optimieren oder sogar automatisiert in Workflow-Systemen ausführen können.`,ex:`Der Bestellprozess eines Online-Shops wird als BPMN-Diagramm mit den Schritten Warenkorb befüllen → Kasse (Gateway: Zahlungsart wählen) → Zahlung verarbeiten → Lager benachrichtigt (Aktivität) → Versand → Bestätigungs-E-Mail (Endereignis) modelliert, wobei separate Swimlanes für Kunde, Zahlungsdienstleister und Lager die jeweiligen Zuständigkeiten sichtbar machen.`},{t:`Ist- vs. Soll-Prozesse`,def:`Die Unterscheidung zwischen Ist- und Soll-Prozessen ist ein zentrales methodisches Werkzeug des Prozessmanagements. Der Ist-Prozess (auch Ist-Zustand) beschreibt möglichst objektiv und detailliert, wie ein Arbeitsablauf tatsächlich in der Praxis abläuft – inklusive aller Umwege, Sonderfälle, manueller Zwischenschritte und Medienbrüche, die sich oft im Laufe der Zeit unbemerkt eingeschlichen haben. Die Ist-Aufnahme erfolgt typischerweise durch Interviews mit den beteiligten Mitarbeitenden, direkte Beobachtung oder die Auswertung von Systemprotokollen. Der Soll-Prozess (Ziel- oder Referenzprozess) beschreibt demgegenüber, wie der Ablauf nach einer geplanten Verbesserung idealerweise aussehen soll – meist mit dem Ziel, Schritte zu eliminieren, zu vereinfachen oder zu automatisieren. Die systematische Gegenüberstellung (Ist-Soll-Vergleich, auch Gap-Analyse genannt) macht sichtbar, an welchen konkreten Stellen sich Schwachstellen befinden und liefert die Grundlage für einen priorisierten Maßnahmenplan zur Prozessverbesserung.`,ex:`Ist-Prozess: Ein Kunde schickt eine Retoure per E-Mail an den Kundenservice, ein Mitarbeiter prüft den Fall manuell und veranlasst die Rückerstattung oft erst nach mehreren Tagen. Soll-Prozess: Der Kunde meldet die Retoure selbst über ein automatisiertes Online-Portal an, erhält sofort ein Rücksendeetikett, und die Rückerstattung wird automatisch ausgelöst, sobald die Retoure im Lager gescannt wird – der manuelle Prüfschritt entfällt fast vollständig.`},{t:`Prozessoptimierung im Online-Handel`,def:`Prozessoptimierung bezeichnet die systematische, meist datengetriebene Verbesserung bestehender Geschäftsabläufe hinsichtlich Durchlaufzeit, Fehlerquote, Kosten und Kundenerlebnis. Typische Ansatzpunkte sind die Eliminierung überflüssiger oder doppelter Arbeitsschritte, die Automatisierung repetitiver, regelbasierter Tätigkeiten (z.B. durch Software-Bots oder Workflow-Systeme), die Parallelisierung von Prozessschritten, die bislang unnötig nacheinander abliefen, sowie der Abbau von Medienbrüchen, bei denen Informationen manuell von einem System in ein anderes übertragen werden müssen. Im E-Commerce sind besonders die sogenannten Order-to-Cash-Prozesse (vom Bestelleingang bis zum Zahlungseingang) und Procure-to-Pay-Prozesse (von der Beschaffung bis zur Bezahlung von Lieferanten) klassische Optimierungsfelder, weil hier hohe Transaktionsvolumina auf enge Zeit- und Kostenanforderungen treffen. Kennzahlen wie Durchlaufzeit, Fehlerquote pro 1.000 Vorgänge oder Prozesskosten pro Transaktion dienen dazu, den Erfolg von Optimierungsmaßnahmen messbar zu machen.`,ex:`Ein Online-Händler automatisiert die bislang manuelle Rechnungsstellung: Statt dass ein Mitarbeiter jede Bestellung händisch prüft und eine Rechnung erstellt, generiert das System die Rechnung automatisch bei Zahlungseingang und verschickt sie sofort per E-Mail – der Order-to-Cash-Prozess verkürzt sich dadurch von mehreren Tagen auf wenige Minuten und die Fehlerquote sinkt spürbar.`},{t:`Schnittstellen zwischen Abteilungen`,def:`Schnittstellen sind die definierten Übergabepunkte, an denen Informationen, Daten oder physische Güter von einer Abteilung, einem System oder einem Prozessschritt an den nächsten übergeben werden. Im E-Commerce-Kontext sind Schnittstellen besonders kritisch zwischen Marketing (das Kaufinteresse generiert), Vertrieb/Shop-System (das Bestellungen entgegennimmt), Logistik/Lager (das die Ware bereitstellt und versendet), Buchhaltung (die Zahlungen verbucht) und Kundenservice (der Rückfragen und Reklamationen bearbeitet). Schlecht definierte Schnittstellen führen häufig zu Informationsverlust, Doppelarbeit oder Verzögerungen, etwa wenn Bestandsänderungen im Lager nicht in Echtzeit an den Online-Shop gemeldet werden und dadurch Artikel verkauft werden, die gar nicht mehr vorrätig sind. Moderne Systemlandschaften lösen dieses Problem zunehmend durch automatisierte, in Echtzeit synchronisierte Schnittstellen (APIs) zwischen den beteiligten Systemen, statt sich auf manuellen Datenaustausch per E-Mail oder Excel-Tabelle zu verlassen.`,ex:`Eine automatisierte API-Schnittstelle zwischen dem Warenwirtschaftssystem des Lagers und dem Online-Shop meldet in Echtzeit, sobald ein Artikel ausverkauft ist, sodass der Shop den Artikel sofort als 'nicht verfügbar' kennzeichnet – ohne diese Schnittstelle könnten Kunden Artikel bestellen, die bereits vergriffen sind, was zu Stornierungen und Unzufriedenheit führt.`}],quiz:[{q:`Wofür steht BPMN?`,options:[`Business Process Model and Notation`,`Basic Process Management Network`,`Business Planning Model Number`,`Big Process Management Node`],correct:0,explain:`BPMN = Business Process Model and Notation, Standard zur Prozessmodellierung.`},{q:`Was ist ein Ist-Prozess?`,options:[`Der aktuell tatsächlich ablaufende Prozess`,`Ein zukünftiger Wunschprozess`,`Ein Prozess, der gelöscht wurde`,`Ein rein theoretisches Konzept`],correct:0,explain:`Der Ist-Prozess beschreibt, wie ein Ablauf aktuell wirklich funktioniert.`}],cards:[{front:`Prozessmodellierung`,back:`Grafische Darstellung von Arbeitsabläufen, z.B. mit BPMN-Notation.`},{front:`Ist-Prozess`,back:`Der aktuelle, tatsächlich gelebte Ablauf eines Geschäftsprozesses.`},{front:`Soll-Prozess`,back:`Der angestrebte, optimierte Zielprozess nach einer Verbesserung.`},{front:`Prozessoptimierung`,back:`Systematische Verbesserung von Abläufen hinsichtlich Zeit, Kosten und Qualität.`}]},{id:`s2-law`,code:`ECLAW`,name:`Rechtliche Grundlagen des E-Commerce`,ects:6,sws:`4`,exam:`Klausur 90 Min. · 100%`,desc:`Rechtliche Basis für den Online-Handel: BGB, HGB, AGB, Urheberrecht, Wettbewerbsrecht, Datenschutz.`,topics:[{t:`BGB & HGB Grundlagen`,def:`Das Bürgerliche Gesetzbuch (BGB) ist das zentrale deutsche Zivilgesetzbuch und regelt allgemeine Rechtsgeschäfte zwischen Privatpersonen und Unternehmen, insbesondere das Vertragsrecht: Ein Vertrag kommt durch zwei übereinstimmende Willenserklärungen zustande – ein Angebot und dessen Annahme. Für Kaufverträge regelt das BGB u.a. Pflichten von Verkäufer (mangelfreie Lieferung) und Käufer (Zahlung, Abnahme) sowie Gewährleistungsrechte bei Mängeln (Nacherfüllung, Rücktritt, Minderung, Schadensersatz). Das Handelsgesetzbuch (HGB) ergänzt das BGB um Sonderregeln, die ausschließlich für Kaufleute gelten und den besonderen Anforderungen des Geschäftsverkehrs zwischen Unternehmen Rechnung tragen, etwa strengere Formvorschriften, aber auch mehr Vertragsfreiheit als im Verbraucherschutzrecht, sowie spezielle Regeln zur kaufmännischen Rüge- und Untersuchungspflicht bei Warenlieferungen.`,ex:`Ein Online-Kaufvertrag entsteht rechtlich, sobald der Kunde auf 'Jetzt kaufen' klickt (Annahme des im Shop unterbreiteten Angebots) – die reine Produktanzeige im Shop gilt dabei rechtlich meist nur als unverbindliche Aufforderung zur Abgabe eines Angebots (invitatio ad offerendum), das eigentliche Angebot gibt der Kunde mit seiner Bestellung ab, angenommen wird es durch die Bestellbestätigung des Händlers.`},{t:`AGB-Recht im Online-Shop`,def:`Allgemeine Geschäftsbedingungen (AGB) sind vom Verkäufer für eine Vielzahl von Verträgen vorformulierte Vertragsbedingungen, die er seinen Kunden bei Vertragsschluss stellt, um Rechtsverhältnisse einheitlich und effizient zu regeln, statt jeden Vertrag individuell auszuhandeln. Damit AGB wirksam Vertragsbestandteil werden, müssen sie dem Kunden vor Vertragsschluss klar erkennbar zugänglich gemacht werden und er muss zumutbar die Möglichkeit zur Kenntnisnahme haben. Das AGB-Recht (§§ 305 ff. BGB) unterwirft AGB-Klauseln zudem einer strengen Inhaltskontrolle: Überraschende Klauseln werden nicht Vertragsbestandteil, und Klauseln, die den Kunden unangemessen benachteiligen (z.B. unklare oder widersprüchliche Formulierungen, unzulässiger Haftungsausschluss), sind unwirksam – im Zweifel geht eine Unklarheit stets zu Lasten des Verwenders (Unklarheitenregel). Für Online-Shops kommen zusätzlich verbraucherschutzrechtliche Informationspflichten hinzu, die typischerweise über die AGB oder begleitende Rechtstexte erfüllt werden.`,ex:`Ein Online-Shop muss in seinen AGB transparent und verständlich über das 14-tägige Widerrufsrecht für Verbraucher, die voraussichtliche Lieferzeit, die akzeptierten Zahlungsarte
